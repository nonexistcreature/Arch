# Arkhaven CI: publish the packwiz pack to GitHub Pages on every push to main,
# build Arkhaven-Setup.exe + the server kit and attach them to a GitHub Release on version tags (v*).
name: publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  pages:
    # the github-pages environment only accepts deployments from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Pack index hashes match the files
        run: python3 tools/verify_index.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pack
      - uses: actions/deploy-pages@v4
  installer:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install pillow pyyaml
      - name: Inno Setup 7 (the script uses Inno 7 APIs)
        run: choco install innosetup -y --no-progress
      - name: Build installer, Prism instance, own-launcher kit
        run: python launcher/build.py
      - name: Build server kit
        run: python tools/make_server_kit.py
      - name: All release files exist
        shell: bash
        run: ls -la launcher/dist && test -f launcher/dist/Arkhaven-Prism-Instance.zip && test -f launcher/dist/Arkhaven-Own-Launcher.zip && ls launcher/dist/Arkhaven-Setup-*.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            launcher/dist/Arkhaven-Setup-*.exe
            launcher/dist/Arkhaven-Server-Kit.zip
            launcher/dist/Arkhaven-Prism-Instance.zip
            launcher/dist/Arkhaven-Own-Launcher.zip
