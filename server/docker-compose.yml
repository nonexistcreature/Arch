# Arkhaven home server. Lives in /opt/arkhaven/compose, data in /opt/arkhaven/data.
services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: arkhaven-mc
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25565:25565/tcp"
      - "24454:24454/udp"            # Simple Voice Chat
      - "127.0.0.1:25575:25575/tcp"  # RCON: localhost only
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.259"
      PACKWIZ_URL: ${PACK_URL}
      MEMORY: ${SERVER_MEMORY:-12G}
      USE_AIKAR_FLAGS: "true"
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-false}"
      ENFORCE_WHITELIST: "${ENABLE_WHITELIST:-false}"
      WHITELIST: ${WHITELIST}
      OPS: ${OPS}
      DIFFICULTY: normal
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      SPAWN_PROTECTION: "0"
      MAX_TICK_TIME: "-1"            # modded worldgen spikes must not kill the server
      ALLOW_FLIGHT: "true"           # jetpacks, airships, Ars flight
      MOTD: ${MOTD}
      ICON: /extras/server-icon.png
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
      STOP_SERVER_ANNOUNCE_DELAY: "60"
      LOG_TIMESTAMP: "true"
    volumes:
      - ../data:/data
      - ./extras:/extras:ro
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 10m
      interval: 1m
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  backups:
    image: itzg/mc-backup
    container_name: arkhaven-backup
    restart: unless-stopped
    depends_on: [mc]
    environment:
      BACKUP_METHOD: restic
      RESTIC_REPOSITORY: /backups
      RESTIC_PASSWORD: ${RCON_PASSWORD}
      BACKUP_INTERVAL: "1h"
      INITIAL_DELAY: "15m"
      PRUNE_RESTIC_RETENTION: "--keep-hourly 24 --keep-daily 7 --keep-weekly 4"
      RCON_HOST: mc
      RCON_PASSWORD: ${RCON_PASSWORD}
      PAUSE_IF_NO_PLAYERS: "true"
      EXCLUDES: "*.jar,cache,logs,DistantHorizons.sqlite*"
    volumes:
      - ../data:/data:ro
      - ../backups:/backups

  # Announces the server on the local network (Multiplayer -> LAN, and the launcher's auto-discovery).
  lan-announce:
    image: python:3.12-alpine
    container_name: arkhaven-lan
    restart: unless-stopped
    network_mode: host            # multicast must reach the real LAN
    volumes:
      - ./lan_announce.py:/lan_announce.py:ro
    command: ["python", "/lan_announce.py", "25565", "Arkhaven"]

  # Self-hosted update channel (use only when there is no GitHub Pages): serves /opt/arkhaven/pack on :8080.
  # Enable with: docker compose --profile selfhost-pack up -d
  pack:
    image: caddy:2
    container_name: arkhaven-pack
    restart: unless-stopped
    profiles: [selfhost-pack]
    ports:
      - "8080:80"
    volumes:
      - ../pack:/srv:ro
    command: caddy file-server --root /srv --listen :80
