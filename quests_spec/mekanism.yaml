  # --- armor and tools (Mekanism Tools)
  - id: mg_bronze_set
    deps: [mg_ores]
    roles: [warrior]
    items: [mekanismtools:bronze_helmet, mekanismtools:bronze_chestplate, mekanismtools:bronze_leggings, mekanismtools:bronze_boots]
    title: {ru: "Бронзовая броня", en: "Bronze Armor"}
    why: {ru: "Сплав олова и меди: первая броня лучше железной, когда железо уходит на машины.", en: "First armor better than iron."}
  - id: mg_lapis_set
    deps: [m_osmium]
    roles: [warrior, mage]
    items: [mekanismtools:lapis_lazuli_helmet, mekanismtools:lapis_lazuli_chestplate, mekanismtools:lapis_lazuli_leggings, mekanismtools:lapis_lazuli_boots]
    title: {ru: "Лазуритовая броня", en: "Lapis Armor"}
    why: {ru: "Слабая, но хорошо зачаровывается — магу под зачарования.", en: "Weak but highly enchantable."}
  - id: mg_osmium_set
    deps: [m_osmium_armor]
    roles: [warrior]
    items: [mekanismtools:osmium_helmet, mekanismtools:osmium_leggings, mekanismtools:osmium_boots]
    title: {ru: "Полный осмиевый комплект", en: "Full Osmium Set"}
    why: {ru: "Осмий прочнее железа и добывается почти на любой высоте — честный комплект на средний этап.", en: "Osmium is tougher than iron and common — a fair mid-game set."}
  - id: mg_steel_set
    deps: [m_steel]
    roles: [warrior]
    items: [mekanismtools:steel_helmet, mekanismtools:steel_chestplate, mekanismtools:steel_leggings, mekanismtools:steel_boots]
    title: {ru: "Стальная броня", en: "Steel Armor"}
    why: {ru: "Прочная и дешёвая для того, у кого уже идёт сталь.", en: "Tough and cheap once you have steel."}
  - id: mg_glowstone_set
    deps: [m_refined_glowstone]
    roles: [warrior]
    items: [mekanismtools:refined_glowstone_helmet, mekanismtools:refined_glowstone_chestplate, mekanismtools:refined_glowstone_leggings, mekanismtools:refined_glowstone_boots]
    title: {ru: "Броня из светокамня", en: "Refined Glowstone Armor"}
    why: {ru: "Светится в темноте вокруг тебя — для шахт и данжей.", en: "Gives light around you."}
  - id: mg_obsidian_set
    deps: [m_refined_obsidian]
    roles: [warrior]
    items: [mekanismtools:refined_obsidian_helmet, mekanismtools:refined_obsidian_leggings, mekanismtools:refined_obsidian_boots, mekanismtools:refined_obsidian_sword]
    title: {ru: "Обсидиановый воин", en: "Refined Obsidian Warrior"}
    why: {ru: "Лучшая не-модульная броня в Mekanism, почти как незерит, но без поисков обломков.", en: "Best non-modular armor, near netherite."}
  - id: mg_shields
    deps: [m_steel]
    roles: [warrior]
    items: [mekanismtools:steel_shield]
    why: {ru: "Металлические щиты держат больше ударов, чем деревянный.", en: "Metal shields last longer."}
  - id: mg_master
    deps: [mg_fusion_parts, mg_nucleo, mg_mekasuit_full, mg_module_gravity, mg_five_x, mg_qio_portable, mg_factory_elite, mg_obsidian_set]
    roles: [engineer]
    shape: hexagon
    icon: mekanism:ultimate_control_circuit
    title: {ru: "Мастер Mekanism", en: "Mekanism Master"}
    text: {ru: "Пятикратная переработка, термояд, антиматерия и полный MekaSuit. Дальше — только помогать соседям строить их реакторы.", en: "5x processing, fusion, antimatter and a full MekaSuit."}
    rewards: [{type: xp_levels, count: 20}]
