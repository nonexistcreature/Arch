# Key items per mod: what actually matters in play (owner, 2026-10-16). Quests must cover >= 80% of each list.
# In: machines and multiblocks with their own mechanics, one item per tool/weapon/armor tier, materials that
# progression hangs on, boss drops, consumables with a unique effect. Out: decor and building blocks, colour/wood
# variants, redundant "same effect, harder recipe" items. Nothing is removed from existing quests because of this list.
# tools/quest_coverage.py --key measures coverage against it.
