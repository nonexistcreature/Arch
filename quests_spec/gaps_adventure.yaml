    deps: [gaq_abyssal, gaq_terrible]
    roles: [warrior]
    items: [aquamirae:abyssal_upgrade_smithing_template, aquamirae:terrible_upgrade_smithing_template]
    title: {ru: "Шаблоны улучшения", en: "Upgrade Templates"}
  - id: gaq_blades
    deps: [adv_cornelia]
    roles: [warrior]
    items: [aquamirae:terrible_blade, aquamirae:remnant_saber, aquamirae:dagger_of_greed]
    title: {ru: "Клинки ледяного моря", en: "Blades of the Frozen Sea"}
    why: {en: 'Blades of the frozen sea, each with its own trait.', ru: Клинки из ледяного моря Aquamirae — каждый со своей особенностью. Смотри подсказки.}
  - id: gaq_trident
    deps: [gaq_blades]
    roles: [warrior]
    items: [aquamirae:tempest_trident]
    why: {en: A storm-powered trident., ru: Трезубец бури — оружие для морского похода. Его особая сила описана в подсказке.}
  - id: gaq_maelstrom
    deps: [boss_maw]
    roles: [warrior, mage]
    items: [aquamirae:maelstrom_vestige, aquamirae:rune_of_the_storm]
    title: {ru: "Трофеи бури", en: "Storm Relics"}
  - id: gaq_horn
    deps: [adv_cornelia]
    roles: [warrior]
    items: [aquamirae:shell_horn, aquamirae:echo_compass]
    title: {ru: "Рог и эхо-компас", en: "Shell Horn and Echo Compass"}
  - id: gaq_fish
    deps: [adv_cornelia]
    roles: [cook]
    items: [aquamirae:angler_fang, aquamirae:esca, aquamirae:fin]
    title: {ru: "Дары глубин", en: "Gifts of the Deep"}
    why: {en: Drops from frozen-sea creatures for food and gear., ru: Добыча с чудищ ледяного моря — материалы для еды и снаряжения Aquamirae.}
  - id: gaq_food
    deps: [gaq_fish]
    roles: [cook]
    items: [aquamirae:poseidon_breakfast]
    why: {en: A hearty seafood dish., ru: Завтрак Посейдона — сытное блюдо из даров моря.}
  - id: gaq_moth
    deps: [adv_cornelia]
    roles: [mage]
    items: [aquamirae:golden_moth_jar]
