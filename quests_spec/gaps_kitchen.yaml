# Key-item gaps in the kitchen: the role-buff dishes of kubejs/server_scripts/40_food_buffs.js (exact effects below
# are copied from that script), plus stations, tools and crops of the food mods.
extends: kitchen
lang: [farmersdelight, farm_and_charm, brewinandchewin, herbalbrews, mynethersdelight, ends_delight, meadow, oceansdelight, create_confectionery, vinery]
out: gaps_kitchen_gen
quests:
  # --- the cook as a support role
  - id: gkt_buffs
    deps: [k_pot]
    roles: [cook]
    shape: gear
    icon: farmersdelight:shepherds_pie
    tasks: [{type: checkmark}]
    title: {ru: "Повар-усилитель", en: "The Cook as Support"}
    why: {ru: "В Arkhaven некоторые блюда дают полезные эффекты сверх сытости — так повар помогает шахтёрам, воинам и магам. Одно и то же блюдо не складывается: повторная еда лишь обновляет таймер, а разные блюда работают вместе. Ниже — все такие блюда с точными эффектами.", en: "Some dishes give effects on top of food: the cook supports miners, warriors and mages. Eating the same dish again only refreshes it."}
  - id: gkt_miner_food
    deps: [gkt_buffs]
    roles: [cook, engineer]
    items: [farmersdelight:shepherds_pie, farm_and_charm:farmers_breakfast]
    title: {ru: "Еда шахтёра", en: "Miner's Food"}
    why: {ru: "Пастуший пирог — Спешка II на 5 минут («пирог шахтёра»). Фермерский завтрак — Скорость и Спешка на 5 минут.", en: "Shepherd's pie: Haste II 5 min. Farmer's breakfast: Speed + Haste 5 min."}
  - id: gkt_warrior_food
    deps: [gkt_buffs]
    roles: [cook, warrior]
    items: [farmersdelight:steak_and_potatoes, farmersdelight:beef_stew]
    title: {ru: "Еда воина", en: "Warrior's Food"}
    why: {ru: "Стейк с картошкой — Сила на 5 минут. Говяжье рагу — Сопротивление и Огнестойкость на 5 минут («смелое рагу»). Паста с фрикадельками — +здоровье на 10 минут.", en: "Steak: Strength 5 min. Beef stew: Resistance + Fire Res 5 min. Meatball pasta: Health Boost 10 min."}
  - id: gkt_quiche
    deps: [gkt_warrior_food]
    roles: [cook, warrior]
    items: [brewinandchewin:quiche_slice]
    title: {ru: "Киш", en: "Quiche"}
    why: {ru: "Кусок киша — Поглощение II на 3 минуты: щит из золотых сердец перед боем.", en: "Absorption II for 3 min."}
  - id: gkt_sea_food
    deps: [gkt_buffs]
    roles: [cook]
    items: [farmersdelight:fish_stew, farmersdelight:baked_cod_stew, farmersdelight:squid_ink_pasta]
    title: {ru: "Еда ныряльщика", en: "Diver's Food"}
    why: {ru: "Рыбное рагу — Подводное дыхание на 8 минут. Тушёная треска — Грация дельфина на 3 минуты. Паста с чернилами кальмара — Ночное зрение 8 минут и Подводное дыхание 4 минуты.", en: "Fish stew: Water Breathing 8 min. Baked cod stew: Dolphin's Grace 3 min. Squid ink pasta: Night Vision 8 + Water Breathing 4."}
  - id: gkt_cave_food
    deps: [gkt_buffs]
    roles: [cook, engineer]
    items: [farmersdelight:mushroom_rice]
    title: {ru: "Грибной рис", en: "Mushroom Rice"}
    why: {ru: "Грибной рис — Ночное зрение на 8 минут: пещеры без факелов.", en: "Night Vision for 8 min."}
  - id: gkt_nether_food
    deps: [k_nether_kitchen]
    roles: [cook, warrior]
    items: [mynethersdelight:spicy_curry]
    title: {ru: "Острое карри", en: "Spicy Curry"}
    why: {ru: "Острое карри — Огнестойкость на 10 минут и Скорость на 3 минуты. Еда для Незера. Фондю (Brewin' and Chewin') — Огнестойкость на 8 минут.", en: "Fire Resistance 10 min + Speed 3 min. Fiery fondue: Fire Resistance 8 min."}
  - id: gkt_end_food
    deps: [k_end_kitchen]
    roles: [cook, warrior]
    items: [ends_delight:dragon_meat_stew]
    title: {ru: "Рагу из драконьего мяса", en: "Dragon Meat Stew"}
    why: {ru: "Рагу из дракона — Сопротивление II на 8 минут и Регенерация II на минуту. Лучшее блюдо перед боссом.", en: "Resistance II 8 min + Regeneration II 1 min: the best pre-boss meal."}
  - id: gkt_luck_food
    deps: [k_ocean_kitchen]
    roles: [cook]
    items: [oceansdelight:fugu_roll, meadow:cheese_tart_slice]
    title: {ru: "Фугу и сырный тарт", en: "Fugu Roll and Cheese Tart"}
    why: {ru: "Ролл с фугу — Удача на 10 минут (больше добычи). Кусок сырного тарта — Регенерация на минуту.", en: "Fugu roll: Luck 10 min. Cheese tart slice: Regeneration 1 min."}
  - id: gkt_mage_tea
    deps: [k_teas]
    roles: [cook, mage]
    items: [herbalbrews:green_tea]
    title: {ru: "Зелёный чай мага", en: "Mage's Green Tea"}
    why: {ru: "Зелёный чай мгновенно восполняет ману Iron's Spells — чай для мага посреди боя.", en: "Instantly restores Iron's Spells mana."}
  # --- Farmer's Delight tools and farming
  - id: gkt_knives
    deps: [k_iron_knife]
    roles: [cook]
    items: [farmersdelight:diamond_knife, farmersdelight:netherite_knife]
    title: {ru: "Ножи получше", en: "Better Knives"}
    why: {ru: "Нож — главный инструмент повара: режет траву на солому, мясо и продукты на доске. Ножи получше дольше служат.", en: "The cook's main tool; better knives last longer."}
  - id: gkt_rich_soil
    deps: [k_pot]
    roles: [gardener]
    items: [farmersdelight:organic_compost, farmersdelight:rich_soil*4]
    title: {ru: "Компост и богатая почва", en: "Compost and Rich Soil"}
    why: {ru: "Органический компост со временем превращается в богатую почву. На ней культуры растут быстрее, а грибы разрастаются в колонии.", en: "Compost turns into rich soil: faster crops, mushroom colonies."}
  - id: gkt_canvas
    deps: [k_knife]
    roles: [gardener, builder]
    items: [farmersdelight:canvas*4, farmersdelight:rope*8]
    title: {ru: "Холст и верёвка", en: "Canvas and Rope"}
    why: {ru: "Из соломы — холст (на вывески и шатры) и верёвка (лазать вниз и подвешивать грузы).", en: "Straw makes canvas and rope."}
  - id: gkt_feasts
    deps: [k_feast]
    roles: [cook, mayor]
    items: [farmersdelight:shepherds_pie_block]
    title: {ru: "Праздничные блюда", en: "Feasts"}
    why: {ru: "Блюдо-праздник ставится на стол, и каждый берёт свою порцию миской. Еда на всю команду за один раз.", en: "A feast on the table feeds the whole team."}
  - id: gkt_pet_food
    deps: [k_pot]
    roles: [breeder]
    items: [farmersdelight:dog_food, farmersdelight:horse_feed]
    title: {ru: "Корм для питомцев", en: "Pet Food"}
    why: {ru: "Собачий корм лечит и усиливает волка, конский корм — лошадь. Питомцы дольше живут в походах.", en: "Heals and buffs your wolf or horse."}
  - id: gkt_cocoa
    deps: [k_pot]
    roles: [cook]
    items: [farmersdelight:hot_cocoa]
    why: {ru: "Горячий шоколад снимает один случайный негативный эффект — лекарство из кухни.", en: "Removes a harmful effect."}
  # --- Brewin' and Chewin'
  - id: gkt_bnc_fondue_pot
    deps: [k_fondue]
    roles: [cook]
    items: [brewinandchewin:fiery_fondue_pot]
    why: {en: Serve fiery fondue (Fire Resistance 8 min) from the pot., ru: Котелок для фондю ставится на стол — из него берут порции огненного фондю (Огнестойкость на 8 минут).}
  - id: gkt_bnc_ferment
    deps: [k_brewin_keg]
    roles: [cook]
    items: [brewinandchewin:kimchi]
    why: {ru: "Кег не только для пива: в нём квасят кимчи и соленья — еда, которая долго не портится.", en: "The keg also ferments kimchi and pickles."}
  - id: gkt_bnc_drinks
    deps: [k_brewin_keg]
    roles: [cook]
    items: [brewinandchewin:red_rum, brewinandchewin:dread_nog, brewinandchewin:glittering_grenadine]
    title: {ru: "Особые напитки кега", en: "Special Keg Drinks"}
    why: {ru: "У каждого напитка свой эффект — он написан в подсказке. Пей в меру: опьянение мешает в бою.", en: "Each drink has its own effect (see tooltip). Mind the tipsiness."}
  - id: gkt_bnc_drinks2
    deps: [gkt_bnc_drinks]
    roles: [cook]
    items: [brewinandchewin:withering_dross, brewinandchewin:pale_jane, brewinandchewin:egg_grog, brewinandchewin:salty_folly]
    title: {ru: "Вся барная карта", en: "The Whole Drinks Menu"}
    why: {ru: "Коллекция напитков кега — для таверны и праздников. Эффект каждого — в подсказке.", en: "The full keg menu for taverns and festivals."}
  # --- HerbalBrews
  - id: gkt_tea_kit
    deps: [k_teas]
    roles: [cook]
    items: [herbalbrews:tea_kettle, herbalbrews:cauldron, herbalbrews:flask]
    title: {ru: "Набор чаевара", en: "Tea Maker's Kit"}
    why: {ru: "Чайник заваривает чай, котёл — травяные отвары, фляга носит напиток в кармане.", en: "Kettle for tea, cauldron for herbal brews, a flask for the road."}
  - id: gkt_teas
    deps: [gkt_tea_kit]
    roles: [cook]
    items: [herbalbrews:oolong_tea, herbalbrews:rooibos_tea, herbalbrews:hibiscus_tea, herbalbrews:yerba_mate_tea]
    title: {ru: "Чайная коллекция", en: "Tea Collection"}
    why: {ru: "Каждый чай даёт свой эффект — смотри подсказку. Чай не пьянит, его можно пить в бою.", en: "Each tea has its effect; tea never makes you tipsy."}
  - id: gkt_coffee
    deps: [gkt_tea_kit]
    roles: [cook]
    items: [herbalbrews:coffee, herbalbrews:milk_coffee, herbalbrews:herbal_infusion]
    title: {ru: "Кофе и травяной настой", en: "Coffee and Herbal Infusion"}
  # --- My Nether's / End's / Ocean's Delight, Meadow
    why: {en: Energising drinks; see tooltips., ru: 'Кофе, кофе с молоком и травяной настой — бодрящие напитки HerbalBrews. Эффекты — в подсказках.'}
  - id: gkt_nether_stove
    deps: [k_nether_kitchen]
    roles: [cook]
    items: [mynethersdelight:nether_bricks_stove, mynethersdelight:resurgent_soil, mynethersdelight:letios_compost]
    title: {ru: "Незерская кухня и почва", en: "Nether Stove and Soil"}
    why: {ru: "Плита из незерского кирпича и воскрешающая почва — на ней в Незере растут незерские культуры и грибы.", en: "A nether stove and a soil that grows nether crops."}
  - id: gkt_nether_dishes
    deps: [gkt_nether_stove]
    roles: [cook]
    items: [mynethersdelight:spicy_hoglin_stew, mynethersdelight:strider_stew, mynethersdelight:hot_cream, mynethersdelight:ghasta]
    title: {ru: "Блюда Незера", en: "Nether Dishes"}
    why: {en: Hearty dishes from Nether drops., ru: 'Рагу из хоглина, рагу из страйдера, горячий крем и гаста — сытные блюда из добычи Незера.'}
  - id: gkt_powder_cannon
    title: {en: Powder Cannon, ru: Порошковая пушка}
    deps: [gkt_nether_stove]
    roles: [warrior]
    items: [mynethersdelight:powder_cannon]
    why: {ru: "Порошковая пушка — оружие из незерской кухни. Чем она стреляет и что делает — в подсказке.", en: "A nether-kitchen weapon; see its tooltip."}
  - id: gkt_end_kitchen
    deps: [k_end_kitchen]
    roles: [cook]
    items: [ends_delight:end_stove, ends_delight:dragon_tooth_knife, ends_delight:chorus_fruit_grain]
    title: {ru: "Кухня Края", en: "End Kitchen"}
    why: {ru: "Плита Края, нож из драконьего зуба и зерно хоруса — для блюд из шалкеров и дракона.", en: "Stove, dragon-tooth knife and chorus grain for End dishes."}
  - id: gkt_end_dishes
    deps: [gkt_end_kitchen]
    roles: [cook]
    items: [ends_delight:shulker_soup, ends_delight:ender_noodle, ends_delight:dragon_breath_soda]
    title: {ru: "Блюда Края", en: "End Dishes"}
    why: {en: Exotic End cooking., ru: 'Суп из шалкера, лапша Края и газировка из драконьего дыхания — экзотика для смелых поваров.'}
  - id: gkt_ocean_dishes
    deps: [k_ocean_kitchen]
    roles: [cook]
    items: [oceansdelight:bowl_of_guardian_soup, oceansdelight:elder_guardian_roll, oceansdelight:stuffed_squid, oceansdelight:braised_sea_pickle]
    title: {ru: "Блюда океана", en: "Ocean Dishes"}
    why: {ru: "Суп из стража и ролл из древнего стража — трофейная кухня после океанских храмов.", en: "Trophy cooking after ocean monuments."}
  - id: gkt_meadow_kit
    deps: [k_meadow_cheese]
    roles: [cook]
    items: [meadow:cookpot, meadow:fondue_pot, meadow:wooden_cauldron, meadow:rennet]
    title: {ru: "Альпийская кухня", en: "Alpine Kitchen"}
    why: {ru: "Котелок, фондюшница, деревянный котёл и сычужный фермент — без фермента молоко не станет сыром.", en: "Rennet turns milk into cheese."}
  - id: gkt_meadow_gear
    deps: [a_alpine]
    roles: [breeder, warrior]
    items: [meadow:felting_needle, meadow:fur_chestplate, meadow:climbing_rope]
    title: {ru: "Меховая одежда и верёвка", en: "Fur Clothing and Climbing Rope"}
    why: {ru: "Игла валяния делает войлок из шерсти, мех даёт тёплую одежду для гор, верёвка помогает лазать по скалам.", en: "Felting, warm fur clothes and a climbing rope."}
  - id: gkt_buffalo
    deps: [a_alpine]
    roles: [cook]
    items: [meadow:cooked_buffalo_meat]
  # --- Create: Confectionery
    why: {en: Hearty meat from alpine meadows., ru: Мясо буйвола — сытная добыча альпийских лугов.}
  - id: gkt_chocolate
    deps: [br_hot_chocolate]
    roles: [cook, engineer]
    items: [create_confectionery:bar_of_black_chocolate, create_confectionery:bar_of_white_chocolate, create_confectionery:bar_of_ruby_chocolate, create_confectionery:bar_of_caramel]
    title: {ru: "Шоколадная фабрика", en: "Chocolate Factory"}
    why: {ru: "Тёмный, белый, рубиновый шоколад и карамель льются из машин Create — сладости для праздников.", en: "Dark, white, ruby chocolate and caramel from Create machines."}
  - id: gkt_sweets
    deps: [gkt_chocolate]
    roles: [cook]
    items: [create_confectionery:marshmallow_on_a_stick, create_confectionery:gingerbread_man, create_confectionery:soothing_hot_chocolate]
    title: {ru: "Сладости", en: "Sweets"}
    why: {en: Sweets for festivals., ru: 'Маршмеллоу на палочке, имбирный человечек и успокаивающий горячий шоколад — сладкий стол для праздника.'}
  - id: gkt_candy_tools
    title: {en: Candy Cane Pickaxe, ru: Леденцовая кирка}
    deps: [gkt_chocolate]
    roles: [cook]
    items: [create_confectionery:candy_cane_pickaxe]
    why: {ru: "Кирка из леденца — шуточный, но рабочий инструмент к зимнему празднику.", en: "A festive, working candy-cane pickaxe."}
