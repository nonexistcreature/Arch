    roles: [explorer, engineer]
    items: [createteleporters:redstone_pearl, createteleporters:quantum_mechanism]
    title: {ru: "Квантовый механизм", en: "Quantum Mechanism"}
    why: {ru: "Редстоун-жемчуг и квантовый механизм — основа телепортеров Create. Квантовую жидкость делают в миксере.", en: "Redstone pearls and the quantum mechanism start Create teleporters."}
  - id: cp_tp_teleporter
    title: {ru: "Телепортер", en: "Teleporter"}
