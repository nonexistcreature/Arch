    roles: [engineer]
    items: [create_hypertube:hypertube_accelerator, create_hypertube:hypertube_junction]
    doc: ponder:create_hypertube:accelerator
    why: {ru: "Ускоритель разгоняет в трубе, развилка позволяет строить целую сеть с выбором направления.", en: "Accelerators speed you up, junctions build networks."}
  - id: cp_tube_attach
    title: {ru: "Воронка и сканер труб", en: "Tube Funnel and Scanner"}
    deps: [cp_tube_acc]
    roles: [engineer]
    items: [create_hypertube:hypertube_funnel, create_hypertube:tube_scanner_attachment]
    doc: ponder:create_hypertube:attachments
    why: {ru: "Воронка гонит по трубам предметы, сканер и детектор управляют сетью сигналами редстоуна.", en: "Funnels move items; scanners and detectors control the network."}
  - id: cp_tp_pearl
