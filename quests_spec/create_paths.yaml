    roles: [explorer, engineer]
    items: [createteleporters:teleporter, createteleporters:tp_link]
    doc: ponder:createteleporters:entity_teleporter_setup
    why: {ru: "Телепортер с привязкой переносит игроков между двумя точками. Настрой связь ссылкой — сцена Ponder покажет как.", en: "Linked teleporters move players between two points."}
  - id: cp_tp_items
    title: {ru: "Телепорт предметов и блоков", en: "Item and Block Teleporters"}
    deps: [cp_tp_teleporter]
    roles: [engineer]
    items: [createteleporters:item_tp, createteleporters:block_teleporter]
    doc: ponder:createteleporters:item_teleporter_setup
    why: {ru: "Телепортеры предметов и блоков — логистика без конвейеров между далёкими базами.", en: "Item and block teleporters: logistics between far bases."}
  - id: cp_tp_portal
    title: {ru: "Свой портал", en: "Custom Portal"}
    deps: [cp_tp_teleporter]
    roles: [explorer]
    items: [createteleporters:custom_portal_base]
    doc: ponder:createteleporters:c_portal_1
    why: {ru: "Свой портал можно настроить на координаты — строй личные врата между городами.", en: "Custom portals go to set coordinates."}
  - id: cp_tp_pocket
    title: {ru: "Карманное измерение", en: "Pocket Dimension"}
    deps: [cp_tp_teleporter]
    roles: [explorer, builder]
    items: [createteleporters:pocket_dimension_remote]
    why: {ru: "Пульт карманного измерения переносит в личную комнату — отличное место для склада или мастерской.", en: "The pocket dimension remote opens a private room."}

  # ===== Kinetics: Components & Additions, Bits 'n' Bobs, Dreams & Desires
  - id: cp_ca_gearbox
    title: {ru: "Латунная коробка передач", en: "Brass Gearbox"}
