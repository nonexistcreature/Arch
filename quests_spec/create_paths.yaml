    roles: [engineer]
    items: [create_ca:brass_gearbox, create_ca:vertical_brass_gearbox]
    doc: ponder:create_ca:brass_gearbox
    why: {ru: "Латунная коробка передач передаёт вращение во все шесть сторон и настраивается — меньше лишних валов.", en: "The brass gearbox outputs to all six sides."}
  - id: cp_ca_chain
    title: {ru: "Латунный цепной привод", en: "Brass Chain Drive"}
    deps: [cp_ca_gearbox]
    roles: [engineer]
    items: [create_ca:brass_chain_drive, create_ca:adjustable_brass_chain_gearshift]
    doc: ponder:create_ca:chain_drive
    why: {ru: "Латунный цепной привод и регулируемый переключатель тонко меняют скорость вдоль линии.", en: "Brass chain drives fine-tune speed along a line."}
  - id: cp_ca_inverted
    deps: [cp_ca_gearbox]
    roles: [engineer]
    items: [create_ca:inverted_clutch, create_ca:inverted_gearshift, create_ca:brass_basin]
    title: {ru: "Обратные муфты и латунная чаша", en: "Inverted Clutch and Brass Basin"}
    doc: ponder:create_ca:inverted_clutch
    why: {ru: "Обратная муфта работает наоборот: вращение идёт, пока нет сигнала. Латунная чаша — улучшенная чаша для миксера и пресса.", en: "Inverted clutches pass rotation without a signal; the brass basin upgrades the basin."}
  - id: cp_bnb_chain
    deps: [c_contraption]
    roles: [engineer]
    items: [bits_n_bobs:chain_pulley, bits_n_bobs:cogwheel_chain_carriage]
    doc: ponder:bits_n_bobs:chain_cog_flat
    why: {ru: "Цепной подъёмник и тележка на цепи двигают контрапции по сложным путям — лифты и подъёмники без верёвок.", en: "Chain pulleys and chain carriages move contraptions along chains."}
  - id: cp_bnb_nixie
    deps: [c_logistics]
    roles: [engineer, builder]
    items: [bits_n_bobs:nixie_board, bits_n_bobs:large_nixie_tube]
    doc: ponder:bits_n_bobs:nixie_board
    why: {ru: "Газоразрядные табло показывают числа и текст со ссылок дисплея — склад, счётчики, табло станций.", en: "Nixie boards show numbers and text from display links."}
  - id: cp_bnb_strut
    deps: [cp_intro]
    roles: [builder, engineer]
    items: [bits_n_bobs:girder_strut, bits_n_bobs:headlamp, bits_n_bobs:brass_lamp]
    title: {ru: "Распорки и фонари", en: "Struts and Lamps"}
    doc: ponder:bits_n_bobs:girder_strut
    why: {ru: "Балки-распорки соединяют опоры под любым углом, налобный фонарь светит в шахте, латунная лампа — на базе.", en: "Girder struts at any angle, a headlamp and brass lamps."}
  - id: cp_dd_press
    deps: [c_press]
    roles: [engineer]
    items: [dndesires:hydraulic_press, dndesires:industrial_fan]
    title: {ru: "Гидравлический пресс и промышленный вентилятор", en: "Hydraulic Press and Industrial Fan"}
    why: {ru: "Create: Dreams & Desires даёт более мощные версии машин: гидропресс и промышленный вентилятор для больших партий.", en: "Stronger machines for big batches."}
  - id: cp_dd_sails
    deps: [cp_dd_press, c_fan]
    roles: [engineer]
    items: [dndesires:splashing_sail, dndesires:blasting_sail, dndesires:smoking_sail, dndesires:haunting_sail]
    title: {ru: "Обрабатывающие паруса", en: "Processing Sails"}
    why: {ru: "Паруса-обработчики на вращающейся мельнице промывают, плавят, коптят и «призрачат» предметы, как вентилятор, — только на ходу.", en: "Processing sails wash, smelt, smoke and haunt like a fan."}
  - id: cp_dd_gears
    deps: [c_brass]
    roles: [engineer]
    items: [dndesires:omni_gearbox, dndesires:omni_speed_controller, dndesires:cog_crank]
    title: {ru: "Омни-коробка и регулятор", en: "Omni Gearbox and Controller"}
    why: {ru: "Омни-коробка и омни-регулятор скорости упрощают сложные трансмиссии, рукоять-шестерня даёт ручной привод.", en: "Omni gearbox and speed controller simplify transmissions."}
  - id: cp_dd_mixer
    deps: [c_mixer]
    roles: [engineer, cook]
    items: [dndesires:gold_mixer, dndesires:fluid_hatch, dndesires:smart_hopper]
    title: {ru: "Золотой миксер и люки", en: "Golden Mixer and Hatches"}
    why: {ru: "Золотой миксер работает быстрее, жидкостной люк и умная воронка упрощают загрузку.", en: "Faster golden mixer, fluid hatch and smart hopper."}
  - id: cp_dd_tools
    deps: [cp_dd_press]
    roles: [engineer, warrior]
    items: [dndesires:handheld_drill, dndesires:handheld_saw, dndesires:multimeter]
    title: {ru: "Ручные инструменты", en: "Handheld Tools"}
    why: {ru: "Ручная дрель и пила копают и рубят на силе Create, мультиметр показывает напряжения и скорости.", en: "Handheld drill and saw; the multimeter reads values."}
  - id: cp_dd_defense
    deps: [cp_dd_tools]
    roles: [warrior, engineer]
    items: [dndesires:spud_sentry, dndesires:gatling_breaker]
    title: {ru: "Турели", en: "Turrets"}
    why: {ru: "Картофельная турель и гатлинг-разрушитель защищают базу — заряжай их и ставь у входа.", en: "Turrets defend the base."}

  # ===== Create: Misc and Things
  - id: cp_mt_spout
