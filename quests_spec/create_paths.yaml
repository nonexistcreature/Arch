# Create, wave 13: production, automation, logistics, transport and gear add-ons. Many duplicate other mods on purpose
# (owner: players choose their own route). Texts: Ponder scenes, the add-ons' tooltips and our «why» lines.
chapter:
  id: create_paths
  order: 7.6
  icon: createoreexcavation:drilling_machine
  ru: {title: "Create: пути развития", subtitle: "Добыча, переработка, логистика, транспорт и снаряжение — выбирай свой путь"}
  en: {title: "Create: Paths", subtitle: "Mining, processing, logistics, transport and gear — pick your own route"}
lang: [createoreexcavation, vintage, createsifter, createmetallurgy, create_netherless, create_aquatic_ambitions, create_mechanical_spawner, create_factory_logistics, createstockbridge, createendertransmission, create_hypertube, create_ca, bits_n_bobs, dndesires, create_things_and_misc, createteleporters, creategoggles, create_sa, createmoredrillheads]
autodoc: ["item.{ns}.{path}.tooltip.summary", "block.{ns}.{path}.tooltip.summary", "item.{ns}.{path}.tooltip", "block.{ns}.{path}.tooltip", "item.{ns}.{path}.desc"]
out: create_paths_gen
quests:
  - id: cp_intro
    deps: [c_alloy]
    roles: [engineer]
    shape: gear
    icon: create:wrench
    title: {ru: "Пути развития Create", en: "Create Paths"}
    why: {ru: "В этой главе — дополнения Create. Многие делают одно и то же разными способами: руду можно бурить, просеивать или плавить; энергию — получать от дизеля, магнитов или реактора. Выбирай ветку, которая тебе нравится, — квесты не запирают остальные.", en: "Create add-ons. Many do the same job differently: drill, sift or smelt ore; pick the branch you like."}

  # ===== Ore Excavation: endless ore veins
  - id: cp_oe_finder
    deps: [cp_intro, c_precision]
    roles: [explorer, engineer]
    items: [createoreexcavation:vein_finder]
    doc: ponder:createoreexcavation:find_ores
    why: {ru: "Под землёй в каждом чанке может лежать бесконечная рудная жила. Искатель жил показывает, есть ли она рядом и что в ней.", en: "Every chunk may hide an endless ore vein; the Vein Finder shows it."}
  - id: cp_oe_sample
    deps: [cp_oe_finder]
    roles: [explorer, engineer]
    items: [createoreexcavation:sample_drill]
    doc: ponder:createoreexcavation:sample_drill
    why: {ru: "Пробный бур уточняет, какая именно жила в чанке, прежде чем строить большую установку.", en: "The Sample Drill confirms the vein before you build."}
  - id: cp_oe_atlas
    deps: [cp_oe_finder]
    roles: [explorer]
    items: [createoreexcavation:vein_atlas]
    why: {ru: "Атлас жил запоминает найденные жилы, чтобы не искать их заново.", en: "The Vein Atlas remembers found veins."}
  - id: cp_oe_drill
    deps: [cp_oe_sample, c_drill]
    roles: [engineer]
    items: [createoreexcavation:drilling_machine, createoreexcavation:drill]
    doc: ponder:createoreexcavation:drilling
    why: {ru: "Буровая установка с вращением добывает руду из жилы бесконечно — главный поздний источник железа, меди и редких руд.", en: "The drilling machine mines a vein forever: the late-game ore source."}
  - id: cp_oe_heads
    deps: [cp_oe_drill]
    roles: [engineer]
    items: [createoreexcavation:diamond_drill, createoreexcavation:netherite_drill]
    title: {ru: "Алмазный и незеритовый буры", en: "Diamond and Netherite Drills"}
    why: {ru: "Буры получше копают быстрее и берут жилы, которые обычному буру не по зубам.", en: "Better drill heads mine faster and reach tougher veins."}
  - id: cp_oe_extractor
    deps: [cp_oe_drill]
    roles: [engineer]
    items: [createoreexcavation:extractor]
    why: {ru: "Экстрактор качает из жил жидкости — например, нефть или воду глубоко под землёй.", en: "The Extractor pumps fluids out of fluid veins."}
  - id: cp_oe_raw
    deps: [cp_oe_drill]
    roles: [engineer, explorer]
    items: [createoreexcavation:raw_diamond, createoreexcavation:raw_emerald]
    title: {ru: "Сырые алмазы и изумруды", en: "Raw Diamonds and Emeralds"}
    why: {ru: "Из редких жил идут сырые камни — их дробят и промывают в Create, как обычную руду.", en: "Rare veins give raw gems: crush and wash them."}

  # ===== More Drill Heads
  - id: cp_mdh_tiers
    deps: [c_drill]
    roles: [engineer]
    items: [createmoredrillheads:iron_drill, createmoredrillheads:diamond_drill, createmoredrillheads:netherite_drill]
    title: {ru: "Буры по тирам", en: "Drill Tiers"}
    why: {ru: "Механический бур бывает каменным, железным, алмазным и незеритовым. Чем лучше материал, тем быстрее копает контрапция.", en: "Mechanical drills in stone, iron, diamond and netherite: faster mining contraptions."}
  - id: cp_mdh_tipped
    deps: [cp_mdh_tiers]
    roles: [engineer]
    items: [createmoredrillheads:redstone_dusts_tipped_iron_drill, createmoredrillheads:quartz_dusts_tipped_iron_drill]
    title: {ru: "Напылённые буры", en: "Tipped Drills"}
    why: {ru: "Напыление из редстоуна, кварца, аметиста или изумруда даёт буру особые свойства — подробности в подсказке предмета.", en: "Dust tipping gives drills special traits; see the tooltip."}

  # ===== Sifting: early ore from gravel
  - id: cp_sift
    deps: [cp_intro, c_wheel]
    roles: [engineer, explorer]
    items: [createsifter:sifter, createsifter:string_mesh]
    doc: ponder:createsifter:sifter
    why: {ru: "Сито на вращении просеивает гравий, песок и пыль — оттуда выпадают кусочки руды. Ранний способ получать металлы без шахты.", en: "The sifter turns gravel, sand and dust into ore pieces: early metal without mining."}
  - id: cp_sift_meshes
    deps: [cp_sift]
    roles: [engineer]
    items: [createsifter:andesite_mesh, createsifter:zinc_mesh, createsifter:brass_mesh]
    title: {ru: "Сетки получше", en: "Better Meshes"}
    why: {ru: "Сетка определяет, что выпадает и как часто. Андезитовая, цинковая, латунная — у каждой свой набор руд.", en: "The mesh decides the drops: each tier has its own ores."}
  - id: cp_sift_brass
    deps: [cp_sift_meshes, c_brass]
    roles: [engineer]
    items: [createsifter:brass_sifter, createsifter:advanced_brass_mesh]
    why: {ru: "Латунное сито быстрее и работает с продвинутыми сетками — уже настоящая фабрика руды.", en: "The brass sifter is faster and takes advanced meshes."}
  - id: cp_sift_pieces
    deps: [cp_sift]
    roles: [engineer]
    items: [createsifter:raw_iron_piece*9, createsifter:dust*4]
    title: {ru: "Кусочки руды и пыль", en: "Ore Pieces and Dust"}
    why: {ru: "Девять кусочков складываются в сырую руду. Пыль получают дроблением песка — её тоже можно просеивать.", en: "Nine pieces make raw ore; dust comes from crushed sand."}

  # ===== Vintage: processing machines
  - id: cp_vin_grinder
    title: {ru: "Ленточный шлифовальщик", en: "Belt Grinder"}
    deps: [cp_intro, c_belt]
    roles: [engineer]
    items: [vintage:belt_grinder, vintage:grinder_belt]
    doc: ponder:vintage:belt_grinder_processing
    why: {ru: "Ленточный шлифовальщик обрабатывает детали и полирует камни. Ленту можно менять наждачкой.", en: "The belt grinder processes parts; swap the belt with sandpaper."}
  - id: cp_vin_spring
    title: {ru: "Пружины", en: "Springs"}
    deps: [cp_vin_grinder, c_press]
    roles: [engineer]
    items: [vintage:spring_coiling_machine, vintage:iron_spring]
    doc: ponder:vintage:spring_coiling_processing
    why: {ru: "Пружинонавивочная машина делает пружины — главный ресурс Vintage для механизмов посложнее.", en: "The coiling machine makes springs, Vintage's key resource."}
  - id: cp_vin_compressor
    title: {ru: "Компрессор", en: "Compressor"}
    deps: [cp_vin_spring, c_pipes]
    roles: [engineer]
    items: [vintage:vacuum_chamber]
    doc: ponder:vintage:vacuum_chamber
    why: {ru: "Компрессор (вакуумная камера) сжимает или разрежает — режим переключается ключом. В нём делают сульфаты и особые сплавы.", en: "The compressor has two modes (wrench): sulfates and special alloys."}
  - id: cp_vin_centrifuge
    title: {ru: "Центрифуга", en: "Centrifuge"}
    deps: [cp_vin_compressor]
    roles: [engineer]
    items: [vintage:centrifuge]
    doc: ponder:vintage:centrifuge
    why: {ru: "Центрифуга разделяет смеси и жидкости на составляющие — например, руду на основной металл и примеси.", en: "The centrifuge splits mixes and fluids into parts."}
  - id: cp_vin_hammer
    title: {ru: "Кузнечный молот", en: "Helve Hammer"}
    deps: [cp_vin_spring]
    roles: [engineer]
    items: [vintage:helve_hammer]
    doc: ponder:vintage:helve_hammer
    why: {ru: "Кузнечный молот куёт заготовки. У него два режима, а лишние слоты можно закрыть крышкой.", en: "The helve hammer forges parts; two modes, slots can be covered."}
  - id: cp_vin_lathe
    title: {ru: "Токарный станок", en: "Lathe"}
    deps: [cp_vin_spring]
    roles: [engineer]
    items: [vintage:lathe, vintage:recipe_card]
    doc: ponder:vintage:lathe
    why: {ru: "Токарный станок вытачивает стержни и детали. Карта рецепта позволяет автоматизировать его.", en: "The lathe turns rods and parts; a recipe card automates it."}
  - id: cp_vin_curving
    title: {ru: "Гибочный пресс", en: "Curving Press"}
    deps: [cp_vin_spring]
    roles: [engineer]
    items: [vintage:curving_press, vintage:convex_curving_head]
    doc: ponder:vintage:curving_press
    why: {ru: "Гибочный пресс с разными насадками сгибает листы в вёдра, конусы и уголки.", en: "The curving press bends sheets with different heads."}
  - id: cp_vin_vibro
    title: {ru: "Вибростол", en: "Vibrating Table"}
    deps: [cp_vin_spring]
    roles: [engineer]
    items: [vintage:vibrating_table]
    doc: ponder:vintage:vibrating_table
    why: {ru: "Вибростол сортирует сыпучие материалы — отделяет ценное от пустой породы.", en: "The vibrating table sorts loose materials."}
  - id: cp_vin_laser
    title: {ru: "Лазер", en: "Laser"}
    deps: [cp_vin_lathe, ca_wires]
    roles: [engineer]
    items: [vintage:laser]
    doc: ponder:vintage:laser
    why: {ru: "Лазер работает на электричестве и делает самые точные рецепты Vintage.", en: "The laser runs on electricity for the finest Vintage recipes."}
  - id: cp_vin_materials
    deps: [cp_vin_compressor]
    roles: [engineer, gardener]
    items: [vintage:copper_sulfate, vintage:vanadium_ingot, vintage:redstone_module]
    title: {ru: "Сульфат, ванадий и редстоун-модуль", en: "Sulfate, Vanadium and Redstone Module"}
    why: {ru: "Медный купорос — удобрение вместо костной муки. Ванадий — прочный металл. Редстоун-модуль — деталь для сложных механизмов.", en: "Copper sulfate is fertiliser, vanadium a strong metal, the redstone module a complex part."}

  # ===== Metallurgy: melting and casting
  - id: cp_met_mortar
    deps: [cp_intro, c_mixer]
    roles: [engineer]
    items: [createmetallurgy:refractory_mortar*8]
    doc: ponder:createmetallurgy:foundry
    why: {ru: "Огнеупорный раствор — основа литейной: из него строят то, что выдерживает расплавленный металл.", en: "Refractory mortar builds what holds molten metal."}
  - id: cp_met_foundry
    deps: [cp_met_mortar]
    roles: [engineer]
    items: [createmetallurgy:foundry_basin, createmetallurgy:foundry_lid, createmetallurgy:foundry_mixer]
    doc: ponder:createmetallurgy:foundry_basin
    why: {ru: "Литейный котёл с крышкой и мешалкой плавит руду и пыль в жидкий металл. Выход больше, чем у обычной плавки.", en: "The foundry melts ore and dust into molten metal for higher yield."}
  - id: cp_met_crucible
    deps: [cp_met_foundry]
    roles: [engineer]
    items: [createmetallurgy:industrial_crucible]
    doc: ponder:createmetallurgy:industrial_crucible
    why: {ru: "Промышленный тигель — большая печь для плавки целыми партиями.", en: "The industrial crucible melts in bulk."}
  - id: cp_met_casting
    deps: [cp_met_foundry]
    roles: [engineer]
    items: [createmetallurgy:faucet, createmetallurgy:casting_table, createmetallurgy:graphite_ingot_mold]
    doc: ponder:createmetallurgy:casting_blocks
    why: {ru: "Кран сливает металл на литейный стол, форма задаёт, что получится: слиток, пластина, шестерня.", en: "Faucet + casting table + mold: ingots, plates, gears."}
  - id: cp_met_basin
    deps: [cp_met_casting]
    roles: [engineer]
    items: [createmetallurgy:casting_basin]
    why: {ru: "Литейная чаша отливает сразу целые блоки металла.", en: "The casting basin casts whole blocks."}
  - id: cp_met_tungsten
    deps: [cp_met_foundry]
    roles: [engineer, explorer]
    items: [createmetallurgy:raw_tungsten*4, createmetallurgy:tungsten_ingot]
    title: {ru: "Вольфрам", en: "Tungsten"}
    why: {ru: "Вольфрамит добывают под землёй. Вольфрам плавится только в литейной — это материал для самых прочных деталей Metallurgy.", en: "Wolframite ore becomes tungsten, only in the foundry."}
  - id: cp_met_steel
    deps: [cp_met_foundry]
    roles: [engineer]
    items: [createmetallurgy:steel_ingot*4, createmetallurgy:coke]
    title: {ru: "Сталь из литейной", en: "Foundry Steel"}
    why: {ru: "Ещё один путь к стали: железо + кокс в литейной. Можно выбрать его вместо домны TFMG или IE.", en: "Another way to steel: iron + coke in the foundry."}
  - id: cp_met_grinder
    deps: [cp_met_foundry]
    roles: [engineer]
    items: [createmetallurgy:mechanical_belt_grinder]
    why: {ru: "Механический шлифовальщик чистит грязную пыль перед плавкой — так выход ещё выше.", en: "The belt grinder cleans dirty dust before melting."}

  # ===== Netherless, Aquatic Ambitions, Ultimate Factory
  - id: cp_nl_ecto
    title: {ru: "Эктоплазма", en: "Ectoplasm"}
    deps: [cp_intro, c_fan]
    roles: [engineer]
    items: [create_netherless:ectoplasm]
    why: {ru: "Create: Netherless даёт ресурсы Незера без похода в Незер. Эктоплазма — первый шаг цепочки, смотри рецепты в JEI.", en: "Netherless gives Nether resources without the Nether; ectoplasm starts it."}
  - id: cp_nl_blaze
    deps: [cp_nl_ecto, c_deployer]
    roles: [engineer]
    items: [create_netherless:coal_rod]
    title: {ru: "Огненный стержень без Незера", en: "Blaze Rods Without the Nether"}
    why: {ru: "Угольный стержень в последовательной сборке становится стержнем ифрита — топливо для горелок Create.", en: "Coal rods become blaze rods in sequenced assembly."}
  - id: cp_nl_netherite
    title: {ru: "Незерит без Незера", en: "Netherite Without the Nether"}
    deps: [cp_nl_blaze]
    roles: [engineer]
    items: [create_netherless:netherite_fragment]
    why: {ru: "Обломки незерита и шаблон улучшения тоже можно сделать на фабрике.", en: "Netherite fragments and the upgrade template from the factory."}
  - id: cp_aq_conduit
    deps: [cp_intro, c_fan]
    roles: [engineer, breeder]
    items: [create_aquatic_ambitions:mechanical_conduit]
    doc: ponder:create_aquatic_ambitions:mechanical_conduit_awaken
    why: {ru: "Механический проводник даёт эффекты источника и обрабатывает предметы — новый вид массовой переработки.", en: "The mechanical conduit gives conduit effects and processes items."}
  - id: cp_aq_alloy
    deps: [cp_aq_conduit]
    roles: [engineer]
    items: [create_aquatic_ambitions:prismarine_alloy, create_aquatic_ambitions:calcium_rich_powder]
    title: {ru: "Призмариновый сплав", en: "Prismarine Alloy"}
    doc: ponder:create_aquatic_ambitions:conduit_processing
    why: {ru: "Через проводник фабрика делает призмарин, кораллы и раковины наутилуса — без походов к храмам.", en: "Prismarine, coral and nautilus shells from the factory."}
  - id: cp_uf
    deps: [cp_intro, c_mixer]
    roles: [engineer]
    icon: create:mechanical_mixer
    title: {ru: "Ультимативная фабрика", en: "Ultimate Factory"}
    why: {ru: "Create: Ultimate Factory добавляет рецепты Create для вещей, которые обычно добывают руками: ресурсы мобов, редкие блоки. Ищи в JEI машины Create как способ получения.", en: "Ultimate Factory adds Create recipes for things usually gathered by hand; check JEI."}

  # ===== Mechanical Spawner
  - id: cp_spawner
    deps: [cp_intro, c_brass, c_pipes]
    roles: [engineer, warrior]
    items: [create_mechanical_spawner:mechanical_spawner]
    doc: ponder:create_mechanical_spawner:spawner
    why: {ru: "Механический спаунер на вращении создаёт мобов из спаун-жидкости. Жидкость для каждого моба своя — смешивай её из его дропа.", en: "The mechanical spawner makes mobs from spawn fluid made of their drops."}
  - id: cp_spawner_loot
    deps: [cp_spawner]
    roles: [engineer]
    items: [create_mechanical_spawner:loot_collector]
    why: {ru: "Сборщик добычи забирает дроп сразу, без убийства моба. Ферма ресурсов без лишних хлопот.", en: "The loot collector takes the drops directly."}

  # ===== Logistics: Factory Logistics, Stock Bridge, Ender Transmission
  - id: cp_fl_jar
    deps: [c_logistics]
    roles: [engineer]
    items: [create_factory_logistics:jar_packager, create_factory_logistics:copper_jar_package_8x8]
    why: {ru: "Банки — посылки для жидкостей. Упаковщик банок отправляет воду, лаву и топливо по сети посылок Create, как обычные предметы.", en: "Jars are packages for fluids, sent through Create's package network."}
  - id: cp_fl_gauge
    deps: [cp_fl_jar]
    roles: [engineer]
    items: [create_factory_logistics:factory_fluid_gauge, create_factory_logistics:network_link]
    doc: ponder:create_factory_logistics:mixer_upkeep
    why: {ru: "Датчик жидкостей заказывает жидкость, когда её мало, — миксеры и котлы пополняются сами.", en: "The fluid gauge orders fluid when it runs low."}
  - id: cp_fl_composite
    title: {ru: "Составная посылка", en: "Composite Package"}
    deps: [cp_fl_jar]
    roles: [engineer]
    items: [create_factory_logistics:composite_package]
    why: {ru: "Составная посылка везёт предметы и жидкости вместе — один заказ на всё.", en: "Composite packages carry items and fluids together."}
  - id: cp_stockbridge
    title: {ru: "Мост склада и AE2", en: "AE Stock Bridge"}
    deps: [c_logistics, ae_network]
    roles: [engineer]
    items: [createstockbridge:ae_bridge]
    doc: ponder:createstockbridge:ae_stockbridge
    why: {ru: "Мост связывает склад Create с сетью AE2: заказы из стоковой системы забирают предметы из МЭ-хранилища.", en: "Links Create's stock system with an AE2 network."}
  - id: cp_stockbridge_pattern
    title: {ru: "Шаблон запроса", en: "Request Pattern"}
    deps: [cp_stockbridge]
    roles: [engineer]
    items: [createstockbridge:request_pattern]
    why: {ru: "Шаблон запроса позволяет заказывать у AE2 автокрафт прямо из системы Create.", en: "Request patterns order AE2 autocrafting from Create."}
  - id: cp_et_items
    deps: [c_brass]
    roles: [engineer]
    items: [createendertransmission:item_transmitter, createendertransmission:fluid_transmitter]
    title: {ru: "Эндер-передатчики", en: "Ender Transmitters"}
    why: {ru: "Передатчики отправляют предметы и жидкости на любое расстояние и даже между мирами — без труб и поездов.", en: "Transmitters move items and fluids across any distance, even dimensions."}
  - id: cp_et_energy
    title: {ru: "Энергопередатчик", en: "Energy Transmitter"}
    deps: [cp_et_items]
    roles: [engineer]
    items: [createendertransmission:energy_transmitter]
    why: {ru: "Энергопередатчик пересылает энергию по воздуху — генератор может стоять далеко от фабрики.", en: "Send energy wirelessly."}
  - id: cp_et_chunk
    title: {ru: "Загрузчик чанков", en: "Chunk Loader"}
    deps: [cp_et_items]
    roles: [engineer]
    items: [createendertransmission:chunk_loader]
    why: {ru: "Загрузчик чанков держит фабрику работающей, пока ты далеко.", en: "Keeps your factory loaded while you are away."}

  # ===== Transport: Hypertubes, Teleporters
  - id: cp_tube
