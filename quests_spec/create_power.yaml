# Create power add-ons, wave 13: Create: New Age (magnet electricity, thorium reactor), Create: Diesel Generators (oil,
# fuels, engines), Create Nuclear (uranium reactor). They overlap Crafts & Additions, TFMG and Mekanism on purpose.
chapter:
  id: create_power
  order: 7.7
  icon: createdieselgenerators:diesel_engine
  ru: {title: "Create: энергия и атом", subtitle: "Магниты, дизель и реакторы — три пути к большой мощности"}
  en: {title: "Create: Power", subtitle: "Magnets, diesel and reactors — three roads to big power"}
lang: [create_new_age, createdieselgenerators, createnuclear]
autodoc: ["item.{ns}.{path}.tooltip.summary", "block.{ns}.{path}.tooltip.summary", "item.{ns}.{path}.tooltip", "block.{ns}.{path}.tooltip"]
out: create_power_gen
quests:
  - id: cpw_intro
    deps: [c_steam]
    roles: [engineer]
    shape: gear
    icon: create:steam_engine
    title: {ru: "Больше мощности", en: "More Power"}
    why: {ru: "Паровой двигатель — не предел. Здесь три пути: электричество на магнитах (New Age), дизельные двигатели (Diesel Generators) и атомные реакторы (New Age и Create Nuclear). Можно пройти любой или все.", en: "Three roads past steam: magnet electricity, diesel engines and reactors."}

  # ===== Create: New Age
  - id: cpw_na_magnet
    deps: [cpw_intro]
    roles: [engineer]
    items: [create_new_age:redstone_magnet]
    doc: ponder:create_new_age:generation
    why: {ru: "New Age делает электричество из вращения: магниты вокруг вращающейся катушки. Начни с редстоун-магнита.", en: "New Age turns rotation into power with magnets around a coil."}
  - id: cpw_na_coil
    deps: [cpw_na_magnet]
    roles: [engineer]
    items: [create_new_age:generator_coil, create_new_age:carbon_brushes]
    why: {ru: "Катушка генератора с угольными щётками — сердце генератора. Чем сильнее магниты вокруг, тем больше энергии.", en: "The generator coil with carbon brushes; stronger magnets, more power."}
  - id: cpw_na_wires
    deps: [cpw_na_coil]
    roles: [engineer]
    items: [create_new_age:copper_wire*8, create_new_age:electrical_connector*4]
    doc: ponder:create_new_age:wires
    why: {ru: "Провода и коннекторы New Age несут энергию от генератора к машинам. Провода получше (перезаряженные) держат больший ток.", en: "Wires and connectors carry power; overcharged wires carry more."}
  - id: cpw_na_motor
    deps: [cpw_na_wires]
    roles: [engineer]
    items: [create_new_age:basic_motor]
    doc: ponder:create_new_age:motor
    why: {ru: "Мотор превращает электричество обратно во вращение — машины можно ставить где угодно, протянув провод.", en: "Motors turn power back into rotation anywhere."}
  - id: cpw_na_energiser
    deps: [cpw_na_wires]
    roles: [engineer]
    items: [create_new_age:basic_energiser, create_new_age:overcharged_iron]
    doc: ponder:create_new_age:energiser
    why: {ru: "Энерджайзер заряжает предметы: из железа, золота и алмаза получаются перезаряженные версии для проводов и магнитов получше.", en: "The energiser overcharges iron, gold and diamond."}
  - id: cpw_na_better
    deps: [cpw_na_energiser]
    roles: [engineer]
    items: [create_new_age:fluxuated_magnetite, create_new_age:netherite_magnet]
    title: {ru: "Сильные магниты", en: "Strong Magnets"}
    why: {ru: "Флюксованный магнетит и незеритовый магнит — следующие ступени: генератор выдаёт в разы больше.", en: "Stronger magnets for a much stronger generator."}
  - id: cpw_na_motor2
    deps: [cpw_na_motor, cpw_na_better]
    roles: [engineer]
    items: [create_new_age:advanced_motor, create_new_age:reinforced_motor]
    title: {ru: "Продвинутые моторы", en: "Advanced Motors"}
    why: {ru: "Продвинутый и усиленный моторы крутят быстрее и сильнее. Удлинители мотора добавляют мощность.", en: "Advanced and reinforced motors; extensions add power."}
  - id: cpw_na_heat
    deps: [cpw_na_wires]
    roles: [engineer]
    items: [create_new_age:heater, create_new_age:basic_solar_heating_plate]
    doc: ponder:create_new_age:heating
    why: {ru: "Нагреватель на электричестве греет чаши Create без горелки ифрита, солнечная плита — от солнца.", en: "The heater warms basins electrically; solar plates use the sun."}
  - id: cpw_na_stirling
    deps: [cpw_na_heat]
    roles: [engineer]
    items: [create_new_age:stirling_engine, create_new_age:heat_pipe]
    why: {ru: "Двигатель Стирлинга делает вращение из тепла, тепловые трубы переносят тепло между блоками.", en: "The Stirling engine turns heat into rotation."}
  - id: cpw_na_thorium
    deps: [cpw_na_better]
    roles: [engineer, explorer]
    items: [create_new_age:thorium*4]
    why: {ru: "Ториевая руда — топливо реактора New Age. Ищи её глубоко под землёй.", en: "Thorium ore fuels the New Age reactor."}
  - id: cpw_na_fuel
    deps: [cpw_na_thorium, c_deployer]
    roles: [engineer]
    items: [create_new_age:nuclear_fuel]
    why: {ru: "Ядерное топливо собирается последовательной сборкой из тория.", en: "Nuclear fuel is assembled from thorium."}
  - id: cpw_na_reactor
    deps: [cpw_na_fuel]
    roles: [engineer]
    items: [create_new_age:reactor_casing*16, create_new_age:reactor_fuel_acceptor, create_new_age:reactor_heat_vent]
    doc: ponder:create_new_age:reactor
    title: {ru: "Реактор New Age", en: "New Age Reactor"}
    why: {ru: "Реактор New Age греет тепловые трубы и двигатели. Следи за температурой: перегретый реактор плавится в кориум — опасную лаву, которая разрушает блоки.", en: "The reactor heats pipes and engines. Overheat it and it melts into corium."}

  # ===== Create: Diesel Generators
  - id: cpw_dg_scanner
    deps: [cpw_intro]
    roles: [explorer, engineer]
    items: [createdieselgenerators:oil_scanner]
    doc: ponder:createdieselgenerators:oil_chunk
    why: {ru: "Сканер нефти показывает, есть ли под этим чанком нефть и сколько. Нефтяные чанки встречаются не везде.", en: "The oil scanner finds oil chunks."}
  - id: cpw_dg_pumpjack
    deps: [cpw_dg_scanner, c_pipes]
    roles: [engineer]
    items: [createdieselgenerators:pumpjack_head, createdieselgenerators:pumpjack_bearing, createdieselgenerators:pumpjack_crank, createdieselgenerators:pumpjack_hole]
    doc: ponder:createdieselgenerators:pumpjack
    title: {ru: "Станок-качалка", en: "Pumpjack"}
    why: {ru: "Качалка собирается из головки, подшипника, кривошипа и устья. Ставь над нефтяным чанком — она качает сырую нефть.", en: "Build the pumpjack over an oil chunk to pump crude oil."}
  - id: cpw_dg_distill
    deps: [cpw_dg_pumpjack]
    roles: [engineer]
    items: [createdieselgenerators:distillation_controller]
    doc: ponder:createdieselgenerators:distillation_tower
    why: {ru: "Ректификационная колонна из баков Create с контроллером разгоняет нефть на бензин, дизель и мазут.", en: "The distillation tower splits oil into gasoline and diesel."}
  - id: cpw_dg_bio
    deps: [cpw_intro, c_mixer]
    roles: [engineer, gardener]
    items: [createdieselgenerators:basin_lid, createdieselgenerators:bulk_fermenter]
    doc: ponder:createdieselgenerators:basin_fermenting_station
    title: {ru: "Биотопливо", en: "Biofuel"}
    why: {ru: "Нет нефти? Крышка чаши и ферментёр делают этанол и биодизель из урожая — топливо из фермы.", en: "No oil? Ferment crops into ethanol and biodiesel."}
  - id: cpw_dg_engine
    deps: [cpw_dg_distill]
    roles: [engineer]
    items: [createdieselgenerators:diesel_engine]
    doc: ponder:createdieselgenerators:diesel_engine
    why: {ru: "Дизельный двигатель — компактный и мощный источник вращения. Кормится дизелем, бензином или биотопливом.", en: "A compact powerful engine burning diesel, gasoline or biofuel."}
  - id: cpw_dg_engine_alt
    deps: [cpw_dg_bio]
    roles: [engineer]
    items: [createdieselgenerators:diesel_engine]
    title: {ru: "Двигатель на биотопливе", en: "Engine on Biofuel"}
    why: {ru: "Тот же дизельный двигатель работает и на этаноле или биодизеле с фермы.", en: "The same engine runs on farm fuel."}
  - id: cpw_dg_large
    deps: [cpw_dg_engine]
    roles: [engineer]
    items: [createdieselgenerators:large_diesel_engine, createdieselgenerators:huge_diesel_engine]
    title: {ru: "Большой и огромный двигатели", en: "Large and Huge Engines"}
    doc: ponder:createdieselgenerators:huge_diesel_engine
    why: {ru: "Большой и огромный двигатели собираются из нескольких блоков и дают в разы больше силы.", en: "Multiblock engines give far more stress."}
  - id: cpw_dg_upgrades
    deps: [cpw_dg_engine]
    roles: [engineer]
    items: [createdieselgenerators:engine_turbocharger, createdieselgenerators:engine_silencer]
    title: {ru: "Турбина и глушитель", en: "Turbocharger and Silencer"}
    why: {ru: "Турбонагнетатель повышает мощность двигателя, глушитель убирает шум.", en: "The turbocharger adds power, the silencer cuts noise."}
  - id: cpw_dg_canister
    deps: [cpw_dg_distill]
    roles: [engineer, explorer]
    items: [createdieselgenerators:canister, createdieselgenerators:oil_barrel]
    title: {ru: "Канистра и бочка", en: "Canister and Barrel"}
    why: {ru: "Канистра и нефтяная бочка хранят и переносят топливо — заправляй транспорт и двигатели в поле.", en: "Store and carry fuel."}
  - id: cpw_dg_turret
    deps: [cpw_dg_canister]
    roles: [warrior, engineer]
    items: [createdieselgenerators:chemical_turret, createdieselgenerators:chemical_sprayer]
    doc: ponder:createdieselgenerators:chemical_turret
    title: {ru: "Химическая турель и распылитель", en: "Chemical Turret and Sprayer"}
    why: {ru: "Химическая турель и ручной распылитель стреляют жидкостью: топливо — огонь, вода — тушит. Защита базы на дизеле.", en: "The chemical turret and sprayer shoot fluids."}

  # ===== Create Nuclear
  - id: cpw_cn_uranium
    deps: [cpw_intro]
    roles: [explorer, engineer]
    items: [createnuclear:raw_uranium*4, createnuclear:raw_lead*4]
    title: {ru: "Уран и свинец", en: "Uranium and Lead"}
    why: {ru: "Create Nuclear строит реактор из урана. Свинец пойдёт на защиту от радиации. Обе руды — под землёй.", en: "Create Nuclear runs on uranium; lead protects you."}
  - id: cpw_cn_yellowcake
    deps: [cpw_cn_uranium, c_crushing]
    roles: [engineer]
    items: [createnuclear:uranium_powder*4, createnuclear:yellowcake*2]
    title: {ru: "Жёлтый кек", en: "Yellowcake"}
    why: {ru: "Уран дробят в порошок, а из него делают жёлтый кек — заготовку топлива.", en: "Crush uranium into powder, then yellowcake."}
  - id: cpw_cn_enrich
    deps: [cpw_cn_yellowcake]
    roles: [engineer]
    items: [createnuclear:enriching_campfire, createnuclear:enriched_yellowcake]
    title: {ru: "Обогащение", en: "Enrichment"}
    why: {ru: "Обогащающий огонь (вентилятор Create через обогащающий костёр) превращает жёлтый кек в обогащённый — настоящее топливо.", en: "The enriching fire turns yellowcake into enriched fuel."}
  - id: cpw_cn_armor
    deps: [cpw_cn_uranium]
    roles: [engineer, warrior]
    items: [createnuclear:default_anti_radiation_helmet, createnuclear:default_anti_radiation_chestplate, createnuclear:default_anti_radiation_leggings, createnuclear:default_anti_radiation_boots]
    title: {ru: "Защита от радиации", en: "Anti-Radiation Suit"}
    why: {ru: "Возле реактора и обогащённого урана накапливается радиация. Защитный костюм не даёт облучиться.", en: "Radiation builds up near the reactor; the suit protects you."}
  - id: cpw_cn_steel
    deps: [cpw_cn_uranium]
    roles: [engineer]
    items: [createnuclear:steel_ingot*8, createnuclear:graphene]
    title: {ru: "Сталь и графен", en: "Steel and Graphene"}
    why: {ru: "Из стали и графена собирают корпус реактора и стержни.", en: "Steel and graphene build the reactor."}
  - id: cpw_cn_frame
    deps: [cpw_cn_steel, cpw_cn_enrich]
    roles: [engineer]
    items: [createnuclear:reactor_blueprint_item, createnuclear:reactor_frame, createnuclear:reactor_casing*16]
    doc: ponder:createnuclear:reactor_t1
    title: {ru: "Чертёж и корпус реактора", en: "Reactor Blueprint and Casing"}
    why: {ru: "Чертёж реактора задаёт расположение стержней, рама и корпус — его оболочку. Сцена Ponder показывает сборку по шагам.", en: "The blueprint sets rod layout; frame and casing build the shell."}
  - id: cpw_cn_core
    deps: [cpw_cn_frame]
    roles: [engineer]
    items: [createnuclear:reactor_controller, createnuclear:reactor_core, createnuclear:reactor_cooler]
    doc: ponder:createnuclear:reactor_io_placement
    title: {ru: "Ядро и контроллер", en: "Core and Controller"}
    why: {ru: "Контроллер управляет реактором, ядро — его центр, охладитель не даёт перегреться.", en: "Controller, core and cooler."}
  - id: cpw_cn_io
    deps: [cpw_cn_core]
    roles: [engineer]
    items: [createnuclear:reactor_rod_input, createnuclear:reactor_fluid_input, createnuclear:reactor_output]
    title: {ru: "Входы и выход реактора", en: "Reactor Inputs and Output"}
    why: {ru: "Вход стержней и жидкости кормит реактор топливом и охлаждением, выход отдаёт огромное вращение.", en: "Inputs feed fuel and coolant; the output gives huge rotation."}
  - id: cpw_cn_alarm
    deps: [cpw_cn_core]
    roles: [engineer]
    items: [createnuclear:reactor_alarm, createnuclear:reinforced_glass*8]
    title: {ru: "Сирена и усиленное стекло", en: "Alarm and Reinforced Glass"}
    why: {ru: "Сирена предупреждает о перегреве, усиленное стекло позволяет смотреть внутрь без облучения.", en: "The alarm warns of overheating; reinforced glass is safe to look through."}

  - id: cpw_na_energiser2
    deps: [cpw_na_energiser]
    roles: [engineer]
    items: [create_new_age:advanced_energiser, create_new_age:overcharged_diamond]
    title: {ru: "Продвинутый энерджайзер", en: "Advanced Energiser"}
    why: {ru: "Продвинутый энерджайзер заряжает быстрее и умеет перезаряжать алмаз — для лучших проводов и магнитов.", en: "Faster charging, overcharges diamond."}
  - id: cpw_na_pump
    deps: [cpw_na_stirling]
    roles: [engineer]
    items: [create_new_age:heat_pump]
    title: {ru: "Тепловой насос", en: "Heat Pump"}
    why: {ru: "Тепловой насос гонит тепло туда, где оно нужно: от реактора к двигателям.", en: "Moves heat where it is needed."}
  - id: cpw_dg_tools
    deps: [cpw_dg_engine]
    roles: [engineer]
    items: [createdieselgenerators:engine_piston, createdieselgenerators:lighter]
    title: {ru: "Поршни и зажигалка", en: "Pistons and Lighter"}
    why: {ru: "Поршни нужны для больших двигателей, зажигалка поджигает горелки и костры.", en: "Pistons for big engines, a lighter for burners."}
  - id: cpw_cn_thorium
    deps: [cpw_cn_uranium]
    roles: [engineer]
    items: [createnuclear:thorium_ingot]
    title: {ru: "Торий Create Nuclear", en: "Create Nuclear Thorium"}
    why: {ru: "Торий из своей руды — дополнительное топливо и материал реактора.", en: "Thorium: extra fuel and reactor material."}
  - id: cpw_cn_extractor
    deps: [cpw_cn_core]
    roles: [engineer]
    items: [createnuclear:biome_irradiation_extractor]
    title: {ru: "Извлекатель облучения", en: "Irradiation Extractor"}
    why: {ru: "Извлекатель убирает радиацию из облучённых биомов вокруг реактора.", en: "Cleans irradiated biomes."}
