# WaterFrames: TVs, frames and projectors that play pictures, video and sound from a link (YouTube, Twitch, images).
extends: home
lang: [waterframes]
out: waterframes_gen
quests:
  - id: wf_tv
    deps: [ho_intro]
    roles: [builder, mayor]
    shape: gear
    items: [waterframes:tv]
    title: {ru: "Телевизор", en: "Television"}
    why: {ru: "Телевизор показывает видео по ссылке — со звуком, который слышат все рядом. Как включить: поставь телевизор, нажми по нему ПКМ, вставь ссылку на видео YouTube (или Twitch, или картинку) в поле адреса и сохрани. Громкость и повтор — там же. Первое видео может грузиться дольше: игра один раз готовит видеодвижок.", en: "Place it, right-click, paste a YouTube/Twitch/image link and save. Sound is heard by everyone nearby."}
  - id: wf_remote
    deps: [wf_tv]
    roles: [builder]
    items: [waterframes:remote]
    title: {ru: "Пульт", en: "Remote Control"}
    why: {ru: "Привяжи пульт к экрану — и ставь на паузу, перематывай и меняй громкость с дивана, не подходя к телевизору.", en: "Pause, seek and change volume from the couch."}
  - id: wf_big_tv
    deps: [wf_tv]
    roles: [builder, mayor]
    items: [waterframes:big_tv]
    title: {ru: "Большой телевизор", en: "Big Television"}
    why: {ru: "Для гостиной или таверны — смотреть вместе стримы и видео по вечерам.", en: "For the living room or tavern."}
  - id: wf_tv_box
    deps: [wf_tv]
    roles: [builder]
    items: [waterframes:tv_box]
    title: {ru: "Ламповый телевизор", en: "Box Television"}
    why: {ru: "Старый телевизор-коробка — для уютной комнаты в деревенском стиле.", en: "A retro box TV."}
  - id: wf_frame
    deps: [wf_tv]
    roles: [builder]
    items: [waterframes:frame*2]
    title: {ru: "Рама для картинок", en: "Picture Frame"}
    why: {ru: "Рама показывает картинку или гифку по ссылке любого размера: вывеска магазина, карта города, афиша праздника.", en: "Shows an image or GIF from a link: shop signs, town maps, posters."}
  - id: wf_projector
    deps: [wf_big_tv]
    roles: [builder, mayor]
    items: [waterframes:projector]
    title: {ru: "Проектор", en: "Projector"}
    why: {ru: "Проектор бросает изображение на стену до 64 блоков — кинотеатр под открытым небом или экран на площади ратуши.", en: "Projects onto a wall up to 64 blocks: an open-air cinema."}
  - id: wf_cinema
    deps: [wf_projector, wf_remote]
    roles: [builder, mayor]
    shape: hexagon
    icon: waterframes:projector
    tasks: [{type: checkmark}]
    title: {ru: "Кинотеатр", en: "Cinema"}
    why: {ru: "Построй зал с рядами сидений (подойдут сиденья Create или диваны таверны), проектор и экран — и устрой показ для всего сервера. Звук слышно в радиусе 64 блоков, так что не ставь кино вплотную к чужому дому.", en: "Build a hall with seats and a projector; sound carries 64 blocks, so keep it away from neighbours."}
    rewards: [{type: xp_levels, count: 5}]
