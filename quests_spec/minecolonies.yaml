# MineColonies: every hut has a translated advancement text and many have an in-game info page.
extends: city
lang:
- minecolonies
out: minecolonies_gen
quests:
- id: cyg_citizen
  deps:
  - city_townhall
  roles:
  - mayor
  items:
  - minecolonies:blockhutcitizen
