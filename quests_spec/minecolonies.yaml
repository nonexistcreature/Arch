  deps:
  - city_farmer
  roles:
  - gardener
  - mayor
  items:
  - minecolonies:blockhutfield
  why:
    ru: 'Поле для фермера: поставь, назначь культуру — житель сам вспашет и засеет.'
    en: A field for your farmer.
- id: cyg_master
  deps:
  - cyg_baker
  - cyg_concretemixer
  - cyg_school
  - cyg_combatacademy
  - cyg_netherworker
  - cyg_mysticalsite
  roles:
  - mayor
  shape: hexagon
  icon: minecolonies:blockhuttownhall
  title:
    ru: Город, который живёт сам
    en: A City That Runs Itself
  text:
    ru: Пекари, каменщики, механики, школа и гвардия — колония кормит, строит и защищает себя. Ты — мэр, а не прораб.
    en: Your colony feeds, builds and defends itself.
  rewards:
  - type: xp_levels
    count: 15
