# Key-item gaps: Alex's Mobs gear made from animals. The mod's own Animal Dictionary explains each creature.
extends: animals
lang: [alexsmobs]
autodoc: ["item.{ns}.{path}.desc", "item.{ns}.{path}.tooltip"]
out: gaps_animals_gen
quests:
  - id: gam_gear_intro
    deps: [a_wildlife]
    roles: [breeder, warrior]
    shape: gear
    icon: alexsmobs:roadrunner_boots
    tasks: [{type: checkmark}]
    title: {ru: "Снаряжение из зверей", en: "Gear from the Wild"}
    why: {ru: "Из добычи зверей Alex's Mobs делают броню с особыми свойствами и необычные инструменты. Не убивай всех подряд: многие звери редкие, а их добыча нужна по одной-две штуки. Всё о каждом звере — в Словаре животных.", en: "Alex's Mobs drops make armor with special traits and odd tools. Read the Animal Dictionary."}
  - id: gam_armor_feet
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:roadrunner_boots, alexsmobs:flying_fish_boots]
    title: {ru: "Особые ботинки", en: "Special Boots"}
  - id: gam_armor_legs
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:centipede_leggings, alexsmobs:emu_leggings]
    title: {ru: "Особые поножи", en: "Special Leggings"}
  - id: gam_armor_chest
    doc: advancements.alexsmobs.crocodile_chestplate.desc
    doc2: item.alexsmobs.rocky_chestplate.desc
    deps: [a_croc]
    roles: [warrior]
    items: [alexsmobs:crocodile_chestplate, alexsmobs:rocky_chestplate]
    title: {ru: "Особые нагрудники", en: "Special Chestplates"}
  - id: gam_armor_head
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:froststalker_helmet, alexsmobs:moose_headgear]
    title: {ru: "Особые шлемы", en: "Special Helmets"}
  - id: gam_elytra
    doc: advancements.alexsmobs.tame_tarantula_hawk.desc
    why: {ru: "Элитры из крыльев тарантулового ястреба — альтернатива элитрам Края, если в Энд ещё рано.", en: "Elytra before the End."}
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:tarantula_hawk_elytra]
  - id: gam_falconry
    deps: [gam_gear_intro]
    roles: [breeder]
    items: [alexsmobs:falconry_glove]
    why: {ru: "Перчатка сокольничего: приручённая птица садится на руку и улетает по команде.", en: "A tamed bird perches on your arm."}
  - id: gam_lasso
    doc: item.alexsmobs.squid_grapple.desc
    doc2: advancements.alexsmobs.squid_grapple.desc
    why: {ru: "Лассо из лозы тянет мобов за собой, щупальце-крюк — цепляется и подтягивает тебя.", en: "The lasso leads mobs; the squid grapple pulls you along."}
    deps: [gam_gear_intro]
    roles: [breeder]
    items: [alexsmobs:vine_lasso, alexsmobs:squid_grapple]
    title: {ru: "Лассо и кальмарий крюк", en: "Vine Lasso and Squid Grapple"}
  - id: gam_shield
    why: {ru: "Щит глубин — особый щит из морской добычи. Свойства — в подсказке.", en: "A special shield from sea drops; see its tooltip."}
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:shield_of_the_deep]
  - id: gam_sprayers
    doc: advancements.alexsmobs.blood_sprayer.desc
    doc2: advancements.alexsmobs.hemolymph_blaster.desc
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:blood_sprayer, alexsmobs:hemolymph_blaster, alexsmobs:stink_ray]
    title: {ru: "Странное оружие", en: "Strange Weapons"}
  - id: gam_carver
    doc: advancements.alexsmobs.dimensional_carver.desc
    deps: [gam_gear_intro]
    roles: [mage]
    items: [alexsmobs:dimensional_carver]
  - id: gam_ghostly_pickaxe
    doc: advancements.alexsmobs.ghostly_pickaxe.desc
    deps: [gam_gear_intro]
    roles: [engineer]
    items: [alexsmobs:ghostly_pickaxe]
  - id: gam_locators
    doc: advancements.alexsmobs.echolocator.desc
    doc2: advancements.alexsmobs.endolocator.desc
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:echolocator, alexsmobs:endolocator]
    title: {ru: "Локаторы", en: "Locators"}
  - id: gam_straddle
    doc: advancements.alexsmobs.straddleboard.desc
    why: {ru: "Доска для катания по лаве — быстрый путь через лавовые моря Незера.", en: "Ride across Nether lava seas."}
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:straddleboard]
  - id: gam_whip
    doc: advancements.alexsmobs.pocket_sand.desc
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:tendon_whip, alexsmobs:pocket_sand]
    title: {ru: "Кнут и карманный песок", en: "Tendon Whip and Pocket Sand"}
  - id: gam_stew
    why: {ru: "Рагу от комаров — защищает от кровососущих комаров болот и Незера. Подробно — в Словаре животных.", en: "Protects from mosquitoes; see the Animal Dictionary."}
    deps: [gam_gear_intro]
    roles: [cook]
    items: [alexsmobs:mosquito_repellent_stew]
  - id: gam_transmutation
    doc: advancements.alexsmobs.transmutation_table.desc
    deps: [gam_gear_intro]
    roles: [mage]
    items: [alexsmobs:transmutation_table]
  - id: gam_skelewag
    doc: advancements.alexsmobs.skelewag_skull.desc
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:skelewag_sword]
  - id: gam_rocket
    doc: advancements.alexsmobs.enderiophage_rocket.desc
    deps: [gam_gear_intro]
    roles: [warrior]
    items: [alexsmobs:enderiophage_rocket, alexsmobs:shark_tooth_arrow*8]
    title: {ru: "Ракета и стрелы", en: "Rocket and Arrows"}
