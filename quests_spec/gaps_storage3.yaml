# Key-item gaps: Sophisticated Backpacks upgrades and Sophisticated Storage (first steps chapter).
extends: first_steps
lang: [sophisticatedbackpacks, sophisticatedstorage, sophisticatedcore]
autodoc: ["item.{ns}.{path}.tooltip", "block.{ns}.{path}.tooltip", "item.sophisticatedcore.{path}.tooltip"]
out: gaps_storage3_gen
quests:
  - id: gsb_pickup
    deps: [fs_upgrades]
    roles: [warrior, engineer]
    items: [sophisticatedbackpacks:pickup_upgrade, sophisticatedbackpacks:magnet_upgrade, sophisticatedbackpacks:filter_upgrade]
    title: {ru: "Подбор, магнит и фильтр", en: "Pickup, Magnet and Filter"}
    why: {ru: "Рюкзак сам подбирает выбранные предметы, магнит тянет их издалека, фильтр решает, что брать.", en: "The pack picks up, attracts and filters items."}
  - id: gsb_refill
    deps: [fs_upgrades]
    roles: [warrior, builder]
    items: [sophisticatedbackpacks:refill_upgrade, sophisticatedbackpacks:restock_upgrade, sophisticatedbackpacks:deposit_upgrade]
    title: {ru: "Пополнение и выгрузка", en: "Refill, Restock, Deposit"}
    why: {ru: "Пополнение подкладывает блоки в руку, пока строишь; пополнение запасов и выгрузка обмениваются с сундуком одним кликом.", en: "Refill your hotbar while building; restock/deposit with chests in one click."}
  - id: gsb_compact
    deps: [fs_upgrades]
    roles: [engineer]
    items: [sophisticatedbackpacks:compacting_upgrade, sophisticatedbackpacks:void_upgrade]
    title: {ru: "Сжатие и уничтожение", en: "Compacting and Void"}
    why: {ru: "Сжатие собирает слитки в блоки, уничтожение стирает мусор вроде булыжника. Настрой фильтр, чтобы не потерять нужное!", en: "Compact ingots into blocks; void junk (set the filter!)."}
  - id: gsb_crafting
    deps: [fs_upgrades]
    roles: [engineer]
    items: [sophisticatedbackpacks:crafting_upgrade, sophisticatedbackpacks:stonecutter_upgrade, sophisticatedbackpacks:smithing_upgrade, sophisticatedbackpacks:anvil_upgrade]
    title: {ru: "Мастерская в рюкзаке", en: "Workshop in a Backpack"}
    why: {ru: "Верстак, камнерез, кузнечный стол и наковальня прямо в рюкзаке — крафт в походе.", en: "Crafting, stonecutting, smithing and anvil on the go."}
  - id: gsb_smelting
    deps: [fs_upgrades]
    roles: [engineer, cook]
    items: [sophisticatedbackpacks:smelting_upgrade, sophisticatedbackpacks:auto_smelting_upgrade]
    title: {ru: "Печь в рюкзаке", en: "Furnace in a Backpack"}
  - id: gsb_tools
    deps: [fs_upgrades]
    roles: [warrior, engineer]
    items: [sophisticatedbackpacks:tool_swapper_upgrade]
    why: {ru: "Сам подставляет нужный инструмент под блок или моба — кирку, топор, меч.", en: "Swaps in the right tool automatically."}
  - id: gsb_tank
    deps: [fs_iron_backpack]
    roles: [engineer]
    items: [sophisticatedbackpacks:tank_upgrade, sophisticatedbackpacks:battery_upgrade]
    title: {ru: "Бак и батарея", en: "Tank and Battery"}
  - id: gsb_stack
    deps: [fs_iron_backpack]
    roles: [engineer]
    items: [sophisticatedbackpacks:stack_upgrade_tier_1]
    why: {ru: "Улучшение стака — в каждом слоте рюкзака помещается больше предметов.", en: "More items per slot."}
  - id: gsb_special
    deps: [gsb_stack]
    roles: [mage]
    items: [sophisticatedbackpacks:everlasting_upgrade, sophisticatedbackpacks:inception_upgrade, sophisticatedbackpacks:xp_pump_upgrade]
    title: {ru: "Особые улучшения", en: "Special Upgrades"}
    why: {ru: "Вечность — рюкзак не сгорает и не пропадает, вложенность — рюкзаки в рюкзаке, насос опыта — копит опыт.", en: "Everlasting, inception and XP pump."}
  - id: gsb_jukebox
    deps: [fs_upgrades]
    roles: [mayor]
    items: [sophisticatedbackpacks:jukebox_upgrade]
  - id: gss_barrels
    deps: [fs_storage]
    roles: [engineer, builder]
    items: [sophisticatedstorage:barrel, sophisticatedstorage:chest, sophisticatedstorage:limited_barrel_1]
    title: {ru: "Бочки и сундуки Sophisticated", en: "Sophisticated Barrels and Chests"}
    why: {ru: "Бочки и сундуки, которые улучшаются как рюкзак: больше слотов, автопечь, сжатие. Ограниченная бочка держит один предмет в большом количестве.", en: "Upgradable storage; the limited barrel holds one item in bulk."}
  - id: gss_tiers
    deps: [gss_barrels]
    roles: [engineer]
    items: [sophisticatedstorage:iron_to_gold_tier_upgrade, sophisticatedstorage:gold_to_netherite_tier_upgrade]
    title: {ru: "Улучшение уровня", en: "Tier Upgrades"}
    why: {ru: "Улучшение уровня прямо на месте превращает сундук в более вместительный, не выгружая вещи.", en: "Upgrade in place without emptying."}
  - id: gss_upgrades
    deps: [gss_barrels]
    roles: [engineer]
    items: [sophisticatedstorage:stack_upgrade_tier_1, sophisticatedstorage:crafting_upgrade, sophisticatedstorage:smelting_upgrade, sophisticatedstorage:advanced_pump_upgrade]
    title: {ru: "Улучшения хранилищ", en: "Storage Upgrades"}
  - id: gss_controller
    deps: [gss_tiers]
    roles: [engineer]
    items: [sophisticatedstorage:controller, sophisticatedstorage:storage_link, sophisticatedstorage:storage_output]
    title: {ru: "Контроллер хранилища", en: "Storage Controller"}
    why: {ru: "Контроллер объединяет все бочки и сундуки рядом в один склад: кладёшь в контроллер — предмет сам находит место.", en: "Joins nearby storage into one."}
  - id: gss_tape
    deps: [gss_barrels]
    roles: [builder]
    items: [sophisticatedstorage:packing_tape]
    why: {ru: "Упаковочная лента: заклей сундук — и его можно унести со всем содержимым.", en: "Tape a chest shut to move it with contents."}
