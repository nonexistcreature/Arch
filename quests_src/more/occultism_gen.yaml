    subtitle: ''
    text: '**Зачем:** Джинн-рудокоп добывает только руды: отбрасывает лишнее и работает быстрее и экономнее фолиота.'
  en:
    title: Ore Miner Djinni
    subtitle: ''
    text: "**Why:** Mines only ores, faster than the foliot.\nThe [#](AA00AA)Djinni[#]() miner harvests ores specifically. By discarding other blocks it is able to mine faster and\n more efficiently. The\
      \ greater power of the djinni it damages the magic lamp relatively quickly."
