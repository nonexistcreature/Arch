  ru:
    title: Африт-рудокоп для глубинносланцевой руды
    subtitle: ''
    text: '**Зачем:** Африт копает руды как джинн и вдобавок часть глубинносланцевых. Быстрее и экономнее джинна.'
  en:
    title: Deep Ore Miner Afrit
    subtitle: ''
    text: "**Why:** Also mines some deepslate ores; faster than the djinni.\nThe [#](AA00AA)Afrit[#]() miner harvests ores, like djinni miners, and additionally\n mines some deepslate ores. This miner is\
