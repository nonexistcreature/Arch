  roles:
  - mage
  - engineer
  icon: minecraft:iron_ingot
  ru:
    title: Дух-плавильщик
    subtitle: ''
    text: '**Зачем:** Дух-плавильщик выполняет работу печи, плавильни, коптильни и костра без топлива: подбирает подходящие предметы и бросает результат рядом.'
  en:
    title: Spirit Smelter
    subtitle: ''
    text: '**Why:** Smelts, blasts, smokes and cooks without fuel.

      Smelter spirits are summoned to do furnace, blast furnace, smoker and campfire process,

      without using fuel. They will pick up appropriate items and drop the resulting into the world.

      A fire particle effect and a flame sound indicate the smelter is at work.'
- id: occg_crystallizer
  tasks:
  - type: checkmark
  deps:
  - occg_crusher
  roles:
  - mage
  icon: minecraft:amethyst_shard
  ru:
    title: Дух-кристаллизатор
    subtitle: ''
    text: '**Зачем:** Дух-кристаллизатор восстанавливает самоцветы из их пыли и умножает выход с самоцветных руд.'
  en:
    title: Spirit Crystallizer
    subtitle: ''
    text: '**Why:** Regrows gems from dust and multiplies gem ore output.

      Crystallizer spirits are summoned to regenerate gem from their dusts and directly multiply

      the output of breaking gem ores. They will pick up appropriate items and drop the resulting into

      the world. A magical particle effect and a amethyst sound indicate the crystallizer is at work.'
- id: occg_farmer
  tasks:
  - type: item
    item: occultism:book_of_calling_foliot_farmer
  deps:
  - occ_lumberjack
  roles:
  - mage
  - gardener
  icon: occultism:book_of_calling_foliot_farmer
  ru:
    title: Фолиот-фермер
    subtitle: ''
    text: '**Зачем:** Фермер собирает и пересаживает урожай в своей зоне. Укажи сундук — и он будет складывать урожай туда.'
  en:
    title: Foliot Farmer
    subtitle: ''
    text: "**Why:** Harvests and replants; set a chest to collect.\nThe farmer will harvest and re-plant crops in it's working area.\n If a deposit location is set it will collect the dropped items into\
      \ the specified chest."
- id: occg_traders
  tasks:
  - type: checkmark
  deps:
  - occ_otherworld_tree
  roles:
  - mage
  icon: occultism:otherstone
  ru:
    title: Духи-торговцы
    subtitle: ''
    text: '**Зачем:** Духи-торговцы берут подходящие предметы и бросают на землю результат обмена — например, превращают один камень в другой. Работает, пока вокруг духа фиолетовые частицы.'
  en:
    title: Spirit Traders
    subtitle: ''
    text: '**Why:** Trade spirits exchange items while purple particles show.

      Trade spirits pick up appropriate items and throw trade results on the ground.

      The spirit is only actively exchanging items if purple particles spawn around it.

      \

      \

      **If you do not see any particles**, ensure that you gave the proper item and amount.'
- id: occg_weather
  tasks:
  - type: checkmark
  deps:
  - occ_djinni
  roles:
  - mage
  icon: minecraft:lightning_rod
  ru:
    title: Магия погоды и времени
    subtitle: ''
    text: '**Зачем:** Магия погоды вызывает духов, которые меняют погоду, — полезно фермерам. Магия времени переводит день и ночь.'
  en:
    title: Weather and Time Magic
    subtitle: ''
    text: '**Why:** Spirits change the weather; time magic shifts day and night.

      Weather magic is especially useful for farmers and others depending

      on specific weather. Summons spirits to modify the weather.

      Different types of weather modification require different spirits.

      \

      \

      Weather spirits will only modify the weather once and then vanish.'
- id: occg_wild_hunt
  tasks:
  - type: item
    item: minecraft:wither_skeleton_skull
  deps:
  - occ_afrit
  roles:
  - mage
  - warrior
  icon: minecraft:wither_skeleton_skull
  ru:
    title: Дикая охота
    subtitle: ''
    text: 'Группа легендарных Могущественных духов, как правило, появляется в облике Визер-скелетов со своими скелетами-прислужниками. Великие духи связаны со своими прислужниками таким образом, что они
      практически неуязвимы до тех пор, пока их прислужники не будут отправлены обратно в [#](ad03fc)Иное Место[#]().

      Помимо опасного путешествия в Незер, существует ещё другой способ получить эти черепа. Легендарная [#](ad03fc)Дикая охота[#]() состоит из [#](ad03fc)могущественных духов[#](), принявших облик визер-скелетов.
      Хотя вызов Дикой охоты невероятно опасен — это наибыстрейший способ получения черепов визер-скелетов.'
  en:
    title: The Wild Hunt
    subtitle: ''
    text: 'A group of legendary Greater Spirits, usually appearing in the form of wither skeletons, with their skeleton minions. The Greater Spirits are bound to their minions in such fashion that they
      are virtually invulnerable until their minions have been sent back to [#](ad03fc)The Other Place[#]().

      Besides venturing into nether dungeons, there is one more way to get these skulls. The legendary [#](ad03fc)Wild Hunt[#]() consists of [#](ad03fc)Greater Spirits[#]() taking the form of wither skeletons.
      While summoning the Wild Hunt is incredibly dangerous, it is the fastest way to get wither skeleton skulls.'
- id: occg_possession
  tasks:
  - type: checkmark
  deps:
  - occ_djinni
  roles:
  - mage
  icon: occultism:pentacle_possess
  ru:
    title: Ритуалы одержимости
    subtitle: ''
    text: '**Зачем:** Вселяет духа в моба и тут же убивает его — гарантированный лут с редких мобов (шалкеры, стражи, Хранитель) без охоты.

      Одержимые монстры контролируются духами, позволяя вызывателю определять некоторые из их свойств. Как правило, они имеют **высокую частоту выпадения** редкой добычи, но их, как правило, труднее убить.

      \

      \

      Вы, возможно, захотите начать с вызова [Одержимого эндермита](entry://possession_rituals/possess_endermite) с целью получения [](item://minecraft:end_stone) для создания [Продвинутых мелков](entry://getting_started/chalks).'
  en:
    title: Possession Rituals
    subtitle: ''
    text: '**Why:** Possess a mob for guaranteed rare drops without hunting.

      Possessed mobs are controlled by spirits, allowing the summoner to determine some of their properties. They usually have **high drop rates** for rare drops, but are generally harder to kill.

      \

      \

      You probably will want to start by summoning a [Possessed Endermite](entry://possession_rituals/possess_endermite) to get [](item://minecraft:end_stone) to craft [Advanced Chalks](entry://getting_started/chalks).'
- id: occg_possess_shulker
  tasks:
  - type: item
    item: minecraft:shulker_shell
    count: 2
  deps:
  - occg_possession
  roles:
  - mage
  icon: minecraft:shulker_shell
  ru:
    title: Одержимый шалкер
    subtitle: ''
    text: В этом ритуале появляется [#](ad03fc)Шалкер[#](), используя жизненную энергию [#](ad03fc)Кубического существа[#](), и сразу овладевается путём вызова [#](ad03fc)Африта[#](). При убийстве [#](ad03fc)Одержимый
      шалкер[#]() всегда выдаёт минимум 1-у [](item://minecraft:shulker_shell). Можете использовать ванильное размножение шалкеров для получения обычных шалкеров; но с них меньшая вероятность выпадения
      панцирей.
  en:
    title: Possessed Shulker
    subtitle: ''
    text: In this ritual a [#](ad03fc)Shulker[#]() is spawned using the life energy of a [#](ad03fc)Cube Mob[#]() and immediately possessed by the summoned [#](ad03fc)Afrit[#](). The [#](ad03fc)Possessed
      Shulker[#]() will always drop at least one [](item://minecraft:shulker_shell) when killed. You can use vanilla shulker multiplication to get normal shulkers but their have less chance to drop shells.
- id: occg_possess_warden
  tasks:
  - type: checkmark
  deps:
  - occg_possess_shulker
  roles:
  - mage
  icon: minecraft:echo_shard
  ru:
    title: Одержимый Хранитель
    subtitle: ''
    text: '**Зачем:** Ритуал создаёт Хранителя из жизненной силы аксолотля, и африт сразу вселяется в него. Хранитель погибает и оставляет добычу — без опасного боя.'
  en:
    title: Possessed Warden
    subtitle: ''
    text: '**Why:** A Warden is made and possessed at once, dropping loot without a fight.

      In this ritual a [#](ad03fc)Warden[#]() is spawned using the life energy of a [#](ad03fc)Axolotl[#]() and immediately possessed by the summoned [#](ad03fc)Afrit[#](). The [#](ad03fc)Possessed Warden[#]()
      will always drop at least six [](item://minecraft:echo_shard) when killed and as a chance to drop [](item://minecraft:disc_fragment_5), [](item://minecraft:music_disc_otherside), [](item://minecraft:silence_armor_trim_smithing_template),
      [](item://minecraft:ward_armor_trim_smithing_template). If you try to escape, this possessed Warden will go to the floor like a normal warden.'
- id: occg_hordes
  tasks:
  - type: checkmark
  deps:
  - occg_possession
  roles:
  - mage
  - warrior
  icon: minecraft:zombie_head
  ru:
    title: Призыв орды
    subtitle: ''
    text: '**Зачем:** Ритуал вызывает волну врагов — тренировка для команды и быстрый лут. Проводи вдали от чужих домов.'
  en:
    title: Summoning a Horde
    subtitle: ''
    text: '**Why:** Summons a wave of enemies: team practice and loot.

      Summon a Wild Evoker and his henchmen to get [](item://minecraft:totem_of_undying), [](item://minecraft:vex_armor_trim_smithing_template) and [](item://minecraft:sentry_armor_trim_smithing_template).'
- id: occg_familiar_ring
  tasks:
  - type: item
    item: occultism:familiar_ring
  deps:
  - occ_familiar
  roles:
  - mage
  icon: occultism:familiar_ring
  ru:
    title: Перстень для фамильяра
    subtitle: ''
    text: 'Находчивые вызыватели нашли способ заточать фамильяров в драгоценные камни, которые пассивно накладывают свои усиления. \

      [Перстень для фамильяра](entry://crafting_rituals/craft_familiar_ring).'
  en:
    title: Familiar Ring
    subtitle: ''
    text: Enterprising summoners have found a way to bind familiars into jewelry that passively applies their buff, the [Familiar Ring](entry://crafting_rituals/craft_familiar_ring).
- id: occg_familiar_greedy
  tasks:
  - type: checkmark
  deps:
  - occg_familiar_ring
  roles:
  - mage
  icon: minecraft:hopper
  ru:
    title: Жадный фамильяр
    subtitle: ''
    text: 'Алчный фамильяр является Фолиотом, подбирающим ближайшие предметы для хозяина. Если фамильяра поймать в перстень, он увеличит дальность подбирания владельцу.

      \

      \

      **Улучшение поведения**:\

      При улучшении фамильяром-кузнецом, он сможет находить блоки для хозяина. Нажмите [#](ad03fc)ПКМ[#]() на него блоком, чтобы указать, что именно искать.'
  en:
    title: Greedy Familiar
    subtitle: ''
    text: 'The greedy familiar is a Foliot that will pick up nearby items for it''s master. When captured in a familiar ring it increased the pick-up range of the wearer.

      \

      \

      **Upgrade Behaviour**\

      When upgraded by a blacksmith familiar, it can find blocks for its master. [#](ad03fc)Right-click[#]() it with a block to tell it what to look for.'
- id: occg_familiar_blacksmith
  tasks:
  - type: checkmark
  deps:
  - occg_familiar_ring
  roles:
  - mage
  icon: minecraft:anvil
  ru:
    title: Фамильяр-кузнец
    subtitle: ''
    text: 'Всякий раз, когда игрок подбирает камень, существует вероятность, что фамильяр-кузнец немножко починит снаряжение игрока.

      \

      \

      **Улучшение поведения**: \

      Улучшает других фамильяров, но сам не может быть улучшен.'
  en:
    title: Blacksmith Familiar
    subtitle: ''
    text: 'Whenever the player picks up stone, there is a chance for the blacksmith familiar to repair their equipment a little bit.

      \

      \

      **Upgrade Behaviour**: \

      Cannot be upgraded, but upgrades other Familiars.'
- id: occg_familiar_dragon
  tasks:
  - type: checkmark
  deps:
  - occg_familiar_ring
  roles:
  - mage
  icon: minecraft:dragon_head
  ru:
    title: Фамильяр-дракон
    subtitle: ''
    text: 'Алчные фамильяры могут оседлать фамильяра-дракона, вдобавок наделять его эффектами алчности.

      \

      \

      **Улучшение поведения**:\

      При улучшении фамильяром-кузнецом, он кидает мечи на близлежащих врагов.'
  en:
    title: Dragon Familiar
    subtitle: ''
    text: 'Greedy familiars can ride on dragon familiars, giving the dragon the greedy effects additionally.

      \

      \

      **Upgrade Behaviour**\

      When upgraded by a blacksmith familiar, it will throw swords at nearby enemies.'
- id: occg_iesnium_golem
  tasks:
  - type: checkmark
  deps:
  - occg_familiar_ring
  - occ_iesnium
  roles:
  - mage
  - warrior
  icon: occultism:iesnium_block
  ru:
    title: Айзниевый голем
    subtitle: ''
    text: '**Зачем:** Айзниевый голем — улучшенный железный голем: намного сильнее и неуязвим. Отпустить его может только игрок, ударив сидя.'
  en:
    title: Iesnium Golem
    subtitle: ''
    text: '**Why:** A far stronger, invulnerable iron golem.

      An Iesnium Golem is a direct upgrade from a regular Iron Golem, this new version is much stronger and invulnerable. \

      Only a player can dismiss them, by hitting while crouched, returning as a [](item://occultism:fragile_soul_gem).'
- id: occg_resurrection
  tasks:
  - type: item
    item: occultism:soul_gem
  deps:
  - occg_familiar_ring
  roles:
  - mage
  icon: occultism:soul_gem
  ru:
    title: Воскрешение фамильяра
    subtitle: ''
    text: 'Воскресение — довольно простой процесс. Осколок душ усиливается при помощи [](item://occultism:otherworld_essence), пока она полностью не окрепнет, что позволяет фамильяру вернуться в царство
      живых и создать для себя новое тело.

      \

      \

      Эссенция добывается путём выращивания (немеренное количество) Блаженства демона.'
  en:
    title: Resurrecting a Familiar
    subtitle: ''
    text: 'The resurrection is a relatively simple process. The soul shard is strengthened with [](item://occultism:otherworld_essence) until it is strong enough to allow the familiar to return to the mortal
      realm and create a new body for itself.

      \

      \

      The essence is obtained by growing (lots of) Demons Dream plants.'
- id: occg_soul_gem
  tasks:
  - type: item
    item: occultism:soul_gem
  deps:
  - occ_afrit
  roles:
  - mage
  icon: occultism:soul_gem
  ru:
    title: Камень души
    subtitle: ''
    text: '**Зачем:** Камень души ловит моба и переносит его куда угодно — перевезти жителя, лошадь или питомца.'
  en:
    title: Soul Gem
    subtitle: ''
    text: '**Why:** A soul gem captures a mob to move it anywhere.

      To capture an entity, [#](AA00AA)right-click[#]() it with the soul gem. \

      [#](AA00AA)right-click[#]() again to release the entity.

      \

      \

      Bosses cannot be captured.'
- id: occg_infused_pickaxe
  tasks:
  - type: item
    item: occultism:infused_pickaxe
  deps:
  - occg_spirit_fire
  roles:
  - mage
  - engineer
  icon: occultism:infused_pickaxe
  ru:
    title: Наполненная кирка
    subtitle: ''
    text: 'После обработки рудных материалов, кирку необходимо наполнить духами.

      \

      \

      Следуйте инструкциям в разделе [Создание наполненной кирки](entry://crafting_rituals/craft_infused_pickaxe)'
  en:
    title: Infused Pickaxe
    subtitle: ''
    text: 'After preparing the raw materials, the pickaxe needs to be infused with a spirit.

      \

      \

      Follow the instructions at [Craft Infuse Pickaxe](entry://crafting_rituals/craft_infused_pickaxe)'
- id: occg_iesnium_pickaxe
  tasks:
  - type: item
    item: occultism:iesnium_pickaxe
  deps:
  - occg_infused_pickaxe
  - occ_iesnium
  roles:
  - mage
  - engineer
  icon: occultism:iesnium_pickaxe
  ru:
    title: Кирка айзния
    subtitle: ''
    text: Как и [Наполненная кирка](entry://getting_started/infused_pickaxe), эта кирка может использоваться для добычи Потусторонних материалов 2-го уровня, таких как [](item://occultism:iesnium_ore).
      Поскольку она сделана из металла, а не хрупкого [](item://occultism:spirit_attuned_gem), она очень прочная и послужит долгое время.
  en:
    title: Iesnium Pickaxe
    subtitle: ''
    text: Like the [Infused Pickaxe](entry://getting_started/infused_pickaxe), this pickaxe can be used to mine Tier 2 Otherworld Materials such as [](item://occultism:iesnium_ore). As it is made from metal,
      instead of brittle [](item://occultism:spirit_attuned_gem), it is very durable and can be used for a long time.
- id: occg_iesnium_anvil
  tasks:
  - type: item
    item: occultism:iesnium_anvil
  deps:
  - occ_iesnium
  roles:
  - mage
  icon: occultism:iesnium_anvil
  ru:
    title: Айзниевая наковальня
    subtitle: ''
    text: '**Зачем:** Наковальня с маридом: не ломается и позволяет превысить максимальный уровень зачарований при объединении.'
  en:
    title: Iesnium Anvil
    subtitle: ''
    text: '**Why:** Unbreakable, and can exceed max enchantment levels.

      The [](item://occultism:iesnium_anvil) is a [#](AA00AA)Marid[#]() infusion.

      This anvil has some improvements:

      1. Is unbreakable;

      2. Can exceed the maximum level of enchantments by 1;

      3. Marid will pay half of the showed level cost (round up);

      4. The cost increase of working with the same item is reduced;

      5. The maximum cost limit is increased;'
- id: occg_storage_stabilizer
  tasks:
  - type: item
    item: occultism:storage_stabilizer_tier1
  deps:
  - occ_storage
  roles:
  - mage
  - engineer
  icon: occultism:storage_stabilizer_tier1
  ru:
    title: Стабилизатор пространственного хранилища 1-го уровня
    subtitle: ''
    text: '**Зачем:** Стабилизаторы вокруг актуатора увеличивают ёмкость пространственного хранилища — от тысяч до миллионов предметов.'
  en:
    title: Tier 1 Dimensional Storage Stabilizer
    subtitle: ''
    text: '**Why:** Stabilizers around the actuator raise storage capacity.

      The stabilizer system works by tier, starting from 0 (which does not add space) up to 5.

      \

      \

      To get started, see the recipes and instructions on the following pages.'
- id: occg_storage_stabilizer4
  tasks:
  - type: item
    item: occultism:storage_stabilizer_tier4
  deps:
  - occg_storage_stabilizer
  roles:
  - mage
  - engineer
  icon: occultism:storage_stabilizer_tier4
  ru:
    title: Стабилизатор пространственного хранилища 4-го уровня
    subtitle: ''
    text: '**Зачем:** Стабилизатор 4-го уровня с маридом удерживает измерение хранилища и сильно увеличивает его ёмкость.'
  en:
    title: Tier 4 Dimensional Storage Stabilizer
    subtitle: ''
    text: "**Why:** A marid stabilizer that greatly raises storage capacity.\nThis highly advanced storage stabilizer is inhabited by a [#](AA00AA)Marid[#]() that supports the dimensional matrix\n in keeping\
      \ the storage dimension stable, thus allowing to store more items.\n\\\n\\\nBy default each Tier 4 Stabilizer adds **512** item types and 4098000 items storage capacity."
- id: occg_storage_remote
  tasks:
  - type: item
    item: occultism:storage_remote
  deps:
  - occ_storage
  roles:
  - mage
  icon: occultism:storage_remote
  ru:
    title: Средство доступа к хранилищу
    subtitle: ''
    text: '**Зачем:** Средство доступа привязывается к актуатору хранилища: джинн внутри открывает твой склад из любой точки мира.'
  en:
    title: Storage Accessor
    subtitle: ''
    text: "**Why:** Opens your storage from anywhere.\nThe [](item://occultism:storage_remote) can be linked to a [](item://occultism:storage_controller) by shift-clicking.\n The [#](AA00AA)Djinni[#]()\
      \ bound to the accessor will then be able to\n access items from the actuator even from across dimensions."
- id: occg_storage_automation
  tasks:
  - type: item
    item: occultism:stable_wormhole
  deps:
  - occ_machine
  roles:
  - mage
  - engineer
  icon: occultism:stable_wormhole
  ru:
    title: Стабильная червоточина
    subtitle: ''
    text: '**Зачем:** Актуатор хранилища работает как большой сундук: воронки и трубы могут класть и забирать предметы. Стабильная червоточина подключает его к машинам на расстоянии.'
  en:
    title: Stable Wormhole
    subtitle: ''
    text: "**Why:** Hoppers and pipes work with the storage like a chest.\nThe Storage Actuator behaves much like a big chest or shulker box.\n That means, hoppers and pipes can insert and extract items."
- id: occg_satchel
  tasks:
  - type: item
    item: occultism:satchel
  deps:
  - occg_first_ritual
  roles:
  - mage
  icon: occultism:satchel
  ru:
    title: Необычайно большая наплечная сумка
    subtitle: ''
    text: '**Зачем:** Сумка-измерение: в ней больше места, чем снаружи.'
  en:
    title: Surprisingly Substantial Satchel
    subtitle: ''
    text: "**Why:** A dimensional satchel: bigger inside than outside.\nA [#](AA00AA)Foliot[#]() is bound to the satchel, tasked with **slightly** warping reality. This allows to store more\n items in the\
      \ satchel than its size would indicate, making it a practical travellers companion."
- id: occg_ritual_satchel
  tasks:
  - type: item
    item: occultism:ritual_satchel_t1
  deps:
  - occg_satchel
  roles:
  - mage
  icon: occultism:ritual_satchel_t1
  ru:
    title: Ритуальная сумка ученика
    subtitle: ''
    text: '**Зачем:** Ставит весь ритуальный круг из сумки за пару кликов — не нужно таскать мелки и чаши по одной.'
  en:
    title: Apprentice Ritual Satchel
    subtitle: ''
    text: '**Why:** Places a whole ritual circle from the satchel in a few clicks.

      Visit the entry about the [Apprentice Satchel](entry://crafting_rituals/apprentice_ritual_satchel) or the [Artisanal Satchel](entry://crafting_rituals/apprentice_ritual_satchel) in the [Binding Rituals
      Category](category://crafting_rituals) to learn how to enchant a satchel and use it for rituals.'
- id: occg_wormhole
  tasks:
  - type: item
    item: occultism:entity_wormhole
  deps:
  - occ_afrit
  roles:
  - mage
  icon: occultism:entity_wormhole
  ru:
    title: Червоточина существ
    subtitle: ''
    text: '**Зачем:** Червоточина переносит существ. Пункт назначения задаёт компас: обычный ведёт к точке спавна мира, привязанный — к своей точке.'
  en:
    title: Entity Wormhole
    subtitle: ''
    text: '**Why:** Moves creatures; a compass sets the destination.

      To set the destination, you''''ll need a compass. Right-click to place it and shift+right-click to remove it.

      + A standard compass takes you to the world spawn;

      + A compass attached to a lodestone takes you to the top of it. (After placing it in the wormhole, the lodestone can be broken);'
- id: occg_true_sight
  tasks:
  - type: item
    item: occultism:true_sight_staff
  deps:
  - occ_goggles
  roles:
  - mage
  icon: occultism:true_sight_staff
  ru:
    title: Посох истинного зрения
    subtitle: ''
    text: '**Зачем:** Марид в посохе помогает видеть потусторонний мир и взаимодействовать с ним без очков.'
  en:
    title: True Sight Staff
    subtitle: ''
    text: "**Why:** A marid helps you see and use the otherworld.\nThe [](item://occultism:true_sight_staff) employs an [#](AA00AA)Marid[#]() to assist the summoner in tasks of finding and interacting with\
      \ the otherworld.\n Unlike [#](AA00AA)Foliot[#]() in the otherworld goggles, which can only provide vision, with this staff in the off-hand or curio slot, the occultist can collect otherworld materials.\n\
      \ The divining rods search abilities receive an upgrade, now is possible locate any block."
- id: occg_vitality
  tasks:
  - type: item
    item: occultism:vitality_compass
  deps:
  - occ_afrit
  roles:
  - mage
  icon: occultism:vitality_compass
  ru:
    title: Компас жизненной силы
    subtitle: ''
    text: '**Зачем:** Фолиот в компасе настраивается на сущность живого создания и указывает на таких же поблизости.'
  en:
    title: Vitality Compass
    subtitle: ''
    text: "**Why:** Attunes to a creature and points to its kind.\nThe [](item://occultism:vitality_compass) is a mystical tool infused with a [#](AA00AA)Foliot[#]()\n that allows it to be attuned to the\
      \ essence of living beings.\n By right-clicking on a creature, you bind its life force to the compass,\n allowing the needle to always point toward its location no matter the distance (while loaded)."
- id: occg_knowledge
  tasks:
  - type: item
    item: occultism:knowledge_tablet
  deps:
  - occ_djinni
  roles:
  - mage
  icon: occultism:knowledge_tablet
  ru:
    title: Табличка знаний
    subtitle: ''
    text: '**Зачем:** ПКМ — сохраняет весь твой опыт в табличку, Shift+ПКМ — возвращает. Опыт не пропадёт при смерти.'
  en:
    title: Knowledge Tablet
    subtitle: ''
    text: '**Why:** Stores all your XP; Shift-click to take it back.

      This item use is very simple: \

      [#](55FF55)Right-Click[#]() will storage all of your experience points. \

      [#](55FF55)Shift-Right-Click[#]() receive all stored points. \

      \

      NOTE: Sometimes, with big values, you can lost a small quantity of point due numerical approximations.'
- id: occg_unbound
  tasks:
  - type: item
    item: occultism:afrit_essence
  deps:
  - occ_afrit
  roles:
  - mage
  - warrior
  icon: occultism:afrit_essence
  ru:
    title: Несвязанные духи
    subtitle: ''
    text: Духи обычно вызываются [#](ad03fc)связанными[#](), что подразумевает наличие условий, удерживающих их под контролем вызывателя. Побочным эффектом связывающих заклинаний является то, что часть
      души остаётся в [#](ad03fc)Ином Месте[#](), лишая его большей части силы. Однако в это же время это также защищает его сущность от чужеродного воздействия в этом мире.
  en:
    title: Unbound Spirits
    subtitle: ''
    text: Generally spirits are summoned [#](ad03fc)bound[#](), which refers to any condition that keeps them under control of the summoner. A side effect of binding spells is that part of the spirit remains
      in [#](ad03fc)The Other Place[#](), robbing them of large portions of the power, but at the same time also protecting their essence from foreign access in this world.
