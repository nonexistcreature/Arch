- id: occg_first_ritual
  tasks:
  - type: checkmark
  deps:
  - occg_bowls
  - occg_candles
  roles:
  - mage
  icon: occultism:pentacle_craft
  ru:
    title: Первый ритуал
    subtitle: ''
    text: 'Эти страницы шаг за шагом ознакомят благосклонного читателя с процессом [Первого ритуала](entry://summoning_rituals/summon_crusher_t1).

      \

      Мы **начнём** с размещения [](item://occultism:golden_sacrificial_bowl) и черчения нужного пентакля, [Круг Авиара](entry://pentacles/summon_foliot), как видно слева рядом с ним.

      Ритуалы позволяют вызывать духов в нашу параллельную реальность или заточать их в предметы или живые существа. Каждый ритуал состоит из [#](ad03fc)пентакля[#](), [#](ad03fc)ингредиентов для ритуала[#](),
      снабжаемые через жертвенные миски, [#](ad03fc)запускающего предмета[#](), а в некоторых случаях — [#](ad03fc)жертвоприношение[#]() живых существ. Фиолетовые частицы покажут, что ритуал удался и выполняется.'
  en:
    title: The First Ritual
    subtitle: ''
    text: 'These pages will walk the gentle reader through the process of the [first ritual](entry://summoning_rituals/summon_crusher_t1) step by step.

      \

      We **start** by placing the [](item://occultism:golden_sacrificial_bowl) and drawing the appropriate pentacle, [Aviar''s Circle](entry://pentacles/summon_foliot) as seen on the left around it.

      Rituals allow to summon spirits into our plane of existence, or bind them into objects or living beings. Every ritual consists of a [#](ad03fc)Pentacle[#](), [#](ad03fc)Ritual Ingredients[#]() provided
      via sacrificial bowls, a [#](ad03fc)Starting Item[#]() and optionally the [#](ad03fc)Sacrifice[#]() of living beings. A purple particle effect will show that the ritual is successful and in progress.'
