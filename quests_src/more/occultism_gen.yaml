    text: '**Зачем:** Эссенция марида нужна, чтобы безопасно управлять сильнейшими духами, — из неё делают синий мел.'
  en:
    title: Marid Essence
    subtitle: ''
    text: "**Why:** Needed to control the strongest spirits; makes blue chalk.\n[](item://occultism:marid_essence)  is required to safely control the most powerful spirits, commonly used\n in the form of\
      \ blue chalk. To obtain the essence, an [#](AA00AA)Marid[#]() needs to be summoned\n unbound into this plane, and killed. Be warned that this is no simple endeavour,\n and unbound spirit presents\
      \ great danger to all nearby."
