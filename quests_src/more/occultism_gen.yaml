  - engineer
  icon: occultism:miner_marid_master
  ru:
    title: Мастер Марид-рудокоп
    subtitle: ''
    text: '**Зачем:** Марид — сильнейший рудокоп: самая быстрая добыча и лучшая сохранность лампы.'
  en:
    title: Master Miner Marid
    subtitle: ''
    text: "**Why:** The fastest miner with the best lamp preservation.\nThe [#](AA00AA)Marid[#]() miner is the most powerful miner spirit, it has the fasted mining speed and best magic lamp\n preservation.\
      \ Unlike other miner spirits they also can mine the rarest ores, such as [](item://minecraft:ancient_debris) and [](item://occultism:iesnium_ore)."
