    subtitle: ''
    text: 'Способность видеть по ту сторону физического мира называется [#](ad03fc)Третий глаз[#]().

      Люди не обладают такой способностью видеть [#](ad03fc)за гробовой чертой[#](),

      однако толковый вызователь сможет обойти это ограничение с помощью определённых веществ и устройств.'
  en:
    title: The Third Eye
    subtitle: ''
    text: 'The ability to see beyond the physical world is referred to as [#](ad03fc)Third Eye[#]().

      Humans do not possess such an ability to see [#](ad03fc)beyond the veil[#](),

      however with certain substances and contraptions the knowledgeable summoner can work around this limitation.'
