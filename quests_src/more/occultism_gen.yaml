    subtitle: ''
    text: '**Why:** Keeps a spirit safe from essence decay.

      Magic Lamps can be used to keep spirits safe from [#](ad03fc)Essence Decay[#]() (if the spirit has decay), while still having access to some of their powers. Right-Click on one of your workers to
      store and transport it as desired.'
