  ru:
    title: Жертвенная миска
    subtitle: ''
    text: 'Эти миски используются для размещения предметов, в которых будет что-то жертвоваться при осуществлении ритуала. Вам понадобится всего лишь несколько из них.

      Примечание: Их точное расположение в ритуале не имеет значения. Держите их в пределах 8 блоков по горизонтали от центра пентакля!'
  en:
    title: Sacrificial Bowl
    subtitle: ''
    text: 'These bowls are used to place the items we will sacrifice as part of a ritual and you will need a handful of them.

      Note: Their exact placement in the ritual does not matter - just keep them within 8 blocks horizontally of the pentacle center!

      Once everything has been set up and you are ready to start, this special ritual bowl is used to activate the ritual by [#](ad03fc)right-clicking[#]() it with the activation item,

      usually a [Book of Binding](entry://getting_started/books_of_binding).'
