    subtitle: ''
    text: '**Зачем:** Дробит руду в пыль — две пыли с руды вместо одного слитка. Удвоение без машин.'
  en:
    title: Spirit Crusher
    subtitle: ''
    text: "**Why:** Crushes ore into dust: two dusts per ore.\nCrusher spirits are summoned to crush ores into dusts, effectively multiplying the metal output.\n   They will pick up appropriate ores and\
      \ drop the resulting dusts into the world.\n   A spark particle effect and a crushing sound indicate the crusher is at work."
- id: occg_smelter
