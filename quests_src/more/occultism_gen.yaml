      Существует тип книги, соответствующий каждому виду духа (или уровня).

      Для определения духа с целью вызова, его имя должно быть предначертано в [#](ad03fc)Книге привязки[#](), что приводит к [#](ad03fc)Книге привязки (связанная)[#](), которую можно использовать в ритуале.'
  en:
    title: 'Book of Binding: Empty'
    subtitle: ''
    text: 'To call forth a spirit, a [#](ad03fc)Book of Binding[#]() must be used in the ritual.

      There is a type of book corresponding to each type (or tier) of spirit.

      To identify a spirit to summon, it''s name must be written in the [#](ad03fc)Book of Binding[#](), resulting in a [#](ad03fc)Bound Book of Binding[#]() that can be used in the ritual.'
