    subtitle: ''
    text: 'To summon a spirit the magician needs to know their [#](ad03fc)True Name[#](). By calling the true naming during the summoning ritual the Spirit is drawn forth from [#](ad03fc)The Other Place[#]()
      and forced to do the summoners bidding.

      \

      \

      *It should be noted, that it does not matter which spirit name is used in summoning, only the spirit tier is relevant.*'
- id: occg_spirits
  tasks:
  - type: checkmark
  deps:
  - occg_true_names
  roles:
  - mage
  icon: occultism:otherworld_essence
  ru:
    title: Иерархия духов
    subtitle: ''
    text: '**Зачем:** Фолиот < Джинн < Африт < Марид. Чем сильнее дух, тем больше он может — и тем дороже ритуал.

      Низший выявленный класс духа. Вооружённый своеобразным интеллектом и малым объёмом силы, чаще всего они служат для физической работы или создания второстепенных артефактов.

      Самый распространённый класс для вызова. Многообразие Джиннов огромно, различаясь по интеллекту и силе. Джинны могут выполнять широкий спектр задач, начиная от создания высших артефактов, завладения
      живыми существами и заканчивая выполнением задач в своём выбранном облике.'
  en:
    title: The Spirit Hierarchy
    subtitle: ''
    text: '**Why:** Foliot < Djinni < Afrit < Marid.

      The lowest identified class of spirit. Equipped with some intelligence and a modicum of power they are most often used for manual labor or minor artifacts.

      The most commonly summoned class. There is a great variety of Djinni, differing both in intelligence and power. Djinni can be used for a variety of task, ranging from higher artifacts over possession
      of living beings to carrying out tasks in their Chosen Form.'
