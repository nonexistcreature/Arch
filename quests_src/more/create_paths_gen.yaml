    text: '**Why:** The foundry melts ore and dust into molten metal for higher yield.

      The Foundry Basin is comparable to a classic Basin... ...However, it can only hold 9 Items of the same type. Put a Foundry Lid on top, and your Foundry is now ready! Like the Basin, a Faucet can extract
      recipes Items... ...and Fluids with a Item Drain. Make sure to close the Foundry Top else the recipe won''t start.'
- id: cp_met_crucible
  tasks:
  - type: item
    item: createmetallurgy:industrial_crucible
  deps:
  - cp_met_foundry
  roles:
  - engineer
  icon: createmetallurgy:industrial_crucible
  ru:
    title: Промышленный тигель
    subtitle: ''
    text: '**Зачем:** Промышленный тигель — большая печь для плавки целыми партиями.

      Промышленные тигли могут хранить расплавленные металлы. Можно добавить окна с помощью гаечного ключа! Чаши могут одновременно хранить несколько видов жидкостей!'
  en:
    title: Industrial Crucible
    subtitle: ''
    text: '**Why:** The industrial crucible melts in bulk.

      Industrial Crucibles can be used to store molten metals. You can add windows with a Wrench! Crucibles can also store multiple fluids at the same time!'
- id: cp_met_casting
  tasks:
  - type: item
    item: createmetallurgy:faucet
  - type: item
    item: createmetallurgy:casting_table
  - type: item
    item: createmetallurgy:graphite_ingot_mold
  deps:
  - cp_met_foundry
  roles:
  - engineer
  icon: createmetallurgy:faucet
  ru:
    title: Кран
    subtitle: ''
    text: '**Зачем:** Кран сливает металл на литейный стол, форма задаёт, что получится: слиток, пластина, шестерня.

      Блоки отливки используются для охлаждения расплавленных металлов в определённую форму. Отливочная чаша используется для отливки целого блока. Отливочный стол используется для создания предметов с
      помощью графитовых форм. Если вы используете воронки вместо ручной загрузки... ...вам может понадобиться латунная воронка, чтобы не извлекать формы. ...вам может понадобиться латунная воронка, чтобы
      не извлекать формы.'
  en:
    title: Faucet
    subtitle: ''
    text: '**Why:** Faucet + casting table + mold: ingots, plates, gears.

      Casting Blocks can be used to cool down Molten Metals into a specific shape. The Casting Basin is used to cast up to a entire block. While the Casting Table is used to cast Items using Graphite Molds.
      Molds can be locked in place using the lock mode selection slot. If you are using Funnels while keeping the mold unlocked... ...you might need a Brass Funnel to not extract Molds.'
- id: cp_met_basin
  tasks:
  - type: item
    item: createmetallurgy:casting_basin
  deps:
  - cp_met_casting
  roles:
  - engineer
  icon: createmetallurgy:casting_basin
  ru:
    title: Отливочная чаша
    subtitle: ''
    text: '**Зачем:** Литейная чаша отливает сразу целые блоки металла.'
  en:
    title: Casting Basin
    subtitle: ''
    text: '**Why:** The casting basin casts whole blocks.'
- id: cp_met_tungsten
  tasks:
  - type: item
    item: createmetallurgy:raw_tungsten
    count: 4
  - type: item
    item: createmetallurgy:tungsten_ingot
  deps:
  - cp_met_foundry
  roles:
  - engineer
  - explorer
  icon: createmetallurgy:raw_tungsten
  ru:
    title: Вольфрам
    subtitle: ''
    text: '**Зачем:** Вольфрамит добывают под землёй. Вольфрам плавится только в литейной — это материал для самых прочных деталей Metallurgy.'
  en:
    title: Tungsten
    subtitle: ''
    text: '**Why:** Wolframite ore becomes tungsten, only in the foundry.'
- id: cp_met_steel
  tasks:
  - type: item
    item: createmetallurgy:steel_ingot
    count: 4
  - type: item
    item: createmetallurgy:coke
  deps:
  - cp_met_foundry
  roles:
  - engineer
  icon: createmetallurgy:steel_ingot
  ru:
    title: Сталь из литейной
    subtitle: ''
    text: '**Зачем:** Ещё один путь к стали: железо + кокс в литейной. Можно выбрать его вместо домны TFMG или IE.'
  en:
    title: Foundry Steel
    subtitle: ''
    text: '**Why:** Another way to steel: iron + coke in the foundry.'
- id: cp_met_grinder
  tasks:
  - type: item
    item: createmetallurgy:mechanical_belt_grinder
  deps:
  - cp_met_foundry
  roles:
  - engineer
  icon: createmetallurgy:mechanical_belt_grinder
  ru:
    title: Ленточная шлифовальная машина
    subtitle: ''
    text: '**Зачем:** Механический шлифовальщик чистит грязную пыль перед плавкой — так выход ещё выше.'
  en:
    title: Mechanical Belt Grinder
    subtitle: ''
    text: '**Why:** The belt grinder cleans dirty dust before melting.'
- id: cp_nl_ecto
  tasks:
  - type: item
    item: create_netherless:ectoplasm
  deps:
  - cp_intro
  - c_fan
  roles:
  - engineer
  icon: create_netherless:ectoplasm
  ru:
    title: Эктоплазма
    subtitle: ''
    text: '**Зачем:** Create: Netherless даёт ресурсы Незера без похода в Незер. Эктоплазма — первый шаг цепочки, смотри рецепты в JEI.'
  en:
    title: Ectoplasm
    subtitle: ''
    text: '**Why:** Netherless gives Nether resources without the Nether; ectoplasm starts it.'
- id: cp_nl_blaze
  tasks:
  - type: item
    item: create_netherless:coal_rod
  deps:
  - cp_nl_ecto
  - c_deployer
  roles:
  - engineer
  icon: create_netherless:coal_rod
  ru:
    title: Огненный стержень без Незера
    subtitle: ''
    text: '**Зачем:** Угольный стержень в последовательной сборке становится стержнем ифрита — топливо для горелок Create.'
  en:
    title: Blaze Rods Without the Nether
    subtitle: ''
    text: '**Why:** Coal rods become blaze rods in sequenced assembly.'
- id: cp_nl_netherite
  tasks:
  - type: item
    item: create_netherless:netherite_fragment
  deps:
  - cp_nl_blaze
  roles:
  - engineer
  icon: create_netherless:netherite_fragment
  ru:
    title: Незерит без Незера
    subtitle: ''
    text: '**Зачем:** Обломки незерита и шаблон улучшения тоже можно сделать на фабрике.'
  en:
    title: Netherite Without the Nether
    subtitle: ''
    text: '**Why:** Netherite fragments and the upgrade template from the factory.'
- id: cp_aq_conduit
  tasks:
  - type: item
    item: create_aquatic_ambitions:mechanical_conduit
  deps:
  - cp_intro
  - c_fan
  roles:
  - engineer
  - breeder
  icon: create_aquatic_ambitions:mechanical_conduit
  ru:
    title: Клетка морского источника
    subtitle: ''
    text: '**Зачем:** Механический проводник даёт эффекты источника и обрабатывает предметы — новый вид массовой переработки.

      Клетки морского источника — компактная замена призмариновому кольцу. Жидкости можно закачивать через нижнюю грань клетки. Закачка жидкости активирует клетку морского источника.'
  en:
    title: Conduit Cage
    subtitle: ''
    text: '**Why:** The mechanical conduit gives conduit effects and processes items.

      Conduit Cages can be used as more compact version of the conduit''s prismarine ring. Fluids can be pumped into the conduit cage through its bottom face. Pumping a fluid into a conduit cage will awaken
      it.'
- id: cp_aq_alloy
  tasks:
  - type: item
    item: create_aquatic_ambitions:prismarine_alloy
  - type: item
    item: create_aquatic_ambitions:calcium_rich_powder
  deps:
  - cp_aq_conduit
  roles:
  - engineer
  icon: create_aquatic_ambitions:prismarine_alloy
  ru:
    title: Призмариновый сплав
    subtitle: ''
    text: '**Зачем:** Через проводник фабрика делает призмарин, кораллы и раковины наутилуса — без походов к храмам.

      Активированные морские источники можно использовать для обработки вентиляторами. Проходя через воды морского источника воздух создаёт каналирующую установку. Дополнительные слои воды ослабляют силу
      морского источника, создавая систему установку. Предметы в каналирующем потоке будут обработаны.'
  en:
    title: Prismarine Alloy
    subtitle: ''
    text: '**Why:** Prismarine, coral and nautilus shells from the factory.

      Awakened Conduits can be used for fan processing. Air Passing through an Conduit''s waters will create a Channeling Setup. Extra layers of water will dillute the Conduit''s Power, thus creating a
      Washing Setup instead. Items caught in the Channeling stream will be processed.'
- id: cp_uf
  tasks:
  - type: checkmark
  deps:
  - cp_intro
  - c_mixer
  roles:
  - engineer
  icon: create:mechanical_mixer
  ru:
    title: Ультимативная фабрика
    subtitle: ''
    text: '**Зачем:** Create: Ultimate Factory добавляет рецепты Create для вещей, которые обычно добывают руками: ресурсы мобов, редкие блоки. Ищи в JEI машины Create как способ получения.'
  en:
    title: Ultimate Factory
    subtitle: ''
    text: '**Why:** Ultimate Factory adds Create recipes for things usually gathered by hand; check JEI.'
- id: cp_spawner
  tasks:
  - type: item
    item: create_mechanical_spawner:mechanical_spawner
  deps:
  - cp_intro
  - c_brass
  - c_pipes
  roles:
  - engineer
  - warrior
  icon: create_mechanical_spawner:mechanical_spawner
  ru:
    title: Механический рассадник монстров
    subtitle: ''
    text: '**Зачем:** Механический спаунер на вращении создаёт мобов из спаун-жидкости. Жидкость для каждого моба своя — смешивай её из его дропа.

      Рассадник использует вращательную силу и специальные жидкости для призыва существ. Он запитывается снизу. Подача жидкости может осуществляться с любой горизонтальной стороны. Точка появления может
      быть настроена. Сборщик добычи может быть помещён в точку появления, чтобы автоматически собирать добычу, не вызывая призыва существа.'
  en:
    title: Mechanical Spawner
    subtitle: ''
    text: '**Why:** The mechanical spawner makes mobs from spawn fluid made of their drops.

      The Spawner uses rotational force and special fluids to spawn entities. Its powered from the bottom. Fluid input can go in from any horizontal side. Spawn point can be configured. A loot collector
      can be placed in the spawn point to automatically collect loot without spawning the entity.'
- id: cp_spawner_loot
  tasks:
  - type: item
    item: create_mechanical_spawner:loot_collector
  deps:
  - cp_spawner
  roles:
  - engineer
  icon: create_mechanical_spawner:loot_collector
  ru:
    title: Сборщик добычи
    subtitle: ''
    text: '**Зачем:** Сборщик добычи забирает дроп сразу, без убийства моба. Ферма ресурсов без лишних хлопот.'
  en:
    title: Loot Collector
    subtitle: ''
    text: '**Why:** The loot collector takes the drops directly.'
- id: cp_fl_jar
  tasks:
  - type: item
    item: create_factory_logistics:jar_packager
  - type: item
    item: create_factory_logistics:copper_jar_package_8x8
  deps:
  - c_logistics
  roles:
  - engineer
  icon: create_factory_logistics:jar_packager
  ru:
    title: Разливочная машина
    subtitle: ''
    text: '**Зачем:** Банки — посылки для жидкостей. Упаковщик банок отправляет воду, лаву и топливо по сети посылок Create, как обычные предметы.'
  en:
    title: Bottler
    subtitle: ''
    text: '**Why:** Jars are packages for fluids, sent through Create''s package network.'
- id: cp_fl_gauge
  tasks:
  - type: item
    item: create_factory_logistics:factory_fluid_gauge
  - type: item
    item: create_factory_logistics:network_link
  deps:
  - cp_fl_jar
  roles:
  - engineer
  icon: create_factory_logistics:factory_fluid_gauge
  ru:
    title: Фабричный жидкостный контроллер
    subtitle: ''
    text: '**Зачем:** Датчик жидкостей заказывает жидкость, когда её мало, — миксеры и котлы пополняются сами.

      Сетевые ссылки могут быть подключены к устройству чтения инвентаря, например, пороговому переключателю. Так что горелка всполоха будет накормлена только при необходимости. По прибытии заказа, переключатель
      будет считывать новые состояния и реагировать на них.'
  en:
    title: Factory Fluid Gauge
    subtitle: ''
    text: '**Why:** The fluid gauge orders fluid when it runs low.

      Network Links could be attached to a inventory reading device like Threshold Switch. So that blaze burner would be fed only when necessary. When order has arrived, the switch will read new state and
      react.'
- id: cp_fl_composite
  tasks:
  - type: item
    item: create_factory_logistics:composite_package
  deps:
  - cp_fl_jar
  roles:
  - engineer
  icon: create_factory_logistics:composite_package
  ru:
    title: Составная посылка
    subtitle: ''
    text: '**Зачем:** Составная посылка везёт предметы и жидкости вместе — один заказ на всё.'
  en:
    title: Composite Package
    subtitle: ''
    text: '**Why:** Composite packages carry items and fluids together.'
- id: cp_stockbridge
  tasks:
  - type: item
    item: createstockbridge:ae_bridge
  deps:
  - c_logistics
  - ae_network
  roles:
  - engineer
  icon: createstockbridge:ae_bridge
  ru:
    title: Мост склада и AE2
    subtitle: ''
    text: '**Зачем:** Мост связывает склад Create с сетью AE2: заказы из стоковой системы забирают предметы из МЭ-хранилища.'
  en:
    title: AE Stock Bridge
    subtitle: ''
    text: '**Why:** Links Create''s stock system with an AE2 network.

      AE Stock Bridge links the Create Stock system with AE. Right-Click to bind to the stock network before placing. Set the AE Stock Bridge address to match the Frogport address. AE. AE. AE can request
      items by ''crafting''. Create can request stored items from AE.'
- id: cp_stockbridge_pattern
  tasks:
  - type: item
    item: createstockbridge:request_pattern
  deps:
  - cp_stockbridge
  roles:
  - engineer
  icon: createstockbridge:request_pattern
  ru:
    title: Шаблон запроса
    subtitle: ''
    text: '**Зачем:** Шаблон запроса позволяет заказывать у AE2 автокрафт прямо из системы Create.'
  en:
    title: Request Pattern
    subtitle: ''
    text: '**Why:** Request patterns order AE2 autocrafting from Create.'
- id: cp_et_items
  tasks:
  - type: item
    item: createendertransmission:item_transmitter
  - type: item
    item: createendertransmission:fluid_transmitter
  deps:
  - c_brass
  roles:
  - engineer
  icon: createendertransmission:item_transmitter
  ru:
    title: Эндер-передатчики
    subtitle: ''
    text: '**Зачем:** Передатчики отправляют предметы и жидкости на любое расстояние и даже между мирами — без труб и поездов.'
  en:
    title: Ender Transmitters
    subtitle: ''
    text: '**Why:** Transmitters move items and fluids across any distance, even dimensions.'
- id: cp_et_energy
  tasks:
  - type: item
    item: createendertransmission:energy_transmitter
  deps:
  - cp_et_items
  roles:
  - engineer
  icon: createendertransmission:energy_transmitter
  ru:
    title: Энергопередатчик
    subtitle: ''
    text: '**Зачем:** Энергопередатчик пересылает энергию по воздуху — генератор может стоять далеко от фабрики.'
  en:
    title: Energy Transmitter
    subtitle: ''
    text: '**Why:** Send energy wirelessly.'
- id: cp_et_chunk
  tasks:
  - type: item
    item: createendertransmission:chunk_loader
  deps:
  - cp_et_items
  roles:
  - engineer
  icon: createendertransmission:chunk_loader
  ru:
    title: Загрузчик чанков
    subtitle: ''
    text: '**Зачем:** Загрузчик чанков держит фабрику работающей, пока ты далеко.'
  en:
    title: Chunk Loader
    subtitle: ''
    text: '**Why:** Keeps your factory loaded while you are away.'
- id: cp_tube
  tasks:
  - type: item
    item: create_hypertube:hypertube
    count: 16
  - type: item
    item: create_hypertube:hypertube_entrance
  deps:
  - cp_intro
  - c_brass
  roles:
  - explorer
  - engineer
  icon: create_hypertube:hypertube
  ru:
    title: Гипертруба
    subtitle: ''
    text: '**Зачем:** Гипертрубы — пневмопочта для людей. Входишь в трубу и летишь по ней к другому концу базы.'
  en:
    title: Hypertube Block
    subtitle: ''
    text: '**Why:** Hypertubes carry players through tubes.

      Hypertube Entrances connect to the Hypertube network, allowing high-speed travel. To be able to enter the Hypertube, you need to power with at least 16 RPM. The faster it spins, the faster you can
      travel. You can change the entrance mode by Right Clicking it with a Wrench.'
- id: cp_tube_acc
  tasks:
  - type: item
    item: create_hypertube:hypertube_accelerator
  - type: item
    item: create_hypertube:hypertube_junction
  deps:
  - cp_tube
  roles:
  - engineer
  icon: create_hypertube:hypertube_accelerator
  ru:
    title: Блок-ускоритель Гипертрубы
    subtitle: ''
    text: '**Зачем:** Ускоритель разгоняет в трубе, развилка позволяет строить целую сеть с выбором направления.'
  en:
    title: Hypertube Accelerator Block
    subtitle: ''
    text: '**Why:** Accelerators speed you up, junctions build networks.

      Hypertube Accelerators increase the speed of entities traveling the Hypertube. You can change to BRAKE mode by Right Clicking the Accelerator.'
- id: cp_tube_attach
  tasks:
  - type: item
    item: create_hypertube:hypertube_funnel
  - type: item
    item: create_hypertube:tube_scanner_attachment
  deps:
  - cp_tube_acc
  roles:
  - engineer
  icon: create_hypertube:hypertube_funnel
  ru:
    title: Воронка и сканер труб
    subtitle: ''
    text: '**Зачем:** Воронка гонит по трубам предметы, сканер и детектор управляют сетью сигналами редстоуна.'
  en:
    title: Tube Funnel and Scanner
    subtitle: ''
    text: '**Why:** Funnels move items; scanners and detectors control the network.

      The Scanner Attachment allows you to detect entities traveling the Hypertube. (8 power for babies and 15 for adults). You can also place attachments in accelerators, in any side at the same time.
      The Redstone Detector Attachment allows you to change the Accelerator/Entrance mode with a Redstone signal.'
- id: cp_tp_pearl
  tasks:
  - type: item
    item: createteleporters:redstone_pearl
  - type: item
    item: createteleporters:quantum_mechanism
  deps:
  - cp_intro
  - c_precision
  roles:
  - explorer
  - engineer
  icon: createteleporters:redstone_pearl
  ru:
    title: Квантовый механизм
    subtitle: ''
    text: '**Зачем:** Редстоун-жемчуг и квантовый механизм — основа телепортеров Create. Квантовую жидкость делают в миксере.'
  en:
    title: Quantum Mechanism
    subtitle: ''
    text: '**Why:** Redstone pearls and the quantum mechanism start Create teleporters.'
- id: cp_tp_teleporter
  tasks:
  - type: item
    item: createteleporters:teleporter
  - type: item
    item: createteleporters:tp_link
  deps:
  - cp_tp_pearl
  roles:
  - explorer
  - engineer
  icon: createteleporters:teleporter
  ru:
    title: Телепортер
    subtitle: ''
    text: '**Зачем:** Телепортер с привязкой переносит игроков между двумя точками. Настрой связь ссылкой — сцена Ponder покажет как.'
  en:
    title: Teleporter
    subtitle: ''
    text: '**Why:** Linked teleporters move players between two points.

      Entity Teleporters send players and mobs to a saved location. The full, slab and quarter-height versions use the same setup. Aim at a loaded block at your destination and right-click with a regular
      TP Link to save the arrival position. Leave room above it for safe arrival. Open the teleporter and insert the saved TP Link into its slot. No receiving teleporter is required. Keep the destination
      in the same dimension and within the configured Entity Teleporter range. Check the distance status in the teleporter screen.'
- id: cp_tp_items
  tasks:
  - type: item
    item: createteleporters:item_tp
  - type: item
    item: createteleporters:block_teleporter
  deps:
  - cp_tp_teleporter
  roles:
  - engineer
  icon: createteleporters:item_tp
  ru:
    title: Телепорт предметов и блоков
    subtitle: ''
    text: '**Зачем:** Телепортеры предметов и блоков — логистика без конвейеров между далёкими базами.'
  en:
    title: Item and Block Teleporters
    subtitle: ''
    text: '**Why:** Item and block teleporters: logistics between far bases.

      Aim at a loaded destination block and right-click with a TP Link to save its position. Keep the destination in the same dimension and within the configured Item Teleporter range. Open the Item Teleporter.
      Put the saved TP Link in the link slot and the items to send in the other slot. Take a stack from storage and put it in the item slot. Items arrive above the saved block: a hopper can collect them
      into a chest.'
- id: cp_tp_portal
  tasks:
  - type: item
    item: createteleporters:custom_portal_base
  deps:
  - cp_tp_teleporter
  roles:
  - explorer
  icon: createteleporters:custom_portal_base
  ru:
    title: Свой портал
    subtitle: ''
    text: '**Зачем:** Свой портал можно настроить на координаты — строй личные врата между городами.'
  en:
    title: Custom Portal
    subtitle: ''
    text: '**Why:** Custom portals go to set coordinates.

      The Custom Portal Controller is the heart of your teleportation system.

      Place it in the bottom row, leaving one free block on each side.

      Placing it automatically adds the two side blocks. Set both controllers to Portal to Portal mode.

      Right-click each controller with the same Advanced TP Link

      to pair them.'
- id: cp_tp_pocket
  tasks:
  - type: item
    item: createteleporters:pocket_dimension_remote
  deps:
  - cp_tp_teleporter
  roles:
  - explorer
  - builder
  icon: createteleporters:pocket_dimension_remote
  ru:
    title: Карманное измерение
    subtitle: ''
    text: '**Зачем:** Пульт карманного измерения переносит в личную комнату — отличное место для склада или мастерской.'
  en:
    title: Pocket Dimension
    subtitle: ''
    text: '**Why:** The pocket dimension remote opens a private room.'
- id: cp_ca_gearbox
  tasks:
  - type: item
    item: create_ca:brass_gearbox
  - type: item
    item: create_ca:vertical_brass_gearbox
  deps:
  - c_brass
  roles:
  - engineer
  icon: create_ca:brass_gearbox
  ru:
    title: Латунная коробка передач
    subtitle: ''
    text: '**Зачем:** Латунная коробка передач передаёт вращение во все шесть сторон и настраивается — меньше лишних валов.'
  en:
    title: Brass Gearbox
    subtitle: ''
    text: '**Why:** The brass gearbox outputs to all six sides.

      The brass gearbox behaves exactly like an andesite gearbox by default. However, it does have some additional functionality available: side blocking! By right clicking the side of a brass gearbox with
      brass casing... ...that side will be blocked. Blocking one of the sides of a brass gearbox will stop rotation from transferring to... ...and from a brass gearbox. In order to unblock the side of a
      brass gearbox, just click the side you no longer want to be blocked with brass casing again.'
- id: cp_ca_chain
  tasks:
  - type: item
    item: create_ca:brass_chain_drive
  - type: item
    item: create_ca:adjustable_brass_chain_gearshift
  deps:
  - cp_ca_gearbox
  roles:
  - engineer
  icon: create_ca:brass_chain_drive
  ru:
    title: Латунный цепной привод
    subtitle: ''
    text: '**Зачем:** Латунный цепной привод и регулируемый переключатель тонко меняют скорость вдоль линии.'
  en:
    title: Brass Chain Drive
    subtitle: ''
    text: '**Why:** Brass chain drives fine-tune speed along a line.

      Chain Drives relay rotation to each other in a row. All shafts connected like this will rotate in the same direction. Any part of the row can be rotated by 90 degrees.'
- id: cp_ca_inverted
  tasks:
  - type: item
    item: create_ca:inverted_clutch
  - type: item
    item: create_ca:inverted_gearshift
  - type: item
    item: create_ca:brass_basin
  deps:
  - cp_ca_gearbox
  roles:
  - engineer
  icon: create_ca:inverted_clutch
  ru:
    title: Обратные муфты и латунная чаша
    subtitle: ''
    text: '**Зачем:** Обратная муфта работает наоборот: вращение идёт, пока нет сигнала. Латунная чаша — улучшенная чаша для миксера и пресса.'
  en:
    title: Inverted Clutch and Brass Basin
    subtitle: ''
    text: '**Why:** Inverted clutches pass rotation without a signal; the brass basin upgrades the basin.

      While the clutch is useful, it doesn''t fit all use cases. Often, you might wish for a clutch that blocks rotation when not powered, and acts like a shaft when it is powered, since it works better
      for your application. Or in other words, you wish for an inverted form of a clutch. You could use a redstone torch to do just that... However, this can easily be considered bulky depending on what
      you are making. This is where the inverted clutch comes into play. By right clicking a clutch with a redstone torch... ...it will be converted into an inverted clutch.'
- id: cp_bnb_chain
  tasks:
  - type: item
    item: bits_n_bobs:chain_pulley
  - type: item
    item: bits_n_bobs:cogwheel_chain_carriage
  deps:
  - c_contraption
  roles:
  - engineer
  icon: bits_n_bobs:chain_pulley
  ru:
    title: Цепная лебёдка
    subtitle: ''
    text: '**Зачем:** Цепной подъёмник и тележка на цепи двигают контрапции по сложным путям — лифты и подъёмники без верёвок.

      Цепь может быть использована для соединения двух и более шестерней. Соотношение скоростей вращения остаётся таким же, каким бы оно было при непосредственном контакте. 32 об/мин. 16 об/мин.'
  en:
    title: Chain Pulley
    subtitle: ''
    text: '**Why:** Chain pulleys and chain carriages move contraptions along chains.

      Chains can be used to connect 2 or more cogwheels. Gear ratios will be preserved across the chain. 2x RPM. 1x RPM.'
- id: cp_bnb_nixie
  tasks:
  - type: item
    item: bits_n_bobs:nixie_board
  - type: item
    item: bits_n_bobs:large_nixie_tube
  deps:
  - c_logistics
  roles:
  - engineer
  - builder
  icon: bits_n_bobs:nixie_board
  ru:
    title: Газоразрядный экран
    subtitle: ''
    text: '**Зачем:** Газоразрядные табло показывают числа и текст со ссылок дисплея — склад, счётчики, табло станций.

      Газоразрядный экран может быть использован для отображения текста. Расширение экрана соприкасающимися блоками возможно как в ширину... ...так и в высоту. Используйте бирку, планшет или подключите
      передатчик информации для отображения текста. ПКМ по экрану гаечным ключом переключает режим отображения экрана. От режима зависят размер текста и видимость дополнительной строки. ПКМ по экрану с
      красителем в руке, чтобы окрасить текст всех соединённых по горизонтали блоков экрана за раз.'
  en:
    title: Nixie Board
    subtitle: ''
    text: '**Why:** Nixie boards show numbers and text from display links.

      This is a Nixie Board. It can be used to display text. The Nixie Board extends when connected to other neighbours. Boards placed above or below will connect to form larger displays. Clipboards, Display
      Links, or Name Tags can be used to change the displayed text. A Wrench can be used to cycle the display mode. Different display modes support more characters and multiple lines. Dye can be used to
      change the color of all connected boards at once.'
- id: cp_bnb_strut
  tasks:
