    title: Refractory Mortar
    subtitle: ''
    text: '**Why:** Refractory mortar builds what holds molten metal.

      Industrial Crucibles can also be used as bigger Foundry Basin. You can add or remove attachments like Gauges any time and anywhere using a Wrench. To melt metals, you will need to heat up the Foundry...
      ...Crucibles must have a base size of 5x5 blocks to reach the maximum temperature. However, each base block without a burner below it will cool down the Crucible. Higher heat means faster melting!
      Unlike Foundry Basins, Crucibles are large enough to melt down bigger items and several at once.'
