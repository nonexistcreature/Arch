    subtitle: ''
    text: '**Why:** Girder struts at any angle, a headlamp and brass lamps.

      Struts can be used to span a gap between two blocks. Struts can be placed at different angles. However, Struts can only move in 2 axes at the same time, meaning they cannot bend.'
