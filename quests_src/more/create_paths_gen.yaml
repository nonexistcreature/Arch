    text: '**Зачем:** Огнеупорный раствор — основа литейной: из него строят то, что выдерживает расплавленный металл.

      Промышленные чаши также могут использоваться как литейные установки... ...вы можете удалить их в любое время с помощью гаечного ключа. Чтобы плавить металлы, необходимо нагреть литейную установку...
