- id: gag_wand
  tasks:
  - type: item
    item: ars_nouveau:wand
  deps:
  - arsg_spellcraft
  roles:
  - mage
  icon: ars_nouveau:wand
  ru:
    title: Чародейский жезл
    subtitle: ''
    text: Жезлы принимают только одно заклинание, начертаное с помощью писчего стола. Жезл всегда начинается со Снаряд -> Укорение, и ДОЛЖЕН быть начертан заклинанием, у которого нет другого метода. Это
      позволяет вам творить заклинания сверх предела в 10 шт. Если вы хотите получить жезл, который творит Разрушение, начертите на нём ТОЛЬКО Разрушение, и в результате вы получите жезл со Снаряд -> Укорение
      -> Разрушение.
  en:
    title: Enchanter's Wand
    subtitle: ''
    text: Wands accept only a single spell, and are inscribed using the Scribes Table. A Wand always starts with Projectile -> Accelerate, and MUST be inscribed with a spell that does not have another form.
      This allows you to cast spells beyond the 10 spell cap. If you want a wand that casts Break, inscribe the wand with JUST break, and your result will be a wand with Projectile -> Acclerate -> Break.
- id: gag_light
