    title: Пояснительный Кодекс
    subtitle: ''
    text: Пояснительный Кодекс позволяет игрокам делиться своими знаниями о глифах с другими игроками. Чтобы записать известные вам глифы, просто используйте кодекс. Запись глифов требует опыта для каждого
      известного глифа, и опыт будет потребляться при использовании предмета. При повторном использовании предмета список известных глифов будет обновлен. Другие игроки могут использовать книгу для изучения
      глифов, потребляя кодекс в процессе.
  en:
    title: Annotated Codex
    subtitle: ''
    text: The Annoted Codex allows players to share their knowledge of glyphs with other players. To record your known glyphs, simply use the codex. Recording glyphs requires EXP for each glyph known, and
      the EXP will be consumed upon using the item. Using the item again will update the list of known glyphs. Other players may use the book to learn the glyphs, consuming the codex in the process.
- id: gag_xp_gem
  tasks:
  - type: item
    item: ars_nouveau:experience_gem
  deps:
  - ars_apparatus
  roles:
  - mage
  icon: ars_nouveau:experience_gem
  ru:
    title: Самоцвет опыта
    subtitle: ''
    text: '**Зачем:** Самоцвет опыта — опыт в кармане. Его тратят на зачарования и ритуалы.'
  en:
    title: Experience Gem
    subtitle: ''
    text: '**Why:** Experience in a gem for enchanting and rituals.'
- id: gae2_foci
  tasks:
  - type: item
    item: ars_elemental:earth_focus
  - type: item
    item: ars_elemental:water_focus
  - type: item
    item: ars_elemental:air_focus
  - type: item
    item: ars_elemental:necrotic_focus
  deps:
  - ars_elemental
  roles:
  - mage
  icon: ars_elemental:earth_focus
  ru:
    title: Фокусы стихий
    subtitle: ''
    text: Этот фокус заклинания настроен на школу Земли. При экипировке глифы этой школы будут усиливаться и обесцениваться. Меньший фокус, как недостаток, ослабит глифы других школ элементалей. Основной
      фокус также дает регенерацию маны I, пока владелец стоит под Y 0.
  en:
    title: Elemental Foci
    subtitle: ''
    text: This spell focus is attuned to the school of Earth. While equipped, the glyphs of this school will be amplified and discounted. The lesser focus, as a drawback, will weaken glyphs of the other
      elemental schools. The major focus also grants Mana Regen I while the wearer stand under Y 0.
- id: gae2_lesser_focus
  tasks:
  - type: item
    item: ars_elemental:lesser_fire_focus
  deps:
  - ars_elemental
  roles:
  - mage
  icon: ars_elemental:lesser_fire_focus
  ru:
    title: Малый фокус огня
    subtitle: ''
    text: Приобрести меньший фокус Огня
  en:
    title: Lesser Focus of Fire
    subtitle: ''
    text: Acquire a lesser focus of Fire
- id: gae2_armor
  tasks:
  - type: item
    item: ars_elemental:fire_chestplate
  - type: item
    item: ars_elemental:aqua_chestplate
  - type: item
    item: ars_elemental:earth_chestplate
  - type: item
    item: ars_elemental:air_chestplate
  deps:
  - gae2_foci
  roles:
  - mage
  - warrior
  icon: ars_elemental:fire_chestplate
  ru:
    title: Стихийные доспехи
    subtitle: ''
    text: '**Зачем:** Доспехи четырёх стихий усиливают глифы своей школы, удешевляют их и снижают урон своей стихией. Полный комплект даёт ещё больший бонус.'
  en:
    title: Elemental Armor
    subtitle: ''
    text: '**Why:** Each set boosts and cheapens its school''s glyphs and reduces its element''s damage.'
- id: gae2_mastery
  tasks:
  - type: item
    item: ars_elemental:mark_of_mastery
  deps:
  - gae2_armor
  roles:
  - mage
  icon: ars_elemental:mark_of_mastery
  ru:
    title: Знак мастерства
    subtitle: ''
    text: '**Зачем:** Знак мастерства нужен для лучших стихийных вещей: его собирают из эссенций и дани. Полный стихийный комплект брони превращает часть погашенного урона в пользу для тебя.'
  en:
    title: Mark of Mastery
    subtitle: ''
    text: '**Why:** Needed for top elemental gear; full sets convert part of reduced damage.

      Elemental Armor Sets are attuned to the four elemental schools of magic. Each piece of armor will amplify glyphs of its school, make them cheaper, and reduce damage related to its element. When all
      pieces are equipped, the chunk of damage reduced is converted into mana and a special effect may trigger.'
- id: gae2_tome
  tasks:
  - type: item
    item: ars_elemental:fire_caster_tome
  deps:
  - gae2_foci
  roles:
  - mage
  icon: ars_elemental:fire_caster_tome
  ru:
    title: Огненный том
    subtitle: ''
    text: '**Зачем:** Том заклинателя огня — готовое мощное огненное заклинание без книги и с меньшей ценой маны.'
  en:
    title: Caster Tome of Fire
    subtitle: ''
    text: '**Why:** A ready-made fire spell at reduced cost.'
- id: gae2_turret
  tasks:
  - type: item
    item: ars_elemental:fire_turret
  deps:
  - gae2_foci
  - gag_turrets
  roles:
  - mage
  - engineer
  icon: ars_elemental:fire_turret
  ru:
    title: Турель с огненным зарядом
    subtitle: ''
    text: '**Зачем:** Турель, напитанная огнём, усиливает огненные заклинания, которые через неё проходят.'
  en:
    title: Fire Infused Turret
    subtitle: ''
    text: '**Why:** Boosts fire spells cast through it.'
- id: gae2_bangles
  tasks:
  - type: item
    item: ars_elemental:base_bangle
  - type: item
    item: ars_elemental:fire_bangle
  deps:
  - gae2_foci
  roles:
  - mage
  icon: ars_elemental:base_bangle
  ru:
    title: Браслеты
    subtitle: ''
    text: У этого волшебного аксессуара есть шанс увеличить урон ваших заклинаний. Его магия нестабильна, но, возможно, настройка его на школу может стабилизировать его способности.
  en:
    title: Bangles
    subtitle: ''
    text: This magic accessory has a chance to boost the damage of your spells. Its magic is unstable but perhaps attuning it to a school can stabilize its abilities.
- id: gae2_charms
  tasks:
  - type: item
    item: ars_elemental:siren_charm
  - type: item
    item: ars_elemental:firenando_charm
  - type: item
    item: ars_elemental:flashjack_charm
  deps:
  - ars_elemental
  roles:
  - mage
  - breeder
  icon: ars_elemental:siren_charm
  ru:
    title: Талисманы стихийных духов
    subtitle: ''
    text: '**Зачем:** Талисманы призывают стихийных духов. Сирену приручают морским огурцом — она скачет из воды у кораллов и оставляет жетоны. Её святилище понемногу даёт улов рыбы.'
  en:
    title: Elemental Spirit Charms
    subtitle: ''
    text: '**Why:** Summon elemental spirits; befriend a siren with a sea pickle.

      Sirens are usually found near coral formations, jumping out of the water or following boats. You can befriend a wild mermaid by giving them a sea pickle, they will jump and leave behind few tokens.
      The siren charm can be used to summon a Siren and if used on Prismarine it will transform in a Siren Shrine. Tamed sirens can change colors if you give them kelp or corals.'
- id: gae2_horn
  tasks:
  - type: item
    item: ars_elemental:spell_horn
  deps:
  - gae2_foci
  roles:
  - mage
  icon: ars_elemental:spell_horn
  ru:
    title: Рог чародея
    subtitle: ''
    text: '**Зачем:** Рог заклинателя накладывает заклинание на тебя и существ вокруг. Чем дольше держишь, тем больше радиус, а на полном заряде он ещё и усиливает урон заклинаний.'
  en:
    title: Enchanter's Horn
    subtitle: ''
    text: '**Why:** Casts its spell on you and those around; hold longer for range.

      The Enchanter''s Horn can be used to cast spells on you and nearby entities. Hold the Horn to increase the range, at max charge it will also give a Spell Damage effect to the player. It MUST be inscribed
      with a spell that does NOT have another method, using a Scribing Table.'
- id: gae2_bag
  tasks:
  - type: item
    item: ars_elemental:caster_bag
  deps:
  - ars_elemental
  roles:
  - mage
  icon: ars_elemental:caster_bag
  ru:
    title: Сумка заклинателя
    subtitle: ''
    text: Приобрести сумку заклинателя
  en:
    title: Spellcaster Bag
    subtitle: ''
    text: Acquire a Spellcaster Bag
- id: gae2_lens
  tasks:
  - type: item
    item: ars_elemental:homing_prism_lens
  - type: item
    item: ars_elemental:piercing_prism_lens
  deps:
  - arsg_spell_prism
  roles:
  - mage
  - engineer
  icon: ars_elemental:homing_prism_lens
  ru:
    title: Линзы призмы
    subtitle: ''
    text: '**Зачем:** Линзы ставят на призму: самонаводящаяся ведёт снаряд к цели, пронзающая пускает его сквозь врагов.'
  en:
    title: Prism Lenses
    subtitle: ''
    text: '**Why:** Lenses on a prism: homing and piercing.'
- id: gae2_relay
  tasks:
  - type: item
    item: ars_elemental:fire_relay
  deps:
  - ars_relay
  roles:
  - mage
  icon: ars_elemental:fire_relay
  ru:
    title: Огненное реле сбора
    subtitle: ''
    text: '**Зачем:** Огненное реле сбора собирает источник из огненных процессов вокруг. Стихийные реле — продвинутые реле Ars Elemental.'
  en:
    title: Fiery Collector Relay
    subtitle: ''
    text: '**Why:** An elemental source relay.'
- id: gae2_glyphs
  tasks:
  - type: item
    item: ars_elemental:glyph_spark
  - type: item
    item: ars_elemental:glyph_water_jet
  - type: item
    item: ars_elemental:glyph_spike
  - type: item
    item: ars_elemental:glyph_life_link
  deps:
  - gae2_foci
  roles:
  - mage
  icon: ars_elemental:glyph_spark
  ru:
    title: Стихийные глифы
    subtitle: ''
    text: Вы создаете связь между своей жизненной силой и жизненной силой цели. Любой урон, нанесенный вам, будет передан цели, а любое исцеление цели будет передано вам. Вы можете разорвать жизненную связь,
      прекратив действие эффекта для обеих сторон.
  en:
    title: Elemental Glyphs
    subtitle: ''
    text: You create a link between your life force and the target's. Any damage dealt to you will be shared with the target and any healing of the target will be shared with you equally. Using sensitive
      reverses the direction of the link. Cut can sever the life link, ending the effect on both sides.
- id: gad_charms
  tasks:
  - type: item
    item: ars_additions:undying_charm
  - type: item
    item: ars_additions:fall_prevention_charm
  - type: item
    item: ars_additions:water_breathing_charm
  deps:
  - arsg_jump_ring
  roles:
  - mage
  - warrior
  icon: ars_additions:undying_charm
  ru:
    title: Защитные талисманы
    subtitle: ''
    text: '**Зачем:** Талисман бессмертия спасает от смерти, талисман от падения отменяет урон от падения, талисман дыхания позволяет дышать под водой. У каждого ограниченный заряд — подзаряжай.'
  en:
    title: Protective Charms
    subtitle: ''
    text: '**Why:** Undying, fall prevention and water breathing charms.

      Prevents you from dying'
- id: gad_charms2
  tasks:
  - type: item
    item: ars_additions:fire_resistance_charm
  - type: item
    item: ars_additions:night_vision_charm
  deps:
  - gad_charms
  roles:
  - mage
  icon: ars_additions:fire_resistance_charm
  ru:
    title: Ещё талисманы
    subtitle: ''
    text: '**Зачем:** Талисман огнестойкости гасит урон от огня, ночного зрения — даёт видеть в темноте.'
  en:
    title: More Charms
    subtitle: ''
    text: '**Why:** Fire resistance and night vision charms.

      Nullifies Fire Damage'
- id: gad_warp_index
  tasks:
  - type: item
    item: ars_additions:warp_index
  - type: item
    item: ars_additions:stabilized_warp_index
  deps:
  - ars_warp
  roles:
  - mage
  icon: ars_additions:warp_index
  ru:
    title: Указатель варпа
    subtitle: ''
    text: '**Зачем:** Указатель варпа хранит несколько точек телепорта сразу, стабилизированный — работает надёжнее и дальше. Подробно — в книге Ars.'
  en:
    title: Warp Index
    subtitle: ''
    text: '**Why:** Holds several warp points; see the notebook.'
- id: gad_wayfinder
  tasks:
  - type: item
    item: ars_additions:wayfinder
  deps:
  - ars_warp
  roles:
  - mage
  icon: ars_additions:wayfinder
  ru:
    title: Путеводитель
    subtitle: ''
    text: '**Зачем:** Путеводитель показывает направление и расстояние до привязанной точки.'
  en:
    title: Wayfinder
    subtitle: ''
    text: '**Why:** Points to a bound location with distance.'
- id: gad_haversack
  tasks:
  - type: item
    item: ars_additions:handy_haversack
  deps:
  - arsg_spellcraft
  roles:
  - mage
  icon: ars_additions:handy_haversack
  ru:
    title: Удобная сумка
    subtitle: ''
    text: '**Зачем:** Привяжи сумку к сундуку — и складывай в него вещи откуда угодно, просто кликая предметом по сумке. Пока сундук не прогружен, сумка закрыта.'
  en:
    title: Handy Haversack
    subtitle: ''
    text: '**Why:** Deposit into a bound container from anywhere.

      After binding the Handy Haversack to a container, you can right-click items onto the haversack to deposit them into that container from anywhere. When the container is unloaded the haversack will
      close and not accept any items. You can automate the depositing of items by adding items to its filters. Use the haversack with an item in your off hand, or scribe the haversack using a Scribe''s
      table with the item you wish to add.'
- id: gad_xp_jar
  tasks:
  - type: item
    item: ars_additions:xp_jar
  - type: item
    item: ars_additions:ender_source_jar
  deps:
  - gag_xp_gem
  roles:
  - mage
  icon: ars_additions:xp_jar
  ru:
    title: Банки опыта и эндер-источника
    subtitle: ''
    text: '**Зачем:** Банка опыта уничтожает выбранный мусор при подборе и даёт за него немного опыта. Включается и выключается кликом с Shift.'
  en:
    title: XP and Ender Source Jars
    subtitle: ''
    text: '**Why:** Destroys chosen junk on pickup for a bit of XP.

      A jar that can destroy items on pickup and grants a small amount of XP in return. To turn the jar on and off, use the jar while sneaking. To add or remove an item to be destroyed by the jar, use the
      jar with an item in the off hand, or use an item on the Scribes Table with the jar placed on it. The jar must be in your hotbar to function.'
- id: gad_spawner
  tasks:
  - type: item
    item: ars_additions:source_spawner
  deps:
  - ars_jar
  roles:
  - mage
  icon: ars_additions:source_spawner
  ru:
    title: Спавнер на источнике
    subtitle: ''
    text: '**Зачем:** Спавнер на источнике призывает мобов из банок с мобами рядом и тратит за каждого источник из банок. Выключается редстоуном.'
  en:
    title: Source Spawner
    subtitle: ''
    text: '**Why:** A source-powered spawner reading nearby mob jars.

      The Source Spawner is a source-powered mob spawner that reads nearby Mob Jars to determine what to spawn. Each mob spawned consumes source from nearby Source Jars, with the cost varying based on the
      mob type. The spawner can be disabled with a redstone signal and outputs a comparator signal proportional to the current spawn delay.'
- id: gad_reliquary
  tasks:
  - type: item
    item: ars_additions:unstable_reliquary
  deps:
  - arsg_spellcraft
  roles:
  - mage
  icon: ars_additions:unstable_reliquary
  ru:
    title: Нестабильный реликварий
    subtitle: ''
    text: '**Зачем:** Реликварий хранит ссылки на существ и места — к ним потом можно вернуться глифом «Возврат». Запоминают глифом «Метка», держа реликварий во второй руке.'
  en:
    title: Unstable Reliquary
    subtitle: ''
    text: '**Why:** Stores targets for the Recall glyph.

      Reliquaries are able to store references to entities and locations to be targeted using the Recall glyph. To store a reference in a Reliquary, hold it in your off-hand and cast a spell with the Mark
      glyph.'
- id: gad_dominion
  tasks:
  - type: item
    item: ars_additions:advanced_dominion_wand
  deps:
  - arsg_dominion
  roles:
  - mage
  icon: ars_additions:advanced_dominion_wand
  ru:
    title: Улучшенный жезл господства
    subtitle: ''
    text: '**Зачем:** Улучшенный жезл господства связывает сразу несколько блоков и задаёт порядок связей — быстрее настраивать магические фабрики.'
  en:
    title: Advanced Dominion Wand
    subtitle: ''
    text: '**Why:** Links several blocks at once and sets link order.

      The Advanced Dominion Wand is an upgraded Dominion Wand with the ability to control link order and link multiple blocks at once. Use the radial menu to toggle between First/Second link order and Single/Multi
      link count. In Multi mode, Shift + Right-clicking a block will find all connected blocks of the same type and link them all at once.'
- id: gad_rituals
  tasks:
  - type: item
    item: ars_additions:ritual_chunk_loading
  - type: item
    item: ars_additions:ritual_locate_structure
  deps:
  - arsg_rit_awakening
  roles:
  - mage
  icon: ars_additions:ritual_chunk_loading
  ru:
    title: Ритуалы якоря и поиска построек
    subtitle: ''
    text: '**Зачем:** Ритуал вечности держит чанки загруженными, пока в него идёт поток источника. Ритуал поиска показывает путь к постройке. Не загружай чанки без нужды — это нагрузка на сервер.'
  en:
    title: Chunk Loading and Locate Rituals
    subtitle: ''
    text: '**Why:** Chunk loading on a source stream; a structure-locating ritual.

      The Ritual of Arcane Permanence force-loads surrounding chunks when provided with a constant stream of source.'
- id: gad_memory
  tasks:
  - type: item
    item: ars_additions:memory_crystal
  - type: item
    item: ars_additions:glyph_recall
  deps:
  - arsg_spellcraft
  roles:
  - mage
  icon: ars_additions:memory_crystal
  ru:
    title: Кристалл памяти и глиф возврата
    subtitle: ''
    text: '**Зачем:** Кристалл памяти сохраняет настройки блока или существа и переносит их на другие. Глиф «Возврат» переносит к точке, сохранённой в реликварии.'
  en:
    title: Memory Crystal and Recall Glyph
    subtitle: ''
    text: '**Why:** Copies block/entity configuration; Recall teleports to a stored mark.

      The Memory Crystal can save and load configuration data from supported blocks and entities. Shift + Right-click a supported block or entity to save its configuration to the selected slot. Shift +
      Right-click again to load the saved data back. Use the radial menu to select between 10 memory slots. Shift + radial menu allows you to clear or lock slots to prevent accidental overwrites.'
