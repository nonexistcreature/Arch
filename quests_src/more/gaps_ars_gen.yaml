      Заклинание, с которого вы начинаете. Разбивает блоки средней твердости. Может быть усилен для повышения уровня сбора. Чувствительность имитирует Разрушение блоков ножницами вместо кирки.'
  en:
    title: Break Glyph
    subtitle: ''
