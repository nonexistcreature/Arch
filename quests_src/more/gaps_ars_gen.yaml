    text: '**Зачем:** Каждое заклинание начинается с формы: снаряд летит во врага, касание действует на блок или существо перед тобой, «на себя» — на тебя. Дальше идут эффекты и усилители.

      Заклинание, с которого вы начинаете. Вызывает снаряд, который применяет эффекты заклинаний, когда этот снаряд попадает в цель или блок. Чувствительность позволит снарядам ломать растения или другие
      материалы, которые не блокируют движение.'
  en:
    title: The Three Spell Forms
    subtitle: ''
    text: '**Why:** Every spell starts with a form: projectile, touch or self.

      Summons a projectile that applies spell effects when this projectile hits a target or block. Sensitive will allow Projectiles to break plants or other materials that do not block motion.'
