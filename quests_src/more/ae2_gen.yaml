  en:
    title: ME IO Port
    subtitle: ''
    text: '**Why:** Moves cell contents into the network and back.

      The IO Port allows you to rapidly fill or empty storage cells to or from network storage.

      It can be rotated with a certus quartz wrench.

      * The IO Port can be set to move the cell to the output slots when the cell is empty, full, or when the work is done. * If a redstone card is inserted, there will be options for various redstone conditions
      * In the center of the GUI, there is an arrow to set which direction to transfer items, from the cell to network storage, or from storage to the cell.'
- id: ae2g_channels
  tasks:
  - type: checkmark
  deps:
  - ae_cables
  roles:
  - engineer
  icon: ae2:fluix_smart_cable
  ru:
    title: Каналы
    subtitle: ''
    text: '**Зачем:** В обычном AE2 каждый кабель несёт ограниченное число каналов. **В Arkhaven каналы бесконечные** — можно не планировать разводку, но знать про них полезно, если поиграешь в другие сборки.'
  en:
    title: Channels
    subtitle: ''
    text: '**Why:** Channels are unlimited in Arkhaven, but it''s worth knowing how they normally work.

      Applied Energistics 2''s ME Networks require Channels to support devices which use networked storage, or other network services. Think of channels like USB cables to all your devices. A computer only
      has so many USB ports and can only support so many devices connected to it. Most machines, full-block devices, and standard cables can only pass through up to 8 channels. You can think of full-block
      devices and standard cables as a bundle of 8 "channel wires". However, dense cables can support up to 32 channels. The only other devices capable of transmitting 32 are me p2p tunnel and the Quantum
      Network Bridge.'
