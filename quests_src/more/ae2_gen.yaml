    subtitle: ''
    text: '**Зачем:** Плоскость поглощения ломает блоки и подбирает предметы прямо в сеть, плоскость формирования — ставит блоки. Генератор булыжника без воронок.'
  en:
    title: ME Formation Plane
    subtitle: ''
    text: '**Why:** The annihilation plane breaks blocks into the network; the formation plane places them.

      The Annihilation Plane breaks blocks and picks up items. It works similarly to an import bus, pushing things into network storage. For items to be picked up, they must collide with the face of the
      plane, it does not pick up in an area.

      Annihilation planes can be enchanted with any pickaxe enchantment, so yes, you can put crazy levels of fortune on a few and automate ore processing if your modpack allows it. In addition, silk touch
      does what you''d expect it to, efficiency reduces the energy cost of breaking a block, and unbreaking gives a chance of not using any energy.

      They are cable subparts.'
