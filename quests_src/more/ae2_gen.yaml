    title: Конденсатор материи
    subtitle: ''
    text: '**Зачем:** Конденсатор уничтожает мусор, превращая его в шарики материи (патроны для материальной пушки) и сингулярности.'
  en:
    title: Matter Condenser
    subtitle: ''
    text: '**Why:** The condenser destroys junk into matter balls and singularities.

      The matter condenser can be used as either a trash can or to create matter balls and singularities. It can take any item or fluid or etc. a storage cell can store.

      * In trash can mode, the matter condenser just voids everything that enters it * In matter ball mode the condenser makes matter balls out of whatever you put in it. This mode requires that you put
      a storage component in the top slot of the condenser. Matter balls take 256 items or buckets each, so a cell component 1k (which provides 8192 bits of capacity) is more than enough. * In matter singularity
      mode the condenser makes singularities out of whatever you put in it.'
- id: ae2g_singularity
  tasks:
  - type: item
    item: ae2:singularity
  deps:
  - ae2g_condenser
  roles:
  - engineer
  icon: ae2:singularity
  ru:
    title: Сингулярность
    subtitle: ''
    text: '**Зачем:** Сингулярность + пыль Края — квантовая запутанная сингулярность для квантового моста.'
  en:
    title: Singularity
    subtitle: ''
    text: '**Why:** A singularity + ender dust makes the entangled singularities for the quantum bridge.

      A very compact ball of matter.

      Made with 256,000 items or buckets in a condenser in singularity mode.

      Required to create a connection between two Quantum Network Bridges, they are always produced in matching pairs. To create a connection place 1 of the pair of quantum entangled singularities into
      the quantum link of the bridge on each side.'
- id: ae2g_tools
  tasks:
  - type: item
    item: ae2:fluix_pickaxe
  deps:
  - ae_fluix
  roles:
  - engineer
  icon: ae2:fluix_pickaxe
  ru:
    title: Токовая кирка
    subtitle: ''
    text: '**Зачем:** Флюиксовые инструменты чуть лучше железных и чинятся флюиксом.'
  en:
    title: Fluix Pickaxe
    subtitle: ''
    text: '**Why:** Fluix tools are a bit better than iron.

      Fluix tools are similar to iron tools, having 3x the durability and a slightly higher attack damage and mining speed.

      All fluix tools act as if they have at least fortune/looting 1, which is useful before getting access to an enchanting table.

      You will need to make a fluix upgrade smithing template'
- id: ae2g_entropy
  tasks:
  - type: item
    item: ae2:entropy_manipulator
  deps:
  - ae_charger
  roles:
  - engineer
  icon: ae2:entropy_manipulator
  ru:
    title: Манипулятор энтропии
    subtitle: ''
    text: '**Зачем:** Нагревает или охлаждает блоки: плавит руду на месте, замораживает воду, тушит лаву.'
  en:
    title: Entropy Manipulator
    subtitle: ''
    text: '**Why:** Heats or cools blocks: smelts ore in place, freezes water.

      The Entropy Manipulator allows you to heat and cool things by right-clicking and shift-right-clicking respectively. It can''t do much, just things like evaporating or freezing water, solidifying lava
      to obsidian, smelting logs to charcoal, and smelting cobble to stone in-world.

      If there is not a specific thing it can do to a block, it will act as a flint-and-steel.

      Its energy can be recharged in a charger.'
- id: ae2g_matter_cannon
  tasks:
  - type: item
    item: ae2:matter_cannon
  deps:
  - ae2g_condenser
  roles:
  - warrior
  - engineer
  icon: ae2:matter_cannon
  ru:
    title: Материальная пушка
    subtitle: ''
    text: '**Зачем:** Ружьё, которое стреляет шариками материи или любыми металлическими самородками.'
  en:
    title: Matter Cannon
    subtitle: ''
    text: '**Why:** A gun that fires matter balls or metal nuggets.

      The matter cannon is a portable railgun that can fire small items as projectiles, like matter balls and metal nuggets. The damage depends on the item being fired, with "heavier" items like gold nuggets
      (10 damage) doing more damage than light items like matter balls (2 damage). It consumes a base energy of 1600 AE per shot.

      When the config option "matterCannonBlockDamage" is true, the cannon will break blocks depending on their hardness and the damage of the ammunition.

      Its energy can be recharged in a charger.'
- id: ae2g_tools_net
  tasks:
  - type: item
    item: ae2:network_tool
  - type: item
    item: ae2:memory_card
  deps:
  - ae_network
  roles:
  - engineer
  icon: ae2:network_tool
  ru:
    title: Сетевой инструмент
    subtitle: ''
    text: '**Зачем:** Сетевой инструмент показывает, что творится в сети, а карта памяти копирует настройки устройства на другое — экономит кучу кликов.'
  en:
    title: Network Tool
    subtitle: ''
    text: '**Why:** The network tool diagnoses; the memory card copies settings between devices.

      The Network Tool is a modified wrench that also shows network diagnostic information and can store upgrade cards. While it retains the wrench''s ability to quickly disassemble things and pull subparts
      off of a cable, it cannot rotate things.

      It has 9 slots in which to store upgrade cards, and they will be available in any AE2 device UI if the tool is anywhere in your inventory.

      Right-clicking any part of a network will show a diagnostic info window, similar to right-clicking a controller. This window shows'
- id: ae2g_level_toggle
  tasks:
  - type: item
    item: ae2:toggle_bus
  deps:
  - ae_level
  roles:
  - engineer
  icon: ae2:toggle_bus
  ru:
    title: МЭ шина переключения
    subtitle: ''
    text: '**Зачем:** Включает и выключает участок сети по редстоуну — например, ферму, когда запас наполнился.'
  en:
    title: ME Toggle Bus
    subtitle: ''
    text: '**Why:** Switches part of the network with redstone, e.g. a farm when stock is full.

      A bus which functions similarly to fluix glass cable or other cables, but it allows its connection state to be toggled via redstone. This allows you to cut off a section of a ME Network.

      When redstone signal supplied the part enables the connection, inverted toggle bus provides the reverse behavior by disabling the connection instead.

      Of note, toggling these may cause the network to reboot and recalculate the connected devices.'
- id: ae2g_view_cell
  tasks:
  - type: item
    item: ae2:view_cell
  deps:
  - ae2g_terminal
  roles:
  - engineer
  icon: ae2:view_cell
  ru:
    title: Ячейка просмотра
    subtitle: ''
    text: '**Зачем:** Ячейка-фильтр для терминала: показывает только руду, только еду — удобно, когда в сети тысячи предметов.'
  en:
    title: View Cell
    subtitle: ''
    text: '**Why:** A terminal filter: show only ore, only food.

      View Cells are used to filter the display of terminals. You partition them in a cell workbench.

      For example, say you want a terminal to only display a selection of stone building materials. Partition the view cell to those materials and place it in a terminal, and only those items will be shown.

      View cells are additive, if you have a view cell for oak planks and a view cell for cobblestone, putting both in will show both planks and cobblestone.'
- id: ae2g_facades
  tasks:
  - type: item
    item: ae2:cable_anchor
    count: 8
  deps:
  - ae_cables
  roles:
  - engineer
  - builder
  icon: ae2:cable_anchor
  ru:
    title: Фасады
    subtitle: ''
    text: '**Зачем:** Фасад прячет кабель под видом любого блока. Делается в резаке на верстаке: блок + кабельный якорь.'
  en:
    title: Facades
    subtitle: ''
    text: '**Why:** A facade hides a cable as any block.

      Facades can be used to make your base appear more clean. They can cover up both sizes of cable, and be made out of many kinds of blocks.

      They can cover all sides of a cable, but will let subparts and cable connections protrude though.

      Be clever with them to improve your base aesthetic or make blocks with different textures on each side.'
- id: ae2g_monitors
  tasks:
  - type: item
    item: ae2:storage_monitor
  deps:
  - ae_level
  roles:
  - engineer
  icon: ae2:storage_monitor
  ru:
    title: МЭ монитор хранения
    subtitle: ''
    text: '**Зачем:** Монитор показывает количество выбранного предмета на стене склада, а монитор обмена ещё и выдаёт его по клику.'
  en:
    title: ME Storage Monitor
    subtitle: ''
    text: '**Why:** A storage monitor shows a chosen item''s count; the conversion monitor also hands it out.

      Monitors allow visualization and interaction with a single item or fluid type, without opening a GUI.

      Monitors will inherit the color of the cable they are mounted on.

      If the monitor is on the floor or ceiling, you can rotate it with a certus quartz wrench.'
- id: ae2g_me_chest
  tasks:
  - type: item
    item: ae2:chest
  deps:
  - ae2g_cells
  roles:
  - engineer
  icon: ae2:chest
  ru:
    title: МЭ сундук
    subtitle: ''
    text: '**Зачем:** ME-сундук: одна ячейка в блоке — маленькое хранилище без сети, хорошо для старта.'
  en:
    title: ME Chest
    subtitle: ''
    text: '**Why:** The ME chest: one cell in a block, a small storage without a network.

      The ME Chest acts like a miniature network with a terminal, drive, and energy acceptor. While it can be used as a tiny storage network, its capacity for just one single storage cell means it has limited
      utility as such.

      Instead, it is useful for interacting with specifically the storage cell mounted inside it. Its integrated terminal can only see and access the items in the mounted drive, while devices on the general
      network can access items in any network storage, including ME chests.

      It has 2 different GUIs and is sided for item transport. Interacting with the top terminal opens the integrated terminal.'
- id: ae2g_master
  tasks:
  - type: checkmark
  deps:
  - ae2g_spatial
  - ae2g_cpu
  - ae2g_assembler
  - ae2g_planes
  - ae2g_singularity
  - ae2g_subnet
  - ae2g_wireless_ap
  - ae2g_cards
  roles:
  - engineer
  shape: hexagon
  rewards:
  - type: xp_levels
    count: 12
  icon: ae2:controller
  ru:
    title: Инженер сети
    subtitle: ''
    text: 'Ты освоил AE2 целиком: от кварцевой фермы до переноса баз. Дальше — MEGA, ExtendedAE и мега-автокрафт в этой же главе.'
  en:
    title: Network Engineer
    subtitle: ''
    text: You've mastered AE2 from quartz farms to moving bases.
