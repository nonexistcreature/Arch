    subtitle: ''
    text: '**Зачем:** Ячейка хранит ограниченное число **типов** предметов (63) и **байтов**. Много разных мелочей быстро съедают типы — для однородного (булыжник, руда) лучше большие ячейки.'
  en:
    title: 4k ME Item Storage Cell
    subtitle: ''
    text: '**Why:** A cell holds a limited number of item types (63) and bytes.

      Storage Cells are one of the primary methods of storage in Applied Energistics. They go in drives or chests.

      See Bytes and Types for an explanation of their capacities in bytes and types.

      Storage components can be removed from the housing if the cell is empty by shift-right clicking with the cell in your hand.

      Storage Cells are defined by both *bytes* and *types*. Bytes, like in your actual computer, are a measure of the total amount of "stuff" in a storage cell. Types are a measure of how many different,
      well, *types* of things are stored in a cell. Each type represents a unique item, so 4,096 cobblestone is 1 type but 16 different swords with different enchantments are 16 types.

      Each storage cell can store a fixed amount of data.'
