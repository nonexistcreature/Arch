    subtitle: ''
    text: '**Why:** The crafting terminal searches the whole base and crafts straight from the network.

      While pattern providers, import busses, storage busses, and the et cetera are the primary method by which an AE2 network interacts with the world, Terminals are the primary method by which an AE2
