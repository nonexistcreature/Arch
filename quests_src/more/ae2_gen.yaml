  en:
    title: Spatial IO Port
    subtitle: ''
    text: '**Why:** Spatial IO cuts a piece of the world into a cell and puts it back elsewhere: move a whole base.

      The volume to be moved

      Spatial IO is a way to cut-and-paste physical volumes of space in your world. It can be used to move flawless budding quartz, have a room in your base where you can swap out various interiors to use
      it for different purposes, or even move the end portal!

      It works by *swapping* the defined volume with an identically-sized volume in the spatial storage dimension, sending whatever''s in the pylon array to the spatial storage dimension, and whatever''s
      in the dimension to the pylon array.'
