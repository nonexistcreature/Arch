  en:
    title: Energy Acceptor
    subtitle: ''
    text: '**Why:** The energy acceptor takes FE; energy cells smooth out peaks.

      Your network will require energy to run. Networks have a pool of energy that devices directly pull from, and vibration chambers, energy acceptors (and controllers) add to. You can see the energy statistics
      for a network by right-clicking anywhere on it with a network tool or by right-clicking the network''s controller, if it has one. This network-wide storage and distribution means that there are no
      energy transfer rate limits, so devices can pull arbitrarily high amounts of energy and energy acceptors can intake at functionally unlimited speed, only limited by your energy storage.'
- id: ae2g_vibration
  tasks:
  - type: item
    item: ae2:vibration_chamber
  deps:
  - ae_power
  roles:
  - engineer
  icon: ae2:vibration_chamber
  ru:
    title: Резонирующая камера
    subtitle: ''
    text: '**Зачем:** Сжигает топливо и питает сеть — когда ещё нет генераторов.'
  en:
    title: Vibration Chamber
    subtitle: ''
    text: '**Why:** Burns fuel to power the network before you have generators.

      While the primary intended method of providing energy to your network is an energy acceptor, the vibration chamber can directly generate small to middling amounts of AE.

      By default (no upgrades and default configs) it makes 40 AE/t.

      When the network''s energy storage is full, the vibration chamber throttles down to conserve fuel, but cannot fully shut off.'
- id: ae2g_wireless_ap
  tasks:
  - type: item
