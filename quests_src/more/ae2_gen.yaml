  en:
    title: Molecular Assembler
    subtitle: ''
    text: '**Why:** The molecular assembler performs crafting-table patterns next to a pattern provider.

      The molecular assembler takes items input into it and carries out the operation defined by an adjacent pattern provider, or the inserted crafting pattern, smithing table pattern, or stonecutting pattern,
      then pushes the result to adjacent inventories.

      This assembler has a crafting pattern that specifies the 1 oak log = 4 oak planks recipe. When oak logs are fed into the upper hopper, the assembler crafts and spits oak planks into the lower hopper.

      However, their main use is next to a pattern provider.'
