  en:
    title: ME Quantum Ring
    subtitle: ''
    text: '**Why:** The quantum bridge links two networks at any distance, even across dimensions.

      Quantum Network Bridges can extend a network over infinite distances and even between dimensions. They can carry 32 channels in total (regardless of how cables are connected to each face), essentially
      acting like a wireless dense cable.

      An imaginary cable between the two endpoints

      Of note, **both sides must be chunkloaded** so a spatial anchor or other chunkloader must be used if the 2 sides are far apart.'
