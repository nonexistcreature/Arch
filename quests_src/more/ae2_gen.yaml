  en:
    title: Crafting Unit
    subtitle: ''
    text: '**Why:** The crafting CPU is a multiblock that plans the chain.

      Crafting CPUs manage crafting requests/jobs. They store the intermediate ingredients while crafting jobs with multiple steps are being carried out, and affect how big jobs can be, and to some degree
      how fast they are completed. See autocrafting for more details.

      Each crafting CPU handles 1 request or job, so if you want to request both a calculation processor and 256 smooth stone at once, you need 2 CPU multiblocks.

      They can be set to handle requests from players, automation (export busses and interfaces), or both.'
