      **your ME system and the world**

      An important concept in AE2 is the idea of Network Storage. It is the place in which the contents of a network are stored, usually storage cells or whatever inventory a storage bus is connected to.
      Most AE2 devices interact with it in one way or another.

      For example,'
- id: ae2g_planes
  tasks:
  - type: item
