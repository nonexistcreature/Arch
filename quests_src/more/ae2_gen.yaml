  en:
    title: ME Pattern Encoding Terminal
    subtitle: ''
    text: '**Why:** A pattern is a recipe you write once; then the network knows how to make the item.

      Patterns are made in a pattern encoding terminal out of blank patterns, and inserted in pattern providers or molecular assemblers.

      There are several different types of pattern for different things:

      * crafting patterns encode recipes made by a crafting table. They can be put directly in a molecular assembler to make it craft the result whenever given the ingredients, but their main use is in
      a pattern provider next to a molecular assembler. Pattern providers have special behavior in this case, and will send the relevant pattern along with the ingredients to adjacent assemblers.'
