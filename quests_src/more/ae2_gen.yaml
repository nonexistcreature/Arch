    title: Ускоритель роста
    subtitle: ''
    text: '**Зачем:** Кварц не нужно копать вечно: почкующийся кварц из метеорита растит кристаллы сам, а ускоритель роста делает это в разы быстрее. Ставь кластеры, собирай урожай.'
  en:
    title: Growth Accelerator
    subtitle: ''
    text: '**Why:** Certus doesn''t have to be mined forever: budding quartz grows crystals on its own.

      Certus quartz buds will sprout from budding certus blocks, similar to amethyst. If you break a bud that is not finished growing, it will drop one certus quartz dust, unchanged by fortune. If you break
      a fully grown cluster, it will drop four certus quartz crystals, and fortune will increase this number.

      There are 4 tiers of budding certus blocks: Flawless, Flawed, Chipped, and Damaged, and you initially find them in meteorites.

      Every time a bud grows by another stage, the budding block has a chance to degrade by one tier, eventually turning into a plain certus quartz block.'
