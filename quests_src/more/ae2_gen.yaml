  en:
    title: ME Storage Bus
    subtitle: ''
    text: '**Why:** The storage bus connects any chest, barrel or Create vault to the network.

      Ever wanted to *keep* your chest monster instead of replacing it with something sensible? We present the Storage Bus!

      The storage bus turns the inventory it''s touching into network storage. It does this by allowing the network to see the contents of that inventory, and by pushing to and pulling from that inventory
      in order to fulfill devices pushing to and pulling from network storage.

      Due to AE2''s philosophy of emergent mechanics through interaction of the functions of the devices, you don''t necessarily *have* to use a storage bus for *storage*.'
