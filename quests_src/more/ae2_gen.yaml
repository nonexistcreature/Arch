  en:
    title: ME Interface
    subtitle: ''
    text: '**Why:** The interface keeps a set stock from the network and accepts anything inserted.

      Interfaces act like a small chest and fluid tank that fills itself from and empties to network storage depending on what you set it to keep a stock of in its slots. It tries to complete this in a
      single gametick, so it can fill itself with or empty itself from up to 9 stacks per gametick, making it a fast method of import or export if you have fast item pipes.

      Another useful trait is that while most fluid tanks can only store 1 type of fluid, interfaces can store up to 9, as well as items.'
