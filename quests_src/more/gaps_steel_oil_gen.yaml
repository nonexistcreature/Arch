  icon: immersivepetroleum:derrick
  ru:
    title: Буровая вышка
    subtitle: ''
    text: '**Зачем:** Вышка бурит скважину до нефтяного пласта, который нашла сейсморазведка. Только потом качалка начинает качать.

      Буровая вышка создает устья скважин путем бурения в пористых слоях, содержащих месторождения под бедроком.

      Конструкция построена так, как показано на рисунке, и сформирована с помощью инженерного молотка на одиночном светотехническом блоке.

      Жидкости вводятся через синее отверстие для подачи жидкости, а жидкость выводится из единственного оранжевого отверстия для подачи жидкости. Трубы для стенок скважины необходимо вставить вручную.'
  en:
    title: Derrick
    subtitle: ''
    text: '**Why:** Drills the well the survey found; then the pumpjack can pump.

      The Derrick creates wellheads by drilling reinforced pipes into porous strata containing fluid reservoirs beneath the bedrock.

      The structure is built as shown and formed by using the Engineer''s Hammer on the single light engineering block.

      Fluids are input through the blue fluid port, and fluid is output from the singular orange fluid output port. Drilling pipes must be input by hand.'
- id: gip_oiltank
  tasks:
  - type: item
    item: immersivepetroleum:oiltank
  deps:
  - ip_pumpjack
  roles:
  - engineer
  icon: immersivepetroleum:oiltank
  ru:
    title: Нефтяной резервуар
    subtitle: ''
    text: '**Зачем:** Большой многоблочный резервуар — буфер между качалкой и колонной.

      Нефтехранилеще представляет собой самовыравнивающийся резервуар для жидкости, который больше обычного резервуара для жидкости, с боковыми, верхним и нижним выходами для жидкости. В нем может храниться
      до 1024 вёдер любой негазообразной жидкости.

      Нефтехранилеще автоматически выравнивается с любыми неконфигурированными масляными баками, расположенными рядом с ним в пределах линии, в результате чего уровень жидкости в каждом подключенном баке
      будет примерно одинаковым в каждом нефтехранилеще.'
  en:
    title: Oil Tank
    subtitle: ''
    text: '**Why:** A big buffer tank between pumpjack and tower.

      The Oil Tank is a self-levelling liquid tank bigger than the normal Fluid Tank, with both side, top, and bottom fluid ports. It can store 1024B of any non-gaseous fluid.

      The Oil Tank will self-level with any non-configured Oil Tanks next to it within a line, bringing each connected tank to an approximately equal liquid level any time fluids are input.

      The side fluid ports can be configured with the hammer to either input and output, while the top and bottom ports cannot be configured. Both the top and bottom port can input, but only the bottom
      fluid port can output.'
- id: gip_coker
  tasks:
  - type: item
    item: immersivepetroleum:coker_unit
  deps:
  - ip_distill
  roles:
  - engineer
  icon: immersivepetroleum:coker_unit
  ru:
    title: Коксовая установка
    subtitle: ''
    text: '**Зачем:** Перерабатывает тяжёлые остатки нефти в нефтяной кокс — ничего не пропадает.

      Установка для коксования - это очень большая многоблочная структура, которая перерабатывает битум;bitumen в нефтяной кокс;petroleum_coke и в сернистый дизель;diesel, в качестве побочного продукта.
      Это достигается путём нагрева Битума до температуры термического растрескивания, расщепляя тяжёлые длинноцепные молекулы углеводородов на нефтяной кокс и дизельное топливо.

      Энергия подается через два высоковольтных разъема на передней панели машины, а битум и вода - через два обозначенных входных отверстия на передней панели машины.'
  en:
    title: Coker Unit
    subtitle: ''
    text: '**Why:** Turns heavy residue into petroleum coke.

      The Coker is a massive machine that cracks and carbonizes residual bitumen;bitumen from distillation into petroleum coke;petroleum_coke and sulfurized diesel;diesel.

      Energy is input through the two high-amperage connectors on the front of the machine, and bitumen and water to the two labeled input ports on the front of the machine. Sulfurized diesel is output
      from the orange port on the front, and petroleum coke from the two hoppers below the coking drums.

      Supplying a redstone signal to the control panel will halt the coking process, which can be inverted with the use of the Engineer''s Screwdriver.'
