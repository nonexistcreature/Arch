    text: '**Зачем:** Маленький генератор на бензине — энергия в походе или на стройке далеко от базы.'
  en:
    title: Portable Generator
    subtitle: ''
    text: '**Why:** Gasoline power for remote builds.

      The Portable Generator is an easily-movable, light fuel alternative to the heavy, immobile Diesel Generator.

      The generator connects to LV and MV power grids directly, and can be picked up with it contents by crouching.

      The Portable Generator produces up to IF/t while burning fuels such as gasoline;gasoline, Naphtha;naphtha, or benzol;gasoline, and has an energy buffer of 100,000IF.'
- id: gip_paraffin
  tasks:
  - type: item
    item: immersivepetroleum:paraffin_wax
    count: 4
  deps:
  - ip_distill
  roles:
  - engineer
  - builder
  icon: immersivepetroleum:paraffin_wax
  ru:
    title: Парафин
    subtitle: ''
    text: '**Зачем:** Парафин из нефти — для свечей и пластика.

      Фенольная смола - это химическое чудо современности, но для её производства не хватало технологии получения её из нефти.

      С использовании недавно разработанных систем термического крекинга это уже не так: лигроин;naphtha крекингуется в ПНГ;petroleum_gas.

      ПНГ не может быть использован для производства фенольной смолы непосредственно, поскольку смола является тяжелым полимером. ПНГ нужно переработать в присадки для получения смолы на Очистительном заводе.'
  en:
    title: Paraffin Wax
    subtitle: ''
    text: '**Why:** Wax from oil, for candles and plastics.

      Phenolic Resin;resin_acetaldehyde is a chemical marvel for the modern age, but it was missing a petroleum derived process for its production.

      Using newly developed thermal cracking systems, this is no longer the case: phenolic resin can be produced from Naphtha;naphtha feedstock using a high temperature processing to crack it into petroleum
      gas;petroleum_gas.

      The High-Pressure Refinery Unit is used to crack naphtha, converting 1500mB naphtha and 500mB of water to 2000mB of petroleum gas.'
- id: gip_boat_tank
  tasks:
  - type: item
    item: immersivepetroleum:upgrade_tank
  deps:
  - ip_speedboat
  roles:
  - engineer
  icon: immersivepetroleum:upgrade_tank
  ru:
    title: Улучшения катера
    subtitle: ''
    text: '**Зачем:** Больший бак — дальше без дозаправки. Есть ещё ледокол, рули, лопасти и усиленный корпус.

      Теперь вы можете путешествовать по морям на высокой скорости с помощью моторной лодки. Моторная лодка работает на Бензине, который может быть добавлен с помощью ведра или Канистры.

      Бензин расходуется при движении Моторной лодки вперед или назад. Удержание клавиши прыжка увеличит скорость лодки, за счет более высокого расхода топлива и увеличенного радиуса поворота.

      Как и другие устройства, Моторная лодка может быть модифицирована на Верстаке Инженера.'
  en:
    title: Speedboat Upgrades
    subtitle: ''
    text: '**Why:** Bigger tank; also icebreaker, rudders, paddles, reinforced hull.

      The Motorboat is a direct upgrade to the standard wooden boat. The engine in the motorboat runs off the same fuels as the Portable Generator, and gives the Motorboat a significant speed boost compared
      to paddling. Fuel can be added to the tank with any portable fluid canister, such as a bucket or Jerrycan.

      Fuel is consumed while the engine is active at a constant rate whether the Motorboat is moving backwards or forwards. Holding the jump key will increase the speed of the Motorboat, albeit at the cost
      of higher fuel consumption and increased turn radius.

      Like other devices, the Motorboat can be modified in the Engineer''s Workbench.'
