- id: gip_hydrotreater
  tasks:
  - type: item
    item: immersivepetroleum:hydrotreater
  deps:
  - ip_distill
  roles:
  - engineer
  icon: immersivepetroleum:hydrotreater
  ru:
    title: Гидроочистка
    subtitle: ''
    text: '**Зачем:** Очищает топливо от серы — меньше грязи в воздухе от твоих двигателей.

      Установка для извлечения серы нагревает и объединяет жидкости в своем основном реакционном барабане. Он является неотъемлемой частью вторичных технологических цепочек современной нефтепереработки,
      включая крекинг и десульфурацию.

      Из-за того, что установка для извлечения серы расположена между LV и MV, в более интенсивных рецептурах не требуется подключение LV. Питание подается через отверстие в верхней части нагревательной
      установки.

      Жидкости вводятся через отверстие на передней панели машины, вода - в верхнее отверстие рядом с панелью управления.'
  en:
    title: Hydrotreater
    subtitle: ''
    text: '**Why:** Removes sulfur from fuel: less air pollution.

      The High-Pressure Refinery Unit heats and combines fluids within its main reaction drum. It is integral to secondary process chains in modern petroleum refining, including cracking and desulfurization.

      Fluctuating power demands from the place the High-Pressure Refinery Unit between LV and MV, with more intensive recipes unable to use LV wiring. Power is input through the port on top of the heating
      unit.

      Fluids are input through the port on the front of the machine, water into the top port beside the control panel. Items are output from the side port beneath the water input, and the reaction product
      from the port atop the reaction drum.'
- id: gip_flarestack
  tasks:
  - type: item
    item: immersivepetroleum:flarestack
  deps:
  - ip_distill
  roles:
  - engineer
  icon: immersivepetroleum:flarestack
  ru:
    title: Газовый факел
    subtitle: ''
    text: '**Зачем:** Сжигает лишние газы, чтобы установка не вставала. Ставь подальше от жилья.

      Газовый факел уничтожать любую горючую жидкость, закачиваемую во входное отверстие на дне, сжигая ее в факельной струе.

      Поджигатель газовый факела горит постоянно, и если встать на него, это может привести к ожогам.

      Скорость сжигания пропорциональна силе подаваемого редстоун сигнала, максимальная скорость составляет 250 Мб/т. Это поведение можно изменить с помощью инженерной отвертки.'
  en:
    title: Flarestack
    subtitle: ''
    text: '**Why:** Burns off excess gas; keep it away from homes.

      The flarestack disposes of any combustible fluid pumped into the input port on the bottom by burning it in a flare jet.

      The pilot light of the flarestack is permanently on, and standing on top of it will cause burn damage.

      The flare rate is proportional to the applied redstone signal strength, with a maximum rate of 250mB/t. This behavior can be inverted with the Engineer''s Screwdriver.'
- id: gip_lubricator
  tasks:
  - type: item
    item: immersivepetroleum:auto_lubricator
  deps:
  - ip_distill
  roles:
  - engineer
  icon: immersivepetroleum:auto_lubricator
  ru:
    title: Автосмазчик
    subtitle: ''
    text: '**Зачем:** Смазка ускоряет многоблочные машины IE — качалку, дробилку, экскаватор.

      Никакие машины не совершенны, даже ваши собственные. Трение между движущимися частями мешает вашим машинам работать на полную мощность - вот где на помощь приходит смазка.

      Смазать можно Штанговые насосы, Экскаваторы, а также Дробители. — can be actively lubricated to increase their speed by 25%.

      Железных големов также можно смазывать, исцеляя их и временно увеличивая их скорость и силу.'
  en:
    title: Automatic Lubricator
    subtitle: ''
    text: '**Why:** Lubricant speeds up IE multiblocks.

      Lubricated bearings and gearboxes are present in almost every machine, but heavy-duty gearboxes and bearings benefit from their lubricant being regularly flushed and replaced.

      Machines with high mechanical loads — such as the Pumpjack, Excavator, and Crusher — can be actively lubricated to increase their speed by 25%.

      Iron Golems can be lubricated, temporarily increasing their speed and strength.'
