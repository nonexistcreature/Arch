  roles:
  - explorer
  - warrior
  shape: gear
  icon: relics:springy_boot
  ru:
    title: Реликвии
    subtitle: ''
    text: '**Зачем:** Реликвии лежат в сундуках данжей и построек. У каждой свои способности, которые растут с опытом использования: чем чаще пользуешься, тем сильнее. Наведи на реликвию и зажми Shift,
      чтобы увидеть уровни.'
  en:
    title: Relics
    subtitle: ''
    text: '**Why:** Relics are found in structure chests; their abilities level up as you use them. Hold Shift on one to see.'
- id: rel_springy_boot
  tasks:
  - type: item
    item: relics:springy_boot
  deps:
  - rel_intro
  roles:
  - explorer
  optional: true
  icon: relics:springy_boot
  ru:
    title: Пружинный ботинок
    subtitle: ''
    text: С этой реликвией падение редко заканчивается первым касанием земли. Поверхность отталкивает носителя обратно в воздух, и движение продолжается от отскока к отскоку, пока не иссякнет само.
  en:
    title: Springy Boot
    subtitle: ''
    text: With this relic, a fall rarely ends with the first touch of the ground. The surface pushes the wearer back into the air, and the movement continues from bounce to bounce until it runs out on its
      own.
- id: rel_roller_skate
  tasks:
  - type: item
    item: relics:roller_skate
  deps:
  - rel_intro
  roles:
  - explorer
  optional: true
  icon: relics:roller_skate
  ru:
    title: Роликовый конёк
    subtitle: ''
    text: С этой реликвией обычный бег быстро перестает быть обычным. Поверхность скользит под ногами, движение становится резче, а на крутом заносе из-под колес срываются искры, ранящие не хуже меча.
  en:
    title: Roller Skate
    subtitle: ''
    text: With this relic, ordinary running quickly stops being ordinary. The surface slides underfoot, movement becomes sharper, and on a hard drift, sparks fly from under the wheels, cutting no worse
      than a sword.
- id: rel_cut_glass_boot
  tasks:
  - type: item
    item: relics:cut_glass_boot
  deps:
  - rel_intro
  roles:
  - explorer
  optional: true
  icon: relics:cut_glass_boot
  ru:
    title: Хрустальный ботинок
    subtitle: ''
    text: Реликвия не всегда считает жидкость преградой. Она хранит ее в себе, а потом узнает под ногой и позволяет носителю пройти поверх.
  en:
    title: Cut Glass Boot
    subtitle: ''
    text: The relic does not always consider liquid an obstacle. It stores it within itself, then recognizes it underfoot and lets the wearer walk across the surface.
- id: rel_kinetic_belt
  tasks:
  - type: item
    item: relics:kinetic_belt
  deps:
  - rel_intro
  roles:
  - warrior
  optional: true
  icon: relics:kinetic_belt
  ru:
    title: Кинетический пояс
    subtitle: ''
    text: Реликвия не дает носителю летать по-настоящему, но позволяет дольше держаться в воздухе. Тело медленнее теряет высоту, лучше сохраняет инерцию и мягче принимает падение.
  en:
    title: Kinetic Belt
    subtitle: ''
    text: The relic does not let the wearer truly fly, but it lets them stay in the air longer. The body loses altitude more slowly, preserves momentum better, and lands more softly.
- id: rel_hunting_belt
  tasks:
  - type: item
    item: relics:hunting_belt
  deps:
  - rel_intro
  roles:
  - warrior
  - breeder
  optional: true
  icon: relics:hunting_belt
  ru:
    title: Охотничий пояс
    subtitle: ''
    text: Реликвия не усиливает самого носителя напрямую. Вместо этого она отдает свою злость прирученным зверям рядом с ним, и их удары становятся заметно тяжелее. Чем больше таких спутников вступает в
      бой, тем хуже приходится выбранной цели.
  en:
    title: Hunting Belt
    subtitle: ''
    text: The relic does not empower the wearer directly. Instead, it gives its anger to the tamed beasts beside them, and their strikes become noticeably heavier. The more such companions join the fight,
      the worse it gets for the chosen target.
- id: rel_reflective_necklace
  tasks:
  - type: item
    item: relics:reflective_necklace
  deps:
  - rel_intro
  roles:
  - warrior
  optional: true
  icon: relics:reflective_necklace
  ru:
    title: Отражающее ожерелье
    subtitle: ''
    text: 'Реликвия не мешает удару настичь тело - и в этом её неприятная честность. Она лишь забирает часть урона на себя и прячет его рядом, в бледных сферах, что держатся подле носителя. Стоит ему ударить
      в ответ, и сферы послушно срываются с места: одна за другой, пока не разобьются о врага, стену или что-нибудь ещё.'
  en:
    title: Reflective Necklace
    subtitle: ''
    text: 'The relic does not stop the blow from reaching the body - and that is its unpleasant honesty. It only takes part of the damage onto itself and hides it nearby, in pale spheres that linger beside
      the wearer. Once the wearer strikes back, the spheres obediently break away: one after another, until they shatter against an enemy, a wall, or something else.'
- id: rel_jellyfish_necklace
  tasks:
  - type: item
    item: relics:jellyfish_necklace
  deps:
  - rel_intro
  roles:
  - explorer
  optional: true
  icon: relics:jellyfish_necklace
  ru:
    title: Медузное ожерелье
    subtitle: ''
    text: 'Реликвия оживает только там, где есть вода. Под дождем или в жидкости она крепче держит носителя на ногах и затягивает его раны. Пока в ее щупальцах копятся электрические дуги, к ней лучше не
      прикасаться: стоит задеть, и одна из них срывается наружу, жаля всех на своем пути.'
  en:
    title: Jellyfish Necklace
    subtitle: ''
    text: 'The relic comes alive only where there is water. In the rain or in liquid, it keeps the wearer steadier on their feet and closes their wounds. While electric arcs build up in its tentacles, it
      is better not to touch it: brush against it, and one of them breaks free, stinging everyone in its path.'
- id: rel_leafy_mantle
  tasks:
  - type: item
    item: relics:leafy_mantle
  deps:
  - rel_intro
  roles:
  - gardener
  optional: true
  icon: relics:leafy_mantle
  ru:
    title: Лиственная мантия
    subtitle: ''
    text: 'С этой реликвией листва расступается перед носителем: среди ветвей он проходит свободно, без преград, и постепенно восстанавливает здоровье. А когда смерть подбирается слишком близко, лес принимает
      удары на себя.'
  en:
    title: Leafy Mantle
    subtitle: ''
    text: 'With this relic, foliage parts before the wearer: among the branches, they move freely, without obstacles, and gradually restore health. And when death comes too close, the forest takes the blows
      upon itself.'
- id: rel_midnight_mantle
  tasks:
  - type: item
    item: relics:midnight_mantle
  deps:
  - rel_intro
  roles:
  - warrior
  optional: true
  icon: relics:midnight_mantle
  ru:
    title: Полуночная мантия
    subtitle: ''
    text: 'Реликвия меняется вместе с Луной: в полнолуние носитель бьет быстрее и сильнее, а в новолуние становится крепче и легче залечивает раны. В темноте она прячет его от чужих глаз, пока свет снова
      не выдаст силуэт. А если носителя ранят, вокруг вспыхивают звезды, готовые сложиться в смертоносное созвездие.'
  en:
    title: Midnight Mantle
    subtitle: ''
    text: 'The relic changes with the Moon: under a full moon, the wearer strikes faster and harder, while under a new moon, they become tougher and recover from wounds more easily. In darkness, it hides
      them from prying eyes until light reveals their silhouette again. And if the wearer is wounded, stars flare around them, ready to form a deadly constellation.'
- id: rel_glitchy_mantle
  tasks:
  - type: item
    item: relics:glitchy_mantle
  deps:
  - rel_intro
  roles:
  - explorer
  optional: true
  icon: relics:glitchy_mantle
  ru:
    title: Глючная мантия
    subtitle: ''
    text: С этой реликвией носитель будто не до конца совпадает с тем, каким его видят. Удары порой проходят мимо, сбивая нападающего с толку. Следом остаются рваные копии, и столкнувшиеся с ними враги
      на миг теряют себя. Даже пустота под ногами сгущается, чтобы носитель успел сделать следующий шаг несмотря на отсутствие твердой опоры.
  en:
    title: Glitchy Mantle
    subtitle: ''
    text: With this relic, the wearer seems not to fully match what others see. Strikes sometimes pass by, confusing the attacker. Torn copies remain behind, and enemies that collide with them lose themselves
      for a moment. Even the void beneath the wearer's feet thickens, giving them time to take the next step despite the lack of solid ground.
- id: rel_ghostly_mantle
  tasks:
  - type: item
    item: relics:ghostly_mantle
  deps:
  - rel_intro
  roles:
  - explorer
  optional: true
  icon: relics:ghostly_mantle
  ru:
    title: Призрачная мантия
    subtitle: ''
    text: За носителем этой реликвии стелется могильный туман. Всякий, кто входит в него, начинает задыхаться, и каждый новый вдох дается тяжелее прежнего. Стоит врагу встретить взгляд владельца, как силы
      начинают покидать его. А когда смерть уже заносит руку, мантия на миг делает тело призрачным и позволяет уйти от злого рока.
  en:
    title: Ghostly Mantle
    subtitle: ''
    text: A grave mist trails behind the bearer of this relic. Anyone who enters it begins to suffocate, and each new breath becomes harder than the last. Once an enemy meets the bearer's gaze, their strength
      begins to leave them. And when death is already raising its hand, the mantle briefly makes the body spectral and lets its wearer escape a cruel fate.
- id: rel_chorus_staff
  tasks:
  - type: item
    item: relics:chorus_staff
  deps:
  - rel_intro
  roles:
  - explorer
  - mage
  optional: true
  icon: relics:chorus_staff
  ru:
    title: Хорусовый посох
    subtitle: ''
    text: 'Реликвия обращается с расстоянием грубо и просто: один взмах - и носитель исчезает с места, появляясь впереди быстрее собственного шага.'
  en:
    title: Chorus Staff
    subtitle: ''
    text: 'The relic handles distance crudely and simply: one swing - and the wearer vanishes from the spot, appearing ahead faster than their own step.'
- id: rel_piglin_mask
  tasks:
  - type: item
    item: relics:piglin_mask
  deps:
  - rel_intro
  roles:
  - explorer
  optional: true
  icon: relics:piglin_mask
  ru:
    title: Пиглинская маска
    subtitle: ''
    text: Реликвия повторяет черты пиглинов, порождений Незера, и даже чужака в ней не сразу принимают за врага. При торгах золото берут как всегда, но отдают больше, чем следовало бы. А если дело доходит
      до драки, встают на защиту знакомого лица.
  en:
    title: Piglin Mask
    subtitle: ''
    text: The relic echoes the features of piglins, spawn of the Nether, and even a stranger wearing it is not immediately taken for an enemy. In trades, they take gold as always, but give back more than
      they should. And if it comes to a fight, they rise to defend a familiar face.
- id: rel_seven_sins
  tasks:
  - type: item
    item: relics:ring_of_the_seven_deadly_sins
  deps:
  - rel_intro
  roles:
  - warrior
  optional: true
  icon: relics:ring_of_the_seven_deadly_sins
  ru:
    title: Кольцо семи смертных грехов
    subtitle: ''
    text: Реликвия отвечает на пороки носителя, но ни один из них не служит даром. Она охотно усиливает того, кто выше, злее, голоднее, богаче или терпеливее своей жертвы, но в каждом преимуществе оставляет
      трещину. Стоит обстоятельствам перемениться, и тот же порок начинает работать против владельца.
  en:
    title: Ring of the Seven Deadly Sins
    subtitle: ''
    text: The relic responds to the wearer's sins, but none of them serves as a gift. It eagerly empowers one who is higher, angrier, hungrier, richer, or more patient than their victim, but leaves a crack
      in every advantage. Once circumstances change, the same sin begins to work against the owner.
- id: rel_sacrifice
  tasks:
  - type: item
    item: relics:sphere_of_self_sacrifice
  deps:
  - rel_intro
  roles:
  - warrior
  optional: true
  icon: relics:sphere_of_self_sacrifice
  ru:
    title: Сфера самопожертвования
    subtitle: ''
    text: Реликвия так же охотно отнимает здоровье, как потом возвращает его. Носитель сам открывает ей доступ к собственной крови, и потерянное медленно возвращается с избытком.
  en:
    title: Sphere of Self-Sacrifice
    subtitle: ''
    text: The relic takes health away just as willingly as it later returns it. The wearer opens access to their own blood, and what was lost slowly returns with interest.
- id: rel_rider_flute
  tasks:
  - type: item
    item: relics:rider_flute
  deps:
  - rel_intro
  roles:
  - breeder
  optional: true
  icon: relics:rider_flute
  ru:
    title: Флейта всадника
    subtitle: ''
    text: Реликвия держит ездовых животных рядом, даже когда их не видно. Носитель может забрать прирученного скакуна внутрь, выпустить его обратно и снова позвать тем же способом. Так скакун остается под
      рукой в любой момент, даже если рядом нет ни стойла, ни поводьев.
  en:
    title: Rider Flute
    subtitle: ''
    text: The relic keeps mount animals nearby, even when they are out of sight. The wearer can take a tamed mount inside, release it back out, and call it again the same way. This keeps the mount close
      at hand at any moment, even when there is neither a stable nor reins nearby.
- id: rel_clot_of_time
  tasks:
  - type: item
    item: relics:clot_of_time
  deps:
  - rel_intro
  roles:
  - mage
  optional: true
  icon: relics:clot_of_time
  ru:
    title: Сгусток времени
    subtitle: ''
    text: Реликвия тянет носителя назад по недавно пройденному пути. Тело возвращается туда, где уже было, шаг за шагом отматывая последние мгновения.
  en:
    title: Clot of Time
    subtitle: ''
    text: The relic pulls the wearer back along the path they recently took. The body returns to where it has already been, rewinding the last moments step by step.
- id: rel_chef_hat
  tasks:
  - type: item
    item: relics:chef_hat
  deps:
  - rel_intro
  roles:
  - cook
  optional: true
  icon: relics:chef_hat
  ru:
    title: Поварской колпак
    subtitle: ''
    text: Реликвия дополняет добычу едой. После убитой цели рядом может остаться фрикаделька, простая и сытная, как кусок сырого мяса. Ее можно съесть сразу или приготовить, чтобы получить больше пользы.
  en:
    title: Chef's Hat
    subtitle: ''
    text: The relic adds food to the spoils. After a target is killed, a meatball may be left nearby, simple and filling, like a piece of raw meat. It can be eaten right away or cooked to get more benefit.
- id: rel_xp_disperser
  tasks:
  - type: item
    item: relics:experience_disperser
  deps:
  - rel_intro
  roles:
  - mage
  optional: true
  icon: relics:experience_disperser
  ru:
    title: Дисперсер опыта
    subtitle: ''
    text: Реликвия не любит, когда опыт оседает в одном месте. Стоит ей получить свою долю, как часть опыта расходится по остальным. Так он копится не в одной реликвии, а во всем снаряжении сразу.
  en:
    title: Experience Disperser
    subtitle: ''
    text: The relic does not like experience settling in one place. Once it receives its share, part of the experience spreads to the others. This way, it accumulates not in a single relic, but across all
      equipment at once.
- id: rel_retaliation
  tasks:
  - type: item
    item: relics:shield_of_retaliation
  deps:
  - rel_intro
  roles:
  - warrior
  optional: true
  icon: relics:shield_of_retaliation
  ru:
    title: Щит возмездия
    subtitle: ''
    text: Щит требует не силы, а мгновения, выбранного безошибочно. Вовремя встреченный удар гаснет перед носителем реликвии, оставляя врага ни с чем.
  en:
    title: Shield of Retaliation
    subtitle: ''
    text: The shield demands not strength, but a flawless choice of moment. A blow met at the right instant dies before the relic's bearer, leaving the enemy with nothing.
- id: rel_golden_tooth
  tasks:
  - type: item
    item: relics:golden_tooth
  deps:
  - rel_intro
  roles:
  - explorer
  optional: true
  icon: relics:golden_tooth
  ru:
    title: Золотой зуб
    subtitle: ''
    text: '**Зачем:** Золотой зуб — реликвия-талисман исследователя. Что она умеет, смотри в подсказке с Shift.'
  en:
    title: Golden Tooth
    subtitle: ''
    text: '**Why:** An explorer''s charm; hold Shift for its abilities.'
- id: rel_pet_bone
  tasks:
  - type: item
    item: relics:pet_bone
  deps:
  - rel_intro
  roles:
  - breeder
  optional: true
  icon: relics:pet_bone
  ru:
    title: Кость питомца
    subtitle: ''
    text: '**Зачем:** Косточка питомца — реликвия для тех, у кого есть прирученные звери. Способности — в подсказке с Shift.'
  en:
    title: Pet Bone
    subtitle: ''
    text: '**Why:** A relic for tamed pets; hold Shift for its abilities.'
- id: rel_xp_bottle
  tasks:
  - type: item
    item: relics:relic_experience_bottle
  deps:
  - rel_intro
  roles:
  - explorer
  icon: relics:relic_experience_bottle
  ru:
    title: Пузырёк опыта реликвии
    subtitle: ''
    text: '**Зачем:** Бутылочка опыта реликвии сразу прокачивает реликвию, без долгого использования.'
  en:
    title: Relic Experience Bottle
    subtitle: ''
    text: '**Why:** Relic experience bottles level a relic instantly.'
