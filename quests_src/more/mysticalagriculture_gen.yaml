  en:
    title: Soulstone
    subtitle: ''
    text: Soulstone is a special kind of stone that spawns in the Nether. It generates in large veins at all Y levels. Soulstone is a decorative block with many variants. It is also required to create Witherproof
      Blocks.
- id: mag_soulium_dagger
  tasks:
  - type: item
    item: mysticalagriculture:soulium_dagger
  deps:
  - g_soul
  roles:
  - warrior
  icon: mysticalagriculture:soulium_dagger
  ru:
    title: Соулиевый кинжал
    subtitle: ''
    text: '**Зачем:** Кинжал душ собирает души мобов в банки — из них делают семена мобов (зомби, скелет, эндермен...).

      Соулиевый кинжал используется для сбора душ с мобов. Эти души собираются с помощью банок для душ. Души собираются при убийстве мобов с помощью Соулиевого Кинжала Соулиевый кинжал можно улучшить с
      помощью Алтаря Наполнения, повысив скорость сбора душ.'
  en:
    title: Soulium Dagger
    subtitle: ''
    text: '**Why:** Collects mob souls for mob seeds.

      The Soulium Dagger is used to collect souls from mobs. These souls are collected using Soul Jars. Souls are collected by killing mobs with the Soulium Dagger The Soulium Dagger can be upgraded using
      an Infusion Altar, improving soul collection efficiency.'
