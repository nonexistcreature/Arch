  ru:
    title: Серпы и косы
    subtitle: ''
    text: 'Серпы используются для сбора/уничтожения больших участков растительного материала. Серпы более высокого уровня имеют большую площадь действия.

      Косы используются для сбора посевов на больших площадях, с помощью клика ПКМ. Любые полностью выросшие посевы в зоне действия будут собраны без выкорчевывания. Косы также являются эффективным оружием
      с увеличенной областью атаки. Косы более высокого уровня имеют большую площадь действия.'
  en:
    title: Sickles and Scythes
    subtitle: ''
    text: 'Sickles are used for harvesting/destroying large areas of plant material. Higher tier Sickles will have a greater area of effect.

      Scythes are used for harvesting large areas of crops by right clicking. Any fully grown crops within the area of effect will be harvested without being uprooted. Scythes are also an effective weapon
      with an increased attack AOE. Higher tier Scythes have a greater area of effect.'
