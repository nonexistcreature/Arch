  deps:
  - mag_elements
  roles:
  - gardener
  icon: mysticalagriculture:essence_vessel
  ru:
    title: Сосуд для эссенции
    subtitle: ''
    text: Сосуды для эссенции используются в структуре Алтаря Пробуждения для хранения эссенций природы, необходимых для создания предмета. Каждый сосуд может содержать до 40 единиц одной эссенции.
  en:
    title: Essence Vessel
    subtitle: ''
    text: Essence Vessels are used in the Awakening Altar structure to hold the elemental essences required to create items. Each vessel can hold up to 40 of a single elemental essence.
- id: mag_awakening_altar
  tasks:
  - type: item
    item: mysticalagriculture:awakening_altar
  - type: item
    item: mysticalagriculture:awakening_pedestal
    count: 4
  deps:
