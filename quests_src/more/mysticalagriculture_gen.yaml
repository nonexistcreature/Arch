      дополнительный дроп с мобов, который у вас может быть, но обычно не так эффективен, в сравнении с Соулиевым Кинжалом.
  en:
    title: Soul Extractor
    subtitle: ''
    text: Soul Extractors are used to convert mob drops into mob souls. They run off of solid fuels and have an internal power storage buffer. The Soul Extractor provides a use for extra mob drops you may
      have, but generally won't be as efficient as using a Soulium Dagger.
