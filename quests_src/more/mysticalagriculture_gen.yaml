  en:
    title: Experience Capsule
    subtitle: ''
    text: Experience Capsules are used to collect experience for creating Experience Seeds. To collect experience, simply have some Experience Capsules in your inventory and pick up Experience Orbs.
- id: mag_enchanter
  tasks:
