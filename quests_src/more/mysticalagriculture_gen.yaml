    subtitle: ''
    text: '**Why:** A spawner for mobs whose souls you collected.

      The Soulium Spawner is used to spawn both hostile and passive mobs using Essences. They run off of solid fuels and have an internal power storage buffer. The Spawner has an internal inventory that
      can hold up to 512 items. Each operation will take a certain amount of items and power to spawn a corresponding mob.'
