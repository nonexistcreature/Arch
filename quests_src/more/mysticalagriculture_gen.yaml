  en:
    title: Enchanter
    subtitle: ''
    text: '**Why:** Pick the enchantment you want.

      The Enchanter is a block that allows you to enchant your tools and armor using different crafting materials and Experience Essence. The Enchanter can apply enchantments to both Books and tools/armor,
      similarly to an Anvil.'
- id: mag_witherproof
