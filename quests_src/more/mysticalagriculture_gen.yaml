  icon: mysticalagriculture:coal_seeds
  ru:
    title: Ресурсные культуры
    subtitle: ''
    text: '**Зачем:** Семена ресурсов делаются на алтаре наполнения из эссенции и самого ресурса. Выращенный урожай превращается обратно в ресурс — уголь, железо, редстоун растут на грядке.

      Ресурсовые культуры - это сердце и душа того, что делает Mystical Agriculture столь великим. Однако есть некоторые особенности ресурсовых культур, которые следует отметить. Ресурсовые культуры нельзя
      выращивать с использованием костной муки. С ресурсовых культур нельзя получить второе семечко, если они не посажены на пашню из эссенции.'
  en:
    title: Resource Crops
    subtitle: ''
    text: '**Why:** Resource seeds grow coal, iron, redstone on a farm.

      Resource Crops are the heart and soul of what makes Mystical Agriculture so great. However, there are some special properties of resource crops that should be noted. Resource Crops can not be grown
      using Bonemeal. Resource Crops do not drop a second seed unless planted on Essence Farmland.'
- id: mag_watering_tiers
