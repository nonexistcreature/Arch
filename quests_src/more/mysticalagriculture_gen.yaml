  en:
    title: Four Elements
    subtitle: ''
    text: Air, Earth, Water and Fire essences can be used in Awakening Altar recipes using Essence Vessels. Elemental seeds can be planted on Tier 1 Essence Farmland for additional drops.
- id: mag_cognizant
