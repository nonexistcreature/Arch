    subtitle: ''
    text: '**Зачем:** Арена для визера, которую он не сломает. И укрытие от взрывов.

      Визеростойкие блоки не разрушаются Визером. Очень полезно для любителей сырных боссов. Они также невосприимчивы к урону от Эндер-дракона, однако он всё равно может пролететь сквозь них.'
  en:
    title: Witherproof Bricks
    subtitle: ''
    text: '**Why:** A wither arena it can''t break.

      Witherproof Blocks are unbreakable by the Wither. Very useful for those who like to cheese bosses. They are also immune to damage from the Ender Dragon, however it can still fly though them.'
