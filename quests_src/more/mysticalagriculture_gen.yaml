    subtitle: ''
    text: Пыль знаний обычно можно получить убив Эндер-дракона или визера с помощью Оружия из эссенции, зачарованного на Мистическое Просветление. Более высокие уровни Мистического Просветления увеличивают
      количество пыли, выпадающей при убийстве.
  en:
    title: Cognizant Dust
    subtitle: ''
    text: Cognizant Dust is usually obtained by killing a Wither or Ender Dragon using an Essence Weapon enchanted with Mystical Enlightenment. Higher levels of Mystical Enlightenment will increase the
      amount of dust dropped on kill.
- id: mag_vessel
  tasks:
