      эссенции. Как только Вы разложите рецепт, нужно будет просто активировать алтарь сигналом Редстоуна.
  en:
    title: Awakening Altar
    subtitle: ''
    text: The Awakening Altar is a crafting structure that is usually used to create Awakened Supremium. The structure consists of 1 Infusion Altar, 4 Infusion Pedestals and 4 Essence Vessels. Once you
      have a recipe put in place, you just need to activate the altar with a Redstone signal.
- id: mag_awakened
  tasks:
  - type: item
    item: mysticalagriculture:awakened_supremium_essence
    count: 4
  deps:
  - mag_awakening_altar
  roles:
  - gardener
  icon: mysticalagriculture:awakened_supremium_essence
  ru:
    title: Пробуждённая супремиевая эссенция
    subtitle: ''
    text: Пробуждённый супремий - это материал высокого уровня, используемый для создания улучшенных версий Супремиевых предметов. Пробуждённый супремий обычно создаётся путём наполнения Пыли Знаний с Супремиевым
      Блоком на Алтаре Пробуждения.
  en:
    title: Awakened Supremium Essence
    subtitle: ''
    text: Awakened Supremium is a high level crafting material used to create upgraded versions of many of your Supremium items. Awakened Supremium is usually created by infusing Cognizant Dust with a Supremium
      Block using an Awakening Altar.
