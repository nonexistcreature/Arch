  ru:
    title: Мистическое удобрение
    subtitle: ''
    text: Мистическое удобрение используется для мгновенного выращивания посевов или саженца. Также эффективно на Ресурсовых Культурах!
  en:
    title: Mystical Fertilizer
    subtitle: ''
    text: Mystical Fertilizer is used to instantly grow a crop or sapling. It's effective on Resource Crops too!
- id: mag_resource_crops
