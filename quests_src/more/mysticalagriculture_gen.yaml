    subtitle: ''
    text: Upgrading the regular Watering Can with essences and Mystical Fertilizer improves your farming experience a ton. Upgraded Watering Cans have improved range and growth acceleration speed. You can
      also toggle automatic watering by Shift + Right Clicking with the Watering Can while not targeting a block.
