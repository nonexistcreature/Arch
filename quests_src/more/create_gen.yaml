  - cook
  icon: create:blaze_cake
  ru:
    title: Торт всполоха
    subtitle: ''
    text: '**Зачем:** Торт всполоха перегревает горелку: нужно для перегретых рецептов в смесителе и котла высокого уровня.

      Вкусное угощение для вашего трудяги — горелки всполоха. Зажигает их всех!'
  en:
    title: Blaze Cake
    subtitle: ''
    text: '**Why:** Superheats a burner for superheated recipes.

      A Delicious treat for your hard-working Blaze Burners. Gets them all fired up!'
- id: cg_whistle
  tasks:
  - type: item
    item: create:steam_whistle
  deps:
  - c_steam
  roles:
  - engineer
  icon: create:steam_whistle
  ru:
    title: Паровой свисток
    subtitle: ''
    text: Паровые свистки можно разместить на жидкостном баке. Если бак получает достаточный нагрев... ...свисток будет играть определённую ноту при активации. Используйте дополнительный свисток на блоке,
      чтобы понизить высоту его звука. Переключайтесь между тремя разными октавами с помощью гаечного ключа. Инженерные очки помогут узнать текущую тональность звука.
  en:
    title: Steam Whistle
    subtitle: ''
    text: Steam Whistles can be placed on a Fluid Tank. If the tank receives sufficient heat... ...the Whistle will play a note when activated. Use a Whistle item on the block to lower its pitch. Cycle
      between three different octaves using a Wrench. Engineer's Goggles can help to find out the current pitch of a Whistle.
- id: cg_piston
  tasks:
  - type: item
    item: create:mechanical_piston
  - type: item
    item: create:piston_extension_pole
    count: 8
  deps:
  - c_contraption
  roles:
