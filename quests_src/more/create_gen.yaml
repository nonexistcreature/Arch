  deps:
  - c_goggles
  roles:
  - engineer
  icon: create:speedometer
  ru:
    title: Скорость и нагрузка
    subtitle: ''
    text: '**Зачем:** Если сеть встала — посмотри стрессометр. Каждая машина ест «нагрузку», генераторы её дают.

      Стрессометр отображает текущую допустимую нагрузку присоединённой кинетической сети. При ношении инженерных очков, игрок сможет получить более полную информацию от прибора. Компараторы могут испускать
      аналоговый редстоун-сигнал относительно измерений стрессометра.'
  en:
    title: Speed and Stress
    subtitle: ''
    text: '**Why:** If the network stops, check the stressometer.

      The Stressometer displays the current Stress Capacity of the attached kinetic network. When wearing Engineers'' Goggles, the player can get more detailed information from the Gauge. Comparators can
      emit analog Redstone Signals relative to the Stressometer''s measurements.'
- id: cg_gearshift_seq
  tasks:
  - type: item
    item: create:sequenced_gearshift
  - type: item
    item: create:rotation_speed_controller
  deps:
  - c_gearshift
  roles:
  - engineer
  icon: create:sequenced_gearshift
  ru:
    title: Последовательная коробка передач
    subtitle: ''
    text: 'Последовательная коробка передач передаёт вращение по списку заданных инструкций. Кликните ПКМ, чтобы открыть интерфейс для настройки. При получении редстоун-сигнал, она начнёт выполнять заданные
      инструкции по порядку. По завершению она будет дожидаться следующего сигнала и начнёт сначала. Можно использовать компаратор для считывания текущего прогресса выполнения инструкций.

      Регуляторы скорости вращения передают вращение от своих осей на большую шестерню выше. Используя панель параметров сбоку, можно настроить выдаваемую скорость.'
  en:
    title: Sequenced Gearshift
    subtitle: ''
    text: 'Seq. Gearshifts relay rotation by following a timed list of instructions. Right-click it to open the Configuration UI. Upon receiving a Redstone Signal, it will start running its configured sequence.
      Once finished, it waits for the next Redstone Signal and starts over. A redstone comparator can be used to read the current progress.

      Rot. Speed Controllers relay rotation from their axis to a Large Cogwheel above them. Using the value panel on its side, the conveyed speed can be configured.'
- id: cg_steam_boiler
  tasks:
  - type: item
    item: create:blaze_burner
    count: 4
  - type: item
    item: create:fluid_tank
    count: 9
  deps:
  - c_steam
  roles:
  - engineer
  icon: create:blaze_burner
  ru:
    title: Паровой котёл
    subtitle: ''
    text: '**Зачем:** Котёл 3×3 из баков с горелками всполохов даёт столько силы, сколько не дадут сто колёс. Корми горелки — или дай им торт всполоха.

      Паровые двигатели можно разместить на жидкостном баке. Кликните по двигателю валом в руке, чтобы создать выход силы вращения. С достаточным количеством воды, уровнем нагрева и объёмом котла... ...они
      будут генерировать силу вращения. Для минимальной установки требуется 4 жидкостных бака. С помощью горелки всполоха можно увеличить итоговую мощность. Более высокие уровни мощности требуют больше
      воды, размера котла и уровня нагрева. Текущий уровень мощности котла можно проверить с помощью инженерных очков.

      Горелки всполохов нагревают предметы, обрабатывающиеся в чаше. Для этого всполох должен быть накормлен воспламеняемыми предметами. С тортом всполоха горелка может достигать ещё большего уровня нагрева.
      Процесс кормления может быть автоматизирован при помощи автономного активатора или механической руки.'
  en:
    title: Steam Boiler
    subtitle: ''
    text: '**Why:** A 3x3 tank boiler with blaze burners powers a factory.

      Steam Engines can be placed on a Fluid Tank. Clicking the engine with a Shaft creates the Kinetic Output. With sufficient Heat, Water and Boiler space... ...they will generate Rotational Force. The
      minimal setup requires 4 Fluid Tanks. With the help of Blaze Burners, the power output can be increased. Higher power levels require more Water, Size and Heat. The boiler''s current power level can
      be inspected with Engineer''s Goggles.

      Blaze Burners can provide Heat to Items processed in a Basin. For this, the Blaze has to be fed with flammable items. With a Blaze Cake, the Burner can reach an even stronger level of heat. The feeding
      process can be automated using Deployers or Mechanical Arms.'
- id: cg_blaze_cake
  tasks:
