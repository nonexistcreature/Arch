  - builder
  icon: create:mechanical_piston
  ru:
    title: Механический поршень
    subtitle: ''
    text: Механические поршни могут двигать блоки перед ними. Скорость и направление движения зависят от исходного вращения. Липкие механические поршни могут тянуть назад присоединённые блоки.
  en:
    title: Mechanical Piston
    subtitle: ''
    text: Mechanical Pistons can move blocks in front of them. Speed and direction of movement depend on the Rotational Input. Sticky Mechanical Pistons can pull the attached blocks back.
- id: cg_gantry
  tasks:
  - type: item
