  - type: item
    item: create:cogwheel
    count: 4
  deps:
  - c_wheel
  roles:
  - engineer
  icon: create:large_cogwheel
  ru:
    title: Передаточное число
    subtitle: ''
    text: '**Зачем:** Большая шестерня к малой — вдвое быстрее, но и нагрузка вдвое выше. Скорость не бесплатна.

      Большие и маленькие шестерни могут соединяться по диагонали. Сила вращения, переходя с большой шестерни на маленькую — удвоит свою скорость. Переходя в обратном направлении — сократит скорость вдвое.'
  en:
    title: Gear Ratios
    subtitle: ''
    text: '**Why:** Large to small doubles speed but also stress.

      Large and Small cogs can be connected diagonally. Shifting from large to small cogs, the conveyed speed will be doubled. Shifting the opposite way, the conveyed speed will be halved.'
- id: cg_gearbox
  tasks:
  - type: item
    item: create:gearbox
  - type: item
    item: create:encased_chain_drive
    count: 2
  deps:
  - c_wheel
  roles:
  - engineer
  icon: create:gearbox
  ru:
    title: Угловая передача
    subtitle: ''
    text: 'Переходы между осями вращения могут быстро стать очень громоздкими. Угловая передача — это более компактный эквивалент этой установки. Валы по углам поворачиваются в зеркальных направлениях.
      Прямые соединения будут реверсированны.

      Цепные приводы передают силу вращения друг другу. Таким образом, все соединённые валы будут вращаться в одном направлении. Любая часть в ряду может быть повёрнута на 90 градусов.'
  en:
    title: Gearbox
    subtitle: ''
    text: 'Jumping between axes of rotation can get bulky quickly. A gearbox is the more compact equivalent of this setup. Shafts around corners rotate in mirrored directions. Straight connections will
      be reversed.

      Chain Drives relay rotation to each other in a row. All shafts connected like this will rotate in the same direction. Any part of the row can be rotated by 90 degrees.'
- id: cg_large_wheel
  tasks:
  - type: item
    item: create:large_water_wheel
  deps:
  - c_wheel
  roles:
  - engineer
  icon: create:large_water_wheel
  ru:
    title: Большое водяное колесо
    subtitle: ''
    text: Большие водяные колёса берут энергию от потоков воды. Колесо генерирует одинаковую силу вращения независимо от количества воды. Эти колёса, вырабатывают только половину от скорости обычного водяного
      колеса... ...но вырабатывают повышенную допустимую нагрузку для компонентов. Используйте доски на колесе для изменения внешнего вида.
  en:
    title: Large Water Wheel
    subtitle: ''
    text: Large Water Wheels draw force from adjacent Water Currents. Covering additional sides will not improve its kinetic output further. These rotate only at half the speed of regular water wheels...
      ...but provide a substantially higher stress capacity. Use wood planks on the wheel to change its appearance.
- id: cg_windmill
  tasks:
  - type: item
    item: create:windmill_bearing
  - type: item
