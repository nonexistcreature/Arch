    subtitle: ''
    text: Рукоятки могут быть использованы игроками для создания силы вращения вручную. Зажмите ПКМ для вращения против часовой стрелки. Зажмите ПКМ крадучись для вращения по часовой стрелке.
  en:
    title: Hand Crank
    subtitle: ''
    text: Hand Cranks can be used by players to apply rotational force manually. Hold Right-Click to rotate it Counter-Clockwise. Sneak and Hold Right-Click to rotate it Clockwise.
- id: cg_cogs
  tasks:
  - type: item
