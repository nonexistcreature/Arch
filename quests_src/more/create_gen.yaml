  deps:
  - c_wheel
  roles:
  - engineer
  icon: create:windmill_bearing
  ru:
    title: Ветряная мельница
    subtitle: ''
    text: '**Зачем:** Чем больше парусов, тем сильнее мельница. Работает везде, даже без реки.

      Любая конструкция может считаться мельницей, пока она содержит как минимум 8 парусоподобных блоков.'
  en:
    title: Windmill
    subtitle: ''
    text: '**Why:** More sails, more power — works anywhere.

      Any Structure can count as a valid Windmill, as long as it contains at least 8 sail-like Blocks.'
- id: cg_stress
  tasks:
  - type: item
