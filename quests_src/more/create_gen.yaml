  deps:
  - cg_piston
  roles:
  - engineer
  icon: create:gantry_carriage
  ru:
    title: Каретка линейного привода
    subtitle: ''
    text: Валы линейного привода составляют основу крановой штуковины. По ним будут двигаться присоединённые каретки. Крановые штуковины могут двигать присоединённые блоки.
  en:
    title: Gantry Carriage
    subtitle: ''
    text: Gantry Shafts form the basis of a gantry setup. Attached Carriages will move along them. Gantry setups can move attached Blocks.
- id: cg_rope_pulley
  tasks:
  - type: item
    item: create:rope_pulley
  deps:
  - cg_piston
  roles:
  - engineer
  - builder
  icon: create:rope_pulley
  ru:
    title: Верёвочная лебёдка
    subtitle: ''
    text: Верёвочные лебёдки могут перемещать блоки вертикально при подаче вращения. Направление и скорость движения зависят от исходного вращения.
  en:
    title: Rope Pulley
    subtitle: ''
    text: Rope Pulleys can move blocks vertically when given Rotational Force. Direction and Speed of movement depend on the Rotational Input.
- id: cg_chassis
  tasks:
  - type: item
    item: create:linear_chassis
    count: 4
  - type: item
    item: create:radial_chassis
    count: 2
  deps:
  - c_contraption
  roles:
  - engineer
  icon: create:linear_chassis
  ru:
    title: Шасси
    subtitle: ''
    text: 'Линейные шасси соединяются с такими же блоками шасси рядом с ними. Когда один блок перемещается как часть штуковины, другие двигаются с ним. Шасси других типов или размещённые в другом направлении
      не прикрепятся.

      Радиальные шасси соединяются с идентичными блоками шасси в ряд. Когда один блок перемещается штуковиной, остальные двигаются с ним. Боковые грани радиального шасси можно сделать липкими. Кликните
      ещё раз, чтобы сделать все остальные грани липкими. Кликните ПКМ крадучись пустой рукой, чтобы убрать слизь. Когда блок находится рядом с липкой гранью... ...он присоединит все достижимые блоки в
      пределах радиуса на этом слое. С помощью гаечного ключа можно указать точный радиус для этого шасси.'
  en:
    title: Chassis
    subtitle: ''
    text: 'Linear Chassis connect to identical Chassis blocks next to them. When one is moved by a Contraption, the others are dragged with it. Chassis of a different type or facing another direction will
      not attach.

      Radial Chassis connect to identical Chassis blocks in a row. When one is moved by a Contraption, the others are dragged with it. The side faces of a Radial Chassis can be made Sticky. Click again
      to make all other sides sticky. Sneak and Right-Click with an empty hand to remove the slime. Whenever a Block is next to a sticky face... ...it will attach all reachable blocks within a radius on
      that layer. Using a Wrench, a precise Radius can be specified for this chassis.'
- id: cg_sticker
  tasks:
  - type: item
    item: create:sticker
  deps:
  - c_contraption
  roles:
  - engineer
  icon: create:sticker
  ru:
    title: Блок-липучка
    subtitle: ''
    text: Блоки-липучки идеально подходят для редстоун-управляемого присоединения блоков. При получении редстоун-сигнала они переключают своё состояние. Если он движется как часть штуковины, то блок будет
      двигаться с ней. При повторном сигнале блок больше не будет прикреплён.
  en:
    title: Sticker
    subtitle: ''
    text: Stickers are ideal for Redstone-controlled block attachment. Upon receiving a signal, it will toggle its state. If it is now moved in a contraption, the block will move with it. Toggled once again,
      the block is no longer attached.
- id: cg_clockwork
  tasks:
  - type: item
    item: create:clockwork_bearing
  deps:
  - c_contraption
  - c_brass
  roles:
  - engineer
  - builder
  icon: create:clockwork_bearing
  ru:
    title: Часовой механизм
    subtitle: ''
    text: '**Зачем:** Механические часы: стрелки на башне ратуши показывают время мира.

      Часовые механизмы прикрепляются к блокам спереди. При получении силы вращения, конструкция повернётся в зависимости от текущего часа. 3:00. 4:00. Кликните ПКМ по механизму, чтобы остановить или вновь
      «оживить» конструкцию. Вторая конструкции может быть добавлена спереди часовой стрелки. Убедитесь, что две конструкции не соединены между собой суперклеем или чем-то похожим. Вторая конструкция станет
      вращаться как минутная стрелка.'
  en:
    title: Clockwork Bearing
    subtitle: ''
    text: '**Why:** Clock hands for your town hall tower.

      Clockwork Bearings attach to blocks in front of them. Upon receiving Rotational Force, the structure will be rotated according to the hour of the day. 3:00. 4:00. Right-Click the bearing to start
      or stop animating the structure. In front of the Hour Hand, a second structure can be added. Ensure that the two Structures are not glued to each other. The Second Structure will now rotate as the
      Minute Hand.'
- id: cg_cart_assembler
  tasks:
  - type: item
    item: create:cart_assembler
  deps:
  - c_contraption
  roles:
  - engineer
  icon: create:cart_assembler
  ru:
    title: Вагонеточный сборщик
    subtitle: ''
    text: Активированные вагонеточные сборщики устанавливают прикреплённые сверху конструкции на проезжающие через них вагонетки. Без редстоун-сигнала они разбирают штуковины обратно в блоки. Использование
      гаечного ключа на вагонетке позволит вам унести вагонеточную штуковину куда угодно.
  en:
    title: Cart Assembler
    subtitle: ''
    text: Powered Cart Assemblers mount attached structures to passing Minecarts. Without a redstone signal, it disassembles passing cart contraptions back into blocks. Using a Wrench on the Minecart will
      let you carry the Contraption elsewhere.
- id: cg_controls
  tasks:
  - type: item
    item: create:contraption_controls
  deps:
  - c_drill
  roles:
  - engineer
  icon: create:contraption_controls
  ru:
    title: Контроллер штуковины
    subtitle: ''
    text: Компоненты на движущихся штуковинах всегда активны по умолчанию. С помощью контроллера штуковины их можно быстро переключать. Они могут быть прикреплены к любому месту на штуковине. Когда она
      разобрана, вы можете указать нужный вам компонент с помощью фильтра. При активации редстоун-сигналом перед сборкой штуковины... ...выбранные компоненты отключатся с самого начала.
  en:
    title: Contraption Controls
    subtitle: ''
    text: Actors on moving contraptions are always active by default. Contraption Controls can be used to toggle them on the fly. They can be attached anywhere on the contraption. While disassembled, the
      filter can be changed to target specific types of actors. If it is redstone-activated during assembly... ...targeted actors will be turned off from the start.
- id: cg_plough
  tasks:
  - type: item
    item: create:mechanical_plough
  deps:
  - c_harvester
  roles:
  - gardener
  - engineer
  icon: create:mechanical_plough
  ru:
    title: Механический плуг
    subtitle: ''
    text: Когда плуги движутся как часть штуковины... ...они будут разрушать блоки без твёрдого хитбокса. К тому же, плуги могут создавать пашню... ...а также толкать сущностей, не причиняя им вреда.
  en:
    title: Mechanical Plough
    subtitle: ''
    text: Whenever Ploughs are moved as part of an animated Contraption... ...they will break blocks without a solid collision hitbox. Additionally, ploughs can create farmland. ...they can also launch
      entities without hurting them.
- id: cg_roller
  tasks:
  - type: item
    item: create:mechanical_roller
  deps:
  - c_contraption
  roles:
  - builder
  icon: create:mechanical_roller
  ru:
    title: Механический каток
    subtitle: ''
    text: '**Зачем:** Каток на поезде или подшипнике сам мостит дороги и засыпает ямы.

      Механические катки помогут убрать блоки с дорог или путей. В стандартном режиме, без выбранного материала, они просто будут разрушать блоки, как буры. В разобранном состоянии у катка можно настроить
      материал укладки. Материалы могут поставляться с помощью сундуков или бочек, прикреплённых к конструкции. Теперь он будет не только разрушать блоки на своём пути, но и заменять слой под собой. Учтите,
      что любой блок, разрушенный катком, имеет шанс не выпасть в виде предмета. Катки будут особенно полезны для поездов, но также могут работать на большинстве других видов движущихся штуковин.'
  en:
    title: Mechanical Roller
    subtitle: ''
    text: '**Why:** Paves roads and fills holes as it moves.

      Mechanical rollers help to clean up terrain around tracks or paths. In its default mode, without a material set, it will simply clear blocks like a Drill. While disassembled, a suitable paving material
      can be specified. Materials can be supplied via chests or barrels attached to the structure. In addition to breaking blocks, it will now replace the layer beneath them. Note that any block destroyed
      by a roller has a chance not to yield drops. Rollers are especially useful on Trains, but can also be used on most other types of moving contraptions.'
- id: cg_psi
  tasks:
  - type: item
    item: create:portable_storage_interface
    count: 2
  deps:
  - c_drill
  roles:
  - engineer
  icon: create:portable_storage_interface
  ru:
    title: Портативный складской интерфейс
    subtitle: ''
    text: '**Зачем:** Разгружает бур или поезд в сундуки на станции — без этого добыча копится внутри.

      Доступ к движущимся инвентарям может быть затруднён или вовсе недоступен. Этот компонент может взаимодействовать с хранилищем без необходимости останавливать штуковину. Разместите второй с промежутком
      в 1 или 2 блока между ними. Когда они пройдут мимо друг друга, произойдёт соединение. Пока они соединены, портативный интерфейс будет представлять собой ВСЕ инвентари на штуковине. Теперь можно положить
      предметы в... ...или вывести их из штуковины. Если на какое-то время обмен предметами прекратится, штуковина продолжит свой путь.'
  en:
    title: Portable Storage Interface
    subtitle: ''
    text: '**Why:** Unloads a moving drill or train at a station.

      Moving inventories can be tricky to access with automation. This component can interact with storage without the need to stop the contraption. Place a second one with a gap of 1 or 2 blocks inbetween.
      Whenever they pass by each other, they will engage in a connection. While engaged, the stationary interface will represent ALL inventories on the contraption. Items can now be inserted... ...or extracted
      from the contraption. After no items have been exchanged for a while, the contraption will continue on its way.'
- id: cg_arm
  tasks:
  - type: item
    item: create:mechanical_arm
  deps:
  - c_brass
  roles:
  - engineer
  icon: create:mechanical_arm
  ru:
    title: Механическая рука
    subtitle: ''
    text: 'Входы и выходы для механических рук должны быть назначены перед их размещением. Кликните ПКМ по компонентам, держа механическую руку, чтобы назначить их целями. Кликните ПКМ ещё раз, для переключения
      между входом (синий) и выходом (жёлтый). Кликните ЛКМ по компонентам, чтобы убрать выделение с них. После размещения, механические руки будут нацелены на ранее выбранные блоки. У них может быть неограниченное
      количество входов и выходов в зоне их досягаемости. Однако не каждый компонент может взаимодействовать с ними напрямую. Шлюзы и депо могут помочь заполнить этот пробел.

      Входы. Выходы. Когда рука выбирает между несколькими доступными выходами... ...она делает выбор исходя из выбранного режима распределения. Панель параметров позволит вам настроить его. Режим «По кругу»
      переключается между всеми доступными выходами по очереди. Если выход не может принять больше предметов, он будет пропущен. «Строго по кругу» никогда не пропускает выходы, а ждёт, пока они не освободятся.'
  en:
    title: Mechanical Arm
    subtitle: ''
    text: 'Mechanical Arms have to be assigned their in- and outputs before they are placed. Right-Click inventories while holding the Arm to assign them as Targets. Right-Click again to toggle between
      Input (Blue) and Output (Yellow). Left-Click components to remove their Selection. Once placed, the Mechanical Arm will target the blocks selected previously. They can have any amount of in- and outputs
      within their range. However, not every type of Inventory can be interacted with directly. Funnels and Depots can help to Bridge that gap.

      Input. Outputs. Whenever an Arm has to choose between multiple valid outputs... ...it will act according to its setting. The value panel will allow you to configure it. Round Robin mode simply cycles
      through all outputs that are available. If an output is unable to take more items, it will be skipped. Forced Round Robin mode will never skip outputs, and instead wait until they are free.'
- id: cg_ejector
  tasks:
  - type: item
    item: create:weighted_ejector
  deps:
  - c_depot
  roles:
  - engineer
  icon: create:weighted_ejector
  ru:
    title: Весовая катапульта
    subtitle: ''
    text: Кликните ПКМ крадучись, держа катапульту, чтобы выбрать место цели. Размещённая катапульта будет запускать объекты до отмеченного места. Подходящая цель может быть на любой дистанции и высоте
      в радиусе. Однако они не могут быть сбоку. Если не было выбрано подходящей цели, она будет целиться в блок перед ней. Предоставьте силу вращения, чтобы зарядить её. Попадание предметов на катапульту
      вызывает её срабатывание. Если целью был выбран инвентарь, то катапульта будет ждать, пока в нём не появится место.
  en:
    title: Weighted Ejector
    subtitle: ''
    text: Sneak and Right-Click holding an Ejector to select its target location. The placed ejector will now launch objects to the marked location. A valid target can be at any height or distance within
      range. They cannot however be off to a side. If no valid Target was selected, it will simply target the block directly in front. Supply Rotational Force in order to charge it up. Items placed on the
      ejector cause it to trigger. If Inventories are targeted, the ejector will wait until there is space.
- id: cg_brass_funnel
  tasks:
  - type: item
    item: create:brass_funnel
    count: 2
  - type: item
    item: create:brass_tunnel
    count: 2
  deps:
  - c_funnels_chutes
  - c_brass
  roles:
  - engineer
  icon: create:brass_funnel
  ru:
    title: Латунный шлюз
    subtitle: ''
    text: 'Андезитовый шлюз может извлекать только один предмет за раз. Латунный шлюз может извлекать их до целого стака. Панель параметров позволяет точно контролировать размер извлекаемого стака. Использование
      предмета на слоте фильтра, ограничит шлюз до передачи только совпадающих предметов.

      Режим распределения латунных туннелей можно настроить. «Разделение» попытается распределить стак поровну между доступными выходами. Если выход не может принять больше предметов, он будет пропущен.
      «Строгое разделение» никогда не пропустит выходы и вместо этого будет ждать, пока они не освободятся. «По кругу» сохраняет цельные стаки и отдаёт их выходам по очереди. Опять же, если выход не может
      принять больше предметов, он будет пропущен. «Строго по кругу» никогда не пропускает выходы. «Предпочтительно ближайший» приоритизирует ближайшие выходы от места подачи предметов.'
  en:
    title: Brass Funnel
    subtitle: ''
    text: 'Andesite Funnels can only ever extract single items. Brass Funnels can extract up to a full stack. The value panel allows for precise control over the extracted stack size. Using items on the
      filter slot will restrict the funnel to only transfer matching stacks.

      The distribution behaviour of Brass Tunnels can be configured. ''Split'' will attempt to distribute the stack evenly between available outputs. If an output is unable to take more items, it will be
      skipped. ''Forced Split'' will never skip outputs, and instead wait until they are free. ''Round Robin'' keeps stacks whole, and cycles through outputs iteratively. Once Again, if an output is unable
      to take more items, it will be skipped. ''Forced Round Robin'' never skips outputs. ''Prefer Nearest'' prioritizes the outputs closest to the items'' input location.'
- id: cg_smart_chute
  tasks:
  - type: item
    item: create:smart_chute
  deps:
  - c_funnels_chutes
  - c_brass
  roles:
  - engineer
  icon: create:smart_chute
  ru:
    title: Умный жёлоб
    subtitle: ''
    text: Умные желоба — вертикальные желоба с дополнительным контролем. Предметы в слоте фильтра указывают что нужно принимать и передавать. Используйте панель параметров для уточнения размера забираемого
      стака. Редстоун-сигнал выключает их.
  en:
    title: Smart Chute
    subtitle: ''
    text: Smart Chutes are vertical chutes with additional control. Items in the filter slot specify what to extract or transfer. Use the value panel to specify the extracted stack size. Redstone power
      will prevent Smart Chutes from acting.
- id: cg_filters
  tasks:
  - type: item
    item: create:filter
  - type: item
    item: create:attribute_filter
  deps:
  - c_funnels_chutes
  roles:
  - engineer
  icon: create:filter
  ru:
    title: Фильтры
    subtitle: ''
    text: '**Зачем:** Фильтр в воронке или туннеле пропускает только нужное. Фильтр атрибутов — по свойствам: «всё, что плавится», «вся еда».

      Сопоставляет элементы с набором предметов или других фильтров. Может использоваться в слотах фильтра компонентов Create.'
  en:
    title: Filters
    subtitle: ''
    text: '**Why:** Filters let only matching items through.

      Matches items against a collection of items or other filters. Can be used in Filter Slots of Create''s Components'
- id: cg_crafting_blueprint
  tasks:
  - type: item
    item: create:crafting_blueprint
  deps:
  - c_deployer
  roles:
  - engineer
  icon: create:crafting_blueprint
  ru:
    title: Чертёж рецепта
    subtitle: ''
    text: Разместив на стене, его можно использовать для определения расположения предметов для более простого ручного создания. Каждый слот показывает отдельный рецепт создания.
  en:
    title: Crafting Blueprint
    subtitle: ''
    text: Placed on a wall, it can be used to specify ingredient arrangements for easier manual crafting. Each slot represents a Recipe.
- id: cg_chain_conveyor
  tasks:
  - type: item
    item: create:chain_conveyor
    count: 2
  - type: item
    item: create:package_frogport
  deps:
  - c_logistics
  roles:
  - engineer
  icon: create:chain_conveyor
  ru:
    title: Цепной конвейер
    subtitle: ''
    text: 'Кликните ПКМ по двум конвейерам с цепями в руке, чтобы соединить их. Цепные конвейеры передают силу вращения между собой... ...и соединяются с валами выше или ниже их самих. Кликните ПКМ, держа
      гаечный ключ в руке, для поездки по цепи. На пересечении конвейеров повернитесь лицом в нужное направление, чтобы следовать по нему.

      Кликните ПКМ по цепному конвейеру и разместите квакопорт рядом. Назначьте ему адрес в его интерфейсе инвентаря. Если адрес помещённой коробки не совпадает с адресом квакопорта... Андрей. → Пётр. ...квакопорт
      разместит коробку на конвейере. Коробки будут бесконечно крутиться, если не смогут найти место назначения. Дополнительные квакопорты могут быть добавлены в любое место сети цепных конвейеров.'
  en:
    title: Chain Conveyor
    subtitle: ''
    text: 'Right-click two conveyors with chains to connect them. Chain conveyors relay rotational power between each other.. ..and connect to shafts above or below them. Right-click holding a wrench to
      start travelling on the chain. At a junction, face towards a chain to follow it.

      Right-click a Chain Conveyor and place the Frogport nearby. Assign it an address in the inventory UI. If the address of an inserted package does not match it.. Albert. → Peter. ..the Frogport will
      place the package on the conveyor. Packages spin in place if they have no valid destination. More Frogports can be added anywhere on the chain network.'
- id: cg_postbox
  tasks:
  - type: item
    item: create:white_postbox
  deps:
  - c_logistics
  roles:
  - engineer
  - mayor
  icon: create:white_postbox
  ru:
    title: Белый почтовый ящик
    subtitle: ''
    text: '**Зачем:** Почтовый ящик у станции: поезда сами забирают и доставляют посылки между городами.

      Кликните ПКМ по железнодорожной станции и разместите почтовый ящик рядом. Назначьте ему адрес в его интерфейсе инвентаря. Если адрес помещённой коробки не совпадает с его адресом... Склад. → Аванпост.
      ...то поезд остановится на станции и заберёт его как груз. И наоборот, отправления, совпадающие с адресом почтового ящика, будут доставлены по этому адресу. Отправления, доставленные поездом, могут
      быть извлечены из почтовых ящиков.'
  en:
    title: White Postbox
    subtitle: ''
    text: '**Why:** Trains carry packages between postboxes.

      Right-click a Train Station and place the Postbox nearby. Assign it an address in the inventory UI. If the address of an inserted package does not match it.. Warehouse. → Outpost. ..trains stopping
      at the station will collect it as cargo. Conversely, packages matching the address will be dropped off. Packages that arrived by train can be extracted from the Postbox.'
- id: cg_requester
  tasks:
  - type: item
    item: create:redstone_requester
  - type: item
    item: create:stock_link
  deps:
  - c_logistics
  roles:
  - engineer
  icon: create:redstone_requester
  ru:
    title: Редстоуновый запрашиватель
    subtitle: ''
    text: Кликните ПКМ по складскому контроллеру перед размещением, чтобы подключиться к его сети. Так же, как и складские тикеры, редстоуновые запросчики могут заказывать предметы из логистической сети.
      Кликните ПКМ по запросчику для открытия его интерфейса настройки. Предметы, установленные в заданном порядке, будут заказываться каждый раз при получении редстоун-импульса. Кроме того, запрашиватель
      может быть полностью настроен перед размещением. Кликните ПКМ по кладовщику с предметом в руке и настройте нужный порядок предметов.
  en:
    title: Redstone Requester
    subtitle: ''
    text: Right-click a Stock link before placement to connect to its network. Just like Stock tickers, Redstone requesters can order items from the logistics network. Right-click the requester to open
      its configuration UI. The order set in the UI will be requested on every redstone pulse. Alternatively, the requester can be fully configured before placement. Right-click a Stock keeper with it and
      set the desired order there.
- id: cg_factory_gauge
  tasks:
  - type: item
    item: create:factory_gauge
    count: 2
  deps:
  - c_logistics
  roles:
  - engineer
  icon: create:factory_gauge
  ru:
    title: Фабричный контроллер
    subtitle: ''
    text: '**Зачем:** Табло фабрики само заказывает ингредиенты со склада и держит запас готовой продукции. Сердце автоматизации Create 6.

      Всякий раз, когда контроллер установлен не на упаковщике... ...он будет отслеживать уровни запасов всех подключённых инвентарей. Кликните ПКМ по контроллеру, держа в руке предмет, который должен отслеживаться.
      Теперь он покажет общее количество предметов в сети. Контроллер может пополнять складские запасы, отправляя другие предметы на обработку. Сначала добавьте необходимые ингредиенты в виде новых фабричных
      контроллеров. Из интерфейса можно установить новые подключения. Кликните ПКМ гаечным ключом по контроллеру для визуального изменения расположения подключений.

      Кликните ПКМ по складскому передатчику перед размещением, чтобы подключиться к его сети. При установке на упаковщике фабричные контроллеры смогут управлять предметами внутри инвентаря. Кликните ПКМ
      по контроллеру, держа в руках предмет, который нужно отслеживать. Теперь он будет отображать общее количество предметов в инвентаре. Контроллер сможет пополнять этот инвентарь из логистической сети.
      Кликните ПКМ для открытия интерфейса настройки. Укажите адрес, который будет использоваться для запрашиваемых предметов.'
  en:
    title: Factory Gauge
    subtitle: ''
    text: '**Why:** Orders ingredients and keeps stock. The heart of Create 6 automation.

      Whenever gauges are not placed on a packager... They will instead monitor stock levels of all linked inventories. Right-click it with the item that should be monitored. It will now display the total
      amount present on the network. The gauge can replenish stock levels by sending other items to be processed. First, add the required ingredients as new factory gauges. From the target''s UI, new connections
      can be made. For aesthetics, input panels can be wrenched to change the pathing.

      Right-click a Stock link before placement to connect to its network. When placed on a packager, factory gauges can monitor items inside the inventory. Right-click it with the item that should be monitored.
      It will now display the amount present in the inventory. The gauge can refill this inventory from the logistics network. Right-click it again to open its configuration UI. Set an address that should
      be used for the requested items. The target amount to maintain can now be set by holding Right-click on the gauge.'
- id: cg_table_cloth
  tasks:
  - type: item
    item: create:white_table_cloth
    count: 2
  deps:
  - c_logistics
  roles:
  - mayor
  - cook
  icon: create:white_table_cloth
  ru:
    title: Белая скатерть
    subtitle: ''
    text: '**Зачем:** Прилавок магазина: игроки покупают товары со склада без твоего участия.

      Скатерти могут использоваться для демонстрации предметов. С помощью логистической системы их также можно использовать для продажи предметов. Начните с инвентаря магазина, упаковщика и складского передатчика.
      Привяжите складской контроллер к складскому передатчику и разместите его рядом с магазином. Наймите существо или горелку всполоха для роли продавца. Наполните инвентарь магазина предметами, которыми
      будете торговать. Чтобы создать новое торговое предложение, обратитесь к кладовщику, держа в руке скатерть. После размещения установите цену в слоте сбоку.'
  en:
    title: White Table Cloth
    subtitle: ''
    text: '**Why:** A shop counter that sells from your stock.

      Table cloths can be used to display items. With the help of a logistics system, they can also be used to sell items. Start with the shop''s inventory, a Packager and Stock link. Bind a Stock ticker
      to the link and place it in the shop. Employ a mob or blaze burner as the shop keeper. Fill the shop inventory with items to be sold. To create a new trade, interact with the shop keeper while holding
      a table cloth. Once placed, set a price in the item slot on the side.'
- id: cg_hose
  tasks:
  - type: item
    item: create:hose_pulley
  deps:
  - c_pipes
  roles:
  - engineer
  icon: create:hose_pulley
  ru:
    title: Шланговая катушка
    subtitle: ''
    text: 'Шланговые лебёдки можно использовать для заполнения или осушения больших объёмов жидкости. С помощью силы вращения можно регулировать длину шланга. Шланг сматывается, если обратить вращение.
      С противоположной стороны можно подключать трубы. Присоединённый трубопровод может либо подавать жидкость в шланг... ...либо вытягивать её, осушая водоём. Скорость заполнения и откачки шлангом полностью
      зависит от пропускной способности трубопровода.

      При развертывании шланговой катушки в достаточно большой океан... ...она будет откачивать или закачивать жидкость без влияния на источник. Трубопроводы могут неограниченно передавать жидкости из/в
      такие шланговые катушки.'
  en:
    title: Hose Pulley
    subtitle: ''
    text: 'Hose Pulleys can be used to fill or drain large bodies of Fluid. With the Kinetic Input, the height of the pulleys'' hose can be controlled. The Pulley retracts while the input rotation is inverted.
      On the opposite side, pipes can be connected. Attached pipe networks can either provide fluid to the hose... ...or pull from it, draining the pool instead. Fill and Drain speed of the pulley depends
      entirely on the fluid networks'' throughput.

      When deploying the Hose Pulley into a large enough ocean... It will provide/dispose fluids without affecting the source. Pipe networks can limitlessly take fluids from/to such pulleys.'
- id: cg_smart_pipe
  tasks:
  - type: item
    item: create:smart_fluid_pipe
  - type: item
    item: create:fluid_valve
  deps:
  - c_pipes
  roles:
  - engineer
  icon: create:smart_fluid_pipe
  ru:
    title: Умная жидкостная труба
    subtitle: ''
    text: Умные трубы могут помочь управлять потоками по типам жидкостей. Размещённые непосредственно у источника, они могут указывать на тип извлекаемой жидкости. Просто кликните ПКМ по слоту фильтра с
      любым предметом, содержащим нужную жидкость. И при размещении дальше по трубопроводу умные трубы будут пропускать только подходящие жидкости.
  en:
    title: Smart Fluid Pipe
    subtitle: ''
    text: Smart pipes can help control flows by fluid type. When placed directly at the source, they can specify the type of fluid to extract. Simply Right-Click their filter slot with any item containing
      the desired fluid. When placed further down a pipe network, smart pipes will only let matching fluids continue.
- id: cg_pfi
  tasks:
  - type: item
    item: create:portable_fluid_interface
    count: 2
  deps:
  - c_pipes
  - c_contraption
  roles:
  - engineer
  icon: create:portable_fluid_interface
  ru:
    title: Портативный жидкостный интерфейс
    subtitle: ''
    text: Жидкостные баки на движущихся штуковинах не могут быть доступны никаким трубам. Этот компонент может взаимодействовать с жидкостными баками без необходимости останавливать штуковину. Разместите
      второй с промежутком в 1 или 2 блока между ними. Когда они пройдут мимо друг друга, они соединятся. Пока они соединены, портативный интерфейс будет представлять собой ВСЕ баки на штуковине. Теперь
      можно закачать жидкости в... ...или выкачать их из штуковины. Если на какое-то время обмен содержимым прекратится — штуковина продолжит свой путь.
  en:
    title: Portable Fluid Interface
    subtitle: ''
    text: Fluid Tanks on moving contraptions cannot be accessed by any pipes. This component can interact with fluid tanks without the need to stop the contraption. Place a second one with a gap of 1 or
      2 blocks inbetween. Whenever they pass by each other, they will engage in a connection. While engaged, the stationary interface will represent ALL Tanks on the contraption. Fluid can now be inserted...
      ...or extracted from the contraption. After no contents have been exchanged for a while, the contraption will continue on its way.
- id: cg_link
  tasks:
  - type: item
    item: create:redstone_link
    count: 2
  deps:
  - c_brass
  roles:
  - engineer
  icon: create:redstone_link
  ru:
    title: Редстоуновый передатчик сигнала
    subtitle: ''
    text: '**Зачем:** Беспроводной редстоун: две ссылки с одинаковыми предметами-частотами связаны на расстоянии.

      Редстоуновые передатчики сигнала могут передавать редстоун-сигнал без редстоуновой пыли. Кликните ПКМ крадучись, чтобы переключить передатчик на режим приёмника. ПКМ гаечным ключом сделает то же самое.
      Приёмники улавливают редстоун-сигнал передатчиков в радиусе 256 блоков. Поместите предметы в два слота, чтобы указать частоту. Передатчики только одной частоты могут сообщаться.'
  en:
    title: Redstone Link
    subtitle: ''
    text: '**Why:** Wireless redstone.

      Redstone Links can transmit redstone signals wirelessly. Right-click while Sneaking to toggle receive mode. A simple Right-click with a Wrench can do the same. Receivers emit the redstone power of
      transmitters within 256 blocks. Placing items in the two slots can specify a Frequency. Only the links with matching Frequencies will communicate.'
- id: cg_redstone_kit
  tasks:
  - type: item
    item: create:pulse_repeater
  - type: item
    item: create:pulse_extender
  - type: item
    item: create:powered_latch
  - type: item
    item: create:analog_lever
  deps:
  - cg_link
  roles:
  - engineer
  icon: create:pulse_repeater
  ru:
    title: Набор логики Create
    subtitle: ''
    text: Редстоуновый удлинитель импульса может увеличить продолжительность редстоун-сигнала, проходящего через него. Он активируется после небольшой задержки... ...и выключается через настраиваемое время.
      Время разряда может быть настроено на панели параметров. Можно настроить задержку вплоть до 1 часа.
  en:
    title: Create Logic Kit
    subtitle: ''
    text: Pulse Extenders can lengthen a signal passing through. They activate after a short delay... ...and cool down for the configured duration. Using the value panel, the discharge time can be configured.
      The configured duration can range up to an hour.
- id: cg_observers
  tasks:
  - type: item
    item: create:content_observer
  - type: item
    item: create:stockpile_switch
  deps:
  - c_brass
  roles:
  - engineer
  icon: create:content_observer
  ru:
    title: Умные наблюдатели
    subtitle: ''
    text: 'Умные наблюдатели могут быть использованы для отслеживания разных событий. Он может обнаружить предметы или жидкости внутри обычных контейнеров. Слот фильтра может быть установлен только для
      обнаружения определённого содержимого. Он также активируется, когда сам блок соответствует фильтру. Кроме того, умные наблюдатели могут отслеживать конвейеры, желоба и трубы. ...и излучать редстоун-импульс,
      если предмет входит или выходит из шлюза.

      Пороговые переключатели отслеживают уровень заполнения контейнеров. Когда содержимое инвентаря превышает верхний порог... ...переключатель поменяет свой редстоун-сигнал. Сигнал остаётся неизменным
      до достижения нижнего порога. Выход редстоун-сигнала можно использовать для контроля подачи предметов, поддерживая буфер заполненным. Оба порога могут быть настроены в интерфейсе переключателя. Фильтр
      может помочь учитывать в общем количестве только определенное содержимое. Аналогичным образом можно отслеживать жидкостные хранилища...'
  en:
    title: Smart Observers
    subtitle: ''
    text: 'Smart Observers can be used to detect a variety of events. It can detect items or fluids inside of generic containers. The filter slot can be used to look for specific contents only. It also
      activates when the block itself matches the filter. Additionally, smart observers can monitor belts, chutes and pipes. ...and will emit a pulse, if an item enters or exits a funnel.

      Threshold Switches monitor the fill level of containers. When the inventory content exceeds the upper threshold... ...the switch will change its redstone output. The signal stays until the lower threshold
      is reached. The redstone output can now be used to control item supply, keeping the buffer filled. The specific thresholds can be changed in the UI. A filter can help to only count specific contents
      toward the total. Fluid buffers can be monitored in a similar fashion.'
- id: cg_nixie
  tasks:
  - type: item
    item: create:nixie_tube
    count: 4
  deps:
  - c_display
  roles:
  - builder
  icon: create:nixie_tube
  ru:
    title: Газоразрядный индикатор
    subtitle: ''
    text: При подаче редстоун-сигнала, газоразрядные индикаторы отобразят его силу. Используя планшет, на них можно отобразить пользовательский текст. Кликните ПКМ с красителем, чтобы изменить цвет их индикаторов.
  en:
    title: Nixie Tube
    subtitle: ''
    text: When powered by Redstone, Nixie Tubes will display the signal strength. Using written Clipboards, custom text can be displayed. Right-Click with Dye to change their display colour.
- id: cg_linked_controller
  tasks:
  - type: item
    item: create:linked_controller
  deps:
  - cg_link
  roles:
  - engineer
  icon: create:linked_controller
  ru:
    title: Контроллер частот
    subtitle: ''
    text: '**Зачем:** Пульт управления: кнопки шлют сигналы в redstone-ссылки — рули машинами издали.

      Предоставляет ручной контроль над частотами редстоуновых передатчиков, присвоенными его шести кнопкам.'
  en:
    title: Linked Controller
    subtitle: ''
    text: '**Why:** A remote that drives redstone links.

      Grants handheld control over Redstone Link frequencies assigned to its six buttons.'
- id: cg_zinc
  tasks:
  - type: item
    item: create:raw_zinc
    count: 8
  deps:
  - c_alloy
  roles:
  - engineer
  icon: create:raw_zinc
  ru:
    title: Цинк
    subtitle: ''
    text: '**Зачем:** Цинк + медь = латунь. Цинк в горах и глубоко под землёй, дробилка удвоит его.'
  en:
    title: Zinc
    subtitle: ''
    text: '**Why:** Zinc + copper = brass.'
- id: cg_rose_quartz
  tasks:
  - type: item
    item: create:polished_rose_quartz
    count: 4
  - type: item
    item: create:sand_paper
  deps:
  - c_brass
  roles:
  - engineer
  icon: create:polished_rose_quartz
  ru:
    title: Розовый кварц
    subtitle: ''
    text: '**Зачем:** Кварц + редстоун, отполированный наждачкой. Из него электронные лампы — для умных машин.'
  en:
    title: Rose Quartz
    subtitle: ''
    text: '**Why:** Polished rose quartz makes electron tubes.'
- id: cg_sturdy
  tasks:
  - type: item
    item: create:sturdy_sheet
    count: 2
  deps:
  - c_press
  roles:
  - engineer
  icon: create:sturdy_sheet
  ru:
    title: Прочный лист
    subtitle: ''
    text: '**Зачем:** Прочный лист из обсидиановой пыли — для ног поезда и пушек.

      Соберите прочный лист из обсидианового порошка и лавы'
  en:
    title: Sturdy Sheet
    subtitle: ''
    text: '**Why:** Obsidian sheets for train parts and cannons.

      Assemble a Sturdy Sheet by refining Powdered Obsidian'
- id: cg_haunting
  tasks:
  - type: checkmark
  deps:
  - c_fan
  roles:
  - engineer
  - mage
  icon: minecraft:soul_campfire
  ru:
    title: Призрачная обработка
    subtitle: ''
    text: '**Зачем:** Вентилятор через огонь душ «зачаровывает» предметы: светящиеся чернила, кварц, душевой песок и камни незера.

      Проходя через лаву, воздушный поток становится раскалённым. Предметы в его области действия будут переплавлены. Съедобные предметы, брошенные сюда, сгорят. Вместо этого, для них должна быть использована
      установка для копчения дымом от огня. Поток, проходящий через воду, создаёт промывающую установку. Несколько новых вариантов обработки проводятся с её помощью. Скорость вентилятора не влияет на скорость
      обработки, а только на дальность установки. Обработка вентиляторами может быть применена к предметам на конвейерах или депо.'
  en:
    title: Haunting
    subtitle: ''
    text: '**Why:** A fan through soul fire haunts items.

      When passing through lava, the Air Flow becomes Heated. Items caught in the area will be smelted. Food items thrown here would be incinerated. Instead, a setup for Smoking using Fire should be used
      for them. Air Flows passing through water create a Washing Setup. Some interesting new processing can be done with it. The Speed of the Fan does NOT affect the processing speed, only its range. Fan
      Processing can also be applied to Items on Depots and Belts.'
- id: cg_netherite_diving
  tasks:
  - type: item
    item: create:netherite_backtank
  - type: item
    item: create:netherite_diving_helmet
  - type: item
    item: create:netherite_diving_boots
  deps:
  - c_backtank
  roles:
  - engineer
  - warrior
  icon: create:netherite_backtank
  ru:
    title: Незеритовое снаряжение
    subtitle: ''
    text: '**Зачем:** Защищает от лавы: плавай в ней, пока в баллоне есть воздух. Для экспедиций в Незер.

      Носимый резервуар для транспортировки сжатого воздуха.'
  en:
    title: Netherite Diving Gear
    subtitle: ''
    text: '**Why:** Swim in lava while the tank has air.

      A Wearable Tank for carrying Pressurized Air.'
- id: cg_cardboard
  tasks:
  - type: item
    item: create:cardboard_helmet
  - type: item
    item: create:cardboard_chestplate
  - type: item
    item: create:cardboard_leggings
  - type: item
    item: create:cardboard_boots
  deps:
  - c_logistics
  roles:
  - warrior
  icon: create:cardboard_helmet
  ru:
    title: Картонные доспехи
    subtitle: ''
    text: '**Зачем:** Защиты почти нет, но в полном комплекте ты — коробка, и мобы тебя не замечают, если стоишь на месте.

      Произведите или получите ваш первый картон'
  en:
    title: Cardboard Armor
    subtitle: ''
    text: '**Why:** Barely protects, but mobs ignore a crouching box.

      Produce or obtain your first Cardboard'
- id: cg_symmetry
  tasks:
  - type: item
    item: create:wand_of_symmetry
  deps:
  - c_brass
  roles:
  - builder
  icon: create:wand_of_symmetry
  ru:
    title: Жезл симметрии
    subtitle: ''
    text: '**Зачем:** Строишь одну половину — вторая появляется зеркально. Для замков и храмов.

      Отражает размещение блоков, пока находится в любом слоте быстрого доступа.'
  en:
    title: Wand Of Symmetry
    subtitle: ''
    text: '**Why:** Build one half, the other mirrors.

      Mirrors Block placement while present in any Hotbar Slot.'
- id: cg_tree_fert
  tasks:
  - type: item
    item: create:tree_fertilizer
    count: 4
  deps:
  - c_mixer
  roles:
  - gardener
  icon: create:tree_fertilizer
  ru:
    title: Удобрение для деревьев
    subtitle: ''
    text: Мощная комбинация минералов, полезная для выращивания саженцев в ограниченных пространствах.
  en:
    title: Tree Fertilizer
    subtitle: ''
    text: A powerful combination of minerals useful for growing saplings in tight spaces.
- id: cg_builders_tea
  tasks:
  - type: item
    item: create:builders_tea
    count: 2
  deps:
  - c_mixer
  roles:
  - cook
  - builder
  icon: create:builders_tea
  ru:
    title: Чай строителя
    subtitle: ''
    text: Идеальный напиток для начала дня. Мотивирует и насыщает.
  en:
    title: Builder's Tea
    subtitle: ''
    text: The perfect drink to get the day started- Motivating and Saturating.
- id: cg_schematic_quill
  tasks:
  - type: item
    item: create:schematic_and_quill
  - type: item
    item: create:schematic_table
  deps:
  - c_schematic
  roles:
  - builder
  icon: create:schematic_and_quill
  ru:
    title: Схематика и перо
    subtitle: ''
    text: '**Зачем:** Пером сохраняешь своё здание в схему, пушка схем строит его заново где угодно. Поделись домом с соседом!

      Используется для сохранения конструкции в вашем мире в файл формата .nbt.'
  en:
    title: Schematic And Quill
    subtitle: ''
    text: '**Why:** Save a build to a schematic and rebuild it anywhere.

      Used for saving a Structure in your world to a .nbt file.'
- id: cg_copycat
  tasks:
  - type: item
    item: create:copycat_panel
    count: 8
  - type: item
    item: create:copycat_step
    count: 8
  deps:
  - c_brass
  roles:
  - builder
  icon: create:copycat_panel
  ru:
    title: Заполняемая панель
    subtitle: ''
    text: Преобразует любой твёрдый блок в декоративную панель. Также принимает прутья и люки.
  en:
    title: Copycat Panel
    subtitle: ''
    text: Converts any full block into a decorative panel. Also accepts Bars and Trapdoors.
- id: cg_seats
  tasks:
  - type: item
    item: create:white_seat
    count: 4
  deps:
  - c_contraption
  roles:
  - builder
  icon: create:white_seat
  ru:
    title: Белое сиденье
    subtitle: ''
    text: '**Зачем:** Сиденья ездят вместе с механизмами: посади друзей в свой поезд или карусель. Моб на сиденье никуда не уйдёт.'
  en:
    title: White Seat
    subtitle: ''
    text: '**Why:** Seats ride along on contraptions; a mob on a seat stays put.'
- id: cg_clock
  tasks:
  - type: item
    item: create:cuckoo_clock
  deps:
  - c_brass
  roles:
  - builder
  icon: create:cuckoo_clock
  ru:
    title: Часы с кукушкой
    subtitle: ''
    text: Прекрасная вещица для украшения пространства и отслеживания времени.
  en:
    title: Cuckoo Clock
    subtitle: ''
    text: Fine craftsmanship for decorating a space and keeping track of time.
- id: cg_bells
  tasks:
  - type: item
    item: create:peculiar_bell
  - type: item
    item: create:haunted_bell
  deps:
  - cg_haunting
  roles:
  - mage
  icon: create:peculiar_bell
  ru:
    title: Особенный колокол
    subtitle: ''
    text: '**Зачем:** Проклятый колокол подсвечивает места, где могут появиться мобы, — проверь, безопасна ли база.

      Декоративный латунный колокол. Размещение его над огнём душ может вызвать непредвиденные последствия...'
  en:
    title: Peculiar Bell
    subtitle: ''
    text: '**Why:** The haunted bell shows where mobs can spawn.

      A decorative Brass Bell. Placing it right above open Soul Fire may have side-effects...'
- id: cg_clipboard
  tasks:
  - type: item
    item: create:clipboard
  deps:
  - c_goggles
  roles:
  - engineer
  - mayor
  icon: create:clipboard
  ru:
    title: Планшет
    subtitle: ''
    text: Сохраняет ваши заметки и делает вас более профессиональным в глазах других людей.
  en:
    title: Clipboard
    subtitle: ''
    text: Keeps your notes and makes you look more professional.
- id: cg_train_assembly
  tasks:
  - type: checkmark
  deps:
  - c_train_track
  roles:
  - engineer
  icon: create:railway_casing
  ru:
    title: Сборка поезда
    subtitle: ''
    text: Выберите участок железнодорожного пути, затем разместите рядом станцию. Станции — это путевые точки вашей железнодорожной сети. Чтобы собрать новый поезд, откройте интерфейс станции и переключитесь
      в режим сборки. Во время сборки к этой станции не будут подъезжать поезда, следующие по расписанию. Создавайте новые вагонные тележки, используя железнодорожный корпус на путях. Кликните по путям
      ещё раз, чтобы переключаться между вариантами внешнего вида тележки. Приклейте блоки с помощью суперклея.
  en:
    title: Train Assembly
    subtitle: ''
    text: Select a Train Track then place the Station nearby. Stations are the Waypoints of your Track Network. To create a new Train, open the UI and switch to Assembly Mode. During Assembly no scheduled
      trains will approach this station. Create new bogeys by using Train Casing on Tracks. Click the track again to cycle between bogey designs. Attach blocks with the help of Super Glue. Assembled Trains
      will move faster if they can find fuel in assembled chests or barrels.
- id: cg_train_schedule
  tasks:
  - type: item
    item: create:schedule
  deps:
  - c_train_run
  roles:
  - engineer
  icon: create:schedule
  ru:
    title: Расписание поезда
    subtitle: ''
    text: 'Расписания позволяют другим машинистам управлять поездами. Кликните ПКМ с предметом в руке, чтобы открыть его интерфейс. После составления расписание передаётся машинисту поезда. Горелка всполоха
      или любое существо, сидящее перед контроллером поезда, является подходящими кандидатами в машинисты. С помощью поводка можно легче усадить потенциального машиниста на его место. Расписания можно отзывать
      от машинистов в любой момент времени.

      Расписания могут использоваться для предоставления машинистам пункта назначения. Компараторы будут получать редстоун-сигнал всегда, когда поезд прибыл на станцию. Имейте в виду, что к станции можно
      подойти только с указанного направления. Станции также можно использовать для автоматического назначения новых расписаний. Расписание, положенное на станцию, будет автоматически скопировано для машиниста
      поезда. В отличие от ручного назначения, машинисты не заберут его с собой.'
  en:
    title: Train Schedule
    subtitle: ''
    text: 'Schedules allow Trains to be controlled by other Drivers. Right-click with the item in hand to open its Interface. Once programmed, the Schedule can be handed off to a Train Driver. Any mob or
      blaze burner sitting in front of Train Controls is an eligible conductor. Creatures on a lead can be given their seat more conveniently. Schedules can be retrieved from Drivers at any moment.

      Schedules can be used to provide drivers with a destination. Comparators will receive a signal whenever a Train is present. Mind that a Station can only be approached from the indicated direction.
      Stations can also be used to assign new Schedules automatically. The Schedule placed on a station will automatically copy itself to present trains. As opposed to manual scheduling, drivers will not
      take the item with them.'
- id: cg_train_portal
  tasks:
  - type: dimension
    dimension: minecraft:the_nether
  deps:
  - c_train_run
  roles:
  - engineer
  icon: minecraft:obsidian
  ru:
    title: Поезд в Незер
    subtitle: ''
    text: Пути, размещённые напротив портала Незера... ...попытаются создать пути на другой стороне. Теперь поезда на данном направлении могут путешествовать по измерениям.
  en:
    title: Train to the Nether
    subtitle: ''
    text: Tracks placed up against a nether portal... ...will attempt to create a paired track on the other side. Trains on this track are now able to travel across dimensions.
- id: cg_track_observer
  tasks:
  - type: item
    item: create:track_observer
  deps:
  - c_signals
  roles:
  - engineer
  icon: create:track_observer
  ru:
    title: Железнодорожный наблюдатель
    subtitle: ''
    text: Выберите участок железнодорожного пути, затем разместите рядом наблюдатель. Наблюдатель обнаружит любые поезда, проходящие через метку на рельсах. Наблюдатели могут быть настроены для обнаружения
