    title: Реактор New Age
    subtitle: ''
    text: '**Зачем:** Реактор New Age греет тепловые трубы и двигатели. Следи за температурой: перегретый реактор плавится в кориум — опасную лаву, которая разрушает блоки.

      Ядерные реакторы - это самый лучший способ получать тепло. Первый компонент - стержени реактора, которые позволяют протекать ядерной реакции. Второй компонент - загрузчик реакторного топлива, который
      позволяет загружать стержни ядерным топливом. И последний компонент - реакторный теплоотвод, который собирает и распространяет тепло по тепловым трубам. Однако, работающий ядерный реактор излучает
      радиацию, смертельную для всего живого. Чтобы этого избежать, наденьте кожаную броню или полностью застройте реактор в реакторное стекло/корпус.'
  en:
    title: New Age Reactor
    subtitle: ''
    text: '**Why:** The reactor heats pipes and engines. Overheat it and it melts into corium.

      A nuclear reactor is a great way to generate large amounts of heat. The first component of a nuclear reactor are the Reactor Rods, which allow for nuclear reaction to take place. The second component
      is the Reactor Fuel Inserter which allows you to insert fuel into the reactor. The final component needed for a nuclear reactor is the Reactor Heat Vent which will collect heat from the reactor and
      distribute it to connected pipes. However as one uses the nuclear reactor they must be careful as the nuclear reactor emits deadly radiation.'
