  ru:
    title: Редстоун-магнит
    subtitle: ''
    text: '**Зачем:** New Age делает электричество из вращения: магниты вокруг вращающейся катушки. Начни с редстоун-магнита.

      При вращении катушек динамо-машины будет вырабатываться электричество, если они окружены магнитами. Сгенерированное электричество можно вывести из углеродного накопителя. По мере увеличения магнитной
      силы магнитов вокруг катушек динамо-машины, выработка электричества увеливается. Эффективность: 33.3%%. Эффективность: 50.0%%. Однако по мере повышения эффективности, создаваемая нагрузка катушками
      динамо-машины тоже увеличивается.'
  en:
    title: Redstone Magnet
    subtitle: ''
    text: '**Why:** New Age turns rotation into power with magnets around a coil.

      When rotated Generator Coils will generate electricity as long as they are surrounded by magnets. The electricity generated by coils can be collected using the Carbon Brushes block. As the magnetic
      force of magnets around the Generator Coils increases, the percentage of SU being turned into electricity increases. Efficiency: 33.3%%. Efficiency: 50.0%%. However, as the efficiency increases, the
      amount of SU used by the Generator Coils increases. Note: GENERATOR COILS DO NOT GENERATE ROTATION, ONLY ELECTRICITY.'
