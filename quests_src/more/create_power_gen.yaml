    subtitle: ''
    text: '**Зачем:** Чертёж реактора задаёт расположение стержней, рама и корпус — его оболочку. Сцена Ponder показывает сборку по шагам.'
  en:
    title: Reactor Blueprint and Casing
    subtitle: ''
    text: '**Why:** The blueprint sets rod layout; frame and casing build the shell.

      Floor 1. Floor 2. Floor 3. Floor 4. Controller: brain of the reactor, and the place where the blueprint goes to start it. Floor 5. Floor 6. Floor 7.'
- id: cpw_cn_core
  tasks:
  - type: item
    item: createnuclear:reactor_controller
  - type: item
    item: createnuclear:reactor_core
  - type: item
    item: createnuclear:reactor_cooler
  deps:
  - cpw_cn_frame
  roles:
  - engineer
  icon: createnuclear:reactor_controller
  ru:
    title: Ядро и контроллер
    subtitle: ''
    text: '**Зачем:** Контроллер управляет реактором, ядро — его центр, охладитель не даёт перегреться.'
  en:
    title: Core and Controller
    subtitle: ''
    text: '**Why:** Controller, core and cooler.

      Rod Input: Stores Heating or Cooling Rods. We need one Heating Rod (fuel) to heat the reactor, and one Cooling Rod for stability. Second Rod Input: This is why we need at least two inputs! One for
      the Heating Rod and one for the Cooling Rod to prevent explosions. Fluid Input: Fluid is also required to cool the reactor and ensure it does not explode. Alarm (Optional): Emits a sound when the
      reactor becomes unstable and risks exploding. Output: Necessary to extract generated energy. You can place multiple outputs to dispatch the total energy between them.'
