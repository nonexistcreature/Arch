    title: Химическая турель и распылитель
    subtitle: ''
    text: '**Зачем:** Химическая турель и ручной распылитель стреляют жидкостью: топливо — огонь, вода — тушит. Защита базы на дизеле.

      Химические турели являются автономными версиями химических распылителей. Им необходимо обеспечить жидкостью и питать их шестерней. Когда они получают питание от редстоуна, турель начнет распылять
      жидкость из своего бака. Кроме того, их можно улучшить с помощью зажигалки.'
  en:
    title: Chemical Turret and Sprayer
    subtitle: ''
    text: '**Why:** The chemical turret and sprayer shoot fluids.

      Chemical turrets are standalone versions of chemical sprayers. They need to be supplied with a fluid, and powered by a cogwheel. When powered with redstone, the turret will start spraying with the
      fluid in its tank. Additionally they can be upgraded with a lighter.'
