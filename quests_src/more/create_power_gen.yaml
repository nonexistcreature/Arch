  en:
    title: Basic Motor
    subtitle: ''
    text: '**Why:** Motors turn power back into rotation anywhere.

      Motors allow you to generate rotation using electricity. You can configure its speed using a wrench, however the amount of SU it outputs will stay the same. By powering it with redstone you can disable
      it. You can also invert that mechanic by right-clicking on it.'
