  en:
    title: Copper Wire
    subtitle: ''
    text: '**Why:** Wires and connectors carry power; overcharged wires carry more.

      Wires are used to transfer energy from one place to another. This block automatically pushes its energy to neighboring blocks. But what if it didn''t do that? Connector can pull energy from the block
      it stands on when ''Pull'' mode is enabled. Modes are switched with a wrench. Note that ''Pull'' mode is only for compatibility with other mods and can''t be used to extract energy from energizer/motor
