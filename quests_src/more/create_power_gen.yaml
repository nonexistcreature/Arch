    subtitle: ''
    text: '**Why:** Build the pumpjack over an oil chunk to pump crude oil.

      Every Pumpjack needs a Pumpjack Bearing. Next, build the body of the Pumpjack. Attach a Pumpjack Head ... ... and another Pumpjack Bearing. Don''t forget to glue the contraption! To power the Pumpjack,
