      Apply a Distillation Controller to a at least 3 block tall Fluid tank to create a Distillation Tower. Distillation Towers process fluids by distilling them. Pump in your ingredient at the bottom level.
      Once you give the distiller the required heat level... ... The distillation tower will start processing. Distillation Towers can have windows.'
