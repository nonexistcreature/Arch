  ru:
    title: Виноградная лоза
    subtitle: ''
    text: 'Исследуйте мир, и вы сможете найти эти виноградные лозы на деревьях.

      Подобно пчелиным гнёздам, использование костной муки на саженце дерева рядом с цветами также может создать виноградную лозу. Инструменты не требуются, ломайте их пустой рукой, чтобы получить виноградную
      лозу. Виноградные лозы можно сажать под цельными блоками и блоками листвы. Посаженные таким образом лозы будут расти вниз, но не будут плодоносить. Используйте ножницы, чтобы подрезать лозу и остановить
      её рост вниз.'
  en:
    title: Grapevine
    subtitle: ''
    text: 'Explore around, and you can find these Grapevines on trees in the wild.

      Similar to bee nests, using Bone Meal on a tree sapling near flowers also has a chance to generate Grapevines. No tools are needed, break them with an empty hand to obtain Grapevines. Grapevines can
      be planted under full blocks and leave blocks. Grapevines planted this way will grow downwards but will not bear grapes. Use Shears to prune a Grapevine, stopping its downward growth.'
- id: alc_vineyard
  tasks:
  - type: item
    item: kaleidoscope_tavern:grape
    count: 16
  deps:
  - alc_grapevine
  roles:
  - gardener
  icon: kaleidoscope_tavern:grape
  ru:
    title: Виноградник
    subtitle: ''
    text: Посадите виноградную лозу на шпалеру, расположенную на один блок выше почвы. Виноградная лоза будет в первую очередь расти на шпалеру над собой. Затем она будет распространяться горизонтально
      на соседние шпалеры. Когда под шпалерой с виноградной лозой окажется пустое пространство, она начнёт плодоносить. Когда виноград созреет, сбор урожая пустой рукой даст 1-2 виноградины. Сбор урожая
      ножницами даст 2-3 виноградины.
  en:
    title: Vineyard
    subtitle: ''
    text: Plant a Grapevine on a Trellis placed one block above the soil. The Grapevine will prioritize growing onto the Trellis above it. Then, it will spread horizontally to surrounding Trellises. When
      a Trellis with a Grapevine has an empty space below it, it will begin to bear grapes. Once the grapes are ripe, harvesting them with an empty hand yields 1-2 grapes. Harvesting with Shears yields
      2-3 grapes.
