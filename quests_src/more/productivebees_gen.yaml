  roles:
  - breeder
  icon: productivebees:inactive_dragon_egg
  ru:
    title: Улей из драконьего яйца
    subtitle: ''
    text: 'Специальный улей, сделанный для «Драконовских пчёл», позволяющий пользователю собирать (труднодоступные) «Драконовские соты». Разумеется, «Драконовские пчёлы» живут в «Обсидиановых гнёздах»,
      а также живут внутри выдолбленного «Яйца дракона».

      Ты можешь приготовить из остатков «Омлет».'
  en:
    title: Dragon Egg Hive
    subtitle: ''
    text: 'A special hive made for Draconic bees that allows the user to harvest the otherwise hard to obtain draconic combs. Naturally Draconic bees live in obsidian nests, but will also live inside a
      hollowed out dragon egg. They can also be convinced to live in an advanced hive but won''t produce any dragon breath there.

      You can make a fulfilling omelet with the leftovers'
