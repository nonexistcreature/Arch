  icon: minecraft:ender_pearl
  ru:
    title: Пчела Края
    subtitle: ''
    text: Обитает в «Гнездах из эндерняка» в «Островах энда». Эндер-пчелы предпочитают опылять местную флору — «Хорусы».
  en:
    title: Ender Bee
    subtitle: ''
    text: Found living in end stone nests on end islands. Ender Bees prefer pollinating the locally flora of chorus plants.
