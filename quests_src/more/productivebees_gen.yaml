    subtitle: ''
    text: Изредка обитает в «Обсидиановых колоннах» в «Главном острове энда». Драконовые пчёлы, летающие кругом по энду собирают нектар из воздуха. Если у них появится шанс, то они будут откусывать «Яйца
      дракона».
  en:
    title: Draconic Bee
    subtitle: ''
    text: Rarely found living in obsidian pillars on the main island in the end. Draconic Bees pollinate by flying around in the end collecting nectar from the air. The will also nibble on dragon eggs if
      they get the chance.
