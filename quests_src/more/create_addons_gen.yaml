- id: cag_trading_depot
  tasks:
  - type: item
    item: trading_floor:trading_depot
    count: 2
  deps:
  - c_depot
  roles:
  - mayor
  - engineer
  icon: trading_floor:trading_depot
  ru:
    title: Торговое депо
    subtitle: ''
    text: '**Зачем:** Депо у рабочего места жителя торгует за тебя: подаёшь товар конвейером — получаешь изумруды. Мэру и торговцу.

      Разместите торговое депо вплотную к рабочей станции крестьянина. Придя на работу, крестьянин возьмёт с него оставленный предмет в качестве оплаты и положит туда же результат сделки.'
  en:
    title: Trading Depot
    subtitle: ''
    text: '**Why:** Trades with villagers for you, fed by belts.

      To use a trading depot, attach it to a villager workstation. When a villager next works at their workstation they will trade with the attached depot.'
- id: cag_trading_double
  tasks:
  - type: checkmark
  deps:
  - cag_trading_depot
  roles:
  - mayor
  icon: trading_floor:trading_depot
  ru:
    title: Сделки на два товара
    subtitle: ''
    text: Два торговых депо могут быть использованы для совершения сделок, требующих подачи двух разных предметов в качестве оплаты. Во избежание совершения неверной сделки рекомендуется установить второй
      предмет в слот фильтра первого депо. Учтите, что депо объединятся в одной сделке только в случае совпадения фильтров или отсутствия такового у одного из депо. Результат сделки крестьянин положит на
      то депо, с которого взял первый предмет оплаты.
  en:
    title: Two-Item Trades
    subtitle: ''
    text: To complete trades with multiple inputs, 2 depots can be used together. While not required, you should set the filter on the first input to avoid other trades. Note that trading depots will only
      share contents if they have matching filters, or the other is empty. The output then goes to whichever depot has the first item of the trade.
- id: cag_pattern
  tasks:
  - type: item
    item: create_pattern_schematics:pattern_schematic_and_quill
  - type: item
    item: create_pattern_schematics:empty_pattern_schematic
  deps:
  - c_schematic
  roles:
  - builder
  icon: create_pattern_schematics:pattern_schematic_and_quill
  ru:
    title: Шаблонные схемы
    subtitle: ''
    text: '**Зачем:** Сохрани кусок стены, моста или дороги — и пушка схем повторит его на любую длину. Строители длинных мостов и стен оценят.

      Чтобы использовать шаблонные схематики, вы должны сначала сохранить схематику для использования в качестве источника. Затем используйте пустую шаблонную схематику на схематичном столе. Используйте
      схематичный стол для загрузки схематики. Затем, используя инструмент клонирования в настройках, структуру можно повторить. Клоны будут размещаться рядом друг с другом. Кроме того, схематику можно
      поворачивать. Затем это изменение будет применено ко всем клонам.'
  en:
    title: Pattern Schematics
    subtitle: ''
    text: '**Why:** Save a wall segment and repeat it at any length.

      To use pattern schematics, you must first save a schematic to use as a source. Then, use a schematic table with an empty pattern schematic. Use the table to upload the schematic. Then, using the clone
      tool in the options, the structure can be repeated. Clones get placed next to each other. Additionally, the schematic can be rotated. This rotation will then apply to all clones.'
- id: cag_pattern_train
  tasks:
  - type: checkmark
  deps:
  - cag_pattern
  - c_train_run
  roles:
  - builder
  - engineer
  icon: create_pattern_schematics:pattern_schematic
  ru:
    title: Дорога за поездом
    subtitle: ''
    text: Одиночная шаблонная схематика может быть применена к группе собранных автономных активаторов с помощью Shift + щелчка ПКМ. Здесь схематика была размещена как обычно. Но дальнейшее движение поезда
      приведет к повторению схематики.
  en:
    title: Road Behind a Train
    subtitle: ''
    text: A single pattern schematic can be applied to a group of assembled deployers with Shift + Right Click. Here, the schematic has been placed as usual. But moving the train further will result in
      the schematic repeating.
