  - aeg_bronze_key
  roles:
  - engineer
  icon: aether:enchanted_gravitite
  ru:
    title: Гравитит
    subtitle: ''
    text: '**Зачем:** Руда, которая взлетает, если её не поймать. Зачаруй на алтаре — материал для лучшей брони Эфира.

      После помещения гравититовой руды в зачарователь и её зачарования вы получите зачарованный гравитит. Из него можно сделать инструменты и броню. При подаче сигнала редстоуна зачарованные гравититовые
      блоки поднимаются в воздух, как и гравититовая руда.'
  en:
    title: Gravitite
    subtitle: ''
    text: '**Why:** Floating ore; enchant it on the altar.

      After putting Gravitite Ore into an Altar and enchanting it, you get Enchanted Gravitite. This can be made into Gravitite tools and armor. When powered with a redstone signal, Enchanted Gravitite
      blocks will float into the air, similarly to Gravitite Ore.'
- id: aeg_gravitite_set
  tasks:
  - type: item
    item: aether:gravitite_helmet
  - type: item
    item: aether:gravitite_chestplate
  - type: item
    item: aether:gravitite_leggings
  - type: item
    item: aether:gravitite_boots
  deps:
  - aeg_gravitite
  roles:
  - warrior
  icon: aether:gravitite_helmet
  ru:
    title: Гравититовая броня
    subtitle: ''
    text: '**Зачем:** Полный комплект даёт высокий прыжок и защиту от падения.

      Часть лучшего набора брони Эфира. Надев полный комплект, вы получите сверхвысокий прыжок!'
  en:
    title: Gravitite Armor
    subtitle: ''
    text: '**Why:** Full set: high jump and no fall damage.

      Part of the Aether''s best armor set. When the full set is worn, you get an extra high jump!'
- id: aeg_gravitite_tools
  tasks:
  - type: item
    item: aether:gravitite_pickaxe
  deps:
  - aeg_gravitite
  roles:
  - engineer
  icon: aether:gravitite_pickaxe
  ru:
    title: Гравититовая Кирка
    subtitle: ''
    text: '**Зачем:** Гравититовая кирка поднимает блоки в воздух ПКМ — перенеси что угодно.'
  en:
    title: Gravitite Pickaxe
    subtitle: ''
    text: '**Why:** Right-click to lift blocks.

      Part of the Aether''s best tool tier. When mining with this powerful tool, you can right-click on any stone block, and it will levitate into the air! You can mine any ore with this pickaxe.'
- id: aeg_silver
  tasks:
  - type: structure
    structure: aether:silver_dungeon
  deps:
  - adv_aether
  roles:
  - warrior
  icon: aether:silver_dungeon_key
  ru:
    title: Серебряный храм
    subtitle: ''
    text: '**Зачем:** Храм валькирий в облаках. Королева валькирий не нападёт, пока не перебьёшь её стражей и не заговоришь с ней.'
  en:
    title: Silver Dungeon
    subtitle: ''
    text: '**Why:** Clear the guards before facing the Valkyrie Queen.'
- id: aeg_valkyrie_set
  tasks:
  - type: item
    item: aether:valkyrie_helmet
  - type: item
    item: aether:valkyrie_chestplate
  - type: item
    item: aether:valkyrie_leggings
  - type: item
    item: aether:valkyrie_boots
  deps:
  - adv_valkyrie
  roles:
  - warrior
  icon: aether:valkyrie_helmet
  ru:
    title: Доспехи валькирии
    subtitle: ''
    text: '**Зачем:** Полный комплект с плащом валькирии дарит полёт.

      Доспехи, уникальные для Серебряного Подземелья. При полном ношении вам предоставляется временный полет. Очень полезно для попадания на высокие места.'
  en:
    title: Valkyrie Armor
    subtitle: ''
    text: '**Why:** With the Valkyrie cape: flight.

      An armor unique to the Silver Dungeon. When fully worn, you are granted temporary flight. Quite useful for getting to high places.'
- id: aeg_valkyrie_lance
  tasks:
  - type: item
    item: aether:valkyrie_lance
  deps:
  - adv_valkyrie
  roles:
  - warrior
  icon: aether:valkyrie_lance
  ru:
    title: Копье Валькирии
    subtitle: ''
    text: '**Зачем:** Копьё валькирии бьёт далеко и сильнее при ударе сверху вниз.

      Инструмент, уникальный для Бронзового Подземелья. Это дальнобойное оружие очень хорошо для победы над Зефирами и Королевами Валькирий.'
  en:
    title: Valkyrie Lance
    subtitle: ''
    text: '**Why:** Long reach, strong when falling.

      A tool unique to the Bronze Dungeon. This long-range weapon is very good for defeating Zephyrs and Valkyrie Queens.'
- id: aeg_neptune
  tasks:
  - type: item
    item: aether:neptune_helmet
  - type: item
    item: aether:neptune_chestplate
  - type: item
    item: aether:neptune_leggings
  - type: item
    item: aether:neptune_boots
  deps:
  - adv_valkyrie
  roles:
  - warrior
  icon: aether:neptune_helmet
  ru:
    title: Доспехи Нептуна
    subtitle: ''
    text: '**Зачем:** Быстрое плавание и дыхание под водой.

      Эта броня, найденная в бронзовых подземельях, позволяет быстрее плавать в воде. В сочетании с железным пузырем этот комплект брони очень полезен для победы над подводными храмами.'
  en:
    title: Neptune Armor
    subtitle: ''
    text: '**Why:** Fast swimming, water breathing.

      Found in Bronze Dungeons, this armor allows faster swimming in water. Combined with an Iron Bubble, this armor set is super useful for defeating underwater temples.'
- id: aeg_gold
  tasks:
  - type: structure
    structure: aether:gold_dungeon
  deps:
  - adv_valkyrie
  roles:
  - warrior
  icon: aether:gold_dungeon_key
  ru:
    title: Золотой остров
    subtitle: ''
    text: '**Зачем:** Остров Духа Солнца. Бой в огне: бей его отражёнными огненными шарами. Огнестойкость и ледяное кольцо обязательны.'
  en:
    title: Gold Dungeon
    subtitle: ''
    text: '**Why:** Reflect his fireballs. Bring fire resistance.'
- id: aeg_phoenix
  tasks:
  - type: item
    item: aether:phoenix_helmet
  - type: item
    item: aether:phoenix_chestplate
  - type: item
    item: aether:phoenix_leggings
  - type: item
    item: aether:phoenix_boots
  deps:
  - adv_sun_spirit
  roles:
  - warrior
  icon: aether:phoenix_helmet
  ru:
    title: Доспехи феникса
    subtitle: ''
    text: '**Зачем:** Иммунитет к огню и лаве. В воде остывают в обсидиановые.

      Получить фрагмент брони Феникса из Золотого подземелья'
  en:
    title: Phoenix Armor
    subtitle: ''
    text: '**Why:** Fire and lava immunity.

      Found in Gold Dungeons, when fully worn, this armor set grants fire resistance; you can swim in lava as well. Be careful when standing in water, as it will turn into obsidian armor.'
- id: aeg_phoenix_bow
  tasks:
  - type: item
    item: aether:phoenix_bow
  deps:
  - adv_sun_spirit
  roles:
  - warrior
  icon: aether:phoenix_bow
  ru:
    title: Лук Феникса
    subtitle: ''
    text: '**Зачем:** Лук феникса поджигает стрелы и тратит их меньше, пока он нагрет.

      Этот лук, найденный в подземельях, очень нагревается и может стрелять огненными стрелами! Он теплый на ощупь.'
  en:
    title: Phoenix Bow
    subtitle: ''
    text: '**Why:** Ignites arrows.

      Found as dungeon loot, this bow is very heated and can shoot flaming Arrows! It''s warm to the touch.'
- id: aeg_obsidian
  tasks:
  - type: item
    item: aether:obsidian_chestplate
  deps:
  - aeg_phoenix
  roles:
  - warrior
  icon: aether:obsidian_chestplate
  ru:
    title: Обсидиановый Нагрудник
    subtitle: ''
    text: '**Зачем:** Феникс, остывший в воде, становится обсидиановым — одна из самых прочных броней.

      Сверхмощная броня, более мощная, чем алмаз. Эту броню можно получить, только стоя в воде в доспехах Феникса и превращая ее в обсидиан.'
  en:
    title: Obsidian Chestplate
    subtitle: ''
    text: '**Why:** Cooled phoenix armor: very tough.

      A super powerful piece of armor, more powerful than diamond. This armor is only obtainable by standing in water while wearing Phoenix armor, converting it to obsidian.'
- id: aeg_weapons
  tasks:
  - type: item
    item: aether:flaming_sword
  - type: item
    item: aether:lightning_sword
  - type: item
    item: aether:holy_sword
  deps:
  - adv_valkyrie
  roles:
  - warrior
  icon: aether:flaming_sword
  ru:
    title: Легендарные мечи
    subtitle: ''
    text: '**Зачем:** Огненный поджигает, молниевый бьёт током, святой — против нежити.'
  en:
    title: Legendary Swords
    subtitle: ''
    text: '**Why:** Fire, lightning and holy swords.

      An ancient sword which burns its foes to a crisp. It almost hurts to touch! Using this on animals can make them drop cooked meat!'
- id: aeg_vampire
  tasks:
  - type: item
    item: aether:vampire_blade
  deps:
  - aeg_weapons
  roles:
  - warrior
  icon: aether:vampire_blade
  ru:
    title: Меч Вампира
    subtitle: ''
    text: '**Зачем:** Вампирский клинок лечит тебя частью нанесённого урона.'
  en:
    title: Vampire Blade
    subtitle: ''
    text: '**Why:** Heals you with a part of damage dealt.

      A mysterious sword that has life-stealing abilities. Holding it just makes you feel creepily empty...'
- id: aeg_hammer
  tasks:
  - type: item
    item: aether:hammer_of_kingbdogz
  deps:
  - aeg_bronze
  roles:
  - warrior
  icon: aether:hammer_of_kingbdogz
  ru:
    title: Молот Кингбдогза
    subtitle: ''
    text: '**Зачем:** Молот отбрасывает врагов далеко — выбивай мобов с острова, а не себя.

      Могучий молот, стреляющий тяжелыми снарядами по мобам. Говорят, что Кингбдогз действительно держал этот молот.'
  en:
    title: Hammer of Kingbdogz
    subtitle: ''
    text: '**Why:** Knocks enemies far away.

      A mighty hammer that shoots heavy projectiles at mobs. It''s said that Kingbdogz actually held this hammer.'
- id: aeg_staves
  tasks:
  - type: item
    item: aether:cloud_staff
  - type: item
    item: aether:nature_staff
  deps:
  - adv_valkyrie
  roles:
  - mage
  icon: aether:cloud_staff
  ru:
    title: Посохи Эфира
    subtitle: ''
    text: '**Зачем:** Посох облаков призывает защитные облака, посох природы — управляет моа и зверями.

      Посох с легким и пушистым верхом. Он призывает маленьких облачных миньонов, которые на короткое время сражаются рядом с хозяином, стреляя большими Облачными кристаллами.'
  en:
    title: Aether Staves
    subtitle: ''
    text: '**Why:** Cloud and nature staves.

      A staff with a light and fluffy top. It summons small Cloud Minions to fight next to the user for a short period of time by shooting large Cloud Crystals.'
- id: aeg_capes
  tasks:
  - type: item
    item: aether:agility_cape
  - type: item
    item: aether:invisibility_cloak
  deps:
  - adv_valkyrie
  roles:
  - warrior
  icon: aether:agility_cape
  ru:
    title: Плащи
    subtitle: ''
    text: '**Зачем:** Плащ ловкости — шаг на блок, плащ невидимости — мобы тебя не видят.'
  en:
    title: Capes
    subtitle: ''
    text: '**Why:** Step-up and invisibility capes.

      An uncommon cape found in Bronze and Silver Dungeons. It makes the wearer''s legs stronger, therefore they can walk up blocks instantly.'
- id: aeg_shield
  tasks:
  - type: item
    item: aether:shield_of_repulsion
  deps:
  - adv_sun_spirit
  roles:
  - warrior
  icon: aether:shield_of_repulsion
  ru:
    title: Щит Отражения
    subtitle: ''
    text: '**Зачем:** Щит отражает снаряды, пока ты не двигаешься.

      Щит, защищающий пользователя от большинства снарядов. Он отразит снаряд обратно в отправителя и нанесет ему урон. Каждый раз, когда снаряд отражается, щит повреждается.'
  en:
    title: Shield of Repulsion
    subtitle: ''
    text: '**Why:** Reflects projectiles while you stand still.

      A shield that protects the user from most projectiles. It will reflect the projectile back at the thrower and cause damage to them. Each time a projectile is reflected, the shield will be damaged.'
- id: aeg_regeneration
  tasks:
  - type: item
    item: aether:regeneration_stone
  deps:
  - adv_sun_spirit
  roles:
  - warrior
  icon: aether:regeneration_stone
  ru:
    title: Камень Регенерации
    subtitle: ''
    text: '**Зачем:** Камень регенерации в слоте аксессуаров медленно лечит.

      Сокровище, найденное в Серебряных Подземельях. Этот камень заставляет владельца чувствовать себя здоровым и залечивает раны. Эффекты могут суммироваться с другими камнями регенерации.'
  en:
    title: Regeneration Stone
    subtitle: ''
    text: '**Why:** Slow healing as an accessory.

      A treasure found in Silver Dungeons. This stone makes the wearer feel healthy and heals their wounds. The effects can stack with other Regeneration Stones.'
- id: aeg_life_shard
  tasks:
  - type: item
    item: aether:life_shard
  deps:
  - adv_sun_spirit
  roles:
  - warrior
  icon: aether:life_shard
  ru:
    title: Осколок Жизни
    subtitle: ''
    text: '**Зачем:** Осколок жизни навсегда добавляет сердце здоровья.

      Очень редкий предмет, который можно найти в Золотых Подземельях. Используя это, вы получите дополнительное постоянное сердце! Ощущения от его использования очень странные и их трудно описать.'
  en:
    title: Life Shard
    subtitle: ''
    text: '**Why:** Adds a permanent heart.

      A very rare item found in Gold Dungeons. Using this will give you an extra permanent heart! The feeling of using it is very strange and hard to describe.'
- id: aeg_medal
  tasks:
  - type: item
    item: aether:victory_medal
    count: 5
  deps:
  - adv_valkyrie
  roles:
  - warrior
  icon: aether:victory_medal
  ru:
    title: Медаль Победы
    subtitle: ''
    text: '**Зачем:** Медали за побитых валькирий. Десять медалей — право сразиться с королевой.

      Доказательство победы над меньшей Валькирией. Используйте их, чтобы доказать Королеве Валькирий, что вы достойны сразиться с ней!'
  en:
    title: Victory Medal
    subtitle: ''
    text: '**Why:** Ten medals let you challenge the Queen.

      Proof of defeating a lesser Valkyrie. Use these to prove to the Valkyrie Queen you are worthy enough to fight her!'
- id: aeg_master
  tasks:
  - type: checkmark
  deps:
  - adv_sun_spirit
  - aeg_phoenix
  - aeg_gravitite_set
  - aeg_valkyrie_set
  - aeg_life_shard
  - aeg_staves
  roles:
  - warrior
  shape: hexagon
  rewards:
  - type: xp_levels
    count: 15
  icon: aether:phoenix_chestplate
  ru:
    title: Хранитель небес
    subtitle: ''
    text: Три подземелья пройдены, Дух Солнца повержен, а над островами снова светит спокойное солнце.
  en:
    title: Keeper of the Skies
    subtitle: ''
    text: Three dungeons cleared, the Sun Spirit defeated.
