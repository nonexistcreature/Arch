    text: 'Построй Башню внутри твоих новых Казарм. Уровни этих Башен привязаны к уровню Казармы, и увеличивают максимальное количество Стражников в них с повышением своего уровня!

      Башни Казарм - нервы вашей оборонной мощи. В каждой такой Башне работает по 1 Стражу за каждый уровень, максимум их может быть 5. Кроме того, Стражники также будут жить в Башне, освобождая кровати
