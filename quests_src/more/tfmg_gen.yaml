      откачивать для продолжения работы. После этого Коксовый уголь выпадет из отверстия.'
  en:
    title: Coke Oven Battery
    subtitle: ''
    text: '**Why:** Ovens placed together merge into a battery.

      The Coke Oven is a machine that produces coal coke from coal. It is very slow so it is beneficial to have long arrays of them. Coal can be inserted from anywhere. Carbon Dioxide is extracted at the
      top, Creosote can be extracted anywhere else. After some time, coal coke will fall out of the machine.'
