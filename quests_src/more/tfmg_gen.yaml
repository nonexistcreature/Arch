    text: '**Зачем:** Ставь печи рядом — они объединяются в батарею и делают кокс и креозот быстрее.

      Коксовая печь строится путем размещения блоков Коксовой печи, как показано на экране, включая направление блоков, и клика Гаечным ключём по узкой стороне. Процесс коксования достаточно медленный,
