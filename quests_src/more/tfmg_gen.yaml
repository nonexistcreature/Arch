    subtitle: ''
    text: "**Why:** Generators turn rotation into current; voltage and resistance are simulated.\nA generator creates 2 values, Voltage and Power. Generator:\n   Voltage(U) = 200V\n   Max Power = 8kW\n\
      Light Bulb:\n   Voltage(U) = 200V\n   Current(I) = 2A\n   Power(P) = 100W\n   Resistance(R) = 100Ω. When load is applied on a generator, it takes its voltage. Every an electric device has electrical\
      \ resistance, light bulbs are 100 Ohm(Ω). Current with size of Voltage divided by Resistance will start flowing in the light bulb."
