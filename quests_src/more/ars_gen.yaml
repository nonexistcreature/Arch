    subtitle: ''
    text: '**Зачем:** Щит, который восстанавливает ману и ускоряет её регенерацию, пока ты блокируешь.

      При блокировании урона пользователь получит кратковременное Восстановление Маны и Заклинательный Урон. Кроме того, этот щит со временем восстанавливается, используя ману владельца.'
  en:
    title: Enchanter's Shield
    subtitle: ''
    text: '**Why:** A shield that restores mana and speeds its regeneration while you block.

      Upon blocking damage, the user will gain a short duration of Mana Regeneration and Spell Damage. Additionally, this shield will repair over time using the wearers mana.'
- id: arsg_mirror
  tasks:
  - type: item
    item: ars_nouveau:enchanters_mirror
  deps:
  - arsg_spellcraft
  roles:
  - mage
  icon: ars_nouveau:enchanters_mirror
  ru:
    title: Зачарованное зеркало
    subtitle: ''
    text: '**Зачем:** Заклинание на себя без книги в руке: лечение или полёт одной кнопкой.

      Использует собственные заклинания для пользователя. Заклинания, сотворённые с помощью этого зеркала, имеют скидку и дают дополнительную длительность бонуса для всех глифов. Примените на Писарском
      Столе заклинание, НЕ содержащее формы, такой как Исцеление -> Исцеление.'
  en:
    title: Enchanter's Mirror
    subtitle: ''
    text: '**Why:** A self-cast spell without the book in hand: healing or flight on one button.

      Applies a self spell to the user. Spells cast with this mirror are discounted and gain additional bonus duration to all glyphs. Apply a spell at the Scribe''s table that DOES NOT contain a form such
      as Heal -> Amplify.'
- id: arsg_bow
  tasks:
  - type: item
    item: ars_nouveau:spell_bow
  deps:
  - arsg_sword
  roles:
  - warrior
  - mage
  icon: ars_nouveau:spell_bow
  ru:
