    subtitle: ''
    text: '**Зачем:** Стрелы становятся снарядами-заклинаниями. Работает с дополненными стрелами: Пронзание, Расщепление, Усиление.

      Лук, на который можно нанести заклинание с помощью Таблицы писцов. Если у игрока достаточно маны, стрелы станут стрелами заклинаний и будут применять заклинание к своей цели. Если в инвентаре нет
      стрел, будет использована стрела заклинания, наносящая 0 повреждений. Если маны недостаточно, будут выпущены обычные стрелы. Луки чародея могут использовать специальные стрелы усиления для усиления
      начертанного заклинания.'
  en:
    title: Enchanter's Bow
    subtitle: ''
    text: '**Why:** Arrows become spell projectiles. Works with augmented arrows: Pierce, Split, Amplify.

      A bow that can be inscribed with a spell using the Scribes Table. If the player has enough mana, arrows will become Spell Arrows and will apply the spell on their target. If no arrows are in the inventory,
      a spell arrow that deals 0 damage will be cast. If there is not enough mana, regular arrows will be fired. Enchanter''s Bows may use special Augment Arrows for empowering the inscribed spell.'
