  ru:
    title: Как творить заклинания
    subtitle: C — создать, X — переключить, ПКМ — сотворить
    text: '**Зачем:** Заклинание = форма + эффекты + усиления. Открой книгу клавишей C и собери первое: Снаряд + Ломание.

      Чтобы начать кастовать заклинания, вам нужно сначала получить Книгу заклинаний. Книга заклинаний позволит вам создавать, хранить и кастовать заклинания, используя ману. Книга заклинаний более высокого
      уровня предоставит дополнительные слоты для заклинаний, что позволит вам создавать более сложные.  Чтобы создать свое первое заклинание, вы должны сначала выбрать Форму, которую примет заклинание.
      Глиф Форма всегда должен быть первым глифом в рецепте заклинания.'
  en:
    title: How Spellcasting Works
    subtitle: C to craft, X to switch, right click to cast
    text: '**Why:** A spell = a form + effects + augments. Open the book with C and build your first: Projectile + Break.

      Ars Nouveau grants aspiring wizards the ability to craft powerful spells. Through creative spellcrafting, you can vanquish foes, reshape the world, automate tasks, create spectacles, and so much more!

      To begin spellcasting, you will need to craft a Novice’s Spell Book which will allow you to create, store, and cast spells using Mana.

      Upgrading your Spell Book, learning new Glyphs, and crafting magical equipment will further enhance your ability to cast new and more powerful spells.'
