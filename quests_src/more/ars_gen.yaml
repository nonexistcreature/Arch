    text: '**Зачем:** Ягоды Истока — первое лекарство от нехватки маны и сырьё для зелья регенерации маны.'
  en:
    title: Sourceberry
    subtitle: ''
    text: '**Why:** Sourceberries are the first cure for low mana and the base of mana regeneration potions.

      A Sourceberry Bush can be found in Taiga and Archwood Forest biomes, and produces Sourceberries. A Sourceberry can be used to craft a Potion of Mana Regeneration or consumed as food. Starbuncles will
      automatically harvest fully grown Source Berry Bushes, making them useful for early automation of the Agronomic Sourcelink. Sourceberry foods will also grant Mana Regeneration.'
