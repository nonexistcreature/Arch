  ru:
    title: Магистр Ars Nouveau
    subtitle: ''
    text: Исток течёт сам, помощники работают, броня и оружие напитаны магией. Остальное — твоя фантазия в книге заклинаний.
  en:
    title: Master of Ars Nouveau
    subtitle: ''
    text: Source flows by itself, helpers work, armour and weapons are steeped in magic. The rest is your imagination in the spell book.
