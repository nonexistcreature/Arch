    text: '**Зачем:** Меч, в который вписано заклинание: каждый удар его творит.

      Применяет заклинание Прикосновение перед нанесением урона существу. Кроме того, все заклинания получают одно дополнительное Усиление последнего эффекта в заклинании. Примените на Писарском Столе заклинание,
      НЕ содержащее формы, такое как Воспламенение -> Продление Времени.'
  en:
    title: Enchanter's Sword
    subtitle: ''
    text: '**Why:** A sword with a spell inscribed: every hit casts it.

      Applies a Touch spell before damaging an entity. Additionally, all spells gain Spell Damage. Apply a spell at the Scribes Table that does NOT contain a form, such as Ignite -> Extend Time.'
- id: arsg_shield
  tasks:
  - type: item
    item: ars_nouveau:enchanters_shield
  deps:
  - arsg_sword
  roles:
  - warrior
  - mage
  icon: ars_nouveau:enchanters_shield
  ru:
