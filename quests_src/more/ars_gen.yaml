    subtitle: ''
    text: '**Зачем:** Пьедесталы вокруг Камеры Впитывания и Чародейского Аппарата — это «верстак» магии.'
  en:
    title: Arcane Pedestal
    subtitle: ''
    text: '**Why:** Pedestals around the Imbuement Chamber and the Enchanting Apparatus are the crafting table of magic.

      The Imbuement Chamber allows the conversion of Amethyst Shards or Lapis Lazuli into Source Gems. By placing three Arcane Pedestals bearing certain items adjacent to the chamber, Source Gems can be
      imbued further into Essences which are used in many Glyph recipes.

      Placing an Enchanting Apparatus on top of an Arcane Core allows the crafting of essentials such as Magebloom Seeds, magical equipment, and charms to summon magical helpers. It can also directly enchant
      your gear with enchantments of your choice.

      The Alteration Table allows for slotting in various Threads into magical armor that grant special properties while worn.'
- id: arsg_enchanting
  tasks:
  - type: item
    item: minecraft:enchanted_book
  deps:
  - ars_apparatus
  roles:
  - mage
  icon: minecraft:enchanted_book
  ru:
    title: Чары без лотереи
    subtitle: ''
    text: '**Зачем:** Аппарат накладывает выбранные чары и поднимает их уровень — без случайностей стола зачарований.

      Чародейский Аппарат может добавлять новые чары или улучшать существующие, используя Источник и предметы. Для начала выберите заклинание 1-го уровня и добавьте его предметы на пьедесталы. Поставьте
      рядом кувшин с Источником и используйте предмет, который вы хотите зачаровать на аппарате. Аппарат может применять только те чары, которые доступны для предмета, который вы ему дали.'
  en:
    title: Enchanting Without the Lottery
    subtitle: ''
    text: '**Why:** The Apparatus applies the enchantment you choose and raises its level: no enchanting-table randomness.

      The Enchanting Apparatus may add new enchantments or upgrade existing ones by using Source and items. To begin, select a level 1 enchantment and add its items to the pedestals. Place a jar of Source
      nearby, and use the item you want to enchant on the apparatus. The apparatus may only apply enchantments that are valid to the item you have given it.'
