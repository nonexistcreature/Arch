  en:
    title: Reactive Enchantment
    subtitle: ''
    text: '**Why:** A weapon that casts a spell when it hits: a sword that ignites and knocks enemies back.

      Items with Reactive have a chance to cast spells when swung. The spell on the Spell Parchment determines the spell that will be inscribed on the item.'
- id: arsg_turret
  tasks:
  - type: item
    item: ars_nouveau:basic_spell_turret
  deps:
  - ars_apparatus
  roles:
  - mage
  - engineer
  icon: ars_nouveau:basic_spell_turret
  ru:
