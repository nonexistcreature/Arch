  tasks:
  - type: item
    item: ars_nouveau:spell_crossbow
  deps:
  - arsg_bow
  roles:
  - warrior
  - mage
  icon: ars_nouveau:spell_crossbow
  ru:
    title: Арбалет чародея
    subtitle: ''
    text: Арбалет, на который можно нанести заклинание. Стоимость заклинания в мане будет вычтена при зарядке лука, если присутствует мана. Арбалеты чародея могут использовать специальные стрелы-аугменты
      для усиления своих заклинаний.
  en:
    title: Enchanter's Crossbow
    subtitle: ''
    text: A crossbow that can be inscribed with a spell. The mana cost of the spell will be deducted when the bow is loaded if mana is present. Enchanter's Crossbows may use special augment arrows to empower
      their spells.
- id: arsg_gauntlet
  tasks:
  - type: item
    item: ars_nouveau:enchanters_gauntlet
  deps:
  - arsg_sword
  roles:
  - mage
  - engineer
  icon: ars_nouveau:enchanters_gauntlet
  ru:
    title: Enchanter's Gauntlet
    subtitle: ''
    text: '**Зачем:** Перчатка-мультиинструмент: копает как алмаз и творит вписанное заклинание.'
  en:
    title: Enchanter's Gauntlet
    subtitle: ''
    text: '**Why:** A multi-tool gauntlet: digs at diamond hardness and casts its inscribed spell.

      Gauntlets are a spell casting multi-tool that can break blocks at diamond hardness. Gauntlets accept a single spell and are inscribed using the Scribes Table. Gauntlets always start with Touch and
      MUST be inscribed with a spell that does not contain a form. Spells cast with the gauntlet are cast with a discount.'
- id: arsg_fishing
  tasks:
  - type: item
    item: ars_nouveau:enchanters_fishing_rod
  deps:
  - arsg_spellcraft
  roles:
  - mage
  icon: ars_nouveau:enchanters_fishing_rod
  ru:
    title: Enchanter's Fishing Rod
    subtitle: ''
    text: '**Зачем:** Удочка, в которую вписано заклинание: при подсечке оно срабатывает на добыче — например, сразу жарит рыбу или притягивает её к тебе.'
  en:
    title: Enchanter's Fishing Rod
    subtitle: ''
    text: '**Why:** A fishing rod with an inscribed spell that fires on the catch.

      Fishing Rods accept a single spell and are inscribed using the Scribes Table. Rods always start with Touch and MUST be inscribed with a spell that does not contain a form. Fishing Rods can be used
      like a normal fishing rod, but hooking an entity will allow the user to cast the spell on the hooked entity until the line is broken.'
- id: arsg_flask
  tasks:
  - type: item
    item: ars_nouveau:potion_flask
  deps:
  - arsg_mana
  roles:
  - mage
  - alchemist
  icon: ars_nouveau:potion_flask
  ru:
    title: Фляжка для зелий
    subtitle: ''
    text: '**Зачем:** 8 глотков зелья в одной фляге — меньше места в инвентаре.

      Фляжка, в которой хранится 8 зарядов зелья. Чтобы наполнить фляжку, используйте её на кувшине с зельем или сделайте на верстаке с другим зельем. Вы можете опустошить фляжку, используя её на кувшине
      с зельем с зажатым shift.'
  en:
    title: Potion Flask
    subtitle: ''
    text: '**Why:** Eight drinks of a potion in one flask: less inventory space.

      A flask that stores 8 charges of a potion. To fill the flask, use the flask on a Potion Jar, or craft the flask in a Crafting Table with another potion. You may empty the flask by using the flask
      on a Potion Jar while sneaking.'
- id: arsg_flask_cannon
  tasks:
  - type: item
    item: ars_nouveau:splash_flask_cannon
  deps:
  - arsg_flask
  roles:
  - mage
  - alchemist
  icon: ars_nouveau:splash_flask_cannon
  ru:
    title: Взрывная Фляжковая пушка
    subtitle: ''
    text: '**Зачем:** Метает зелья из твоих фляг — лечить команду издалека или травить врагов.

      Фляжковые пушки могут потреблять зелья из бутылок и фляжек в инвентаря игрока и превращать их во взрывное или туманное зелья. Чтобы выбрать зелье для броска, с помощью радиального меню выберите фляжку
      или зелье и используйте пусковую установку.'
  en:
    title: Splash Flask Cannon
    subtitle: ''
    text: '**Why:** Fires potions from your flasks: heal the team from afar or poison enemies.

      Flask Cannons can consume potions from bottles and flasks from the players inventory and convert the potion into a Splash or Lingering potion. To select the potion to be thrown, use the Radial Menu
      to select your flask or potion and use the launcher.'
- id: arsg_potion_jar
  tasks:
  - type: item
    item: ars_nouveau:potion_jar
  - type: item
    item: ars_nouveau:potion_melder
  deps:
  - arsg_flask
  roles:
  - alchemist
  icon: ars_nouveau:potion_jar
  ru:
    title: Кувшин для зелий
    subtitle: ''
    text: '**Зачем:** Кувшин хранит зелья литрами, а Связыватель соединяет два зелья в одно с двумя эффектами.

      Резервуар, в котором хранится до 100 зелий. Зелье можно удалить, используя пустой пузырек или фляжку для зелья на резервуаре. Викси будут использовать эти резервуары во время автокрафта зелий. Резервуар
      можно запереть, используя Жезл Владычества с зажатым shift. Запертые резервуары будут получать от Викси только то зелье, на котором они заперты. Может использоваться с компаратором.'
  en:
    title: Potion Jar
    subtitle: ''
    text: '**Why:** The jar stores potions by the litre, and the Melder merges two potions into one with both effects.

      A jar that stores up to 100 potions. Potion can be removed by using an Empty Bottle, Potion Flask, or Arrows on the jar. Wixies will use these jars during Potion Autocrafting. The jar may be locked
      by using a Dominion Wand while sneaking. Locked Jars will only receive the potion it is locked to from Wixies. Can be used with a Comparator.'
- id: arsg_jump_ring
  tasks:
  - type: item
    item: ars_nouveau:jump_ring
  deps:
  - ars_jewelry
  roles:
  - mage
  icon: ars_nouveau:jump_ring
  ru:
    title: Кольцо Прыжка
    subtitle: ''
    text: Позволяет пользователю продолжать прыгать в воздухе. Каждый прыжок расходует ману.
  en:
    title: Ring of Jumping
    subtitle: ''
    text: Allows the user to continue jumping in the air. Each jump will expend mana.
- id: arsg_mana_amulets
  tasks:
  - type: item
    item: ars_nouveau:amulet_of_mana_regen
  deps:
  - ars_jewelry
  roles:
  - mage
  icon: ars_nouveau:amulet_of_mana_regen
  ru:
    title: Амулет регенерации маны
    subtitle: ''
    text: Незначительно увеличивает восстановление маны.
  en:
    title: Amulet of Mana Regen
    subtitle: ''
    text: Increases mana regeneration by a moderate amount.
- id: arsg_discount
  tasks:
  - type: item
    item: ars_nouveau:ring_of_lesser_discount
  deps:
  - ars_jewelry
  roles:
  - mage
  icon: ars_nouveau:ring_of_lesser_discount
  ru:
    title: Кольцо скидки
    subtitle: ''
    text: '**Зачем:** Заклинания стоят меньше маны. Большое кольцо (Чёрная Пятница) — ещё дешевле.'
  en:
    title: Ring of Discount
    subtitle: ''
    text: '**Why:** Spells cost less mana. The greater ring is even cheaper.'
- id: arsg_unstable_belt
  tasks:
  - type: item
    item: ars_nouveau:belt_of_unstable_gifts
  deps:
  - ars_belt
  roles:
  - mage
  icon: ars_nouveau:belt_of_unstable_gifts
  ru:
    title: Пояс Нестабильных Даров
    subtitle: ''
    text: Иногда дает случайный положительный эффект зелья на короткое время. Эти эффекты могут различаться по силе.
  en:
    title: Belt of Unstable Gifts
    subtitle: ''
    text: Occasionally grants a random positive potion effect for a short duration. These effects can vary in strength.
- id: arsg_dominion
  tasks:
  - type: item
    item: ars_nouveau:dominion_wand
  deps:
  - ars_starbuncle
  roles:
  - mage
  icon: ars_nouveau:dominion_wand
  ru:
    title: Жезл Владычества
    subtitle: ''
    text: '**Зачем:** Жезл указывает фамильярам и помощникам, откуда брать и куда класть — главный инструмент магической автоматизации.

      Инструмент для настройки Реле Источника и автоматизации существ. Чтобы задать путь трансфера, используйте жезл на объекте, с которого вы хотите взять Источник, а затем используйте его на блоке, на
      который вы хотите отправить Источник. Например: Кувшин с Истоком к транслятору Истока, транслятор Истока к транслятору Истока или транслятор Истока к кувшину с Истоком. Чтобы очистить соединения,
      используйте этот жезл на реле крадучись.'
  en:
    title: Dominion Wand
    subtitle: ''
    text: '**Why:** The wand tells helpers where to take from and where to put to: the main tool of magical automation.

      A tool for configuring Source Relays and automation entities. To set a transfer path, use the wand on the object that you would like to take source from, and then use it on the block you would like
      to send source to. For example: Source Jar to Source Relay, Source Relay to Source Relay, or Source Relay to Source Jar. To clear connections, sneak and use this wand on a relay. You can switch into
      Strict mode using the radial menu, allowing to specify the side of the blocks to use.'
- id: arsg_scrolls
  tasks:
  - type: item
    item: ars_nouveau:allow_scroll
  - type: item
    item: ars_nouveau:deny_scroll
  deps:
  - arsg_dominion
  roles:
  - mage
  icon: ars_nouveau:allow_scroll
  ru:
    title: Списки предметов
    subtitle: ''
    text: '**Зачем:** Фильтры для помощников: что звездоух может носить, а что нет.

      Предоставляет список предметов для автоматизации связанных сущностей. Чтобы нанести надпись, положите предмет на писчий стол и используйте блоки и предметы на столе, зажав shift. Если дать свиток
      Звездоуху, то он будет поднимать и забирать только предметы со свитка.'
  en:
    title: Item Lists
    subtitle: ''
    text: '**Why:** Filters for helpers: what a Starbuncle may carry and what not.

      Provides a list of items to automation related entities. To inscribe an item, place on the Scribes Table and use blocks and items on the table while sneaking. When given to a Starbuncle, the Starbuncle
      will only pickup and take items on the scroll.'
- id: arsg_repository
  tasks:
  - type: item
    item: ars_nouveau:repository
    count: 2
  deps:
  - arsg_archwood
  roles:
  - mage
  - builder
  icon: ars_nouveau:repository
  ru:
    title: Репозиторий
    subtitle: ''
    text: '**Зачем:** Магическое хранилище: двойной сундук в одном блоке.

      В репозитории может храниться двойное количество сундуков с предметами. Когда он назван, он будет отображать имя в виде всплывающей подсказки и сохранять его при удалении как элемент. Полезно для
      создания именованных вкладок инвентаря с помощью Storage Lectern.'
  en:
    title: Repository
    subtitle: ''
    text: '**Why:** Magic storage: a double chest in one block.

      A repository can store a double chests worth of items. When named, it will display the name as a tooltip, and preserve it when dropped as an item. Useful for creating named inventory tabs with the
      Storage Lectern. A Repository Catalog can be used as a proxy for a chain of connected repositories, and respects filter scrolls on repositories when inserting items.'
- id: arsg_lectern
  tasks:
  - type: item
    item: ars_nouveau:storage_lectern
  deps:
  - arsg_repository
  roles:
  - mage
  icon: ars_nouveau:storage_lectern
  ru:
    title: Кафедра хранения
    subtitle: ''
    text: '**Зачем:** Кафедра видит все связанные хранилища и крафтит из них — «AE2 для мага».

      Кафедра хранения может использоваться для просмотра, управления и создания из нескольких связанных инвентарей. Количество инвентарей, которые могут быть подключены, определяется количеством Книжных
      Змеев, привязанных к кафедре. Вы можете добавить больше Книжных змей на кафедру, используя амулет Книжный змей. Используйте жезл доминиона из инвентаря на кафедру, чтобы связать или удалить доступ.
      Инвентарь может быть подключен на расстоянии 30 блоков.'
  en:
    title: Storage Lectern
    subtitle: ''
    text: '**Why:** The lectern sees every linked storage and crafts from it: AE2 for mages.

      The Storage Lectern can used to view, manage, and craft from multiple connected inventories. The number of inventories that may be connected is determined by the number of Bookwyrms bound to the lectern.
      You can add more Bookwyrms to the lectern by using a Bookwyrm Charm. Use the Dominion Wand from an inventory to the lectern in order to bind or remove access. Inventories can be connected 30 blocks
      away.'
- id: arsg_bookwyrm
  tasks:
  - type: item
    item: ars_nouveau:bookwyrm_charm
  deps:
  - arsg_lectern
  roles:
  - mage
  icon: ars_nouveau:bookwyrm_charm
  ru:
    title: Талисман Книгочея
    subtitle: ''
    text: Амулеты Книгочея можно использовать на кафедре хранения, чтобы увеличить количество доступных инвентарей. Дополните ритуал пробуждения Книгами и Перьями, чтобы получить амулеты. Книгочея можно
      покрасить белой, черной, синей, зеленой, красной или фиолетовой краской.
  en:
    title: Bookwyrm Charm
    subtitle: ''
    text: Bookwyrm Charms can be used on a Storage Lectern to increase the number of accessible inventories. Augment a Ritual of Awakening with Book and Quills in order to obtain charms. Bookwyrms can be
      dyed using white, black, blue, green, red, or purple dye.
- id: arsg_catalog
  tasks:
  - type: item
    item: ars_nouveau:repository_controller
  deps:
  - arsg_lectern
  roles:
  - mage
  icon: ars_nouveau:repository_controller
  ru:
    title: Repository Catalog
    subtitle: ''
    text: '**Зачем:** Каталог кладёт и забирает предметы из всех соседних репозиториев сразу — воронка в твоё магическое хранилище.'
  en:
    title: Repository Catalog
    subtitle: ''
    text: '**Why:** The catalog inserts and extracts from every connected repository: a funnel into your magic storage.

      Catalogs can insert and extract items from any adjacent and connected repository. Catalogs respect filters placed on repositories via item frames while inserting items, and will prioritize existing
      stacks of an item. Filter scrolls can be used on the Catalog, storing the filter and applying it to all connected repositories when interacted with directly.'
- id: arsg_detector
  tasks:
  - type: item
    item: ars_nouveau:item_detector
  deps:
  - arsg_lectern
  roles:
  - mage
  - engineer
  icon: ars_nouveau:item_detector
  ru:
    title: Витрина
    subtitle: ''
    text: Витрина может быть настроена на вывод сигнала красного камня при достижении определенного уровня запасов. Для установки предмета на отслеживание используйте предмет на кейсе. Взаимодействуйте
      с блоком, чтобы увеличить счет, и ударьте, чтобы уменьшить. Чтобы связать инвентарь, Dominion Wand инвентарь к витрине. Блуждание во время подкрадывания инвертируется, если выходной сигнал ниже или
      выше установленного количества.
  en:
    title: Display Case
    subtitle: ''
    text: A Display Case can be configured to output a redstone signal when a certain level of inventory is reached. To set the item for tracking, use an item on the case. Interact with the block to increase
      the count, and punch to decrease. To link to an inventory, Dominion Wand an inventory to the display case. Wanding while sneaking will invert if the signal outputs below or greater than the set count.
- id: arsg_alteration
  tasks:
  - type: item
    item: ars_nouveau:alteration_table
  deps:
  - ars_apparatus
  roles:
  - mage
  icon: ars_nouveau:alteration_table
  ru:
    title: Стол Чередования
    subtitle: ''
    text: '**Зачем:** Здесь в магическую броню вставляют Нити — особые способности.

      Используется для нанесения Нитей на магические доспехи. Чтобы использовать стол, положите доспехи на подставку стола. Скрижаль отобразит доступные слоты для Нитей на доспехах. Чтобы добавить или удалить
      Нить, используйте Нить на скрижали стола. При удалении доспехов нити останутся на них. Чтобы удалить нить, положите доспехи на стол и взаимодействуйте со скрижалью пустой рукой.'
  en:
    title: Alteration Table
    subtitle: ''
    text: '**Why:** Here you fit Threads into magic armour: special abilities.

      Used to inscribe Threads onto magical armors. To use the table, place armor onto the stand of the table. The tablet will display the available Thread Slots on the armor. To add or remove a Thread,
      use the thread on the tablet of the table. Removing the armor will apply the threads to the armor. To remove a thread, place the armor on the table and interact with the display with an empty hand.'
- id: arsg_sorcerer
  tasks:
  - type: item
    item: ars_nouveau:sorcerer_hood
  - type: item
    item: ars_nouveau:sorcerer_robes
  - type: item
    item: ars_nouveau:sorcerer_leggings
  - type: item
    item: ars_nouveau:sorcerer_boots
  deps:
  - arsg_alteration
  roles:
  - mage
  icon: ars_nouveau:sorcerer_robes
  ru:
    title: Одеяния колдуна
    subtitle: ''
    text: '**Зачем:** Самая слабая защита, но больше всего маны и слотов под Нити — для чистого мага.

      Магические одеяния увеличивают регенерацию маны и могут быть улучшены специальными способностями с помощью Нитей. Набор колдуна обеспечивает самую низкую защиту, но предоставляет самый мощный набор
      слотов для Нитей. Наборы чародея и боевого мага дают все больше защиты, но все меньше и меньше мощных слотов для Нитей. Более подробную информацию о Нитях см. в разделе "Доспехи и Перки".'
  en:
    title: Sorcerer's Robes
    subtitle: ''
    text: '**Why:** The weakest protection, but the most mana and thread slots: for a pure mage.

      Magical robes will increase the wearers mana regen and can be upgraded with special abilities using Threads. The Sorceror''s set provides the lowest defence, but provides the most powerful set of
      slots for Threads. The Arcanist''s and Battlemage''s sets provide increasingly more defence, but fewer and less powerful Thread Slots. For more information on Threads, see the section on Armor and
      Perks.'
- id: arsg_arcanist
  tasks:
  - type: item
    item: ars_nouveau:arcanist_hood
  - type: item
    item: ars_nouveau:arcanist_robes
  - type: item
    item: ars_nouveau:arcanist_leggings
  - type: item
    item: ars_nouveau:arcanist_boots
  deps:
  - arsg_alteration
  roles:
  - mage
  icon: ars_nouveau:arcanist_robes
  ru:
    title: Одеяния арканиста
    subtitle: ''
    text: '**Зачем:** Баланс защиты и маны.

      Магические доспехи могут быть улучшены с помощью Нитей для получения дополнительных эффектов. Каждый тип доспехов имеет разное количество слотов, и эти слоты различаются по размеру. Более крупные
      слоты увеличивают мощность Нитей, а для некоторых Нитей требуется слот определенного размера или больше. Чтобы применить нити, см. раздел "Стол чередования".'
  en:
    title: Arcanist's Robes
    subtitle: ''
    text: '**Why:** A balance of protection and mana.

      Magical armor can be upgraded with Threads to provide additional effects. Each type of armor has a different number of slots, and those slots vary in size. Larger slots will increase the power of
      threads, and some threads require a slot of a certain size or larger. To apply threads, see the section on the Alteration Table.'
- id: arsg_battlemage
  tasks:
  - type: item
    item: ars_nouveau:battlemage_hood
  - type: item
    item: ars_nouveau:battlemage_robes
  - type: item
    item: ars_nouveau:battlemage_leggings
  - type: item
    item: ars_nouveau:battlemage_boots
  deps:
  - arsg_alteration
  roles:
  - mage
  - warrior
  icon: ars_nouveau:battlemage_robes
  ru:
    title: Доспех боевого мага
    subtitle: ''
    text: '**Зачем:** Защита почти как у брони, маны меньше — для мага на передовой.

      Нити могут быть нанесены на броню с помощью Аппарата для преобразования. Каждая часть брони имеет уникальный набор Слотов для Нитей со своим собственным вариантом уровней. Некоторым Нитям может потребоваться
      Слот для Нитей минимального уровня, но многие нити просто увеличивают мощность в зависимости от предоставленного им слота.'
  en:
    title: Battlemage Armour
    subtitle: ''
    text: '**Why:** Protection close to real armour, less mana: for a frontline mage.

      Threads may be applied to armor using the Alteration Apparatus. Each piece of armor has a unique set of Thread Slots with their own variety of levels. Some Threads may require a Thread Slot of a minimum
      level, but many threads simply increase in power based on the slot they are given.'
- id: arsg_thread
  tasks:
  - type: item
    item: ars_nouveau:blank_thread
  deps:
  - arsg_sorcerer
  roles:
  - mage
  icon: ars_nouveau:blank_thread
  ru:
    title: Нити
    subtitle: ''
    text: '**Зачем:** Пустая нить превращается в Аппарате в нить-способность: ночное зрение, прыжок, скорость, восстановление маны.'
  en:
    title: Threads
    subtitle: ''
    text: '**Why:** A blank thread becomes an ability thread in the Apparatus: night vision, jump, speed, mana regen.'
- id: arsg_rit_awakening
  tasks:
  - type: item
    item: ars_nouveau:ritual_awakening
  deps:
  - ars_ritual_flight
  roles:
  - mage
  icon: ars_nouveau:ritual_awakening
  ru:
    title: Пробуждение
    subtitle: ''
    text: '**Зачем:** Пробуждает деревья и аметист в живых помощников: Заросшего ходока, Аметистового голема.

      Пробуждает близлежащие Арчвудские деревья в Заросших Ходоков, а Цветущие Аметисты в Аметистовых Големов. Сталкерам можно указать позицию в мире для охраны от враждебных мобов. Со временем они излечиваются
      и превращаются в Увальней, если умирают. Чтобы создать Сталкера, проведите этот ритуал у основания арчвудского дерева.'
  en:
    title: Awakening
    subtitle: ''
    text: '**Why:** Awakens trees and amethyst into living helpers: the Weald Walker, the Amethyst Golem.

      Awakens nearby Archwood trees into Weald Walkers and Budding Amethyst into Amethyst Golems. Weald Walkers can be given a position in the world to guard against hostile mobs. They will heal over time,
      and turn into Weald Waddlers if they die. To create a Weald Walker, perform this ritual near the base of an Archwood Tree. Augmenting with Book and Quills will create Bookwyrm Charms.'
- id: arsg_rit_binding
  tasks:
  - type: item
    item: ars_nouveau:ritual_binding
  deps:
  - ars_ritual_flight
  roles:
  - mage
  icon: ars_nouveau:ritual_binding
  ru:
    title: Привязка
    subtitle: ''
    text: Ритуал Привязки превращает близлежащих существ в Скрипты Привязки, используемые для вызова Фамильяра. Для получения дополнительной информации смотрите Фамильяры.
  en:
    title: Binding
    subtitle: ''
    text: The Ritual of Binding converts nearby eligible entities into Bound Scripts, used for summoning a Familiar. For more information, see the section on Familiars.
- id: arsg_rit_containment
  tasks:
  - type: item
    item: ars_nouveau:ritual_containment
  - type: item
    item: ars_nouveau:mob_jar
  deps:
  - arsg_rit_binding
  roles:
  - mage
  icon: ars_nouveau:ritual_containment
  ru:
    title: Удержание
    subtitle: ''
    text: 'Захватывает ближайшую сущность и помещает ее в любые расположенные рядом Удерживающие кувшины. После первого захвата для продолжения этого ритуала требуется дополнительный Источник. Мобы и кувшины
      должны находиться в пределах 3 блоков от Жаровни.

      Позволяет захватывать и хранить мобов для транспортировки или декора. Чтобы захватить моба, вы должны выполнить Ритуал Сдерживания. Более подробную информацию см. в "Ритуале сдерживания". Чтобы освободить
      моба, наложите Отпущение на кувшин, и моб будет выпущен над ним. Блоки заметок, размещенные над кувшином, будут воспроизводить звук моба, находящегося внутри.'
  en:
    title: Containment
    subtitle: ''
    text: 'Captures a nearby entity and places it into any nearby placed Containment Jars. After the first capture, this ritual requires additional source to continue. Mobs and jars must be within 3 blocks
      of the brazier.

      Allows you to capture and store mobs for transportation or decoration. To capture a mob, you must perform a Ritual of Containment. See the Ritual of Containment for more info. To release a mob, cast
      Dispel on the jar and the mob will be released above the jar. Note Blocks placed above a jar will play an ambient sound of the mob inside.'
- id: arsg_rit_sunrise
  tasks:
  - type: item
    item: ars_nouveau:ritual_sunrise
  deps:
  - ars_ritual_flight
  roles:
  - mage
  icon: ars_nouveau:ritual_sunrise
  ru:
    title: Рассвет
    subtitle: ''
    text: Устанавливает дневное время.
  en:
    title: Sunrise
    subtitle: ''
    text: Sets the time to day.
- id: arsg_rit_moonfall
  tasks:
  - type: item
    item: ars_nouveau:ritual_moonfall
  deps:
  - arsg_rit_sunrise
  roles:
  - mage
  icon: ars_nouveau:ritual_moonfall
  ru:
    title: Падшая Луна
    subtitle: ''
    text: Устанавливает ночное время.
  en:
    title: Moonfall
    subtitle: ''
    text: Sets the time to night.
- id: arsg_rit_cloudshaping
  tasks:
  - type: item
    item: ars_nouveau:ritual_cloudshaping
  deps:
  - arsg_rit_sunrise
  roles:
  - mage
  icon: ars_nouveau:ritual_cloudshaping
  ru:
    title: Образование Облаков
    subtitle: ''
    text: Этот ритуал может изменить погоду в одно мгновение. По умолчанию этот ритуал устанавливает ясную погоду. Дополнение с помощью пороха вызовет дождь, а блока лазурита - бурю.
  en:
    title: Cloudshaping
    subtitle: ''
    text: This ritual can change the weather at a moments notice. By default, this ritual will set the weather to clear. Augmenting with Gunpowder will cause it to rain, while a Lapis Block will cause it
      to storm.
- id: arsg_rit_overgrowth
  tasks:
  - type: item
    item: ars_nouveau:ritual_overgrowth
  deps:
  - ars_ritual_flight
  roles:
  - mage
  - gardener
  icon: ars_nouveau:ritual_overgrowth
  ru:
    title: Гипертрофия
    subtitle: ''
    text: Иногда в области вокруг него возникают блоки костной муки. Для работы этого ритуала требуется Источник. Если его дополнить костяным блоком, то этот ритуал заставит детенышей животных расти быстрее.
  en:
    title: Overgrowth
    subtitle: ''
    text: Occasionally bone meals blocks in the area around it. This ritual requires source to operate. If augmented with a Bone Block, this ritual will instead force baby animals to grow faster.
- id: arsg_rit_harvest
  tasks:
  - type: item
    item: ars_nouveau:ritual_harvest
  deps:
  - arsg_rit_overgrowth
  roles:
  - mage
  - gardener
  icon: ars_nouveau:ritual_harvest
  ru:
    title: Урожай
    subtitle: ''
    text: Накладывает эффект Сбора Урожая на близлежащие культуры. Потребляет источник каждый раз, когда собирается культура. Если рядом с жаровней находится инвентарь, предметы будут помещены в него до
      того, как упасть на землю.
  en:
    title: Harvest
    subtitle: ''
    text: Casts the Harvest effect on nearby crops. Consumes source each time a set of crops are harvested. If an inventory is adjacent to the brazier, the items will be deposited in them before dropping
      on the ground.
- id: arsg_rit_fertility
  tasks:
  - type: item
    item: ars_nouveau:ritual_fertility
  deps:
  - arsg_rit_overgrowth
  roles:
  - mage
  - gardener
  icon: ars_nouveau:ritual_fertility
  ru:
    title: Плодородие
    subtitle: ''
    text: По возможности периодически размножайте близлежащих животных. Для проведения этого ритуала требуется Источник, и он не будет иметь эффекта, если поблизости находятся более 19 существ.
  en:
    title: Fertility
    subtitle: ''
    text: Periodically causes nearby animals to breed if possible. This ritual requires source to operate, and will have no effect if there are twenty or more animals nearby.
- id: arsg_rit_forestation
  tasks:
  - type: item
    item: ars_nouveau:ritual_forestation
  deps:
  - arsg_rit_overgrowth
  roles:
  - mage
  - builder
  icon: ars_nouveau:ritual_forestation
  ru:
    title: Лесоразведение
    subtitle: ''
    text: Размещает выращенные дубы и березы и применяет костную муку в области 7x7 (круглой). Аугментация исходным камнем увеличит радиус на 1 для каждого камня. Аугментация коричневым грибом превратит
      область в подзол и породит таежные ресурсы. Аугментация светящимися ягодами порождает ресурсы джунглей.
  en:
    title: Forestation
    subtitle: ''
    text: Places grown Oak and Birch trees, and applies bonemeal in a 7x7 (circular) area. Augmenting with a source gem will increase the radius by 1 for each gem. Augmenting with a Brown Mushroom will
      convert the area to Podzol and spawn taiga resources. Augmenting with Glow Berries will spawn jungle resources.
- id: arsg_rit_restoration
  tasks:
  - type: item
    item: ars_nouveau:ritual_restoration
  deps:
  - ars_ritual_flight
  roles:
  - mage
  icon: ars_nouveau:ritual_restoration
  ru:
    title: Восстановление
    subtitle: ''
    text: Лечит близлежащих существ или наносит вред нежити в течение определенного времени. Кроме того, зомби-жители будут мгновенно излечиваться, а появившийся житель будет предлагать скидки, если рядом
      находился игрок. Для работы этого ритуала требуется Источник.
  en:
    title: Restoration
    subtitle: ''
    text: Heals nearby entities or harms undead over time. Additionally, Zombie Villagers will be instantly cured, and the resulting villager will offer discounts if a player was nearby. This ritual requires
      source to operate.
- id: arsg_rit_sanctuary
  tasks:
  - type: item
    item: ars_nouveau:ritual_sanctuary
  deps:
  - arsg_rit_restoration
  roles:
  - mage
  icon: ars_nouveau:ritual_sanctuary
  ru:
    title: Святилище
    subtitle: ''
    text: Запрещает враждебным мобам появляться естественным образом в радиусе 32 блоков. Дополните гнилой плотью, чтобы увеличить радиус на 1 каждой, до 128. Расходует источник раз в минуту, если в появлении
      отказано.
  en:
    title: Sanctuary
    subtitle: ''
    text: Denies hostile mobs from naturally spawning in a 32 block radius. Augment with rotten flesh to increase the radius by 1 each, up to 128. Costs source once a minute if a spawn is denied.
- id: arsg_rit_scrying
  tasks:
  - type: item
    item: ars_nouveau:ritual_scrying
  deps:
  - ars_ritual_flight
  roles:
  - mage
  icon: ars_nouveau:ritual_scrying
  ru:
    title: Предсказание
    subtitle: ''
    text: '**Зачем:** Подсвечивает нужные блоки сквозь стены — поиск руды без копания вслепую.

      Дает возможность видеть данный блок через любой другой блок в течение определенного времени. Белые частицы означают, что вы находитесь очень близко, зеленые - недалеко, а синие - далеко.  Чтобы завершить
      ритуал, перед началом бросьте любой блок по своему выбору. Вы также можете добавить Манипуляционную Эссенцию, чтобы увеличить продолжительность до 15 минут.'
  en:
    title: Scrying
    subtitle: ''
    text: '**Why:** Highlights chosen blocks through walls: find ore without digging blind.

      Grants vision of a given block through any other block for a given time. White particles signify you are very close, green is semi-far, and blue particles are blocks very far from you.  To complete
      the ritual, throw any block of your choice before starting. You may also add a Manipulation Essence to increase the duration to 15 minutes.'
- id: arsg_rit_burrowing
  tasks:
  - type: item
    item: ars_nouveau:ritual_burrowing
  deps:
  - arsg_rit_scrying
  roles:
  - mage
  icon: ars_nouveau:ritual_burrowing
  ru:
    title: Роющий
    subtitle: ''
    text: Выкапывает четыре соседних отверстия до бедрока, дропая все блоки.
  en:
    title: Burrowing
    subtitle: ''
    text: Digs four adjacent holes to bedrock, dropping any blocks.
- id: arsg_rit_disintegration
  tasks:
  - type: item
    item: ars_nouveau:ritual_disintegration
  deps:
  - arsg_rit_sanctuary
  roles:
  - mage
  icon: ars_nouveau:ritual_disintegration
  ru:
    title: Распад
    subtitle: ''
    text: Уничтожает ближайших монстров и превращает их в самоцветы опыта, которые стоят в два раза больше обычных. Монстры, уничтоженные таким образом, не роняют лут. Этот ритуал расходует Источник каждый
      раз, когда уничтожается монстр.
  en:
    title: Disintegration
    subtitle: ''
    text: Destroys nearby monsters and converts them into Experience Gems worth twice as much experience. Monsters destroyed this way will not drop items. This ritual consumes source each time a monster
      is destroyed.
- id: arsg_rit_gravity
  tasks:
  - type: item
    item: ars_nouveau:ritual_gravity
  deps:
  - ars_ritual_flight
  roles:
  - mage
  - builder
  icon: ars_nouveau:ritual_gravity
  ru:
    title: Гравитация
    subtitle: ''
    text: Дает находящимся поблизости игрокам эффект Гравитации, на короткое время прижимающий их к земле. Если игрок находится поблизости, этот ритуал обновит его дебафф Гравитация. Каждый раз, когда этот
      ритуал дарует или обновляет гравитацию, он будет расходовать Источник из близлежащих банок.
  en:
    title: Gravity
    subtitle: ''
    text: Grants nearby players the Gravity effect, forcing them to the ground for a short time. If the player is nearby, this ritual will refresh their gravity debuff. Each time this ritual grants or refreshes
      gravity, it will expend source from nearby jars.
- id: arsg_rit_island
  tasks:
  - type: item
    item: ars_nouveau:ritual_conjure_island_plains
  deps:
  - arsg_rit_cloudshaping
  roles:
  - mage
  - builder
  icon: ars_nouveau:ritual_conjure_island_plains
  ru:
    title: 'Остров колдовства: Равнины'
    subtitle: ''
    text: Создает остров травы и грязи по кругу вокруг ритуала, превращая область в Равнины. Аугментируется Фростой с преобразованием в Снежные Равнины. Остров будет генерироваться с радиусом 7 блоков.
      Дополнение ритуала исходными самоцветами увеличит радиус на 1 для каждого самоцвета. Источник должен быть предоставлен рядом, так как блоки генерируются.
  en:
    title: 'Conjure Island: Plains'
    subtitle: ''
    text: Creates an island of grass and dirt in a circle around the ritual, converting the area to Plains. Augmenting with a Frostaya with convert to Snow Plains. The island will generate with a radius
      of 7 blocks. Augmenting the ritual with Source Gems will increase the radius by 1 for each gem. Source must be provided nearby as blocks are generated.
- id: arsg_rit_challenge
  tasks:
  - type: item
    item: ars_nouveau:ritual_challenge
  deps:
  - ars_wilden
  roles:
  - mage
  - warrior
  icon: ars_nouveau:ritual_challenge
  ru:
    title: Челендж
    subtitle: ''
    text: Призывает рейд жителей при использовании в деревне. Изумруд может быть использован для повышения сложности рейда до максимального уровня, делая Тотемы Бессмертия доступными на более легких сложностях.
      Дополнение не влияет на Тяжёлую сложность.
  en:
    title: Challenge
    subtitle: ''
    text: Summons an illager raid when used inside a village. An Emerald may be used to increase the difficulty of the raid to the maximum amount, making Totems of the Undying accessible on easier difficulties.
      Augmenting has no effect on Hard difficulty.
- id: arsg_rit_warping
  tasks:
  - type: item
    item: ars_nouveau:ritual_warping
  deps:
  - ars_warp
  roles:
  - mage
  icon: ars_nouveau:ritual_warping
  ru:
    title: Варп
    subtitle: ''
    text: Телепортирует все близлежащие сущности в место, указанное в Варп-свитке. Перед началом ритуала вы должны дополнить его Варп-свитком.
  en:
    title: Warping
    subtitle: ''
    text: Warps all nearby entities to the location on a warp scroll. Before starting the ritual, you must first augment the ritual with an inscribed Warp Scroll.
- id: arsg_brazier_relay
  tasks:
  - type: item
    item: ars_nouveau:brazier_relay
  deps:
  - arsg_rit_awakening
  roles:
  - mage
  icon: ars_nouveau:brazier_relay
  ru:
    title: Эстафета ритуальной жаровни
    subtitle: ''
    text: Позволяет пользователям привязать ритуал Ritual Brazier к новому месту. К одному и тому же реле-жаровне можно подключить несколько ритуалов. Чтобы подключиться, используйте жезл доминиона на своей
      ритуальной жаровне, затем реле. Источник потребляется в исходном месте жаровни. Может быть привязан в пределах 15 блоков.
  en:
    title: Ritual Brazier Relay
    subtitle: ''
    text: Allows the users to bind a Ritual Brazier ritual to a new location. Multiple rituals can be connected to the same brazier relay. To connect, use the Dominion Wand on your Ritual Brazier, then
      the relay. Source is consumed at the original braziers location. Can be bound within 15 blocks.
- id: arsg_golem
  tasks:
  - type: item
    item: ars_nouveau:amethyst_golem_charm
  deps:
  - arsg_rit_awakening
  roles:
  - mage
  icon: ars_nouveau:amethyst_golem_charm
  ru:
    title: Талисман Аметистового Голема
    subtitle: ''
    text: Аметистовые Големы будут собирать, выращивать и хранить аметист рядом со своим домом. Чтобы получить Аметистового Голема, выполните Ритуал Пробуждения рядом с Цветущим Аметистом, чтобы получить
      Талисман Аметистового Голема.
  en:
    title: Amethyst Golem Charm
    subtitle: ''
    text: Amethyst Golems will harvest, grow, and collect Amethyst near its home. To obtain an Amethyst Golem, perform the Ritual of Awakening near Budding Amethyst to obtain the Amethyst Golem Charm.
- id: arsg_walker
  tasks:
  - type: checkmark
  deps:
  - arsg_rit_awakening
  roles:
  - mage
  - warrior
  icon: ars_nouveau:green_archwood_sapling
  ru:
    title: Заросший ходок
    subtitle: ''
    text: Заросшие Ходоки - это живые арчвудские деревья, которые охраняют свои дома от враждебных монстров. Заросший Ходок может быть создан в Ритуале Пробуждения. После пробуждения, Заросший Ходок будет
      бродить там, где ему вздумается, если не назначена конкретная позиция. Чтобы задать Заросшему Ходоку позицию, используйте Жезл Владычества на нём, а затем на блоке, который вы хотите, чтобы он охранял.
  en:
    title: Weald Walker
    subtitle: ''
    text: Weald Walkers are living Archwood Trees that guard their homes against hostile monsters. A Weald Walker can be created from the Ritual of Awakening. When summoned, the Weald Walker will roam randomly
      unless given a home position. To give the Weald Walker a home, use the dominion wand on the Weald Walker, and then the block you wish it to guard.
- id: arsg_alakarkinos
  tasks:
  - type: item
    item: ars_nouveau:alakarkinos_charm
  deps:
  - ars_drygmy
  roles:
  - mage
  icon: ars_nouveau:alakarkinos_charm
  ru:
    title: Alakarkinos Charm
    subtitle: ''
    text: '**Зачем:** Краб Алакаркинос просеивает песок и гравий и находит то, что обычно добывают археологией: черепки, сокровища.'
  en:
    title: Alakarkinos Charm
    subtitle: ''
    text: '**Why:** The Alakarkinos crab sifts sand and gravel for archaeology loot: sherds and treasures.

      Alakarkinos can sift sand and gravel to find items found in archaeology sites. They can be found on beaches and will give you a token if they receive a Pottery Sherd of any kind.'
- id: arsg_familiar
  tasks:
  - type: checkmark
  deps:
  - arsg_rit_binding
  roles:
  - mage
  icon: ars_nouveau:familiar_starbuncle
  ru:
    title: Фамильяр
    subtitle: ''
    text: '**Зачем:** Фамильяр всегда рядом и даёт бонус: звездоух — скорость, викси — зелья подольше, книгочей — дешевле заклинания.

      Чтобы начать вызывать фамильяров, вам нужно получить Скрипт Привязки существа, с которым вы хотите подружиться. Можно получить, выполнив Ритуал Привязки рядом с соответствующим существом. Смотри полный
      список подходящих существ в разделе Фамильяров. Как только вы получите Скрипт Привязки, используйте его, чтобы изучить фамильяра.'
  en:
    title: Familiar
    subtitle: ''
    text: '**Why:** A familiar stays by your side and gives a bonus: the Starbuncle speed, the Wixie longer potions, the Bookwyrm cheaper spells.

      To begin summoning familiars, you will need to obtain a Bound Script of the entity you wish to befriend. These can be obtained by performing the Ritual of Binding near a relevant entity. See the full
      list of eligible entities in the Familiars section. Once you have obtained a Bound Script, use it to learn the familiar.'
- id: arsg_magelight
  tasks:
  - type: item
    item: ars_nouveau:sconce
    count: 2
  deps:
  - arsg_spellcraft
  roles:
  - mage
  - builder
  icon: ars_nouveau:sconce
  ru:
    title: Волшебное Бра
    subtitle: ''
    text: Декоративные светильники. Чтобы зажечь, бросьте Свет на бра. Цвет пламени соответствует цвету вашего заклинания. Факел магического света на стене может менять направление своего пламени, взаимодействуя
      с ним. Используйте Touch или Projectile Sensitive, чтобы нацелить бра.
  en:
    title: Gold Sconce
    subtitle: ''
    text: Decorative lights. To ignite, cast Light on the sconce. The color of the flame corresponds with your spell color. The Magelight Torch on a wall can change the direction of its flames by interacting.
      Use Touch or Projectile Sensitive to target the sconce.
- id: arsg_illusion
  tasks:
  - type: item
    item: ars_nouveau:mirrorweave
    count: 8
  deps:
  - ars_apparatus
  roles:
  - mage
  - builder
  icon: ars_nouveau:mirrorweave
  ru:
    title: Зеркальное плетение
    subtitle: ''
    text: Mirrorweave может воспроизводить внешний вид любого блока, который используется на нем. Эти блоки будут иметь те же коллизии и освещение, что и их реплицированный блок. Sense Magic раскроет иллюзию.
      Все блоки иллюзий также можно использовать в качестве рамок для порталов. Направление света на блок иллюзий позволит ему излучать свет.
  en:
    title: Mirrorweave
    subtitle: ''
    text: Mirrorweave can replicate the appearance of any block that is used on it. These blocks will take on the same collisions and light as their replicated block. Sense Magic will reveal the illusion.
      All illusion blocks can also be used as frames for portals. Casting light on an illusion block will allow it to emit light.
- id: arsg_portal
  tasks:
  - type: item
    item: ars_nouveau:portal
  deps:
  - ars_warp
  roles:
  - mage
  icon: ars_nouveau:portal
  ru:
    title: Варп-портал
    subtitle: ''
    text: '**Зачем:** Постоянный портал в любую точку измерения — общая транспортная сеть для сервера.

      Варп-порталы, как и варп-свитки, обеспечивают одностороннюю телепортацию в любое место, при условии, что оно находится в том же измерении. Чтобы построить Варп-портал, соорудите каркас из Исходного
      камня или его разновидностей в форме прямоугольника, и обеспечьте поблизости полный кувшин Источника. Затем бросьте во фрейм варп-свиток с записанным местоположением. Если поблизости будет достаточно
      Истока, то портал будет создан.'
  en:
    title: Warp Portal
    subtitle: ''
    text: '**Why:** A permanent portal to any spot in the dimension: a shared transport network for the server.

      Warp portals, like warp scrolls, provide a one-way teleport to any location, provided it is in the same dimension. To construct a Warp Portal, build a frame from Sourcestone or its variants in the
      shape of a rectangle and provide a full Source Jar nearby. Then, throw a warp scroll with a written location into the frame. Given there is enough source nearby, the portal will be created.'
- id: arsg_planarium
  tasks:
  - type: item
    item: ars_nouveau:planarium
  deps:
  - arsg_portal
  roles:
  - mage
  - builder
  icon: ars_nouveau:planarium
  ru:
    title: Planarium
    subtitle: ''
    text: '**Зачем:** Карманное измерение в банке: своя маленькая база, куда можно войти.'
  en:
    title: Planarium
    subtitle: ''
    text: '**Why:** A pocket dimension in a jar: your own little base you can step into.

      The Planarium allows for the creation of custom pocket dimensions. Blocks placed within the jar will be rendered inside the Planarium. To create a new dimension, name a Planarium with the Name glyph
      or an anvil. Interact with the planarium while sneaking to enter the jar.

      The spawn point of the Planarium can be set by using the Dominion Wand on a boundary of the jar, and then using the wand again on your desired spawn point. To exit the jar, simply break any wall of
      the dimension.'
- id: arsg_scry_crystal
  tasks:
  - type: item
    item: ars_nouveau:scryers_crystal
  - type: item
    item: ars_nouveau:scryers_oculus
  deps:
  - arsg_rit_scrying
  roles:
  - mage
  icon: ars_nouveau:scryers_crystal
  ru:
    title: Око провидца
    subtitle: ''
    text: '**Зачем:** Смотри глазами кристалла, поставленного далеко — видеонаблюдение за фермой или входом в базу.'
  en:
    title: Scryer's Oculus
    subtitle: ''
    text: '**Why:** Watch through a crystal placed far away: a camera for your farm or base entrance.'
