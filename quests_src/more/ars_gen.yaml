  roles:
  - mage
  - engineer
  icon: ars_nouveau:relay_splitter
  ru:
    title: 'Реле Источника: Сплиттер'
    subtitle: ''
    text: '**Зачем:** Делит поток Истока на несколько устройств — без него большая мастерская голодает.

      Работает аналогично Реле Источника, но поддерживает одновременное получение и передачу в несколько кувшинов. Разделитель имеет гораздо большую пропускную способность, чем Реле Источника, и разделит
      эту пропускную способность между всеми своими кувшинами. Смотри инструкции по использованию Реле Источника.'
  en:
    title: 'Source Relay: Splitter'
    subtitle: ''
    text: '**Why:** Splits the Source flow across several devices: without it a big workshop starves.

      Operates similar to the Source Relay, but will support taking from and transferring to multiple jars at once. The splitter has a much larger through-put than the Source Relay, and will split this
      throughput amongst all of its jars. See the instructions on the Source Relay for use.'
- id: arsg_source_relay_warp
  tasks:
  - type: item
    item: ars_nouveau:relay_warp
  deps:
  - arsg_source_relay_split
  roles:
  - mage
  icon: ars_nouveau:relay_warp
  ru:
    title: 'Реле Источника: Сновальщик'
    subtitle: ''
    text: '**Зачем:** Передаёт Исток на большие расстояния без цепочки реле.

      Работает аналогично транслятору Истока: Сплиттер, но может телепортировать Исток на бесконечное расстояние между другими трансляторами. На расстоянии более 30 блоков есть вероятность, что некоторая
      часть Источника будет потеряна во время варпа.'
  en:
    title: 'Source Relay: Warper'
    subtitle: ''
    text: '**Why:** Sends Source over long distances without a chain of relays.

      Operates similar to the Source Relay: Splitter but can teleport source an endless distance between other Warp relays. For distances beyond 30 blocks, there is a chance that some source will be lost
      during warp.'
- id: arsg_creative_flow
  tasks:
  - type: item
    item: ars_nouveau:source_jar
    count: 4
  deps:
  - ars_vitalic
  - ars_volcanic
  - ars_agronomic
  - ars_mycelial
  - ars_alchemical
  roles:
  - mage
  icon: ars_nouveau:source_jar
  ru:
    title: Пять сочетаний
    subtitle: ''
    text: '**Зачем:** Каждое сочетание кормится своим: рост растений, огонь, грибы, смерть мобов, зелья. Собери все пять — Исток не кончится никогда.

      Источник - это специальный ресурс, который необходимо собирать различными устройствами по всему миру. Источник используется для питания таких устройств, как Камера Впитывания и Чародейский Аппарат.
      Чтобы начать сбор Источника, вам понадобится Кувшин Источника и Сочетание.'
  en:
    title: Five Sourcelinks
    subtitle: ''
    text: '**Why:** Each sourcelink feeds on something: plant growth, fire, mushrooms, mob deaths, potions. Build all five and Source never runs out.

      Source is a magical resource used for many purposes such as speeding up the Imbuement Chamber, fueling devices, powering magical helpers, creating portals, or fueling powerful Enchanting Apparatus
      recipes.

      Sourcelinks are specialized artifacts that can collect and concentrate Source from the world into Source Jars. Source Relays can be used to transfer Source over large distances between jars.

      The Agronomic and Mycelial Sourcelinks are good early options for building up your Source supply.'
- id: arsg_pedestal
