  icon: ars_nouveau:rotating_spell_turret
  ru:
    title: Регулируемая турель заклинаний
    subtitle: ''
    text: '**Зачем:** Турель, которую можно наводить, — для ферм и обороны базы.

      Туррели могут использоваться для творения заклинаний, когда на них подается сигнал редстоуна, функционируя как раздатчик. Туррели будут принимать заклинания, использующие «касание» или «снаряд». Заклинания
      могут быть установлены с помощью начертанного куска пергамента для заклинаний. Чтобы творить заклинания, туррели будут черпать Исток из близлежащих кувшинов с Истоком. Туррели могут использовать Крохоборство
      и Размещение, пока инвентарь находится рядом с этим блоком.'
  en:
    title: Adjustable Spell Turret
    subtitle: ''
    text: '**Why:** An aimable turret, for farms and base defence.

      Turrets can be used to cast spells when given a redstone signal, functioning like a dispenser. Turrets will accept spells that use Touch and Projectile. Spells may be set using an inscribed piece
      of Spell Parchment. To cast spells, turrets will draw source from linked or nearby Source Jars. Turrets may use Item Pickup and Place Block as long as an inventory is placed adjacent to this block.'
