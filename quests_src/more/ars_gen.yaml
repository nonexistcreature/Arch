  tasks:
  - type: item
    item: ars_nouveau:spell_prism
  deps:
  - arsg_turret
  roles:
  - mage
  icon: ars_nouveau:spell_prism
  ru:
    title: Заклинательная Призма
    subtitle: ''
    text: '**Зачем:** Призма поворачивает летящий снаряд-заклинание — для хитрых ферм и ловушек.

      Когда заклинание-снаряд попадает в этот блок, оно перенаправляется в направлении, к которому обращен блок. Заклинательные Призмы посылают сигнал ближайшим наблюдателям, если заклинание перенаправлено.'
  en:
    title: Spell Prism
    subtitle: ''
    text: '**Why:** The prism redirects flying spell projectiles: for clever farms and traps.

      When a projectile spell hits this block, it is redirected the direction the block is facing. Spell Prisms will send a signal to nearby Observers if a spell is redirected.'
- id: arsg_sword
  tasks:
