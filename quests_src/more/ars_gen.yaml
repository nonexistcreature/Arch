  ru:
    title: Арчвуд
    subtitle: ''
    text: '**Зачем:** Магическое дерево: из него делают почти все устройства Ars, а его плоды (бомбегранат, фростайя, мендостин, бастионный фрукт) — особые ресурсы.

      Арчвудские деревья имеют небольшой шанс появиться в любом биоме и бывают четырех типов. В редких случаях вы можете наткнуться на Арчвудский лес - биом, полный магических существ, природных огоньков
      и арчвудских деревьев. Можно использовать в качестве декораций, в ритуалах или для изготовления жезлов.'
  en:
    title: Archwood
    subtitle: ''
    text: '**Why:** The magic tree: almost every Ars device is built from it, and its fruits are special resources.

      Archwood Trees have a small chance to spawn in any biome, and come in four types. Rarely, you may stumble upon an Archwood Forest, a biome full of magical creatures, naturally spawning lights, and
      Archwood trees. Can be used as decoration, rituals, or for crafting wands. Archwood Trees also have a chance to spawn magical fruits that can be consumed or brewed into potions.'
