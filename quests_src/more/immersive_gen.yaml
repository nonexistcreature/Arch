  roles:
  - engineer
  - gardener
  icon: immersiveengineering:squeezer
  ru:
    title: Выжиматель и ферментёр
    subtitle: ''
    text: '**Зачем:** Семена → растительное масло, сахар и картошка → этанол. Вместе на нефтеперегонке получается биодизель — нефть с фермы.'
  en:
    title: Squeezer and Fermenter
    subtitle: ''
    text: '**Why:** Seeds → plant oil, sugar → ethanol; together → biodiesel.

      The Squeezer is a multiblock structure that presses juice or oil out of organic materials with a large piston. The structure is built as shown above and formed by using the Engineer''s Hammer on the
      central wooden barrel, on the side of the redstone port.

      Items can be input into the Squeezer via the two hatches at the back that are marked with blue dots. The hatch with the orange dot serves as an item output and the block below it to output fluids.

      Applying a redstone signal to the control panel at the front will halt the machine''s process, this behavior can be inverted by use of the Engineer''s Screwdriver.

      The Fermenter is a multiblock structure that extracts ethanol from certain fruits, grains and vegetables through a fermenting process. The structure is built as shown above and formed by using the
      Engineer''s Hammer on the central cauldron, on the side of the redstone port.

      Items can be input into the Fermenter via the two hatches at the back that are marked with blue dots. The hatch with the orange dot serves as an item output and the block below it to output fluids.

      Applying a redstone signal to the control panel at the front will halt the machine''s process, this behavior can be inverted by use of the Engineer''s Screwdriver.'
- id: ieg_refinery
  tasks:
  - type: checkmark
  deps:
  - ieg_squeezer
  roles:
  - engineer
  icon: immersiveengineering:refinery
  ru:
    title: Нефтеперегонная установка
    subtitle: ''
    text: '**Зачем:** Нефтеперегонная установка смешивает одну-две жидкости через катализатор и выдаёт новую — например, биодизель из масла и этанола.'
  en:
    title: Refinery
    subtitle: ''
    text: '**Why:** Mixes one or two fluids through a catalyst into a new one, e.g. biodiesel.

      Many processes necessitate the addition of a catalyst. The refinery passes its input fluids through a mixer and a catalyst at the same time, producing novel outputs from one or two inputs.

      To form the machine, construct it as shown and rightclick the Heavy Engineering Block on the middle layer.

      Fluids are input through the two ports on either side of the block and output through the orange marked port at the front. Using buckets to interact with the refinery''s tanks is also possible.'
- id: ieg_hemp
