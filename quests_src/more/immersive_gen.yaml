    text: '**Зачем:** Смеситель готовит жидкий бетон. Бетон — взрывоустойчивый строительный блок, а свинцовый бетон держит радиацию.'
  en:
    title: Mixer and Concrete
    subtitle: ''
    text: '**Why:** Liquid concrete: blast-resistant building blocks.

      The Mixer is a multiblock structure that dissolves solids in fluids, mixing them together. The structure is built as shown above and formed by using the Engineer''s Hammer on the central sheetmetal
      block.

      The most common uses for this machine are the mixing of Liquid Concrete;liquid, or the creation of Liquid Potions;potion from water and their various ingredients.

      Fluids are input into the mixer through the port at the bottom of its powersupply. Items can be input via the two hatches at the back. The fluid port at the front serves as fluid output.'
