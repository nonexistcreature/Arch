  en:
    title: Diesel Generator
    subtitle: ''
    text: '**Why:** Huge power from diesel or biodiesel.

      High-Voltage architecture might be fascinating, but an electrical grid isn''t very useful unless there is a generator which can provide for it.

      The Diesel Generator is the primary method of generating HV power. It will run off of Biodiesel;biodiesel or other heavy fuels, as detailed in the following pages. Due to its high output, it will
      consume fuel rapidly, so sufficient fuel production is a must.

      The engine and generator are constructed from radiators, pipes, engineering blocks, and scaffolding as shown above and formed via activating the central generator with an Engineer''s Hammer.'
