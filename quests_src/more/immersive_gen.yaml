    subtitle: ''
    text: '**Зачем:** Растёт в два блока высотой. Волокно — на ткань, верёвку, ветряные паруса и хемпкрит.'
  en:
    title: Industrial Hemp
    subtitle: ''
    text: '**Why:** Fibre for fabric, rope, sails and hempcrete.

      Industrial Hemp is a very versatile plant, with uses all throughout the engineering profession. It seeds can be used for the creation of LINK TO GO HERE(plant oil), used in Biodiesel;biodiesel; its
      fibers can be used in the creation of a sturdy canvas, Tough Fabric.

      The seeds can be obtained by breaking tall grass and other similar methods of collection.

      Tough Fabric is a resilient weave made from hemp fiber. When waterproofed, it can be used as Ersatz Leather;ersatz_leather.'
- id: ieg_cloche
