    subtitle: ''
    text: '**Зачем:** Укрытие от метеоритов и взрывов. Свинцовый бетон — стенки для реактора.'
  en:
    title: Concrete Bunker
    subtitle: ''
    text: '**Why:** Shelter from meteors and blasts; leaded concrete for reactors.

      Concrete is a very hard and resistant composite material. It''s cheap to craft and makes for an excellent use for crushed excess slag;slag produced by making steel.

      Concrete can be cut and assembled into various bricks and pillars using the Stonecutter.

      Concrete bricks have the same blast resistance as concrete, but can be disassembled faster than their solid counterpart, making them a good structural material.'
- id: ieg_bottling
  tasks:
  - type: checkmark
  deps:
  - ie_engineering_blocks
  roles:
  - engineer
  icon: immersiveengineering:bottling_machine
  ru:
    title: Разливочная машина
    subtitle: ''
    text: '**Зачем:** Разливочная машина наполняет ёмкости и формы жидкостью прямо на конвейере.'
  en:
    title: Bottling Machine
    subtitle: ''
    text: '**Why:** Fills containers and molds with fluid on a belt.

      The Bottling Machine fills fluids into containers or molds.

      The structure is created as shown above, but can be mirrored. To form it, rightclick the central conveyor with an Engineer''s Hammer. The direction of the conveyors is important.

      The machine can store 8 buckets of fluid, which is input through the ports on the metal tank. Energy is input through the connection at the top of the opposing side.'
- id: ieg_sawmill
  tasks:
  - type: item
    item: immersiveengineering:sawblade
  deps:
  - ie_engineering_blocks
  roles:
  - engineer
  - builder
  icon: immersiveengineering:sawblade
  ru:
    title: Лесопилка
    subtitle: ''
    text: '**Зачем:** Ленточная пила снимает кору и пилит брёвна в доски с опилками — плотник доволен.'
  en:
    title: Sawmill
    subtitle: ''
    text: '**Why:** Strips and saws logs into planks and sawdust.

      The sawmill is a machine assembly which cuts wooden logs into neatly stacked planks.

      The machine operates in two stages: first, the log is stripped, then the stripped law is cut apart using a sawblade.

      Both steps of the process create sawdust, which is collected and output through the port at the front of the machine.'
- id: ieg_silo_tank
  tasks:
  - type: item
    item: immersiveengineering:sheetmetal_iron
    count: 32
  deps:
  - ie_engineering_blocks
  roles:
  - engineer
  icon: immersiveengineering:sheetmetal_iron
  ru:
    title: Силос и цистерна
    subtitle: ''
    text: '**Зачем:** Огромные хранилища из листового металла: силос держит 40 000 одного предмета, цистерна — 512 вёдер жидкости.'
  en:
    title: Silo and Tank
    subtitle: ''
    text: '**Why:** Silo: 40k of one item; tank: 512 buckets.

      Silos offer space for a lot of items of the same type, making them excellent for mass storage of seeds, slag or cobblestone. They have space for 41472 items, equaling the capacity of 24 chests.

      The structure can be constructed out of any sheetmetal, it is not limited to using iron.

      Items can be input through the top grate, or through the bottom port. Items must be extracted from the bottom port.

      The Tank is a multiblock that provides space for large amounts of fluid.

      It will store up to 512 buckets of any fluid, which can be piped in via the top or bottom port.

      The structure can be constructed out of any sheetmetal, it is not limited to using iron.'
- id: ieg_assembler
  tasks:
  - type: checkmark
  deps:
  - ieg_circuits
  roles:
  - engineer
  icon: immersiveengineering:assembler
  ru:
    title: Сборочный цех
    subtitle: ''
    text: '**Зачем:** Сборочный цех крафтит предметы как игрок — по трём рецептам одновременно, беря ингредиенты из соседних сундуков.'
  en:
    title: Assembler
    subtitle: ''
    text: '**Why:** Crafts like a player, three recipes at once.

      The Assembler is a complex machine capable of crafting items, similar to a player.

      To form the structure, build it like demonstrated above and use the Engineer''s Hammer on the inwards facing conveyor.

      The Assembler allows for up to 3 recipes to be stored inside it that will be performed in order. The outputs of previous recipes can be used as inputs for following recipes.'
- id: ieg_auto_workbench
  tasks:
  - type: checkmark
  deps:
  - ieg_workbench
  - ieg_conveyors
  roles:
  - engineer
  icon: immersiveengineering:auto_workbench
  ru:
    title: Автоматический верстак
    subtitle: ''
    text: '**Зачем:** Автоматический верстак работает по чертежу: сам делает формы, патроны и детали на конвейере.'
  en:
    title: Automated Workbench
    subtitle: ''
    text: '**Why:** Follows a blueprint to craft parts on a belt.

      The Automated Workbench is one of the first major successes of small-scale engineering.

      The machine is able to follow a set of instructions described by a Blueprint;start to assemble the items detailed by it.

      Upon assembling the multiblock, a Blueprint can be placed on its drawing table. After selecting the item that should be created, it will begin the assembly process. In order for the machine to work,
      it will need to be supplied with materials and power.'
- id: ieg_arc_electrode
  tasks:
  - type: item
    item: immersiveengineering:graphite_electrode
    count: 3
  deps:
  - ie_arc
  roles:
  - engineer
  icon: immersiveengineering:graphite_electrode
  ru:
    title: Графитовый электрод
    subtitle: ''
    text: '**Зачем:** Дуговой печи нужны три графитовых электрода — они изнашиваются, держи запас.'
  en:
    title: Graphite Electrode
    subtitle: ''
    text: '**Why:** The arc furnace needs three graphite electrodes.

      Coal Coke is a purified form of carbon similar to charcoal. Coke is created from coal in the Coke Oven.

      It is used in steelmaking of all forms, from the simplest to the most advanced, and is a better furnace fuel than coal.

      Highly Ordered Pyrolytic (HOP) Graphite is a complex, allotrope of graphite used in special engineering constructs.'
- id: ieg_slag
  tasks:
  - type: item
    item: immersiveengineering:slag
    count: 8
  - type: item
    item: immersiveengineering:slag_glass
    count: 8
  deps:
  - ieg_blast_furnace
  roles:
  - builder
  icon: immersiveengineering:slag
  ru:
    title: Шлак в дело
    subtitle: ''
    text: '**Зачем:** Шлак от домны — не мусор: шлаковое стекло, кирпич и щебень для дорог.'
  en:
    title: Slag Products
    subtitle: ''
    text: '**Why:** Slag glass, bricks and gravel.

      Slag Gravel is slag that has been ground in the Crusher to a rough grit. As with other gravels, it can be crushed further into sand.

      Additionally, slag gravel contains valuable nutrients for aquatic flora. Waterlogged plants placed on slag gravel grow faster than when grown on other blocks.

      Remelting slag in a Furnace vitrifies it to a hard, darkened slag glass.'
- id: ieg_minerals
  tasks:
  - type: item
    item: immersiveengineering:coresample
  deps:
  - ie_excavator
  roles:
  - engineer
  icon: immersiveengineering:coresample
  ru:
    title: Месторождения
    subtitle: ''
    text: '**Зачем:** Пробный бур показывает, какая жила под этим местом. Экскаватор потом выкапывает её почти бесконечно.'
  en:
    title: Mineral Deposits
    subtitle: ''
    text: '**Why:** The core sample shows the deposit under you.

      Scattered throughout the stone of the world are small, concentrated deposits of ores, visible to the naked eye and recoverable with hand tools.

      Outside of those and in the underlying rock are Mineral Veins, composed of several different ores, too sparse for all but a special machine to recover.

      At the end of this section is an appendix listing all known mineral veins.'
- id: ieg_conveyors
  tasks:
  - type: item
    item: immersiveengineering:conveyor_basic
    count: 16
  - type: item
    item: immersiveengineering:conveyor_splitter
  - type: item
    item: immersiveengineering:conveyor_extract
  deps:
  - ie_components
  roles:
  - engineer
  icon: immersiveengineering:conveyor_basic
  ru:
    title: Конвейеры
    subtitle: ''
    text: '**Зачем:** Многоблочные машины IE берут и отдают предметы конвейерами. Сплиттер делит поток, вытягивающий забирает из сундуков.'
  en:
    title: Conveyor Belts
    subtitle: ''
    text: '**Why:** IE multiblocks are fed by conveyors.

      Conveyor Belts are an easy, unpowered method of moving in-world things around.

      Conveyor belts will move anything other creatures can push and several they cannot, with their primary design point being items. Other creatures such as cows and sheep can also be moved, but will
      not interact with some item-specific designs.

      Items dropped onto conveyor belts will move along a belt, and items can be dropped onto belts from devices such as hoppers or pipes.'
- id: ieg_chutes
  tasks:
  - type: item
    item: immersiveengineering:chute_iron
    count: 4
  deps:
  - ieg_conveyors
  roles:
  - engineer
  icon: immersiveengineering:chute_iron
  ru:
    title: Желоб из листового металла
    subtitle: ''
    text: '**Зачем:** Желоба из листового металла роняют предметы и существ прямо вниз и складывают их в инвентарь под собой.'
  en:
    title: Iron Sheetmetal Chute
    subtitle: ''
    text: '**Why:** Drop items straight down into inventories below.

      Chutes are simple constructions made from sheetmetal that allow creatures and items that fit inside to drop straight down.

      Chutes also insert into inventories below them and can be inserted into by conveyors or similar devices.

      Items within them won''t be picked up by players and should be immune to most forms of attraction, magnetic or otherwise.'
- id: ieg_sorter
  tasks:
  - type: item
    item: immersiveengineering:sorter
  - type: item
    item: immersiveengineering:fluid_sorter
  deps:
  - ieg_conveyors
  roles:
  - engineer
  icon: immersiveengineering:sorter
  ru:
    title: Сортировщики
    subtitle: ''
    text: '**Зачем:** Сортировщик раскладывает предметы по сторонам по фильтрам, жидкостный — то же для жидкостей.'
  en:
    title: Item and Fluid Routers
    subtitle: ''
    text: '**Why:** Sorts items (and fluids) by filters per side.

      The Item Router is designed to parcel and sort items into inventories such as chests, machines, and conveyors.

      Items inserted into the router will be output from matching configured sides or open sides in that order.

      Items can be inserted from any side, and will be output from one of the other five sides, or will disallow input if they cannot be sorted.'
- id: ieg_pipes
  tasks:
  - type: item
    item: immersiveengineering:fluid_pipe
    count: 16
  - type: item
    item: immersiveengineering:fluid_pump
  - type: item
    item: immersiveengineering:pipe_valve
  deps:
  - ie_components
  roles:
  - engineer
  icon: immersiveengineering:fluid_pipe
  ru:
    title: Трубы и насос
    subtitle: ''
    text: '**Зачем:** Трубы гонят жидкости в любые подключённые баки и машины, насос качает их из резервуаров и источников, вентиль перекрывает поток.'
  en:
    title: Pipes and Pump
    subtitle: ''
    text: '**Why:** Pipes carry fluids; the pump extracts; the valve shuts flow.

      Fluid Pipes are a versatile and efficient method of transporting fluids, unlike moving tanks ore buckets around en masse.

      Pipe systems will output any fluid input to them across the available ouputs, split evenly.

      At low pressure, pipe systems will transport fluid slowly. Pressurized fluids output from a Fluid Pump or certain large machines can move much faster.'
- id: ieg_jerrycan
  tasks:
  - type: item
    item: immersiveengineering:jerrycan
  deps:
  - ieg_pipes
  roles:
  - engineer
  icon: immersiveengineering:jerrycan
  ru:
    title: Канистра
    subtitle: ''
    text: '**Зачем:** Канистра на 10 вёдер: заправь катер, дрон или генератор в поле.'
  en:
    title: Jerrycan
    subtitle: ''
    text: '**Why:** A 10-bucket can to refuel vehicles and generators.

      Jerrycans are simple metal containers used to carry fluids. They can store up to 10 buckets and can pour that fluid into the world as well as into machines.

      Jerrycans cannot be used to pick up fluids from the world, but can be refilled from tanks such as barrels or large tanks.

      Additionally, they can be used to refill fluid-consuming items like the Mining Drill;start by placing the jerrycan and the tool together in a crafting grid.'
- id: ieg_storage
  tasks:
  - type: item
    item: immersiveengineering:crate
  - type: item
    item: immersiveengineering:wooden_barrel
  - type: item
    item: immersiveengineering:metal_barrel
  deps:
  - ie_treated
  roles:
  - engineer
  - builder
  icon: immersiveengineering:crate
  ru:
    title: Ящики и бочки
    subtitle: ''
    text: '**Зачем:** Ящик сохраняет содержимое, если его сломать, — переезжай с вещами. Бочки держат жидкость.'
  en:
    title: Crates and Barrels
    subtitle: ''
    text: '**Why:** Crates keep contents when broken; barrels hold fluids.

      Wooden Storage Crates are similar to a chest in function, storing up to 27 stacks of material and providing a comparator signal based on their fill.

      Unlike chests, they can be sealed up to keep all the material stored within a crate when picking it up.

      Using an Engineer''s Hammer;engineers_hammer on a crate for an extended duration will seal it up, after which it can be broken to pick it up.'
- id: ieg_minecarts
  tasks:
  - type: item
    item: immersiveengineering:minecart_woodencrate
  deps:
  - ieg_storage
  roles:
  - engineer
  icon: immersiveengineering:minecart_woodencrate
  ru:
    title: Вагонетка с деревянным ящиком
    subtitle: ''
    text: '**Зачем:** Ящик в вагонетке хранит вещи так же, как на земле, — перевозка грузов по рельсам.'
  en:
    title: Minecart with Wooden Storage Crate
    subtitle: ''
    text: '**Why:** Crates in minecarts keep their contents: rail cargo.

      Storage Crates can be placed into Minecarts, as with chests and hoppers.

      When placed into Minecarts, crates will act as they do outside, and store their items inside when they are broken, unlike chests.

      Storage Barrels can be placed into Minecarts, as with chests and hoppers.'
- id: ieg_circuits
  tasks:
  - type: item
    item: immersiveengineering:electron_tube
    count: 4
  - type: item
    item: immersiveengineering:circuit_board
    count: 2
  - type: item
    item: immersiveengineering:component_electronic
    count: 2
  deps:
  - ie_components
  roles:
  - engineer
  icon: immersiveengineering:electron_tube
  ru:
    title: Электроника
    subtitle: ''
    text: '**Зачем:** Лампы и платы — для продвинутых машин, турелей и рельсотрона.'
  en:
    title: Electronics
    subtitle: ''
    text: '**Why:** Tubes and boards for advanced machines, turrets and the railgun.

      Many machines and tools are constructed from various sub-components. Some of these you will have to use on a regular basis, detailed on the following pages.

      Simple components can be crafted in the regular Crafting Table, but advanced components will need the help of a specialized workbench.

      The Basic Engineering Block serves as the main construction material for a large variety of machinery. It makes up a core frame for most single-block machinery, especially in matters of transportation
      and power storage.'
- id: ieg_logic
  tasks:
  - type: item
    item: immersiveengineering:circuit_table
  - type: item
    item: immersiveengineering:logic_unit
  deps:
  - ieg_circuits
  roles:
  - engineer
  icon: immersiveengineering:circuit_table
  ru:
    title: Логический блок
    subtitle: ''
    text: '**Зачем:** Программируемая схема: И/ИЛИ/НЕ и таймеры в одном блоке вместо простыни редстоуна.'
  en:
    title: Logic Unit
    subtitle: ''
    text: '**Why:** A programmable logic block.

      With the versatility of Redstone Wires and shunting from Vacuum Tubes;tubes, complex redstone can be compacted into Logic Circuits.

      The Logic Unit is the specialty machine in which logic circuits are slotted to be used.

      It has enough space for a total of 10 circuits, and features a full 8 inbuilt registers, usable for any circuit.'
- id: ieg_redstone_wire
  tasks:
  - type: item
    item: immersiveengineering:wirecoil_redstone
    count: 4
  - type: item
    item: immersiveengineering:redstone_timer
  deps:
  - ie_wires
  roles:
  - engineer
  icon: immersiveengineering:wirecoil_redstone
  ru:
    title: Редстоун по проводам
    subtitle: ''
    text: '**Зачем:** Редстоун-провода — алюминий в редстоуне: передают сигнал далеко без потери силы. Таймер даёт сигнал по расписанию.'
  en:
    title: Redstone Wiring
    subtitle: ''
    text: '**Why:** Long-range redstone without signal loss; the timer pulses on schedule.

      Redstone Wires are aluminium coated in redstone dust. The resulting cables provide an easy way to transfer redstone signals over long distance without losing signal strength.

      Redstone Wire Connectors work as both relays and connectors: input and output connectors can have multiple wires connected.

      With the Engineer''s Screwdriver, the connectors can be configured between in- and output mode and set to one of 16 coloured frequencies.'
- id: ieg_lights
  tasks:
  - type: item
    item: immersiveengineering:electric_lantern
    count: 4
  - type: item
    item: immersiveengineering:floodlight
  deps:
  - ie_wires
  roles:
  - builder
  icon: immersiveengineering:electric_lantern
  ru:
    title: Освещение
    subtitle: ''
    text: '**Зачем:** Прожектор освещает далёкую стену — мобы не спавнятся вокруг базы.'
  en:
    title: Engineered Lighting
    subtitle: ''
    text: '**Why:** Floodlights keep mobs from spawning.

      Deep in the halls of the factories, it can be quite dark. Thankfully, lanterns can help illuminate the machinery.

      Their light-level can be adjusted by right-clicking them with an Engineer''s Screwdriver.

      Cage lamps are a little more rugged and atmospheric than lanterns, while also providing redstone control. By default, a cage lamp requires a redstone signal to turn on, this behavior can be inverted
      by sneaking and right-clicking them a screwdriver.'
- id: ieg_tesla
  tasks:
  - type: item
    item: immersiveengineering:tesla_coil
  deps:
  - ieg_capacitor_hv
  - ieg_circuits
  roles:
  - engineer
  - warrior
  icon: immersiveengineering:tesla_coil
  ru:
    title: Катушка Теслы
    subtitle: ''
    text: '**Зачем:** Катушка Теслы бьёт током всех врагов вокруг. Жрёт энергию и бьёт и своих без Фарадеевской брони.'
  en:
    title: Tesla Coil
    subtitle: ''
    text: '**Why:** Shocks enemies around; wear Faraday armor yourself.

      The Tesla Coil started as a concept of wireless energy transfer. However, due to its potentially high loss rates and its rather interesting property of frying every living being in a 6 meter radius,
      it was quickly converted into an Engineer''s dream of home defense.

      The upkeep cost of the coil is high, clocking in at 256 Flux of passive consumption plus an additional 512 every time it applies damage.

      The coil is disabled unless supplied with a redstone signal. Rightclicking it with an Engineer''s Screwdriver will invert this behavior.'
- id: ieg_faraday
  tasks:
  - type: item
    item: immersiveengineering:armor_faraday_helmet
  - type: item
    item: immersiveengineering:armor_faraday_chestplate
  - type: item
    item: immersiveengineering:armor_faraday_leggings
  - type: item
    item: immersiveengineering:armor_faraday_boots
  deps:
  - ieg_alloys
  roles:
  - engineer
  icon: immersiveengineering:armor_faraday_helmet
  ru:
    title: Костюм Фарадея
    subtitle: ''
    text: '**Зачем:** Защищает от удара током проводов и катушек Теслы. Обязателен электрику на высоковольтной линии.'
  en:
    title: Faraday Suit
    subtitle: ''
    text: '**Why:** Protects from wire and tesla shocks.'
- id: ieg_steel_tools
  tasks:
  - type: item
    item: immersiveengineering:pickaxe_steel
  - type: item
    item: immersiveengineering:axe_steel
  - type: item
    item: immersiveengineering:shovel_steel
  - type: item
    item: immersiveengineering:sword_steel
  deps:
  - ie_steel
  roles:
  - warrior
  - engineer
  icon: immersiveengineering:pickaxe_steel
  ru:
    title: Стальные инструменты
    subtitle: ''
    text: '**Зачем:** Прочнее железных, по цене почти те же.'
  en:
    title: Steel Tools
    subtitle: ''
    text: '**Why:** Tougher than iron for about the same cost.

      Engineer''s Hammers are one of the most important tools in the engineer''s toolbox.

      It can be used to configure and form machines, as well as crush ores.

      Engineer''s Wire Cutters are used to remove all the wires connected to a block by simply rightclicking it.'
- id: ieg_steel_armor
  tasks:
  - type: item
    item: immersiveengineering:armor_steel_helmet
  - type: item
    item: immersiveengineering:armor_steel_chestplate
  - type: item
    item: immersiveengineering:armor_steel_leggings
  - type: item
    item: immersiveengineering:armor_steel_boots
  deps:
  - ie_steel
  roles:
  - warrior
  icon: immersiveengineering:armor_steel_helmet
  ru:
    title: Стальная броня IE
    subtitle: ''
    text: '**Зачем:** Защита почти как у алмазной; в шлем можно встроить наушники от шума.'
  en:
    title: IE Steel Armor
    subtitle: ''
    text: '**Why:** Close to diamond; the helmet takes ear defenders.'
- id: ieg_earmuffs
  tasks:
  - type: item
    item: immersiveengineering:earmuffs
  deps:
  - ieg_steel_armor
  roles:
  - engineer
  icon: immersiveengineering:earmuffs
  ru:
    title: Защитные наушники
    subtitle: ''
    text: '**Зачем:** Защитные наушники берегут слух рядом с дизельными генераторами и другими шумными машинами. Их можно встроить в шлем.'
  en:
    title: Ear Defenders
    subtitle: ''
    text: '**Why:** Protect your hearing near loud machines.

      Ear Defenders are devices for protecting your hearing. They are quite important for engineers that work in close proximity to Diesel Generators; or other loud machinery.

      While wearing Ear Defenders, all noises are reduced by 90% and they make your ears considerably more warm and fuzzy! :D

      Placing the Ear Defenders in the Engineer''s Workbench; allows you to specify which types of noises you want cancelled and by how much their volume should be reduced.'
- id: ieg_shield
  tasks:
  - type: item
    item: immersiveengineering:shield
  deps:
  - ie_steel
  roles:
  - warrior
  icon: immersiveengineering:shield
  ru:
    title: Тяжёлый покрытый металлом щит
    subtitle: ''
    text: '**Зачем:** Тяжёлый щит с улучшениями: магнит возвращает его в руку, вспышка ослепляет, разряд бьёт атакующего.'
  en:
    title: Heavy Plated Shield
    subtitle: ''
    text: '**Why:** A heavy shield with flash, shock and magnet upgrades.

      The Heavy Plated Shield is a direct upgrade to the normal wooden shields you might be acquainted with. In similar fashion, this shield will block most incoming damage from the front, but its durability
      has been increased considerably, and it can be upgraded.

      The Flashbulb upgrade adds a bright lightbulb and reflector screen to the shield. Upon being attacked, the device will produce a bright, blinding flash, disorienting everyone in front of the user.

      Adding Shock Emitters to the shield allows you to retaliate against attacking enemies. When the shield is struck, it will emit a shock, inflicting minor damage to the aggressor.'
- id: ieg_drill
  tasks:
  - type: item
    item: immersiveengineering:drill
  - type: item
    item: immersiveengineering:drillhead_steel
  deps:
  - ie_components
  roles:
  - engineer
  icon: immersiveengineering:drill
  ru:
    title: Горный бур
    subtitle: ''
    text: '**Зачем:** Бур на дизеле копает 3×3. Улучшения: удача, ёмкость бака, смазка, работа под водой.'
  en:
    title: Mining Drill
    subtitle: ''
    text: '**Why:** A diesel drill that digs 3x3.

      The handheld, diesel-powered drill is a big advancement in mining. With exchangeable drill heads and upgrades, its speed and other properties are almost entirely modifiable.

      To modify it, place it in an Engineer''s Workbench;start.

      The drill runs off of Biodiesel;biodiesel and can be filled directly in the refinery, or filled at other storage such as barrels or large tanks.'
- id: ieg_drill_upgrades
  tasks:
  - type: item
    item: immersiveengineering:toolupgrade_drill_damage
  - type: item
    item: immersiveengineering:toolupgrade_drill_capacity
  deps:
  - ieg_drill
  roles:
  - engineer
  icon: immersiveengineering:toolupgrade_drill_damage
  ru:
    title: Улучшения бура
    subtitle: ''
    text: '**Зачем:** Усиленное сверло копает быстрее, увеличенный бак — дольше без дозаправки.'
  en:
    title: Drill Upgrades
    subtitle: ''
    text: '**Why:** Faster digging and a bigger fuel tank.'
- id: ieg_buzzsaw
  tasks:
  - type: item
    item: immersiveengineering:buzzsaw
  - type: item
    item: immersiveengineering:sawblade
  deps:
  - ieg_drill
  roles:
  - engineer
  icon: immersiveengineering:buzzsaw
  ru:
    title: Бензопила
    subtitle: ''
    text: '**Зачем:** Циркулярная пила валит дерево целиком.'
  en:
    title: Buzzsaw
    subtitle: ''
    text: '**Why:** Fells whole trees.

      This large, portable buzzsaw is designed to make quick work of trees and other pieces of foliage that may stand in the way of a pristine factory.

      After using the Engineer''s Workbench;start to place a sawblade in it, and loading it with Biodiesel;biodiesel or another fuel, it can be used to carve through everything from small birches to large
      jungle trees.

      Like many other tools, the buzzsaw can be modified in the Engineer''s Workbench. These upgrades affect the size of the internal tank, the number of blades it can store, and the durability of its sawblade.'
- id: ieg_revolver_parts
  tasks:
  - type: item
    item: immersiveengineering:speedloader
  - type: item
    item: immersiveengineering:toolupgrade_revolver_magazine
  deps:
  - ie_revolver
  roles:
  - warrior
  icon: immersiveengineering:speedloader
  ru:
    title: 'Револьвер: апгрейды'
    subtitle: ''
    text: '**Зачем:** Скорозарядник перезаряжает все 8 патронов разом, увеличенный барабан — больше выстрелов. Ещё есть штык и электро-апгрейд.'
  en:
    title: Revolver Upgrades
    subtitle: ''
    text: '**Why:** Speedloader and extended magazine.

      The Revolver, a more elegant weapon from a more civilized age, is an achievement of small mechanics.Small being relative here, since this weapon is chambered for 12-gauge.

      Similar to the Mining Drill, the Revolver will allow for modification in the Engineer''s Workbench, as detailed on the last pages.

      Note that firing the revolver is quite noisy, and will attract the attention of hostile mobs in the area!'
- id: ieg_cartridges
  tasks:
  - type: item
    item: immersiveengineering:bullet_casull
    count: 8
  - type: item
    item: immersiveengineering:bullet_armor_piercing
    count: 8
  - type: item
    item: immersiveengineering:bullet_buckshot
    count: 8
  deps:
  - ie_revolver
  roles:
  - warrior
  icon: immersiveengineering:bullet_casull
  ru:
    title: Патроны
    subtitle: ''
    text: '**Зачем:** Гильзы печёт пресс (форма гильзы), пули — верстак. Бронебойные для бронированных, картечь — для толпы.'
  en:
    title: Cartridges
    subtitle: ''
    text: '**Why:** Casings from the press; AP for armored foes, buckshot for crowds.

      Cartridges are created in the Engineer''s Workbench, by the use of specific Engineer''s Blueprints. Blueprints for normal ammunition you can create yourself, but some more advanced types will require
      you to buy adequate blueprints from other engineers.

      Empty Casings and Shells are the basis for every projectile. Empty Casings can also be crafted in the Metal Press, using the Bullet Casing mold, which reduces the copper required. Similarly, Empty
      Shells can be made out of Phenolic Resin;empty_shell in a bottling machine.

      Casull Cartridges are created with a "Common Projectiles" blueprint.'
- id: ieg_special_ammo
  tasks:
  - type: item
    item: immersiveengineering:bullet_silver
    count: 4
  - type: item
    item: immersiveengineering:bullet_dragons_breath
    count: 4
  - type: item
    item: immersiveengineering:bullet_wolfpack
    count: 2
  deps:
  - ieg_cartridges
  roles:
  - warrior
  icon: immersiveengineering:bullet_silver
  ru:
    title: Особые патроны
    subtitle: ''
    text: '**Зачем:** Серебро — против нежити, «дыхание дракона» поджигает, «волчья стая» выпускает самонаводящиеся пули.'
  en:
    title: Special Cartridges
    subtitle: ''
    text: '**Why:** Silver vs undead, dragon''s breath burns, wolfpack homes.'
- id: ieg_chemthrower
  tasks:
  - type: item
    item: immersiveengineering:chemthrower
  deps:
  - ieg_pipes
  roles:
  - warrior
  icon: immersiveengineering:chemthrower
  ru:
    title: Химический распылитель
    subtitle: ''
    text: '**Зачем:** Распыляет любую жидкость: креозот горит, вода тушит пожар — пригодится при грозе с поджогами.'
  en:
    title: Chemical Thrower
    subtitle: ''
    text: '**Why:** Sprays any fluid: creosote burns, water puts out fires.

      The Chemical Thrower is a device that propels fluids and optionally ignites from its internal tanks.

      The device can be loaded with any fluid, liquid or gas, and, on right click, will spray it out.

      To toggle the pilot light for the ignition of flammable fluids, sneak and right-click.'
- id: ieg_railgun
  tasks:
  - type: item
    item: immersiveengineering:railgun
  deps:
  - ieg_capacitor_hv
  - ieg_circuits
  roles:
  - warrior
  icon: immersiveengineering:railgun
  ru:
    title: Рельсотрон
    subtitle: ''
    text: '**Зачем:** Рельсотрон стреляет стальными стержнями насквозь. Самое мощное ручное оружие IE — против боссов.'
  en:
    title: Railgun
    subtitle: ''
    text: '**Why:** Fires steel rods; IE''s strongest handheld weapon.

      The Railgun (or more accurately the Portable Induction Catapult) is a marvel of engineering. It consists of two rails through which an electric current flows and accelerates a sled, and by that, a
      projectile.

      The process is energy intensive but will accelerate various projectiles to high speeds.

      To launch a projectile from your inventory, click and hold the use button till the charge level reaches 99, then release.'
- id: ieg_powerpack
  tasks:
  - type: item
    item: immersiveengineering:powerpack
  deps:
  - ieg_capacitor_mv
  roles:
  - engineer
  - warrior
  icon: immersiveengineering:powerpack
  ru:
    title: Энергоранец
    subtitle: ''
    text: '**Зачем:** Носи накопитель на спине — он заряжает рельсотрон, бур и щит прямо в бою.'
  en:
    title: Powerpack
    subtitle: ''
    text: '**Why:** Charges your railgun, drill and shield on the go.

      Energy storage takes space and some heavyweight components. As such, storing large amounts of energy in each tool individually is inefficient and makes them awkward to wield.

      The Accumulator Backpack acts as a compromise, offering a centralized storage of energy for any powered tools to tap into.

      The carrying frame can be constructed with the recipe shown on the following page.'
- id: ieg_turrets
  tasks:
  - type: item
    item: immersiveengineering:turret_gun
  deps:
  - ieg_circuits
  - ie_revolver
  roles:
  - warrior
  - engineer
  icon: immersiveengineering:turret_gun
  ru:
    title: Турели
    subtitle: ''
    text: '**Зачем:** Пулемётная турель стреляет патронами из револьвера по мобам — охрана периметра базы. Настрой белый список друзей!'
  en:
    title: Turrets
    subtitle: ''
    text: '**Why:** A gun turret for base defence. Whitelist your friends!

      Turrets are the next step is automated defense of your factory. They feature a complex optical system combined with an electronic "brain" to effectively distinguish and acquire targets and use the
      inbuilt weaponry to neutralize them.

      All turrets feature energy ports at their base, and require a redstone signal to be active, although this behavior can be inverted by sneaking and rightclicking it with an Engineer''s Screwdriver.

      Upon being placed, Turrets will remember their owner and will not allow other users to break or modify them.'
- id: ieg_razor
  tasks:
  - type: item
    item: immersiveengineering:razor_wire
    count: 8
  deps:
  - ie_steel
  roles:
  - warrior
  - builder
  icon: immersiveengineering:razor_wire
  ru:
    title: Колючая проволока
    subtitle: ''
    text: '**Зачем:** Колючая проволока режет и замедляет всех, кто через неё лезет. Снять её можно только кусачками.'
  en:
    title: Razor Wire
    subtitle: ''
    text: '**Why:** Cuts and slows anything passing; remove with wirecutters.

      Razorwire is a wire with sharpened pieces of metal attached. It will slow and cut any entity that tries to move through it.

      Razorwire can only be removed with Wirecutters, any other attempts will damage the player. Additionally, LV wires can be connected to electrify the razorwire for extra damage.'
- id: ieg_glider
  tasks:
  - type: item
    item: immersiveengineering:glider
  deps:
  - ieg_hemp
  roles:
  - engineer
  icon: immersiveengineering:glider
  ru:
    title: Складной планер
    subtitle: ''
    text: '**Зачем:** Складной планер — элитры для тех, кто ещё не был в Энде.'
  en:
    title: Collapsible Glider
    subtitle: ''
    text: '**Why:** Elytra before the End.

      The villagers tell stories about cities in the sky, guarded by dragons, where brave adventurers may acquire magical wings that let them glide through the air.

      Humbug, surely - but the concept intrigues the engineer''s mind. The Collapsible Glider is a device that affords just such liberties, allowing you to sail through the skies.

      It performs the same tasks as the "Elytra" that the villagers spoke of, but comes with a few downsides: It has lower durability and lacks any magical potential for enchantments.'
- id: ieg_skyhook_rope
  tasks:
  - type: item
    item: immersiveengineering:wirecoil_structure_steel
    count: 8
  deps:
  - ie_skyhook
  roles:
  - engineer
  icon: immersiveengineering:wirecoil_structure_steel
  ru:
    title: Моток стального троса
    subtitle: ''
    text: '**Зачем:** Натяни стальные тросы между столбами — и катайся по ним на скайхуке между базами.'
  en:
    title: Steel Cable Coil
    subtitle: ''
    text: '**Why:** Ride steel cables between bases.

      The Engineer''s Skyhook is a motorized grabber system designed to hook onto wires, hemp ropes or steel cables.

      With it, engineers can quickly traverse the length of a powerline to move between substations or other sites.

      Simply hold the right mouse button while close to a wire and you will be attached to it.'
- id: ieg_wolf
  tasks:
  - type: item
    item: immersiveengineering:robot_wolf
  deps:
  - ieg_circuits
  roles:
  - engineer
  - warrior
  icon: immersiveengineering:robot_wolf
  ru:
    title: Механический волк
    subtitle: ''
    text: '**Зачем:** Чертёж механического волка находят в испытательных залах. По нему собирают синтетического спутника, похожего на волка.'
  en:
    title: Automaton Wolf
    subtitle: ''
    text: '**Why:** A blueprint found in Trial Chambers for a synthetic wolf-like companion.

      Within the Trial Chambers, you have found a slightly faded but still legible blueprint. It seems to contain instructions on how to construct a synthetic creature akin to the common wolf!

      This construct is loyal to the person that deploys it.

      Being powered by a thermoelectric generator, it should never run out of energy to move itself.'
- id: ieg_shaders
  tasks:
  - type: checkmark
  deps:
  - ie_revolver
  roles:
  - warrior
  icon: immersiveengineering:shader_bag_common
  ru:
    title: Шейдеры оружия
    subtitle: ''
    text: '**Зачем:** Скины для револьвера, щита и машин. Выпадают из мешков, которые падают с боссов и продаются у инженеров-жителей.'
  en:
    title: Shaders
    subtitle: ''
    text: '**Why:** Skins for guns and machines, from bags dropped by bosses.

      Shaders are items you can find in the world or aquire by trading with villagers.

      They don''t have a purpose by themselves, but they can be equipped to Revolvers, Drills, Chemical Throwers, Heavy Plated Shields, Railguns, and Accumulator Backpacks (and possibly other things you
      still have to discover) to change the designs of the item.

      Simply put the item in an Engineer''s Workbench and equip the shader in the appropriate slot.'
- id: ieg_other_engineers
  tasks:
  - type: checkmark
  deps:
  - ieg_manual
  roles:
  - mayor
  icon: immersiveengineering:blueprint
  ru:
    title: Другие инженеры
    subtitle: ''
    text: '**Зачем:** В деревнях живут жители-инженеры: продают чертежи, патроны и шейдеры. В диких землях встречаются вражеские иллагеры с оружием IE.'
  en:
    title: Other Engineers
    subtitle: ''
    text: '**Why:** Engineer villagers trade blueprints, ammo and shaders.

      Outside of the comfortable compound of any engineer are others less fortified.

      Inside of the villages and towns of the world come a variety of inhabitants who farm and build. Among these come some engineers at the forefront of the field in their towns, pushing against the tide.

      Common trades among those that ply designs and devices in the markets of the world are below.'
- id: ieg_master
  tasks:
  - type: checkmark
  deps:
  - ieg_railgun
  - ieg_improved_bf
  - ieg_lightning
  - ieg_refinery
  - ieg_assembler
  - ieg_turrets
  - ieg_tesla
  - ieg_concrete
  roles:
  - engineer
  shape: hexagon
  rewards:
  - type: xp_levels
    count: 15
  icon: immersiveengineering:railgun
  ru:
    title: Главный инженер
    subtitle: ''
    text: Высоковольтные магистрали, громоотвод, биодизель с фермы, турели по периметру и рельсотрон за спиной. Справочник инженера тебе больше не нужен — теперь ты пишешь его сам.
  en:
    title: Chief Engineer
    subtitle: ''
    text: HV lines, lightning, biodiesel, turrets and a railgun.
