  en:
    title: Thermoelectric Generator
    subtitle: ''
    text: '**Why:** Between hot and cold blocks it makes power with no fuel.

      Thermoelectric Generators are another kind of power generation, and work without the use of any mechanical parts. These generators use the temperature gradient between two opposing sources to produce
      power.

      Placing a heat source on one side and a colder source on the opposite side generates energy based on the difference between the two temperatures.

      Any fluid will work based on its temperature, along with some other blocks.'
